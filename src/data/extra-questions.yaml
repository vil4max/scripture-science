      difference: "Святые последних дней называют свою общину восстановленной Церковью Иисуса Христа, единственной истинной и живой на земле, а Православная Церковь считает истинной Церковью Христовой себя, непрерывно хранящую от апостолов учение и преемство."
      response: "Православная Церковь верит, что Церковь, созданная Христом, не прерывалась: Он обещал, что «врата ада не одолеют ее» (Мф 16:18; катехизис, §255), и по катехизису она «никогда не может ни отпасть от веры, ни погрешить в истине веры» (§269). Апостольность для неё — непрерывное хранение учения и преемства даров Святого Духа через рукоположение от апостолов (§272), а не восстановление в последние дни."
