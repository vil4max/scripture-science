- id: schedule
  question: "Когда молятся: день, неделя, год"
  orthodox:
    short: "Центр — Литургия: вокруг неё строятся день, неделя и год. Сутки начинаются вечером: вечерня, утреня, часы. В воскресенье — день Воскресения Христова — собираются на Литургию; среда и пятница постные. Дома — утренние и вечерние молитвы."
    detail: "Главное в богослужении — Литургия: катехизис называет Причащение, которое совершается за ней, главной и существенной частью христианского богослужения, а собираться на неё в воскресенье Церковь начала с апостолов: «В первый же день недели, когда ученики собрались для преломления хлеба» (Деян 20:7). По церковной традиции сутки начинаются вечером. Суточный круг — это восемь служб: вечерня, повечерие, полунощница, утреня и четыре часа (первый, третий, шестой и девятый); в приходах повечерие и полунощницу, как правило, не служат. Литургия в этот круг не входит: это особое, главное богослужение. Среда и пятница посвящены Крестной смерти Христа, и в эти дни, как правило, постятся. Год строится вокруг Пасхи — главного церковного праздника, двенадцати двунадесятых праздников и четырёх многодневных постов: Великого, Петрова (Апостольского), Успенского и Рождественского. Дома минимум — утренние и вечерние молитвы."
