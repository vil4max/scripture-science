    islam:
      teaching: "В исламе, по словам востоковеда А. В. Журавского, нет церкви и духовенства, наделённого полномочиями через таинство: имам — лишь предстоятель на молитве (так он описывает суннитский ислам). Верующие образуют умму — общину; Коран называет их «лучшей из общин» (3:110, пер. Кулиева). Мечеть, масджид, — «место поклонения»; по Корану, «Мечети принадлежат Аллаху» (72:18)."
      difference: "В суннитском исламе верующие образуют умму — общину без духовенства, наделённого полномочиями через таинство, а Православная Церковь называет Церковью собрание верующих во Христа, Его Тело, где священноначалие хранит преемство даров Святого Духа через рукоположение."
      response: "Православная Церковь называет себя Телом Христовым, у которого единственная Глава — Христос (Еф 1:22–23; Кол 1:18; катехизис, §257), а священноначалие понимает как преемство даров Святого Духа от апостолов через рукоположение (§272). Мечеть как здание ближе к храму: по «Азбуке веры», церковью называют и храм, но в полном смысле Церковь — собрание, возглавляемое Христом."
