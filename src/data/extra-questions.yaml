    adventism:
      teaching: "В названии два вероучения: «адвентисты» (от лат. адвентус — «пришествие») веруют в близкое второе пришествие Христа, а «седьмой день» указывает на святость субботы (так объясняет Московское объединение церкви). По основным положениям, Церковь — сообщество верующих; вселенскую Церковь составляют все, кто истинно верит в Христа, а в последние дни, во время всеобщего богоотступничества, Бог призвал «Церковь Остатка»: она возвещает час суда и спасение через Христа."
      difference: "Адвентисты называют общину по двум своим вероучениям — близкому пришествию Христа и субботе — и видят в ней «Церковь Остатка» последних дней, а Православная Церковь называет себя по правому исповеданию и славословию, Православной, и видит свою основу в непрерывном апостольском учении и преемстве."
