    jw:
      teaching: "Свидетели Иеговы учат молиться Иегове через Иисуса Христа, от сердца: в их книге «Чему нас учит Библия?» сказано, что в молитве важно быть искренним и не повторять одни и те же фразы. «Отче наш» они называют образцовой молитвой: «Это образцовая молитва, которой нас научил Иисус Христос» («Сторожевая башня», 2004). По их толкованию, Иисус не предполагал, что её нужно произносить «слово в слово». Молитву завершают словом «аминь» — «верно» или «пусть будет так»."
      difference: "Свидетели Иеговы молятся Иегове через Иисуса Христа от сердца, не повторяя одни и те же фразы, и видят в «Отче наш» образец, а не текст для дословного повторения, а Православная Церковь читает «Отче наш» как молитву, данную Христом, молится по молитвослову и своими словами и обращается и ко Христу, и к Святому Духу."
      response: "Христос сказал: «когда молитесь, говорите: Отче наш, сущий на небесах!» (Лк 11:2), и Церковь читает эту молитву как заповеданную Господом. Повторение слов само по себе не запрещено: Сам Христос в Гефсимании «помолился в третий раз, сказав то же слово» (Мф 26:44), а в Мф 6:7 Он предостерегает от пустословия — «не говорите лишнего, как язычники». Сердечную молитву, по «Азбуке веры», готовые слова дополняют, а не заменяют: «Одно не исключает другого»."
