- id: baptism
  question: "Крещение: похожий обряд — разный смысл"
  orthodox:
    short: "Крещение — Таинство, а не только знак: при троекратном погружении во имя Отца и Сына и Святого Духа верующий умирает для греховной жизни и возрождается Духом Святым. Оно совершается один раз, над младенцами — по вере восприемников."
    detail: "Таинство, по свт. Филарету, — священное действие, через которое тайным образом действует на человека благодать (Пространный катехизис, §281). О Крещении он учит: «Крещение есть Таинство, в котором верующий при троекратном погружении тела в воду с призыванием Бога Отца и Сына и Святого Духа умирает для жизни плотской, греховной и возрождается Святым Духом в жизнь духовную, святую» (§285). Основание — слова Христа: «идите, научите все народы, крестя их во имя Отца и Сына и Святого Духа» (Мф 28:19) и «если кто не родится от воды и Духа, не может войти в Царствие Божие» (Ин 3:5). Апостол Павел видит в Крещении участие в смерти и воскресении Христа (Рим 6:3–4), а апостол Пётр говорит о нём «для прощения грехов» (Деян 2:38). От желающего креститься требуются покаяние и вера (§288); младенцев крестят по вере родителей и восприемников, которые обязаны научить их вере (§§289, 292). Крещение совершается один раз, потому что оно — духовное рождение (§301), и Символ веры исповедует: «Исповедую одно Крещение во оставление грехов». Миропомазание обычно совершается сразу после Крещения (энциклопедия «Азбука веры»); в нём, по катехизису, верующий получает благодать для духовного роста, а в Причащении питается духовно (§283). Православная Церковь признаёт Крещение, совершённое во имя Святой Троицы: по «Азбуке веры», людей, крещённых так в других исповеданиях, она принимает другим чином — через миропомазание или покаяние, — а через Крещение принимает тех, у кого, по оценке Церкви, кардинально искажены догматы, прежде всего учение о Святой Троице и о Христе."
