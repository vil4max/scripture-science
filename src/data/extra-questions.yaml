  traditions:
    judaism:
      teaching: "В иудейских источниках речь не о «церкви», а о народе Израиля, избранном Богом и связанном с Ним заветом на Синае (Втор 7:6; так объясняет My Jewish Learning). Община называется кегила — «сообщество», а дом молитвы — бейт-кнессет, «дом собрания»: по «Азбуке веры», это центр религиозной жизни общины, и он не является синонимом Храма."
      difference: "Иудаизм видит общину веры в народе Израиля, связанном с Богом заветом, и собирается в синагоге, «доме собрания», а Православная Церковь называет Церковью собрание верующих во Христа, возглавляемое Им: Тело Христово, открытое людям всех народов."
      response: "Православная Церковь учит, что Христос положил начало Церкви «в земле иудейской» (катехизис, §271), но Церковь не ограничена одним народом: она заключает в себе верующих всех стран, времён и народов, и в ней, по апостолу, «нет ни Еллина, ни Иудея» (Кол 3:11; §268). Церковью в полном смысле называют собрание, возглавляемое Христом; так же называют и храм, но это более узкое значение слова («Азбука веры»)."
