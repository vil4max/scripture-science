    adventism:
      teaching: "Руководство Церкви (Church Manual) призывает хранить привычку ежедневного изучения Библии и молитвы, называет христианский дом домом молитвы и приводит совет Э. Уайт собирать семью вокруг алтаря Божьего. По основам вероучения, христиане растут, общаясь с Богом ежедневно в молитве и питаясь Его Словом."
      difference: "Адвентисты призывают к ежедневной молитве и изучению Библии лично и в семье, а Церковь читает утренние и вечерние молитвы из молитвослова, акафисты и правило перед Причащением."
      response: "Церковь тоже учит молиться ежедневно и всей семьёй: семейная молитва — разновидность церковной и не заменяет личной, а лишь дополняет её. Основа и домашнего, и церковного богослужения — Священное Писание («Азбука веры»)."
