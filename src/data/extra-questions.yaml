      difference: "Свидетели Иеговы называют себя по имени, принятому в 1931 году, единоверцев — собранием, место встреч — Залом Царства и во главе организации видят Руководящий совет, а Православная Церковь называет Церковью собрание верующих во Христа, возглавляемое Им, и хранит непрерывное апостольское преемство."
