    protestantism:
      teaching: "Баптисты, по «Википедии», молятся на богослужении импровизированно, своими словами, а их вероучение называет молитву средством общения человека с Богом; пятидесятники часто молятся и «на иных языках». Лютеране и англикане пользуются и готовыми текстами. По Малому катехизису Лютера, утром читают Символ веры и «Отче наш» и, по желанию, краткую молитву, в которой благодарят Небесного Отца через Иисуса Христа за то, что Он сохранил ночью от всякого вреда и опасности. В англиканском Молитвеннике 1662 г. на утренней молитве читают коллекту — краткую молитву к Небесному Отцу о защите в наступающий день от греха и опасности."
      difference: "Баптисты молятся на богослужении импровизированно, лютеране и англикане пользуются и готовыми текстами, а Православная Церковь молится готовыми молитвами из молитвослова, не отвергая и своих слов."
      response: "Церковь тоже призывает молиться своими словами и не отвергает готовых молитв: молитвословия, составленные святыми, по «Азбуке веры», могут стать своими собственными. Лютеранское утреннее правило — Символ веры и «Отче наш» — перекликается с православным: Символ веры читают ежедневно в утреннем правиле, а «Отче наш» — в составе практически любого домашнего правила. Молиться чужими словами учит Сам Христос: Его молитвенные возгласы на кресте — строки из псалмов."
