    islam:
      teaching: "Намаз предписан в определённое время (Коран 4:103), но совершать его можно не только в мечети: по хадису из «Сахих» аль-Бухари, земля сделана для Пророка и его последователей местом молитвы, и они могут молиться там, где застало время молитвы. Кроме намаза, верующий обращается к Аллаху с личной мольбой — дуа: «Взывайте ко Мне, и Я отвечу вам» (Коран 40:60) — и повторяет формулы поминания Аллаха, например тасбих «субхан-Аллах»: в конце каждого намаза его произносят 33 раза, а для счёта пользуются чётками."
      difference: "Ислам предписывает намаз в определённое время, который можно совершать где угодно, личную мольбу (дуа) и повторение формул поминания Аллаха (тасбих), а Православная Церковь читает утренние и вечерние молитвы по молитвослову и молится также своими словами."
      response: "Церковь тоже молится не только в установленное время: апостол велит молиться «во всякое время духом» (Еф 6:18) и «непрестанно» (1 Фес 5:17). Свою молитву христианин обращает к Отцу так, как научил Христос (Мф 6:9), а её суть — «возношение ума и сердца к Богу» (катехизис, §387)."
