- id: private-prayer
  question: "Как молятся дома?"
  orthodox:
    short: "Дома читают молитвенное правило: минимум — утренние и вечерние молитвы из молитвослова. Перед Причастием — Последование ко Святому Причащению; можно читать акафисты, молиться Иисусовой молитвой, перед иконами и своими словами."
    detail: "Правило бывает общим для всех или индивидуальным — его подбирает духовник; тексты утренних и вечерних молитв есть в Православном молитвослове, например на «Азбуке веры». Накануне Причастия читают Последование ко Святому Причащению и соблюдают пост (с полуночи воздерживаются от еды и питья), а чтение трёх канонов — благочестивая традиция, но не обязанность. Новые акафисты, по статье «Азбуки веры», за богослужением по Уставу не положены, но их рекомендуют для келейного, то есть домашнего, чтения; в течение дня тихо творят Иисусову молитву, а перед иконами, по катехизису, следует умом видеть Бога и святых, на них изображённых."
    proof:
