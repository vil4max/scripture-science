    protestantism:
      teaching: "Служба зависит от церкви. Лютеране и англикане (Церковь Англии) служат по литургическому порядку: чтения из Библии, проповедь, причащение хлебом и вином. У евангельских христиан-баптистов (ЕХБ) воскресное собрание строится вокруг проповеди, общего пения и молитв, а Вечеря Господня — как правило, раз в месяц. У пятидесятников — музыкальное «прославление», проповедь, молитвы друг за друга, «на языках» и за исцеление больных; Вечеря — иногда."
      difference: "Лютеране и Церковь Англии служат по литургическому порядку с причащением, баптисты и пятидесятники строят собрание вокруг проповеди и видят в Вечере Господней воспоминание, а Церковь совершает Литургию, на которой хлеб и вино прелагаются в Тело и Кровь Христовы."
      response: "Церковь учит, что в Причащении верующий под видом хлеба и вина вкушает подлинные Тело и Кровь Иисуса Христа (катехизис, §312), а не только вспоминает Тайную вечерю; Господь сказал: «если не будете есть Плоти Сына Человеческого и пить Крови Его, то не будете иметь в себе жизни» (Ин 6:53)."
