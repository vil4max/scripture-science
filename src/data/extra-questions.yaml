    lds:
      teaching: "Святые последних дней молятся утром и вечером лично и всей семьёй. Каждое воскресенье проходит причастное собрание. Раз в месяц, в воскресенье, они постятся: два приёма пищи подряд обходятся без еды и воды, а сэкономленные деньги отдают нуждающимся. Раз в неделю семья проводит «домашний вечер» (home evening), и Церковь оставляет понедельничные вечера свободными от собраний. Пасха для них — праздник Воскресения Христа."
      difference: "Святые последних дней молятся утром и вечером, собираются на причастное собрание в воскресенье и раз в месяц постятся, а Православная Церковь совершает суточный круг служб, постится по средам и пятницам и в четыре многодневных поста и празднует Пасху как главный праздник года."
      response: "Церковь тоже молится утром и вечером, а семейная молитва в ней не заменяет личную, а лишь дополняет её («Азбука веры»). Воскресенье Церковь посвящает Воскресению Христа (катехизис, §535), а пост держит чаще, чем раз в месяц: по средам и пятницам и в четыре многодневных поста."
