    jw:
      teaching: "Свидетели Иеговы собираются два раза в неделю: в будний день и в выходной. Раз в год, 14 нисана после захода солнца, они проводят Вечерю воспоминания смерти Христа. Рождество и Пасху не отмечают: по их учению, эти праздники изначально связаны с поклонением другим богам. Дни рождения не празднуют, потому что считают это неугодным Богу."
      difference: "Свидетели Иеговы собираются дважды в неделю, раз в год отмечают Вечерю воспоминания и не празднуют Рождество и Пасху, а Православная Церковь совершает Литургию, держит суточный, седмичный и годовой круги служб и празднует Рождество Христово и Пасху."
      response: "Церковь празднует Рождество Христово как память о рождении Спасителя — «ибо ныне родился вам в городе Давидовом Спаситель» (Лк 2:11), а Пасху — как «праздников праздник и торжество торжеств» (свт. Григорий Богослов). Праздники и посты Церковь устанавливает «во славу Божию» (катехизис, §537)."
      proof:
