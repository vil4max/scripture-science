      teaching: "Мусульмане совершают пять намазов в день: фаджр на рассвете, зухр после полудня, аср в предвечернее время, магриб после заката и иша ночью. В пятницу в полдень мужчины собираются в мечети на общую молитву с проповедью. В месяц Рамадан верующие постятся в светлое время суток, от рассвета до ночи; его завершает Ураза-байрам, а через два с лишним месяца отмечают Курбан-байрам — праздник окончания хаджа."
      difference: "Ислам предписывает пять намазов в течение суток, пятничную общую молитву и месячный пост в Рамадан, а Православная Церковь ставит в центр Литургию, совершает суточный круг служб, празднует воскресенье, день Воскресения Христова, и постится по средам и пятницам и в четыре многодневных поста."
