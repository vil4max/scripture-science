    catholicism:
      teaching: "Центр богослужения — Месса: Евхаристия — «источник и вершина всей христианской жизни» (КЦЦ 1324), и в воскресенье верные обязаны быть на ней (КЦЦ 2180). Месса состоит из Литургии Слова (чтения, проповедь, общая молитва) и Евхаристической Литургии (приношение хлеба и вина, освящение, Причащение; КЦЦ 1346). По миссалу 1970 года её разрешено служить на национальных языках. В латинском обряде хлеб пресный (опресноки), а мирян обычно причащают одним хлебом (кан. 926; КЦЦ 1390)."
      difference: "Католики, как и Церковь, ставят Евхаристию в центр богослужения, но в латинском обряде служат на опресноках и мирян обычно причащают одним хлебом, а Церковь служит на квасном хлебе и причащает верующих под видом хлеба и вина."
      response: "Церковь тоже называет Причащение главной и существенной частью богослужения (катехизис, §314), но совершает Литургию на квасном хлебе: по «Азбуке веры», все евангелисты, говоря о Евхаристии, говорят именно о квасном хлебе. Верующие причащаются под видом хлеба и вина (§312), а о чаше Господь сказал: «пейте из нее все» (Мф 26:27). В Церкви общеупотребительны три вида Божественной Литургии: свт. Иоанна Златоуста, свт. Василия Великого и Преждеосвященных Даров."
