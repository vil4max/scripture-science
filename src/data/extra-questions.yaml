  traditions:
    judaism:
      teaching: "Три ежедневные молитвы — утренняя (Шахарит), дневная (Минха) и вечерняя (Маарив); после разрушения Храма молитва заменила жертвоприношения. Главные части утренней — «Шма» и «Амида»: Амиду читают про себя, затем вслух повторяет кантор (хазан) от имени общины. Для полной службы нужен миньян — десять взрослых мужчин. Тору читают вслух по понедельникам и четвергам, в праздники и в субботу (в субботу — недельную главу)."
      difference: "Иудаизм предписывает три ежедневные молитвы и чтение Торы в синагоге и не приносит жертв после разрушения Храма, а Церковь на Литургии читает Апостол и Евангелие, совершает Евхаристию и каждую седмицу празднует воскресенье, день Воскресения Христа."
      response: "Христос Сам входил в синагогу «по обыкновению Своему» (Лк 4:16), и за Литургией Церкви тоже читают Священное Писание — книги Апостольские и Евангелие (катехизис, §332). На Тайной вечере Христос установил Евхаристию: «сие творите в Мое воспоминание» (Лк 22:19); главная часть богослужения Церкви — Причащение за Литургией (§314). В книге Деяний сказано: «В первый же день недели, когда ученики собрались для преломления хлеба» (Деян 20:7)."
