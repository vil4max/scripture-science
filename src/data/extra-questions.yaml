    lds:
      teaching: "Церковь Иисуса Христа Святых последних дней учит молиться Небесному Отцу и никому другому, во имя Иисуса Христа. Личную молитву следует совершать по меньшей мере утром и вечером, а семейную — утром и вечером всей семьёй."
      difference: "Святые последних дней молятся лично и всей семьёй утром и вечером, обращаясь только к Небесному Отцу во имя Иисуса Христа, а Церковь молится и Господу Иисусу Христу, и просит молитв Богородицы и святых."
      response: "Церковь обращается и ко Христу — в Иисусовой молитве, — потому что Он Сам истинный Бог (катехизис, §187), и просит святых о молитвах: это молитва земной Церкви к небесной (§261)."
      proof:
        - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/prayer?lang=eng"
