    islam:
      teaching: "Намаз — пять молитв в день в предписанное время (Коран 4:103): утренняя, полуденная, предвечерняя, вечерняя и ночная, из двух–четырёх ракаатов (циклов). Перед молитвой совершают омовение и становятся лицом к Каабе; ракаат — стояние, чтение Корана, поясной и земной поклоны. Общую молитву ведёт имам, остальные повторяют за ним. В пятницу в полдень мужчины собираются в мечети: имам читает две проповеди (хутба) и ведёт молитву из двух ракаатов (Коран 62:9)."
      difference: "Ислам предписывает пять намазов в день лицом к Каабе, с поясными и земными поклонами, и пятничную общую молитву с проповедью, а Православная Церковь совершает Литургию с Евхаристией, ведёт суточный, седмичный и годовой круги служб и празднует воскресенье."
      response: "Церковь тоже молится в течение суток — по кругу из восьми служб — и собирается в воскресенье, день Воскресения Христа (катехизис, §535). Её главное богослужение — Литургия: Христос на Тайной вечере повелел «сие творите в Мое воспоминание» (Лк 22:19), и за Литургией совершается Причащение (§314)."
