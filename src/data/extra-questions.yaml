    jw:
      teaching: "Свидетели Иеговы крестят полным погружением «во имя Отца, Сына и святого духа»: так, по их объяснению, человек признаёт положение Иеговы, роль Иисуса Христа в замысле Бога и то, что Иегова использует святой дух для исполнения Своей воли. Крещение — символ смерти для прежней жизни и публичный знак посвящения Иегове; кандидат подтверждает, что становится Свидетелем Иеговы и присоединяется к организации Иеговы. Само крещение, по их учению, спасения не гарантирует."
      difference: "Свидетели Иеговы крестят полным погружением после изучения Библии как символ посвящения Иегове и вхождения в организацию Свидетелей Иеговы, не считая обряд гарантией спасения, а Православная Церковь крестит и младенцев, во имя Отца и Сына и Святого Духа, как Таинство, в котором действует благодать и верующий возрождается Духом Святым."
      response: "Православная Церковь крестит «во имя Отца и Сына и Святого Духа» (Мф 28:19) — во имя Святой Троицы — и видит в Крещении Таинство, в котором верующий «умирает для жизни плотской, греховной и возрождается Святым Духом» (катехизис, §285). По «Азбуке веры», Крещение, совершённое во имя Святой Троицы, Церковь признаёт, а Свидетелей Иеговы принимает через Крещение, относя к сообществам, где, по её оценке, искажено учение о Святой Троице и о Христе."
