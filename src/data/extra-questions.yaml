    islam:
      teaching: "Крещения в исламе нет. В ислам входят, произнеся шахаду — свидетельство, что нет божества, кроме Аллаха, и Мухаммад — Его посланник; по Московской Соборной мечети, веры в Единого Аллаха и подтверждения пророческой миссии Мухаммада достаточно для принятия ислама. Водой совершается очищение: Коран велит перед намазом умыть лица и руки до локтей, оботреть головы и умыть ноги (5:6) и говорит, что Аллах «хочет очистить вас»."
      difference: "В исламе в общину входят, произнеся шахаду, и омовение водой перед молитвой служит очищением, а не посвящением, а Православная Церковь вводит в Церковь через Крещение — Таинство, в котором человек при погружении в воду возрождается Духом Святым."
      response: "Православная Церковь исповедует, что в Крещении человек рождается «от воды и Духа» (Ин 3:5) и вводится в Церковь, становясь её членом («Азбука веры»). От желающего креститься требуются покаяние и вера (катехизис, §288), но само Крещение — Таинство, то есть священное действие, в котором действует благодать Божия (§281), а не только исповедание."
