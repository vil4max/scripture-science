- id: church-names
  question: "Как себя называют: Церковь и другие общины"
  orthodox:
    short: "Церковь — собрание верующих, Тело Христово (Еф 1:22–23): единая, святая, соборная и апостольская (Символ веры). «Православная» — правильно верующая и славящая Бога. Это семья Поместных Церквей (Русская и др.), единых верой и Таинствами."
    detail: "В ответах Православной Церкви на этом сайте слово «Церковь» без уточнения означает Православную Церковь: так она называет себя сама. Свт. Филарет определяет её так: «Церковь есть Богом установленное общество людей, соединённых православной верой, законом Божиим, священноначалием и Таинствами» (Пространный катехизис, §250). Греческое слово ἐκκλησία значит «собрание»; апостол Павел называет Церковь Телом Христовым, а Христа — её Главой (Еф 1:22–23; Кол 1:18). Символ веры исповедует Церковь Единой, Святой, Соборной и Апостольской, и катехизис объясняет каждое свойство: Церковь едина, потому что у неё одна глава — Христос и один Дух (§256); свята, потому что освящена Христом (§266); соборна, потому что не ограничена ни местом, ни временем, ни народом (§268); апостольска, потому что непрерывно хранит от апостолов учение и преемство даров Святого Духа (§272). В этом же смысле она называется Православной (§272): по «Азбуке веры», слово «Православие» соединяет правильное суждение о Боге с правильным прославлением Бога. В «Основных принципах отношения к инославию» (Архиерейский Собор РПЦ, 2000, §1.1) сказано: «Православная Церковь есть истинная Церковь Христова». Единая Церковь существует как семья самостоятельных Поместных Церквей — Иерусалимской, Антиохийской, Александрийской, Константинопольской, Российской и других; они едины в исповедании веры и в общении молитв и Таинств (§259). С маленькой буквы по-русски «церковью» называют и храм."
    proof:
      - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
        title: "Свт. Филарет Московский. Пространный катехизис, §250: что такое Церковь"
        tier: official
