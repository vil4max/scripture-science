    catholicism:
      teaching: "Катехизис Католической Церкви исповедует Марию Матерью Божией и Приснодевой. Католики верят также, что Она с первого мгновения была сохранена от первородного греха (догмат 1854 г.), после земной жизни взята телом и душой в небесную славу, и просят Её заступничества."
      difference: "Католики, как и Церковь, исповедуют Марию Богородицей и Приснодевой, а догмат 1854 г. о Её непорочном зачатии Церковь не принимает."
      response: "Церковь высоко чтит святость Богородицы, но, по «Азбуке веры», никогда не учила, что Она была изначально свободна от первородного греха. Успение Богородицы Церковь празднует, а догмат о Её взятии на небо, по оценке прот. М. Козлова и Д. Огицкого, принят в 1950 г. папой без Собора."
      proof:
        - url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
