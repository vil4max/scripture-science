    catholicism:
      teaching: "Литургия Часов освящает весь день: главные её часы — утренняя молитва (лауды) и вечерня, а перед сном — повечерие. По традиции верные читают и Ангелус — молитву утром, в полдень и вечером. В воскресенье католики обязаны быть на Мессе, а пятница, в память смерти Господа, — день покаяния, обычно с воздержанием от мяса. Год строится вокруг Пасхи: Адвент, Рождество, Великий пост, Пасха."
      difference: "Здесь во многом согласие: католики, как и Православная Церковь, молятся в течение суток, собираются в воскресенье и строят год вокруг Пасхи, но постным днём недели считают пятницу, а Православная Церковь— среду и пятницу."
      response: "Церковь тоже молится в течение суток — по кругу из восьми служб — и называет Пасху «праздников праздником и торжеством торжеств» («Азбука веры»). Среда и пятница в Церкви — дни поста, а перед великими праздниками она держит четыре многодневных поста: Великий, Петров, Успенский и Рождественский."
