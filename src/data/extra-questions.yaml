    catholicism:
      teaching: "Католики тоже видят в Крещении таинство: «Крещением мы освобождаемся от греха и возрождаемся как сыны Божии» (Катехизис, §1213). Оно совершается «во имя Отца и Сына и Святого Духа»: в латинской Церкви — троекратным возлиянием воды (§1240), хотя тройное погружение названо наиболее выразительным (§1239). Детей крестят вскоре после рождения (§1250). На Западе Миропомазание отделено от Крещения, а Причастие даётся с сознательного возраста; на Востоке — вместе (§§1244, 1290)."
      difference: "Католики, как и Православная Церковь, видят в Крещении таинство, совершаемое во имя Святой Троицы, но в латинской Церкви его совершают возлиянием воды и отделяют от него Миропомазание и Первое Причастие, а Православная Церковь крестит троекратным погружением и обычно сразу совершает Миропомазание."
      response: "Для Православной Церкви главное в священнодействии Крещения — троекратное погружение с призыванием Святой Троицы (катехизис, §287), а Миропомазание обычно совершается сразу после него («Азбука веры»). При этом она признаёт Крещение, совершённое во имя Святой Троицы, и миропомазанных католиков присоединяет через покаяние, не крестя их заново («Азбука веры»)."
