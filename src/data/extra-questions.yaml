  traditions:
    judaism:
      teaching: "Три ежедневные молитвы: утренняя (Шахарит), послеполуденная (Минха) и вечерняя (Маарив). Шаббат, день покоя, длится от заката в пятницу до появления звёзд в субботу вечером. Главные праздники года — Песах, Шавуот и Суккот, Рош ха-Шана (Новый год) и Йом Кипур (День Искупления), в который молятся и постятся."
      difference: "Иудаизм молится трижды в день, чтит субботу, седьмой день недели, и отмечает Песах, Шавуот, Суккот, Рош ха-Шана и Йом Кипур, а Православная Церковь празднует воскресенье, день Воскресения Христова, и Пасху как главный праздник года."
      response: "Христос Сам входил в синагогу «по обыкновению Своему, в день субботний» (Лк 4:16), а Воскресение произошло «по прошествии же субботы, на рассвете первого дня недели» (Мф 28:1). Поэтому ученики, по книге Деяний, собирались «в первый же день недели» (Деян 20:7), и Церковь празднует воскресенье со времени воскресения Христа (катехизис, §535)."
