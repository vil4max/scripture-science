    judaism:
      teaching: "День начинается с молитвы «Модэ ани» (благодарность за то, что Бог вернул душу), омовения рук и утренних благословений. Мужчины носят одежду с кистями (цицит); перед утренней молитвой женатые мужчины закутываются в талит, а с возраста бар-мицвы в будни надевают тфилин. Шма — единственная молитва, данная как заповедь Торы: её читают утром, вечером и перед сном. Перед едой и после неё произносят благословения; для полной службы нужен миньян (десять взрослых), поэтому вне его еврей молится сам."
      difference: "Иудаизм предписывает начинать день с молитвы благодарности, читать Шма утром и вечером и произносить благословения перед едой и после неё, а Православная Церковь читает утренние и вечерние молитвы по молитвослову и в течение дня молится кратко, например Иисусовой молитвой."
      response: "Христос научил молиться и втайне: «войди в комнату твою и, затворив дверь твою, помолись Отцу твоему» (Мф 6:6), и дал молитву «Отче наш» (Мф 6:9). Церковь тоже молится утром и вечером по молитвослову, а в течение дня — кратко, например Иисусовой молитвой («Азбука веры»)."
