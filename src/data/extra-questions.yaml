    lds:
      teaching: "Церковь Иисуса Христа Святых последних дней учит молиться Небесному Отцу и никому другому, во имя Иисуса Христа, и предлагает схему молитвы: обращение к Небесному Отцу, слова сердца — благодарность, вопросы, просьбы — и завершение словами во имя Иисуса Христа, аминь. Она предостерегает от пустых повторений. Готовый текст записан в Писании для причастия: по Мороний 4:2–3, священники опускались на колени с Церковью и молились Отцу во имя Христа: «О Боже, Отец Вечный, мы просим Тебя во имя Сына Твоего, Иисуса Христа, благословить и освятить этот хлеб…»."
      difference: "Святые последних дней молятся Небесному Отцу во имя Иисуса Христа по схеме, которую предлагает их Церковь, а записанный в Писании текст у них — молитва над хлебом причастия; Православная Церковь молится по молитвослову и своими словами, обращаясь и ко Христу, и к Святому Духу и прося молитв святых."
      response: "Церковь тоже молится своими словами («Азбука веры»), а готовую молитву дал Сам Христос: «когда молитесь, говорите: Отче наш, сущий на небесах!» (Лк 11:2). Ко Христу Церковь обращается в Иисусовой молитве, а к Святому Духу — в молитве «Царю Небесный», потому что исповедует Его истинным Богом, равным Отцу и Сыну; просьба о молитвах святых — молитва земной Церкви к небесной (катехизис, §261)."
