    protestantism:
      teaching: "Лютеранский Малый катехизис велит главе семьи учить домашних молиться утром и вечером: перекреститься, прочесть Символ веры и «Отче наш». Баптисты (ЕХБ) называют молитву средством общения человека с Богом и учат в ней открывать Богу свои желания, а Церковь Англии предлагает утреннюю, вечернюю и ночную молитву и простой порядок дневной и ночной молитвы (Time to Pray). У многих пятидесятников молитва «на языках» — важная часть личных ежедневных молитв."
      difference: "Лютеране и Церковь Англии предлагают утреннюю и вечернюю молитву по заданному порядку, баптисты учат открывать желания Богу в свободной молитве, пятидесятники нередко молятся и «на языках», а Церковь читает правило из молитвослова и молится также своими словами."
      response: "Церковь тоже призывает молиться своими словами, не отвергая готовых молитв: молитвословия, составленные святыми, могут стать своими собственными. Молитвенное правило нужно, потому что одного вдохновения и импровизации недостаточно, а молиться чужими словами нас учит Сам Христос, Чьи возгласы на кресте — строки из псалмов."
