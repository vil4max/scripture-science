    catholicism:
      teaching: "Катехизис Католической Церкви перечисляет ежедневные ритмы молитвы: утренняя и вечерняя молитвы, молитвы перед едой и после неё, Литургия Часов (КЦЦ 2698). Для личной молитвы он советует «молитвенный уголок» со Священным Писанием и иконами, называет христианскую семью первым местом обучения молитве, а Розарий — «сжатым изложением всего Евангелия» (КЦЦ 2691, 2685, 971)."
      difference: "Здесь согласие: католики, как и Православная Церковь, молятся утром и вечером, перед едой, дома и всей семьёй, перед священными изображениями, а Розарий — особая богородичная молитва католиков."
      response: "Церковь тоже молится утром и вечером, перед едой и всей семьёй: семейная молитва — разновидность церковной и дополняет личную; наиболее распространены правила по Православному молитвослову, по Часослову и правило прп. Серафима Саровского. К Богородице Церковь молится, в частности, акафистом: Акафист Пресвятой Богородице Устав предписывает петь в 5-ю субботу Великого поста, а другие акафисты читают дома."
