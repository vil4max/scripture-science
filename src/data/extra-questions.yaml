  traditions:
    judaism:
      teaching: "Христианского крещения в иудаизме нет. Ближайший аналог — погружение в микву, бассейн с чистой водой: по Jewish Virtual Library, оно делает ритуально чистым того, кто стал ритуально нечистым, и обязательно для обращающихся в иудаизм (гиюр). По My Jewish Learning, вода миквы смывает прошлое, а обратившегося считают подобным новорождённому. Миква служит и другим целям, например женщинам после ниды и родов, поэтому погружение повторяется."
      difference: "Иудаизм знает ритуальное погружение в микву — для очищения, а при гиюре как часть обращения, — и оно может повторяться, а Православная Церковь совершает Крещение один раз как Таинство: человек умирает для греха и рождается свыше от воды и Духа."
      response: "Православная Церковь видит в Крещении не очищение, которое можно повторять, а новое рождение «от воды и Духа» (Ин 3:5), поэтому оно совершается один раз (катехизис, §301). Крещение Иоанна Предтечи было «крещением покаяния» (Деян 19:4); Христос освятил Крещение, приняв его от Иоанна, а затем повелел крестить «во имя Отца и Сына и Святого Духа» (Мф 28:19; §286)."
