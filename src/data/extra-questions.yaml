    islam:
      teaching: "Обязательная молитва, намаз, состоит из установленных арабских формул: это такбир «Аллаху акбар» («Аллах Велик!») и чтение Корана, прежде всего суры аль-Фатиха. По «Википедии», шафииты, маликиты и ханбалиты считают чтение Фатихи обязательным в каждом ракаате, ханафиты — в первом и втором. В переводе И. Ю. Крачковского сура открывается словами «Во имя Аллаха милостивого, милосердного!» и содержит просьбу: «Тебе мы поклоняемся и просим помочь!» (Коран 1:1, 1:5). Дуа — личную мольбу к Аллаху — можно произносить на любом языке."
      difference: "Ислам предписывает читать намаз на арабском по строго установленному порядку и допускает дуа на любом языке, а Православная Церковь молится Святой Троице готовыми молитвами из молитвослова и своими словами."
