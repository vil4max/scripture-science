  traditions:
    judaism:
      teaching: "Евреи молятся по сидуру (молитвеннику): личные мольбы, по «Википедии», произносят на родном языке, общинные молитвы — на иврите. Шма — единственная молитва, данная как заповедь Торы: «Слушай, Израиль: Всевышний — наш Б-г, Всевышний — один» (Толдот.ру). День начинают с «Модэ ани» — благодарности Богу, который «вернул нам душу»; перед едой произносят благословения, например над хлебом: «Благословен Ты, Г-сподь, Б-г наш, Владыка мира, Взрастивший хлеб из земли». Молиться, по принципам веры Маймонида, следует одному Творцу."
      difference: "Иудаизм молится Богу-Творцу общинными молитвами на иврите по сидуру и личными мольбами на родном языке, а Православная Церковь молится Святой Троице, в том числе Господу Иисусу Христу и Святому Духу, готовыми молитвами из молитвослова и своими словами."
      response: "Церковь тоже молится псалмами: Псалтирь «более всех других священных книг употребляется при богослужении» («Азбука веры»), и строками из псалмов молился на кресте Сам Христос. «Отче наш» Он дал ученикам (Мф 6:9), и катехизис называет её образцом для всех молитв (§394). Ко Христу и Святому Духу Церковь обращается потому, что исповедует Их Богом: в молитве «Царю Небесный» она молится Святому Духу как истинному Богу."
