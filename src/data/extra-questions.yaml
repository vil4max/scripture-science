    lds:
      teaching: "Каждое воскресенье Святые последних дней собираются на причастное собрание: вступительная и заключительная молитвы, несколько гимнов и проповеди, которые готовят сами члены Церкви. Главная часть — причастие: кусочек хлеба и стаканчик воды в память об искупительной жертве Христа. Затем второй час учёбы: Первоначальное общество для детей, Воскресная школа для взрослых (в определённые воскресенья). Обряды храма, например дар (endowment) и запечатление брака, совершаются отдельно, в храмах."
      difference: "Святые последних дней проводят еженедельное причастное собрание с молитвами, гимнами и выступлениями членов и причащаются хлебом и водой, а Церковь совершает Литургию, на которой хлеб и вино прелагаются в Тело и Кровь Христовы."
      response: "Церковь учит, что за Литургией хлеб и вино прелагаются в истинное Тело и истинную Кровь Христову (катехизис, §336), а Причащение — главная часть богослужения (§314). Господь на Тайной вечере говорил о «плоде виноградном» (Мф 26:29), и Церковь причащает под видом хлеба и вина (§312)."
