    islam:
      teaching: "Коран чтит Марьям (Марию): ангелы говорят ей, что Аллах «избрал тебя, очистил и возвысил над женщинами миров» (3:42), а сын у неё родится, хотя её «не касался ни один мужчина» (3:47). Иса, сын Марьям, — только посланник Аллаха (5:75), а в 5:116 он отрицает, что велел людям принимать его и его мать «двумя богами наряду с Аллахом»."
      difference: "Ислам чтит Марьям как избранную деву и мать пророка Исы, а Православная Церковь исповедует Марию Богородицей, Матерью воплотившегося Бога."
      response: "Церковь не обожествляет Марию: Она — сотворённое существо, но превосходит благодатью и достоинством всякое сотворённое существо (катехизис, §188). Богородицей Её называют потому, что родившийся от Неё был в самом зачатии и рождении истинным Богом (§187)."
      proof:
        - url: "https://api.quran.com/api/v4/quran/translations/45?verse_key=3:42"
