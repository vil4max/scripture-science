        accessed: "2026-10-09"
  traditions:
    judaism:
      teaching: "Иудаизм не признаёт Иисуса из Назарета Мессией, а веру в Его божественность трудно согласовать с единством Бога (так объясняет My Jewish Learning). Отдельного учения о Марии в найденных иудейских источниках нет, а стих Ис 7:14 раввин с сайта Aish относит к современнице пророка, а не к Марии."
      difference: "Иудаизм не признаёт Иисуса Мессией и не учит о Марии как о Матери Бога, а Православная Церковь исповедует Её Богородицей и просит Её молитв."
      response: "Церковь называет Марию Богородицей, потому что родившийся от Неё — истинный Бог (катехизис, §187). Ис 7:14 она читает по Синодальному переводу — «Дева» — и вслед за евангелистом Матфеем относит это к Марии (Мф 1:22–23); к святым Церковь обращается за молитвенной помощью, а молитву приносят они Богу (§261)."
