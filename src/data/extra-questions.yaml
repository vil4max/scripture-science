- id: prayer-words
  question: "Какими словами молятся: примеры молитв"
  orthodox:
    short: "Православные молятся и готовыми молитвами из молитвослова, составленными святыми (многие взяты из Писания), и своими словами. Например: «Отче наш», «Господи Иисусе Христе, Сыне Божий, помилуй мя, грешнаго», «Богородице Дево, радуйся»."
    detail: "Основа молитвенной жизни — молитвослов: читая молитвы, составленные святыми, человек молится словами их творцов — псалмопевцев и подвижников, а многие из этих молитв, как псалмы и «Отче наш», взяты из Писания. Рядом с этим Церковь учит молиться и своими словами: молитвословия, составленные святыми, могут стать своими собственными. Три краткие молитвы для примера: «Отче наш, Иже еси на небесех! Да святится имя Твое, да приидет Царствие Твое…» — слова, которым научил Сам Христос (Мф 6:9–13); «Господи Иисусе Христе, Сыне Божий, помилуй мя, грешнаго» — Иисусова молитва; «Богородице Дево, радуйся, благодатная Марие, Господь с Тобою…» — слова архангела Гавриила и праведной Елисаветы (Лк 1:28, 1:42). Полные тексты этих и других молитв — ниже на этой странице."
