    lds:
      teaching: "Крещение совершается погружением, и, по Церкви, только носитель священства может совершить его приемлемым образом. Креститься должен каждый, кому исполнилось восемь лет и кто ощущает ответственность за поступки; крещение маленьких детей, по её словам, не соответствует учению Спасителя. Оно ведёт к прощению грехов и вхождению в Церковь; после него следует конфирмация — возложение рук для дара Святого Духа. В храмах совершают крещения и за умерших."
      difference: "Святые последних дней крестят погружением, которое совершает носитель священства, детей — с восьми лет, для прощения грехов, затем совершают конфирмацию и крестят за умерших, а Православная Церковь крестит троекратным погружением во имя Святой Троицы, в том числе младенцев, и обычно сразу совершает Миропомазание."
      response: "Православная Церковь тоже учит, что Крещение даёт прощение грехов (Деян 2:38), но видит в нём Таинство, в котором верующий умирает для греховной жизни и возрождается Духом Святым (катехизис, §285), и крестит младенцев по вере родителей и восприемников (§289). По «Азбуке веры», мормонов она принимает через Крещение: этот чин относится к сообществам, где, по оценке Церкви, кардинально искажены догматы, прежде всего учение о Святой Троице."
