    protestantism:
      teaching: "Лютеране крестят и младенцев: по Аугсбургскому исповеданию (IX) через Крещение предлагается благодать Божия, а Малый катехизис учит, что оно дарует прощение грехов и вечное спасение верующим. Англикане (Статья XXVII) называют Крещение знаком возрождения и сохраняют крещение малых детей. Баптисты (1985) и пятидесятники (Assemblies of God) крестят погружением только уверовавших: по ЕХБ это свидетельство веры и послушания и символ смерти, погребения и воскресения со Христом."
      difference: "Лютеране и англикане крестят и младенцев и видят в Крещении средство благодати; баптисты и пятидесятники крестят погружением только уверовавших — как заповедь, свидетельство веры и символ смерти и воскресения со Христом; а Православная Церковь крестит и младенцев, и взрослых и видит в Крещении Таинство, в котором действует благодать Божия."
      response: "Православная Церковь согласна с лютеранами и англиканами, что младенцев следует крестить: по катехизису, их крестят по вере родителей и восприемников, а Крещение заменило обрезание, которое совершалось над младенцами (§§289–290). От баптистов и пятидесятников её отличает понимание Крещения как Таинства, в котором верующий «возрождается Святым Духом» (§285), а не только свидетельствует о вере. По «Азбуке веры», лютеран, англикан и реформатов она принимает через миропомазание, признавая их Крещение."
