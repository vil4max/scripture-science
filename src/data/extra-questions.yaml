    jw:
      teaching: "Свидетели Иеговы учат молиться только Иегове и через Иисуса Христа; молиться, по их словам, можно в любом месте и в любое время, при этом важно быть искренним и не повторять одни и те же фразы. Каждую неделю они выделяют время для семейного поклонения — обсуждения духовных тем в непринуждённой обстановке."
      difference: "Свидетели Иеговы молятся только Иегове через Иисуса Христа и каждую неделю выделяют время для семейного поклонения, а Церковь молится по молитвослову, обращается и ко Христу, и просит молитв святых."
      response: "Церковь молится и Господу Иисусу Христу — в Иисусовой молитве, — потому что Он, по катехизису, истинный Бог (§187), и просит молитв святых как членов небесной Церкви (§261). Повторение слов в молитве не запрещено: Сам Христос в Гефсиманском саду «помолился в третий раз, сказав то же слово» (Мф 26:44)."
