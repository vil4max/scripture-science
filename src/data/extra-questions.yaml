    protestantism:
      teaching: "Лютеранская «Формула согласия» учит, что Мария родила истинного Сына Божия и потому по праву называется матерью Бога, а «Апология» одобряет почитание святых, но говорит, что Писание не учит их призывать. Реформатское Вестминстерское исповедание велит поклоняться Богу, «а не ангелам, святым или другим творениям», баптисты в вероучении 1985 г. пишут, что Христос родился от девы Марии, а у англикан взгляды на призывание святых разные."
      difference: "Лютеране называют Марию матерью Бога, но протестанты в целом не молятся Марии и святым (у англикан взгляды разные), а Православная Церковь исповедует Её Богородицей и просит Её молитв."
      response: "Церковь призывает святых как членов небесной Церкви: они приносят Богу молитвы верующих (катехизис, §261), а основание — Священное Предание (§262). VII Вселенский Собор определил почитать святых и «просить их ходатайства, так как они могут нас приближать к Богу»."
