- id: psalter
  question: "Как относятся к Псалтири?"
  orthodox:
    short: "Псалтирь — книга псалмов, песен и молитв царя Давида и других авторов, часть Священного Писания. В Православной Церкви её читают за богослужением больше, чем любую другую священную книгу, и делят для чтения на 20 кафизм."
    detail: "По Уставу вся Псалтирь прочитывается за неделю, а в Великий пост — дважды. Псалом 50 — покаянный: он звучит на службах трижды за сутки и входит в утренние молитвы. Номера многих псалмов в церковнославянской и русской Библиях на единицу меньше, чем в еврейской и западных (Пс 50 здесь — Пс 51 там)."
    proof:
