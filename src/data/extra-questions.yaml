    catholicism:
      teaching: "Католики называют свою общину Католической Церковью: «католический» значит «вселенский» — содержащий полноту средств спасения и посланный всему человечеству (Катехизис, §§830–831). Единая Церковь Христова, по Катехизису (§816, цитата из Lumen gentium 8), «пребывает» в Католической Церкви под управлением преемника Петра и епископов в общении с ним. Она состоит из отдельных Церквей, прежде всего епархий (§833), и совершает богослужение в нескольких обрядах (§1203)."
      difference: "Католическая Церковь считает, что единая Церковь Христова «пребывает» в ней, под управлением преемника Петра и епископов в общении с ним, а Православная Церковь считает истинной Церковью Христовой себя — семью самостоятельных Поместных Церквей с единой Главой, Христом."
      response: "Православная Церковь тоже исповедует Церковь кафолической, то есть соборной и вселенской: она не ограничена ни местом, ни временем, ни народом (катехизис, §268); сам катехизис свт. Филарета назван катехизисом Православной Кафолической Восточной Церкви. Единственная Глава Церкви — Христос (§257), а единство Поместных Церквей выражается общим исповеданием веры и общением в молитвах и Таинствах (§259), без одного видимого главы над всеми."
