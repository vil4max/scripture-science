# Extra comparison questions (Theotokos, Psalter, services, private prayer):
# Orthodox answer first, then each tradition's own teaching, the difference,
# and the Orthodox response.
# Source rules: docs/SOURCES.md. Proof entries marked accessed 2026-10-09 were
# fetched and checked as exact substrings of the page text on that date; older
# dates belong to entries reused from the matrix, analyses and assessments.
- id: theotokos
  question: "Кто такая Богородица и почему её почитают?"
  orthodox:
    short: "Богородица — Пресвятая Дева Мария, Мать Иисуса Христа. Церковь называет Её так, потому что Её Сын — истинный Бог, чтит Её Приснодевой, выше Херувимов и Серафимов, и просит Её молитв."
    detail: "Имя «Богородица» исповедует веру о Христе: родившийся от Неё — Бог. III Вселенский Собор утвердил это в 431 году. Церковь просит Марию о молитвах, как и других святых, а гимн «Достойно есть» славит Её как Матерь нашего Бога."
    proof:
      - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
        title: "Свт. Филарет. Пространный катехизис, §§184–189: Приснодева и Богородица"
        tier: official
        excerpt: "Пресвятая Мария действительно всегда пребывала и пребывает Девой"
        accessed: "2026-09-27"
      - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
        title: "Свт. Филарет. Пространный катехизис, §187: Богородица"
        tier: official
        excerpt: "Она достойно наречена Богородицей, потому что родившийся от Неё был в самом зачатии и рождении от Неё, как есть и всегда, истинный Бог"
        accessed: "2026-10-01"
      - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
        title: "Свт. Филарет Московский. Пространный катехизис, §188: достоинство Девы Марии"
        tier: official
        excerpt: "Православная Церковь чтит Её превыше Херувимов и Серафимов"
        accessed: "2026-10-01"
      - url: "https://azbyka.ru/bogorodica"
        title: "Богородица (Пресвятая Дева Мария) — энциклопедия «Азбука веры»"
        tier: reference
        excerpt: "Догмат о Богоматеринстве получил окончательное закрепление на III Вселенском Соборе, состоявшемся в 431 году"
        accessed: "2026-10-01"
      - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
        title: "Свт. Филарет Московский. Пространный катехизис, §261: общение земной и небесной Церкви"
        tier: official
        excerpt: "Верующие из земной Церкви, принося молитву Богу, обращаются также за помощью к святым из Церкви небесной"
        accessed: "2026-10-01"
      - url: "https://azbyka.ru/bogorodica"
        title: "Богородица (Пресвятая Дева Мария) — энциклопедия «Азбука веры», «О молитвенном обращении к Богородице „спаси нас!“»"
        tier: reference
        excerpt: "Откликаясь на наши молитвы, Богородица, как Пренепорочная Матерь Христа, может помочь нам ходатайством"
        accessed: "2026-10-09"
      - url: "https://azbyka.ru/dostojno-est"
        title: "Достойно есть — энциклопедия «Азбука веры» (церковнославянский текст и русский перевод гимна)"
        tier: reference
        excerpt: "Поистине достойно прославлять Тебя, Богородицу, всегда блаженную и непорочную и Матерь Бога нашего"
        accessed: "2026-10-09"
  traditions:
    judaism:
      teaching: "Иудаизм не признаёт Иисуса из Назарета Мессией, а веру в Его божественность трудно согласовать с единством Бога (так объясняет My Jewish Learning). Отдельного учения о Марии в найденных иудейских источниках нет, а стих Ис 7:14 раввин с сайта Aish относит к современнице пророка, а не к Марии."
      difference: "Иудаизм не признаёт Иисуса Мессией и не учит о Марии как о Матери Бога, а Церковь исповедует Её Богородицей и просит Её молитв."
      response: "Церковь называет Марию Богородицей, потому что родившийся от Неё — истинный Бог (катехизис, §187). Ис 7:14 она читает по Синодальному переводу — «Дева» — и вслед за евангелистом Матфеем относит это к Марии (Мф 1:22–23); к святым Церковь обращается за молитвенной помощью, а молитву приносят они Богу (§261)."
