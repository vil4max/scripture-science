    catholicism:
      teaching: "Катехизис Католической Церкви признаёт и готовые слова, и личную молитву: Христос научил апостолов устной молитве «Отче наш», но молился и не только богослужебными молитвами синагоги, а и Своей личной (КЦЦ 2701). Особое место занимает «Радуйся, Мария»: Катехизис разбирает её по фразам — «Благодатная, Господь с Тобою»; «Благословенна Ты между женами, и благословен плод чрева Твоего Иисус»; «Святая Мария, Матерь Божия, молись о нас…» (КЦЦ 2676–2677). Розарий вырос, по Катехизису, из средневекового благочестия Запада и заменил в народе Молитвы Часов (КЦЦ 2678)."
      difference: "Здесь согласие: католики, как и Православная Церковь, молятся и готовыми молитвами, и в личной молитве, а «Отче наш» — общая молитва, данная Господом. Католическая «Радуйся, Мария» продолжается просьбой «Святая Мария, Матерь Божия, молись о нас…», а православная «Богородице Дево, радуйся» кончается словами «яко Спаса родила еси душ наших»; Розарий — особая молитва католиков."
      response: "«Богородице Дево, радуйся» тоже собрана из слов Писания — приветствий архангела Гавриила (Лк 1:28) и праведной Елисаветы (Лк 1:42), а «Азбука веры» называет её той же молитвой, что латинская Ave Maria. Просить Богородицу и святых о молитвах Церковь тоже учит: земная Церковь, принося молитву Богу, обращается и к небесной (катехизис, §261). «Отче наш» читают в составе практически любого общественного богослужения и домашнего молитвенного правила."
