    protestantism:
      teaching: "У протестантов много церквей и деноминаций. Аугсбургское исповедание (лютеране, VII) называет Церковью собрание святых, где верно учат Евангелию и верно совершают Таинства; англиканские Статьи веры (XIX) — видимую Церковь верных, где проповедуется чистое Слово Божие; Вестминстерское исповедание (реформаты) — невидимую вселенскую Церковь всех избранных. Баптисты (1985) различают вселенскую, поместную и домашнюю церкви; поместная — собрание возрождённых."
      difference: "Протестанты называют себя разными церквами и общинами и понимают Церковь как собрание верных, видимое и невидимое (у баптистов поместная церковь — собрание возрождённых), а Православная Церковь называет единой Церковью семью Поместных Церквей, соединённых общей верой, священноначалием и Таинствами."
      response: "Православная Церковь тоже говорит о Церкви земной, видимой, и небесной, невидимой, но видит её одной: по катехизису, к ней принадлежат и живущие на земле православные христиане, и скончавшиеся в истинной вере и святости (§252). Церковь есть «Богом установленное общество людей, соединённых православной верой, законом Божиим, священноначалием и Таинствами» (§250), поэтому её единство не сводится к числу общин."
