      teaching: "Крещение, по основным положениям (п. 15), — Божье установление, в котором верующий исповедует веру в смерть и воскресение Иисуса Христа и свидетельствует, что умер для греха; это символ единства со Христом, прощения грехов и принятия Духа Святого. Оно совершается погружением, к нему допускаются те, кто имеет веру в Иисуса и засвидетельствовал о раскаянии во грехе, а предшествует ему изучение Священного Писания. Через крещение верующий становится частью народа Божьего."
      difference: "Адвентисты крестят погружением тех, кто сам исповедал веру и раскаяние, как символ единства со Христом, прощения грехов и принятия Духа Святого, а Православная Церковь крестит и младенцев, и взрослых и видит в Крещении Таинство, в котором верующий умирает для греховной жизни и возрождается Духом Святым."
      response: "Православная Церковь согласна, что Крещение связано с прощением грехов и вхождением в Церковь (Деян 2:38; Ин 3:5), но совершает его и над младенцами по вере родителей и восприемников (катехизис, §289): Крещение в Новом Завете совершается вместо ветхозаветного обрезания, которое совершалось над восьмидневными младенцами (§290)."
