    adventism:
      teaching: "В субботу утром адвентисты сначала собираются на Субботнюю школу — изучение Библии в небольших группах по «Уроку субботней школы», затем, после перерыва, на богослужение: его центр — проповедь, а также общее пение, чтение Писания, молитвы и пожертвования. Руководство Церкви (Church Manual) не задаёт строгого порядка службы. Вечеря Господня обычно раз в квартал: сначала омовение ног, затем пресный хлеб и несброженный виноградный сок."
      difference: "Адвентисты собираются в субботу на изучение Библии (Субботнюю школу) и богослужение с проповедью и обычно раз в квартал совершают Вечерю Господню с омовением ног, а Церковь служит Литургию с Причащением и празднует воскресенье, день Воскресения Христова."
      response: "Церковь празднует воскресенье со времени воскресения Христа (катехизис, §535); в книге Деяний сказано: «В первый же день недели, когда ученики собрались для преломления хлеба» (Деян 20:7), а апостол Иоанн упоминает «день воскресный» (Откр 1:10). Средоточие богослужения Церкви — Причащение, которое совершается за Литургией (§§314–315)."
