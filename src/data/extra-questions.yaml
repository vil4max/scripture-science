- id: services
  question: "Как устроено богослужение?"
  orthodox:
    short: "Основа православного богослужения — Божественная литургия, на которой совершается Евхаристия. Вокруг неё — службы суточного круга (вечерня, утреня, часы, повечерие) и годовой круг праздников и постов; это общая молитва Церкви, с пением."
    detail: "За Литургией звучат молитвы и песнопения, читают отрывки из Апостола и Евангелия, священник произносит проповедь, а затем верующие причащаются Телом и Кровью Христовыми под видом хлеба и вина. Литургия состоит из трёх частей: проскомидии (приготовления хлеба и вина), литургии оглашённых (молитвы, песнопения, чтения Писания) и литургии верных, за которой совершается Причащение. Катехизис называет Причащение главной и существенной частью христианского богослужения, а слово «литургия» означает общественное служение. Суточный круг составляют вечерня, повечерие, полунощница, утреня и часы (в приходах, как правило, повечерие и полунощницу не служат), годовой круг — праздники, памяти святых и посты. В Русской Церкви служат на церковнославянском языке, но язык богослужения — дело традиции, а не догматики: в других Поместных Церквах служат на местных языках."
    proof:
