    protestantism:
      teaching: "Порядок зависит от церкви. Лютеране причащаются в воскресные и праздничные дни, а лютеране и англикане держатся церковного года: Адвент, Рождество, Великий пост, Пасха. Англиканские священники и диаконы обязаны ежедневно читать утреннюю и вечернюю молитву. У баптистов (ЕХБ) главное богослужение — в воскресенье, а в течение недели проходят и другие собрания; главные праздники — Пасха и Рождество Христово."
      difference: "Лютеране и англикане держатся церковного года, баптисты собираются главным образом в воскресенье, а Православная Церковь, кроме воскресенья, хранит постные среду и пятницу, четыре многодневных поста и двунадесятые праздники."
      response: "Церковь тоже строит год вокруг Пасхи и Рождества Христова, но хранит и другие дни: «кроме воскресного дня, и другие, во славу Божию и в честь Пресвятой Богородицы и прочих святых установленные праздники и посты» (катехизис, §537). Пост она держит по слову Христа: «придут дни, когда отнимется у них жених, и тогда будут поститься» (Мф 9:15)."
