  orthodoxFoundation: Пост — время покаяния, молитвы, милосердия и борьбы со страстями. Воздержание в пище помогает этому труду, но без перемены жизни не достигает цели. В практике РПЦ есть четыре многодневных поста, среды и пятницы; меру телесного воздержания соотносят со здоровьем и обстоятельствами человека при пастырском руководстве.
