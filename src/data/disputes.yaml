  answers:
    - tradition: orthodoxy
      summary: >-
        Бог — источник спасения и прежде подаёт благодать; добрые дела не являются платой за неё. Но вера действует любовью, и свободный ответ человека не исключён из спасения. Поэтому православная синергия не означает независимого от Бога самоспасения, а спор нельзя свести к противопоставлению «вера или нравственная жизнь».
      unity:
        kind: shared
        note: >-
          здесь приведено соборное Послание Восточных патриархов 1723 года; его подписанты исповедуют изложение как православную веру своей Церкви.
