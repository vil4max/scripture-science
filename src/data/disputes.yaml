- id: justification
  topic: salvation
  title: 'Оправдание: вера и дела'
  challenges:
    - tradition: protestantism
      summary: >-
        В лютеранском Аугсбургском исповедании прощение грехов и оправдание получаются ради Христа по благодати через веру. Вера должна приносить добрые плоды и дела, но на дела нельзя уповать как на способ снискать благодать перед Богом.
      unity:
        kind: divided
        note: >-
          здесь изложена лютеранская формулировка, а не единое исповедание всех протестантских церквей. Различается, в частности, связь спасения с крещением: Аугсбургское исповедание называет его необходимым средством дарования благодати; Вестминстерское допускает возрождение и спасение без этого обряда.
        proof:
          - url: >-
              https://web.archive.org/web/20260308213117/https://www.elkras.ru/vo_chto_veryat_liuterane/verouchitelnye_knigi/kniga_soglasiya/augsburgskoe_veroispovedanie.jdx
            title: Аугсбургское вероисповедание — ЕЛЦ России (архивная копия), артикул IX
            tier: official
            excerpt: О Крещении мы учим, что оно необходимо и что через него даруется благодать.
            accessed: '2026-09-26'
          - url: https://www.ireformed.org/westminster-confession-of-faith
            title: Вестминстерское исповедание веры — ireformed.org, глава 28
            tier: official
            excerpt: >-
              благодать и спасение не настолько связаны с этим обрядом, чтобы без него человек не мог пережить духовное возрождение или обрести спасение
            accessed: '2026-09-26'
      quote:
        text: мы получаем прощение грехов и оправдание перед Богом ради Христа по благодати через веру
        source: Аугсбургское вероисповедание — ЕЛЦ России (архивная копия), артикул IV
