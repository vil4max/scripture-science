  extras: "<figure class=\"dgwrap\"><svg class=\"dg\" viewBox=\"0 0 360 210\" role=\"img\" aria-label=\"Схема: у православных после смерти душа живёт и проходит частный суд, затем воскресение и Страшный суд; у Свидетелей Иеговы после смерти небытие, затем воскресение как воссоздание и суд по делам\"><defs><marker id=\"ah3\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"ah\"></path></marker></defs><line x1=\"180\" y1=\"6\" x2=\"180\" y2=\"204\" class=\"div\"></line><text x=\"90\" y=\"18\" text-anchor=\"middle\" class=\"hd o\">Православие</text><text x=\"270\" y=\"18\" text-anchor=\"middle\" class=\"hd j\">Свидетели Иеговы</text><rect x=\"26\" y=\"30\" width=\"128\" height=\"34\" rx=\"7\" class=\"bo\"></rect><text x=\"90.0\" y=\"50.9\" text-anchor=\"middle\" class=\"t\" font-size=\"11\">смерть тела</text><line x1=\"90\" y1=\"64\" x2=\"90\" y2=\"74\" class=\"ar\" marker-end=\"url(#ah3)\"></line><rect x=\"26\" y=\"76\" width=\"128\" height=\"34\" rx=\"7\" class=\"bo\"></rect><text x=\"90.0\" y=\"90.3\" text-anchor=\"middle\" class=\"t b\" font-size=\"11\">душа живёт,</text><text x=\"90.0\" y=\"103.3\" text-anchor=\"middle\" class=\"t b\" font-size=\"11\">частный суд</text><line x1=\"90\" y1=\"110\" x2=\"90\" y2=\"120\" class=\"ar\" marker-end=\"url(#ah3)\"></line><rect x=\"26\" y=\"122\" width=\"128\" height=\"34\" rx=\"7\" class=\"bo\"></rect><text x=\"90.0\" y=\"136.3\" text-anchor=\"middle\" class=\"t\" font-size=\"11\">воскресение:</text><text x=\"90.0\" y=\"149.3\" text-anchor=\"middle\" class=\"t\" font-size=\"11\">душа + тело</text><line x1=\"90\" y1=\"156\" x2=\"90\" y2=\"166\" class=\"ar\" marker-end=\"url(#ah3)\"></line><rect x=\"26\" y=\"168\" width=\"128\" height=\"34\" rx=\"7\" class=\"bo\"></rect><text x=\"90.0\" y=\"188.8\" text-anchor=\"middle\" class=\"t\" font-size=\"11\">Страшный суд</text><rect x=\"206\" y=\"30\" width=\"128\" height=\"34\" rx=\"7\" class=\"bj\"></rect><text x=\"270.0\" y=\"50.9\" text-anchor=\"middle\" class=\"t\" font-size=\"11\">смерть</text><line x1=\"270\" y1=\"64\" x2=\"270\" y2=\"74\" class=\"ar\" marker-end=\"url(#ah3)\"></line><rect x=\"206\" y=\"76\" width=\"128\" height=\"34\" rx=\"7\" class=\"bj\"></rect><text x=\"270.0\" y=\"90.3\" text-anchor=\"middle\" class=\"t b\" font-size=\"11\">небытие,</text><text x=\"270.0\" y=\"103.3\" text-anchor=\"middle\" class=\"t b\" font-size=\"11\">«как сон»</text><line x1=\"270\" y1=\"110\" x2=\"270\" y2=\"120\" class=\"ar\" marker-end=\"url(#ah3)\"></line><rect x=\"206\" y=\"122\" width=\"128\" height=\"34\" rx=\"7\" class=\"bj\"></rect><text x=\"270.0\" y=\"136.3\" text-anchor=\"middle\" class=\"t\" font-size=\"11\">воскресение:</text><text x=\"270.0\" y=\"149.3\" text-anchor=\"middle\" class=\"t\" font-size=\"11\">воссоздание</text><line x1=\"270\" y1=\"156\" x2=\"270\" y2=\"166\" class=\"ar\" marker-end=\"url(#ah3)\"></line><rect x=\"206\" y=\"168\" width=\"128\" height=\"34\" rx=\"7\" class=\"bj\"></rect><text x=\"270.0\" y=\"182.3\" text-anchor=\"middle\" class=\"t\" font-size=\"11\">суд по делам</text><text x=\"270.0\" y=\"195.3\" text-anchor=\"middle\" class=\"t\" font-size=\"11\">после воскресения</text></svg><figcaption>Схема: что происходит после смерти</figcaption></figure><div class=\"textdiff\">\n          <p class=\"eyebrow\">Спор 1 · Лк 23:43 — где поставить запятую</p>\n          <p class=\"greek\">Ἀμήν σοι λέγω σήμερον μετ᾽ ἐμοῦ ἔσῃ ἐν τῷ παραδείσῳ<br/><span>«Аминь тебе говорю сегодня со Мной будешь в раю» — в рукописях нет знаков препинания</span></p>\n          <div class=\"duo\">\n            <div class=\"pos o\"><span class=\"who\">Синодальный перевод</span><p>«Истинно говорю тебе<mark>, ныне же</mark> будешь со Мною в раю».</p><p class=\"small\">Разбойник будет в раю в тот же день.</p></div>\n            <div class=\"pos j\"><span class=\"who\">«Перевод нового мира»</span><p>«Обещаю тебе <mark>сегодня:</mark> ты будешь со мной в раю».</p><p class=\"small\">Обещание дано сегодня, рай наступит в будущем.</p></div>\n          </div>\n          <div class=\"duo\">\n            <div class=\"pos o\"><span class=\"who\">Доводы православных</span><ul>\n              <li>Формула «Истинно говорю тебе (вам)» встречается в Евангелиях десятки раз и нигде больше не соединяется со словом «сегодня»</li>\n              <li>Разбойник просит о будущем: «помяни меня, когда приидешь» (23:42), — Христос отвечает: «ныне»</li>\n              <li>Богослужение: «Во гробе плотски, во аде же с душею яко Бог, в раи же с разбойником…» (Пасхальные часы)</li></ul></div>\n            <div class=\"pos j\"><span class=\"who\">Доводы Свидетелей</span><ul>\n              <li>«Обещаю тебе сегодня» — торжественный оборот, как во Втор 30:15: «Я предлагаю вам сегодня жизнь и добро»</li>\n              <li>В тот день Иисус не был в раю: «Сын человеческий будет в сердце земли три дня и три ночи» (Мф 12:40)</li>\n              <li>После воскресения сказал: «я ещё не поднялся к Отцу» (Ин 20:17)</li>\n              <li>Пояснение к ПНМ: грамматика допускает оба прочтения; «рай» — райская земля, где разбойник воскреснет среди «неправедных» (Деян 24:15)</li></ul></div>\n          </div>\n        </div><div class=\"fathers\"><p class=\"eyebrow\">Как толкуют Отцы Лк 23:43 · по ekzeget.ru</p><ul><li><b>Прп. Ефрем Сирин (IV в.):</b> «Господь ускорил отдаленные дары Свои и дал близкое обетование, говоря: „сегодня“»</li><li><b>Блж. Иероним (IV–V вв.):</b> «Крест Христа есть ключ от рая; крест Христа отверз рай разбойнику»</li><li><b>Свт. Игнатий (Брянчанинов, XIX в.):</b> «в рай помещается душа разбойника, исповедавшего Христа Господом на кресте»</li></ul></div><div class=\"textdiff\">\n          <p class=\"eyebrow\">Спор 2 · Что такое «душа»</p>\n          <div class=\"duo\">\n            <div class=\"pos o\"><span class=\"who\">Православие</span><ul>\n              <li>Душа отлична от тела и переживает его: «не бойтесь убивающих тело, души же не могущих убить» (Мф 10:28)</li>\n              <li>Души убиенных взывают к Богу (Откр 6:9–10) — они в сознании</li>\n              <li>Притча о богаче и Лазаре (Лк 16:19–31) описывает сознательную жизнь после смерти</li></ul></div>\n            <div class=\"pos j\"><span class=\"who\">Свидетели Иеговы</span><ul>\n              <li>Евр. <i>нефеш</i> — живое существо: человек «стал живым человеком» (Быт 2:7, ПНМ; в Синод. — «душою живою»), а не «получил душу»</li>\n              <li>Смерть — как сон: «Наш друг Лазарь уснул, но я иду его разбудить» (Ин 11:11)</li>\n              <li>Откр 6:9 и Лк 16 — образы: так и «кровь твоего брата взывает ко мне с земли» (Быт 4:10)</li></ul></div>\n          </div>\n          <p class=\"crux\"><b>Суть:</b> православные читают эти места буквально и видят в них учение о бессмертной душе; Свидетели считают их образными и опираются на ветхозаветное понимание души как самого живого человека. Слова «бессмертная душа» в Библии нет — с этим согласны обе стороны; спор о том, есть ли само учение.</p>\n        </div>"
- order: 8
  title: "Спасение, 144 000, тысячелетие и 1914 год"
  slug: "spasenie-144-000-tysyacheletie-i-1914-god"
