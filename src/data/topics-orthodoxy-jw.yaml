  extras: "<figure class=\"dgwrap\"><svg class=\"dg\" viewBox=\"0 0 360 196\" role=\"img\" aria-label=\"Схема: у православных один Бог в трёх равных Лицах; у Свидетелей Иеговы — Иегова, сотворённый Им Иисус и остальное творение, а дух — сила Бога\"><defs><marker id=\"ah0\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"ah\"></path></marker></defs><line x1=\"180\" y1=\"6\" x2=\"180\" y2=\"190\" class=\"div\"></line><text x=\"90\" y=\"18\" text-anchor=\"middle\" class=\"hd o\">Православие</text><text x=\"270\" y=\"18\" text-anchor=\"middle\" class=\"hd j\">Свидетели Иеговы</text><line x1=\"90\" y1=\"60\" x2=\"46\" y2=\"132\" class=\"ln-o\"></line><line x1=\"46\" y1=\"132\" x2=\"134\" y2=\"132\" class=\"ln-o\"></line><line x1=\"90\" y1=\"60\" x2=\"134\" y2=\"132\" class=\"ln-o\"></line><text x=\"90\" y=\"112\" text-anchor=\"middle\" class=\"t b\" font-size=\"11\">один Бог</text><circle cx=\"90\" cy=\"60\" r=\"25\" class=\"bo\"></circle><text x=\"90\" y=\"64\" text-anchor=\"middle\" class=\"t b\" font-size=\"12\">Отец</text><circle cx=\"46\" cy=\"132\" r=\"25\" class=\"bo\"></circle><text x=\"46\" y=\"136\" text-anchor=\"middle\" class=\"t b\" font-size=\"12\">Сын</text><circle cx=\"134\" cy=\"132\" r=\"25\" class=\"bo\"></circle><text x=\"134\" y=\"136\" text-anchor=\"middle\" class=\"t b\" font-size=\"12\">Дух</text><text x=\"90\" y=\"186\" text-anchor=\"middle\" class=\"cap\">три Лица, одна сущность</text><rect x=\"212\" y=\"32\" width=\"116\" height=\"28\" rx=\"7\" class=\"sj\"></rect><text x=\"270.0\" y=\"50.2\" text-anchor=\"middle\" class=\"t b\" font-size=\"12\">Иегова</text><line x1=\"270\" y1=\"60\" x2=\"270\" y2=\"84\" class=\"ar\" marker-end=\"url(#ah0)\"></line><text x=\"276\" y=\"77\" class=\"t sm\">сотворил</text><rect x=\"206\" y=\"86\" width=\"128\" height=\"34\" rx=\"7\" class=\"bj\"></rect><text x=\"270.0\" y=\"100.3\" text-anchor=\"middle\" class=\"t\" font-size=\"11\">Иисус (Михаил)</text><text x=\"270.0\" y=\"113.3\" text-anchor=\"middle\" class=\"t\" font-size=\"11\">первое творение</text><line x1=\"270\" y1=\"120\" x2=\"270\" y2=\"142\" class=\"ar\" marker-end=\"url(#ah0)\"></line><rect x=\"212\" y=\"144\" width=\"116\" height=\"24\" rx=\"7\" class=\"bj\"></rect><text x=\"270.0\" y=\"159.8\" text-anchor=\"middle\" class=\"t\" font-size=\"11\">ангелы, люди, мир</text><path d=\"M328 46 C352 46 352 150 330 156\" class=\"ar dash\" fill=\"none\" marker-end=\"url(#ah0)\"></path><text x=\"346\" y=\"104\" class=\"t sm\" text-anchor=\"middle\" transform=\"rotate(90 346 104)\">дух — сила</text><text x=\"270\" y=\"186\" text-anchor=\"middle\" class=\"cap\">одна Личность и Её творения</text></svg><figcaption>Схема: как устроено учение о Боге</figcaption></figure><div class=\"textdiff\">\n          <p class=\"eyebrow\">Разница в самом тексте Библии · 1 Ин 5:7–8</p>\n          <div class=\"duo\">\n            <div class=\"pos o\"><span class=\"who\">Синодальный перевод</span><p>«Ибо три свидетельствуют <mark>на небе: Отец, Слово и Святый Дух; и Сии три суть едино. И три свидетельствуют на земле:</mark> дух, вода и кровь; и сии три об одном».</p></div>\n            <div class=\"pos j\"><span class=\"who\">«Перевод нового мира»</span><p>«Ведь есть три свидетеля: дух, вода и кровь, и они свидетельствуют в согласии друг с другом».</p></div>\n          </div>\n          <p class=\"crux\"><b>Выделенных слов нет</b> в греческих рукописях до позднего Средневековья и у греческих Отцов. Они появились в латинской традиции (IV–V века), попали в печатный греческий текст Эразма (1522) и оттуда — в Синодальный и церковнославянский переводы. Православные полемисты (энциклопедия «Азбука веры», еп. Александр Милеант) приводят стих как свидетельство Троицы; Свидетели указывают на него как на позднюю вставку. Большинство библеистов, в том числе православных, считают вставку поздней; учение о Троице опирается и на другие места (Мф 28:19, 2 Кор 13:13).</p>\n        </div><p class=\"crux\"><b>Где спор:</b> православные относят Ин 14:28 к человеческой природе Христа, а «Троицу» считают поздним названием того, что уже есть в Писании. В «Сотворим» (Быт 1:26) они видят совет равных Лиц; Свидетели — обращение Бога к Сыну как к первому творению.</p>"
- order: 2
  title: "Кто такой Иисус Христос"
  slug: "kto-takoi-iisus-hristos"
  positions:
    orthodoxy:
      label: "Православие"
      thesis: "Истинный Бог, рождённый, а не сотворённый"
      points:
      - ref: "Ин 1:1"
        html: " «и Слово было Бог»"
      - ref: "Ин 20:28"
        html: " Фома: «Господь мой и Бог мой!»"
      - ref: "Ин 8:58"
        html: " «прежде нежели был Авраам, Я есмь»"
      - ref: "Кол 2:9"
        html: " «в Нём обитает вся полнота Божества телесно»"
      - ref: "Рим 9:5"
        html: " Христос — «сущий над всем Бог»"
    jw:
      label: "Свидетели Иеговы"
      thesis: "Первое творение Бога; «бог», но не Всемогущий"
      points:
      - ref: "Ин 1:1 (ПНМ)"
        html: " Слово «было богом»"
      - ref: "Кол 1:15"
        html: " «первый из всех творений»"
      - ref: "Откр 3:14"
        html: " «первое творение Бога»"
      - ref: "Мк 13:32"
        html: " «не знает никто: ни ангелы на небе, ни Сын — это знает только Отец»"
      - ref: "Притч 8:22"
        html: " Мудрость (по их пониманию — Сын): «Я была первой, кого создал Иегова»"
  extras: "<div class=\"fathers\"><p class=\"eyebrow\">Как толкуют Отцы · по ekzeget.ru</p><ul><li><b>Кол 1:15 — свт. Иоанн Златоуст (IV в.):</b> «не сказал: первозданный, а — перворожденный»</li><li><b>Кол 1:15 — свт. Афанасий Великий (IV в.):</b> «перворожден всея твари назван по тому, что Он виновник приведения твари из небытия в бытие»</li><li><b>Кол 1:15 — блж. Феодорит Кирский (V в.):</b> образ живой и ничем не отличающийся «имеет одно естество с первообразом»</li><li><b>Ин 1:1 — архиеп. Аверкий (Таушев, XX в.):</b> отсутствие артикля при θεός показывает Божественное достоинство Слова, но и то, что Сын — не та же Ипостась, что Отец</li><li><b>Ин 1:1 — свт. Василий Великий (IV в.):</b> «в начале бе Слово» отсекает мысль ариан о том, что было время, когда Сына не было</li></ul></div><p class=\"crux\"><b>Где спор:</b> в Ин 1:1 слово θεός стоит без артикля — «Бог» по природе или «бог» как качество? Православные: «первенец» (πρωτότοκος) означает первенство — так «первенцем» назван младший Давид (Пс 88:28), а «начало» (ἀρχή) в Откр 3:14 — источник творения. «Я есмь» перекликается с именем Бога в Исх 3:14, поэтому слушатели и взяли камни. Незнание часа относят к человеческой природе. <b>Свидетели</b> (пояснения к ПНМ): в Ин 1:1 θεός с артиклем обозначает Всемогущего Бога, а без артикля — свойство Слова («богоподобный», «божественный»), к тому же Слово было «с Богом»; так же поняли стих древние коптские переводы. Слово <i>прототокос</i> обычно значит «рождённый первым», и Откр 3:14 прямо называет Иисуса «первым творением Бога».</p>"
