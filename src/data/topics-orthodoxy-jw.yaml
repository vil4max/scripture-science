- order: 4
  title: "Можно ли молиться Христу"
  slug: "mozhno-li-molitsya-hristu"
  positions:
    orthodoxy:
      label: "Православие"
      thesis: "Да: Христу молятся и поклоняются как Богу"
      points:
      - ref: "Деян 7:59"
        html: " Стефан: «Господи Иисусе! приими дух мой»"
      - ref: "2 Кор 12:8"
        html: " Павел «трижды молил Господа»"
      - ref: "Откр 5:8"
        html: " старцы падают перед Агнцем"
      - ref: "Ин 5:23"
        html: " «да все чтут Сына, как чтут Отца»"
    jw:
      label: "Свидетели Иеговы"
      thesis: "Молятся только Иегове — через Иисуса"
      points:
      - ref: "Мф 6:9"
        html: " «Наш небесный Отец, пусть святится твоё имя» — молитва обращена к Отцу"
      - ref: "Ин 16:23"
        html: " «о чём бы вы ни попросили Отца во имя моё, он даст вам»"
      - html: "Иисус — посредник, а не адресат молитвы"
  extras: "<div class=\"textdiff\">\n          <p class=\"eyebrow\">Как это объясняют Свидетели · Деян 7:59</p>\n          <div class=\"duo\">\n            <div class=\"pos o\"><span class=\"who\">Синодальный перевод</span><p>«И побивали камнями Стефана, который молился и говорил: <mark>Господи Иисусе! приими дух мой</mark>».</p></div>\n            <div class=\"pos j\"><span class=\"who\">«Перевод нового мира»</span><p>«…он <mark>обратился к Иисусу</mark>: «Господь Иисус, прими мой дух»».</p></div>\n          </div>\n          <p class=\"crux\"><b>Объяснение Свидетелей</b> (пояснение к стиху на wol.jw.org): греческое слово <i>эпикалео</i> значит «призывать, обращаться», а не обязательно «молиться». Стефан только что видел Иисуса в видении (Деян 7:55–56) и обратился к Нему напрямую — это не молитва и не поклонение. Он знал, что Иегова дал Иисусу власть воскрешать, но не считал Их одним лицом. Похожим образом Свидетели понимают и «поклонение» Иисусу (греч. <i>проскинео</i>): как почтительный поклон, который оказывают и царю, а не как служение Богу.</p>\n          <p class=\"crux\"><b>Ответ православных:</b> в Синодальном переводе прямо сказано «молился», а в греческом тексте то же слово <i>эпикалео</i> описывает призывание имени Господа, от которого зависит спасение (Деян 2:21; Рим 10:13). Умирающий вручает свой дух тому, кого считает Богом, — так Сам Христос на кресте вручил дух Отцу (Лк 23:46).</p>\n        </div><p class=\"crux\"><b>Где спор:</b> православные: поклонение, которое Христос принимает (прокажённый-самарянин, Лк 17:15–16), подобает только Богу. Свидетели понимают такое «поклонение» как почтительный поклон царю.</p>"
