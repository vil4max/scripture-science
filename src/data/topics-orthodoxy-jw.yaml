    orthodoxy:
      label: "Православие"
      thesis: "Образ указывает на первообраз; святые живы у Бога"
      points:
      - ref: "Исх 25:18–22"
        html: " Бог Сам велел сделать золотых херувимов на ковчеге: «там Я буду открываться тебе»"
      - ref: "Кол 1:15"
        html: " Христос — «образ Бога невидимого»: Боговоплощение сделало Бога изобразимым"
      - ref: "Мф 22:32"
        html: " «Бог не есть Бог мёртвых, но живых» — поэтому святых просят о молитве"
      - ref: "Лк 1:43, 48"
        html: " Мария — «Матерь Господа моего»; «отныне будут ублажать Меня все роды»"
    jw:
      label: "Свидетели Иеговы"
      thesis: "Поклонение — только Иегове, без изображений"
      points:
      - ref: "Исх 20:4–5"
        html: " «Не делай себе никаких идолов, изображений… Не кланяйся и не служи им»"
      - ref: "1 Ин 5:21"
        html: " «Мои любимые дети, держитесь в стороне от идолов»"
      - ref: "Еккл 9:5"
        html: " «мёртвые ничего не знают»; «есть… один посредник между Богом и людьми» (1 Тим 2:5)"
      - ref: "Мф 13:55–56"
        html: " «его братья — Иаков, Иосиф, Симон и Иуда, и все его сёстры»: у Марии были и другие дети; её уважают, но не почитают как Богородицу"
  extras: "<p class=\"crux\"><b>Где спор:</b> православные различают идол, за которым не стоит никакой реальности, и икону, которая «всегда предполагает первообраз», а также поклонение Богу и почитание образа (VII Вселенский собор, 787). «Братьев Господа» Церковь считает детьми Иосифа от первого брака или родственниками. Свидетели видят в любом поклоне перед изображением нарушение второй заповеди.</p>"
