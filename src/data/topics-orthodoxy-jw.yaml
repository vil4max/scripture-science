    jw:
      label: "Свидетели Иеговы"
      thesis: "Понимание даёт «верный и благоразумный раб»"
      points:
      - ref: "Мф 24:45"
        html: " «Кто же верный и благоразумный раб, которого господин поставил над слугами… чтобы давать им пищу вовремя?» — Руководящий совет"
      - ref: "Притч 4:18"
        html: " «путь праведных — как свет утренней зари, который становится всё ярче и ярче»"
      - html: "Ранние тексты (Дидахе) не содержат учения о Троице"
  extras: "<div class=\"textdiff\">\n          <p class=\"eyebrow\">Кто такие Отцы Церкви</p>\n          <p><b>Отцы Церкви</b> (святые отцы) — богословы и учители, чьё учение Церковь признала верным выражением своей веры. Их узнают по четырём признакам: святость жизни, верность учению, признание Церковью и, для ранних, древность. «Отцами» их называют потому, что они «родили» верующих в вере (ср. 1 Кор 4:15: «я родил вас во Христе Иисусе благовествованием»).</p>\n          <ul class=\"timeline tl-o\">\n            <li><b>I–II века · мужи апостольские</b> — ученики апостолов: Климент Римский, Игнатий Антиохийский, Поликарп Смирнский</li>\n            <li><b>II–III века · апологеты</b> — защищали веру перед язычниками: Иустин Философ, Ириней Лионский</li>\n            <li><b>IV–V века · «золотой век»</b> — Афанасий Великий, Василий Великий, Григорий Богослов, Иоанн Златоуст, Григорий Нисский</li>\n            <li><b>VII–XIV века</b> — Максим Исповедник, Иоанн Дамаскин, Симеон Новый Богослов, Григорий Палама</li>\n          </ul>\n          <p class=\"crux\"><b>Взгляд Свидетелей:</b> после смерти апостолов началось отступничество, о котором предупреждал Павел: «к вам придут свирепые волки» (Деян 20:29–30, ПНМ; 2 Фес 2:3). Поэтому труды Отцов для них не авторитет, а пример того, как в христианство проникла греческая философия.</p>\n        </div><div class=\"textdiff\">\n          <p class=\"eyebrow\">Спор о непрерывности Церкви · диспут прот. Олега Стеняева (pravoslavie.ru)</p>\n          <div class=\"duo\">\n            <div class=\"pos o\"><span class=\"who\">Православие</span><p class=\"thesis\">Церковь не прерывалась ни на день</p><ul>\n              <li><span class=\"ref\">Мф 16:18</span> «создам Церковь Мою, и врата ада не одолеют её»</li>\n              <li><span class=\"ref\">Мф 28:20</span> «Я с вами во все дни до скончания века»</li>\n              <li><span class=\"ref\">1 Кор 11:2</span> «храните предания так, как я передал вам»; <span class=\"ref\">2 Пет 3:16</span> в посланиях «есть нечто неудобовразумительное»</li>\n              <li>Реформаторы, которых Свидетели считают предшественниками (Уиклиф, Тиндейл), исповедовали Троицу и Божество Христа</li></ul></div>\n            <div class=\"pos j\"><span class=\"who\">Свидетели Иеговы</span><p class=\"thesis\">После апостолов — отступничество</p><ul>\n              <li><span class=\"ref\">Мф 13:30</span> «Пусть растут вместе до жатвы»: истинные христиане веками были рассеяны среди «сорняков»</li>\n              <li><span class=\"ref\">Деян 20:29–30</span> «когда я уйду, к вам придут свирепые волки… и среди вас самих появятся люди, которые будут искажать истину»</li>\n              <li>К IV веку (Никея, 325) церковь соединилась с империей и языческой философией</li>\n              <li>Истинное поклонение восстановлено в конце XIX — начале XX века</li></ul></div>\n          </div>\n        </div><div class=\"textdiff\">\n          <p class=\"eyebrow\">Кто такие Руководящий совет и почему именно они</p>\n          <p><b>Кто это.</b> Небольшая группа мужчин-помазанников, то есть из тех, кто считает себя одним из 144 000. На jw.org перечислены 11 человек, штаб-квартира в Уорике (США). Себя они посланниками или пророками не называют.</p>\n          <div class=\"duo\">\n            <div class=\"pos o\"><span class=\"who\">Ответ православных</span><ul>\n              <li>Притча Мф 24:45 обращена ко всем служителям Церкви — апостолам и их преемникам, а не к организации XX века</li>\n              <li>Если «раб» поставлен только в 1919 году, кто кормил верных восемнадцать веков до этого?</li>\n              <li>Иерусалимский собор — прообраз Вселенских соборов: решает собрание епископов всей Церкви, преемников апостолов, а не постоянная группа в одном центре</li>\n              <li>Признание, что совет может ошибаться, при обязательности его разъяснений для всех, православные считают противоречием</li></ul></div>\n            <div class=\"pos j\"><span class=\"who\">Как объясняют Свидетели</span><ul>\n              <li><span class=\"ref\">Мф 24:45</span> «верный и благоразумный раб», поставленный «давать им пищу вовремя», — это Руководящий совет (так понимают с 2013 года)</li>\n              <li><span class=\"ref\">Мал 3:1</span> «Я пошлю своего вестника, и он расчистит путь передо мной»: в 1914–1919 годах Иисус «проверил» религии и в 1919 году поставил этого «раба» над Своими последователями</li>\n              <li><span class=\"ref\">Деян 15:28</span> образец — Иерусалимский совет: «Святой дух помог нам прийти к выводу…»</li>\n              <li><span class=\"ref\">Еф 5:23</span> «Христос — глава собрания»; совет не вдохновлён и не непогрешим, может ошибаться и исправлять понимание</li>\n              <li>Решения принимают, обсуждая Писание и стремясь к единогласию</li></ul></div>\n          </div>\n        </div><p class=\"crux\"><b>Где спор:</b> православные: Дидахе не излагает Троицу, но предполагает её (крещение «во имя Отца и Сына и Святаго Духа»). Свидетели: позднейшие соборы добавили к Писанию философские понятия.</p>"
- order: 10
  title: "Библия: «Перевод нового мира»"
  slug: "bibliya-perevod-novogo-mira"
  positions:
    orthodoxy:
      label: "Взгляд православных на ПНМ"
      thesis: "Перевод подстроен под учение организации"
      points:
      - html: "Ни одна рукопись Нового Завета не содержит имени «Иегова»"
      - ref: "Ин 1:1"
        html: " «было богом» вместо «было Бог»"
      - ref: "Кол 1:16–17"
        html: " добавлено слово «остальное»"
      - html: "Переводчики анонимны — проверить квалификацию нельзя"
    jw:
      label: "Взгляд Свидетелей"
      thesis: "Точный перевод, возвращающий имя Бога"
      points:
      - html: "Новый Завет — 1950, вся Библия — 1961"
      - html: "«Иегова» восстановлено в Новом Завете 237 раз"
      - html: "Анонимность — чтобы слава была Богу, а не людям"
      - html: "Цель — ясный современный язык и верность оригиналу"
      - html: "Критика традиционных переводов: имя Бога, стоящее в Еврейских Писаниях почти 7 000 раз, заменено на «Господь»; 1 Ин 5:7 содержит позднюю вставку"
  extras: "<p class=\"crux\"><b>Где спор:</b> СИ считают, что переписчики заменили тетраграмматон на «Господь»; православные и большинство библеистов называют это предположением: апостолы цитировали Септуагинту с «Господь». В православном богослужении — церковнославянский текст, для чтения — Синодальный перевод (1876). Свидетели указывают на дохристианские списки Септуагинты, где тетраграмматон сохранился, и на переводы Нового Завета на иврит, где имя восстановлено.</p>"
