      - ref: "Откр 7:4"
        html: " 144 000 — символ полноты (12 × 12 × 1000)"
      - ref: "Откр 7:9"
        html: " «великое множество» — «пред престолом»"
      - ref: "Ин 5:28–29"
        html: " воскреснут все, кто в гробах"
      - ref: "Откр 20"
        html: " тысячелетие — символ эпохи Церкви"
      - ref: "Мф 24:27, 30"
