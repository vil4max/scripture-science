      - html: "Спасение — по незаслуженной доброте Бога, через выкуп, при вере, перемене жизни и крещении"
  extras: "<figure class=\"dgwrap\"><svg class=\"dg\" viewBox=\"0 0 360 184\" role=\"img\" aria-label=\"Схема: у православных после Страшного суда — Царство Небесное или вечная мука; у Свидетелей Иеговы — 144 000 на небе, остальные спасённые вечно на земле, нераскаянные гибнут навсегда\"><defs><marker id=\"ah2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 z\" class=\"ah\"></path></marker></defs><line x1=\"180\" y1=\"6\" x2=\"180\" y2=\"178\" class=\"div\"></line><text x=\"90\" y=\"18\" text-anchor=\"middle\" class=\"hd o\">Православие</text><text x=\"270\" y=\"18\" text-anchor=\"middle\" class=\"hd j\">Свидетели Иеговы</text><rect x=\"30\" y=\"30\" width=\"120\" height=\"28\" rx=\"7\" class=\"bo\"></rect><text x=\"90.0\" y=\"47.9\" text-anchor=\"middle\" class=\"t b\" font-size=\"11\">Страшный суд — все</text><line x1=\"70\" y1=\"58\" x2=\"52\" y2=\"92\" class=\"ar\" marker-end=\"url(#ah2)\"></line><line x1=\"110\" y1=\"58\" x2=\"128\" y2=\"92\" class=\"ar\" marker-end=\"url(#ah2)\"></line><rect x=\"6\" y=\"94\" width=\"88\" height=\"40\" rx=\"7\" class=\"so_t\"></rect><text x=\"50.0\" y=\"111.3\" text-anchor=\"middle\" class=\"t b\" font-size=\"11\">Царство</text><text x=\"50.0\" y=\"124.3\" text-anchor=\"middle\" class=\"t b\" font-size=\"11\">Небесное</text><rect x=\"100\" y=\"94\" width=\"74\" height=\"40\" rx=\"7\" class=\"bo\"></rect><text x=\"137.0\" y=\"111.3\" text-anchor=\"middle\" class=\"t\" font-size=\"11\">вечная</text><text x=\"137.0\" y=\"124.3\" text-anchor=\"middle\" class=\"t\" font-size=\"11\">мука</text><text x=\"90\" y=\"160\" text-anchor=\"middle\" class=\"cap\">одно Царство для всех</text><text x=\"90\" y=\"174\" text-anchor=\"middle\" class=\"cap\">спасённых</text><rect x=\"206\" y=\"30\" width=\"128\" height=\"28\" rx=\"7\" class=\"bj\"></rect><text x=\"270.0\" y=\"47.9\" text-anchor=\"middle\" class=\"t b\" font-size=\"11\">суд, Армагеддон</text><line x1=\"240\" y1=\"58\" x2=\"214\" y2=\"92\" class=\"ar\" marker-end=\"url(#ah2)\"></line><line x1=\"270\" y1=\"58\" x2=\"270\" y2=\"92\" class=\"ar\" marker-end=\"url(#ah2)\"></line><line x1=\"300\" y1=\"58\" x2=\"326\" y2=\"92\" class=\"ar\" marker-end=\"url(#ah2)\"></line><rect x=\"186\" y=\"94\" width=\"56\" height=\"48\" rx=\"7\" class=\"sj_t\"></rect><text x=\"214.0\" y=\"115.5\" text-anchor=\"middle\" class=\"t b\" font-size=\"10\">144 000</text><text x=\"214.0\" y=\"127.5\" text-anchor=\"middle\" class=\"t b\" font-size=\"10\">на небе</text><rect x=\"246\" y=\"94\" width=\"48\" height=\"48\" rx=\"7\" class=\"bj\"></rect><text x=\"270.0\" y=\"109.5\" text-anchor=\"middle\" class=\"t\" font-size=\"10\">рай на</text><text x=\"270.0\" y=\"121.5\" text-anchor=\"middle\" class=\"t\" font-size=\"10\">этой</text><text x=\"270.0\" y=\"133.5\" text-anchor=\"middle\" class=\"t\" font-size=\"10\">Земле</text><rect x=\"298\" y=\"94\" width=\"56\" height=\"48\" rx=\"7\" class=\"bj\"></rect><text x=\"326.0\" y=\"115.5\" text-anchor=\"middle\" class=\"t\" font-size=\"10\">гибель</text><text x=\"326.0\" y=\"127.5\" text-anchor=\"middle\" class=\"t\" font-size=\"10\">навсегда</text><text x=\"270\" y=\"160\" text-anchor=\"middle\" class=\"cap\">небо для 144 000,</text><text x=\"270\" y=\"174\" text-anchor=\"middle\" class=\"cap\">земля для остальных</text></svg><figcaption>Схема: итог истории — одно Царство или два назначения</figcaption></figure><div class=\"textdiff\">\n          <p class=\"eyebrow\">Какая земля? Что будет с миром</p>\n          <div class=\"duo\">\n            <div class=\"pos o\"><span class=\"who\">Православие</span><p class=\"thesis\">Мир не исчезнет, а преобразится</p><ul>\n              <li>«Новое небо и новая земля» (Откр 21:1; 2 Пет 3:13) — то же творение, обновлённое и освобождённое от тления (Рим 8:21)</li>\n              <li>Небо и земля соединятся: Бог будет «всё во всём» (1 Кор 15:28)</li>\n              <li>Солнце станет не нужно: «слава Божия осветила его» (Откр 21:23)</li>\n              <li>Спасённые — в воскресших телах, все вместе; подробности — тайна: «не видел того глаз» (1 Кор 2:9)</li></ul></div>\n            <div class=\"pos j\"><span class=\"who\">Свидетели Иеговы</span><p class=\"thesis\">Эта самая планета станет раем</p><ul>\n              <li>Земля не будет уничтожена: «земля остаётся навечно» (Еккл 1:4); «она никогда не сдвинется с места» (Пс 104:5)</li>\n              <li>Армагеддон уничтожит злую систему и нечестивых, а не планету</li>\n              <li>«Новое небо» — небесное правительство Христа и 144 000; «новая земля» — праведное человечество</li>\n              <li>«Бог вытрет слёзы с их глаз, и смерти больше не будет» (Откр 21:4); «люди будут строить дома и жить в них» (Ис 65:21)</li></ul></div>\n          </div>\n          <div class=\"fathers\"><p class=\"eyebrow\">Как толкуют Откр 7:4 · по ekzeget.ru</p><ul><li><b>Прп. Беда Достопочтенный (VIII в.):</b> «этим конечным числом обозначается неисчислимое множество всей Церкви»</li><li><b>Иером. Иов (Гумеров):</b> «данная цифра является символической и выражает высшую степень полноты: 12 × 12 × 1000»</li><li><b>Архиеп. Аверкий (Таушев):</b> «сыны Израилевы» — духовный Израиль, то есть Церковь, а не счёт по коленам</li></ul></div>\n        <p class=\"crux\"><b>Суть:</b> обе стороны ждут обновлённую землю, а не исчезновение мира. Различие — в том, соединены ли небо и земля для всех спасённых.</p>\n          <div class=\"duo\">\n            <div class=\"pos o\"><span class=\"who\">Православие: все вместе с Богом</span><ul>\n              <li><span class=\"ref\">Откр 21:3</span> «се, скиния Бога с человеками, и Он будет обитать с ними; они будут Его народом»</li>\n              <li><span class=\"ref\">Еф 1:10</span> «дабы всё небесное и земное соединить под главою Христом»</li>\n              <li><span class=\"ref\">Ин 17:24</span> «хочу, чтобы там, где Я, и они были со Мною»</li>\n              <li><span class=\"ref\">1 Фес 4:17</span> «и так всегда с Господом будем»</li>\n              <li><span class=\"ref\">Ин 10:16</span> «другие овцы» — язычники, и итог: «будет одно стадо и один Пастырь»</li>\n              <li><span class=\"ref\">Символ веры</span> «Чаю воскресения мертвых и жизни будущаго века»</li></ul></div>\n            <div class=\"pos j\"><span class=\"who\">Свидетели: небо и земля раздельно</span><ul>\n              <li><span class=\"ref\">Откр 14:3</span> песню не мог выучить никто, «кроме 144 000, купленных с земли»</li>\n              <li><span class=\"ref\">Откр 5:10 (ПНМ)</span> «они будут править землёй» — с неба, а не живя на ней</li>\n              <li><span class=\"ref\">Ин 10:16</span> «У меня есть и другие овцы, не из этого загона» — земной класс, не входящий в 144 000</li>\n              <li><span class=\"ref\">Мф 5:5</span> «Счастливы кроткие, потому что они унаследуют землю»</li>\n              <li><span class=\"ref\">Пс 37:29</span> «Праведные унаследуют землю и будут жить на ней вечно» (в Синод. — 36:29)</li></ul></div>\n          </div>\n          <p class=\"crux\"><b>Где спор:</b> православные замечают, что в тех же заповедях блаженства «наследуют землю» (Мф 5:5) стоит рядом с «их есть Царство Небесное» (Мф 5:3, 10) — это одно обетование, а не два класса. В Синодальном переводе Откр 5:10 — «будем царствовать на земле», в «Переводе нового мира» — «будут править землёй». Свидетели отвечают, что греческий предлог <i>эпи</i> здесь значит «над», а обетования земли и неба относятся к разным группам.</p>\n        </div><p class=\"crux\"><b>Спасение как обожение.</b> В православии спасение — не только прощение грехов, но <b>обожение</b> (теосис): соединение с Богом по благодати, «причастие Божеского естества» (2 Пет 1:4), без превращения в Бога по сущности. Свт. Афанасий Великий: Бог стал человеком, чтобы человек стал богом — по благодати. Православные замечают: если Христос не Бог, соединить человека с Богом Он не может. <b>Свидетели</b> понимают спасение через выкуп: Христос — «человек… который отдал себя как соответствующий выкуп за всех» (1 Тим 2:5–6, ПНМ), то есть совершенная жизнь за совершенную жизнь Адама; для этого Иисусу не нужно быть Всемогущим Богом.</p><p class=\"crux\"><b>Расчёт 1914:</b> 2520 лет от разрушения Иерусалима, которое СИ датируют 607 г. до н. э.; историки — 587/586 г. до н. э.</p>"
