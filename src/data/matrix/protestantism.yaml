  - topic: worship
    summary: "Главное практическое различие семьи — крещение и Вечеря Господня. Лютеранство сохраняет крещение младенцев и учит о реальном присутствии Тела и Крови Христа в Причастии; баптизм (РС ЕХБ) и пятидесятничество (РЦХВЕ) крестят по вере через погружение и понимают Вечерю как воспоминание; пятидесятничество добавляет отдельное «крещение Духом Святым». Англиканство признаёт Крещение и Святое Причастие таинствами при разных литургических стилях — от традиционного до менее формального."
