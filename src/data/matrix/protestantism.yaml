self_view:
  summary: "Протестантские церкви описывают Реформацию не как основание новой церкви, а как восстановление и очищение древней; общим для семьи признаётся принцип «только Писанием, только верой, только благодатью». Лютеранство, реформатство/пресвитерианство, англиканство, баптизм (включая Российский Союз евангельских христиан-баптистов, РС ЕХБ) и пятидесятничество расходятся в понимании таинств, устройства церкви и роли Предания — эти различия отмечены в разделах ниже."
  proof:
    - url: "https://web.archive.org/web/20260411202304/https://www.elkras.ru/vo_chto_veryat_liuterane/liuteranstvo.jdx"
      title: "Лютеранство — Евангелическо-Лютеранская Церковь России (архив)"
      tier: official
      excerpt: "Лютеране подчеркивают непрерывность развития христианства и убеждены, что в лютеранской Реформации не создана новая церковь, а восстановлена древняя"
      accessed: "2026-09-25"
    - url: "https://baptist-volga.ru/verouchenie-baptistov"
      title: "Вероучение евангельских христиан-баптистов 1985 года (текст, воспроизведённый с сайта РС ЕХБ)"
      tier: official
      excerpt: "Вероучение было принято на 43 съезде ЕХБ в 1985 году в качестве вспомогательного материала для духовного воспитания верующих"
      accessed: "2026-09-25"
