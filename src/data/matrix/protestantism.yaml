      kind: divided
      note: "в лютеранских церквах обычно есть алтарь, облачения, распятия и свечи; реформатский Гейдельбергский катехизис не допускает изображений в церквях; методисты и пятидесятники, по англоязычной Википедии, охотнее используют кресты и изображения."
