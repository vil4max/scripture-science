  - topic: authority
    summary: "Лютеранство и реформатство признают за Писанием единственный высший авторитет, а за собственными вероисповедными текстами (Книга Согласия, Вестминстерское исповедание) — лишь подчинённую, толковательную роль. Баптистское (РС ЕХБ) и пятидесятническое (РЦХВЕ) вероучения прямо называют свои исповедания не обязательным символом веры, а вспомогательным материалом; толкование Писания в них — дело поместной церкви. Англиканство (via media) сочетает высший авторитет Библии с ролью церковного предания и разума."
    unity:
