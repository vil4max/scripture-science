  - topic: images
    summary: "Практика различается: лютеране используют распятия и церковные изображения, тогда как реформатская традиция отвергает изображения Бога и их применение в поклонении. Баптисты не почитают иконы, но часто используют крест; у методистов и пятидесятников также встречаются кресты и другие изображения."
