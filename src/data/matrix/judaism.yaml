positions:
  - topic: god
    summary: "Иудаизм исповедует строгий монотеизм: единственный, бестелесный и вечный Творец, не имеющий подобия. Эта вера ежедневно провозглашается в молитве «Шма Исраэль» (Втор 6:4)."
    unity:
      kind: shared
      note: "единство Бога — первый принцип веры в изложении Маймонида; реформистский иудаизм тоже сохраняет веру в Завет между Богом и Израилем."
      proof:
        - url: "https://toldot.com/13PrintsipovVery.html"
          title: "13 принципов веры | Толдот.ру"
          tier: "official"
          excerpt: "Творец, благословенно имя Его, — Один, и нет в мире цельности, подобной абсолютной цельности Его"
          accessed: "2026-09-26"
        - url: "https://urj.org/what-we-believe/what-is-reform-judaism"
          title: "What is Reform Judaism? | Union for Reform Judaism"
          tier: "official"
          excerpt: "Reform Judaism maintains faith in the Covenant between God and Israel"
          accessed: "2026-09-26"
    quote:
      text: "Безоговорочно верю в то, что Творец, благословенно имя Его, — Один, и нет в мире цельности, подобной абсолютной цельности Его"
      source: "13 принципов веры Рамбама | Толдот.ру"
      url: "https://toldot.com/13PrintsipovVery.html"
    proof:
