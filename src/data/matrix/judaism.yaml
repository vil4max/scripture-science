  - topic: jesus
    summary: "Иудаизм ожидает ещё не пришедшего Машиаха (Мессию) и признаёт Моше (Моисея) величайшим из пророков. Иудейские авторитетные источники не признают Иисуса из Назарета Мессией или божеством; идея воплощения Бога в человеке считается несовместимой с единством Бога."
    unity:
      kind: shared
      note: "даже евреи, которые в последнее время видят в Иисусе еврейского учителя, не верят, как христиане, что он воскрес из мёртвых или был Мессией."
      proof:
        - url: "https://www.myjewishlearning.com/article/what-do-jews-believe-about-jesus/"
          title: "What Do Jews Believe About Jesus? | My Jewish Learning"
          tier: "reference"
          excerpt: "Other Jews, recently, have come to regard him as a Jewish teacher"
          accessed: "2026-09-26"
        - url: "https://www.myjewishlearning.com/article/what-do-jews-believe-about-jesus/"
          title: "What Do Jews Believe About Jesus? | My Jewish Learning"
          tier: "reference"
          excerpt: "This does not mean, however, that they believe, as Christians do, that he was raised from the dead or was the messiah"
          accessed: "2026-09-26"
    quote:
      text: "Безоговорочно верю в приход Машиаха, и, хотя он задерживается, я всё же каждый день буду ждать его"
      source: "13 принципов веры | Толдот.ру"
      url: "https://toldot.com/13PrintsipovVery.html"
    proof:
