        title: "13 принципов веры | Толдот.ру"
        tier: official
        excerpt: "пророчество Моше-Рабейну, пусть душа его покоится в мире, — истина и что он — величайший из всех пророков, бывших до него и пришедших после него"
        accessed: "2026-09-25"
      - url: "https://www.myjewishlearning.com/article/what-do-jews-believe-about-jesus/"
