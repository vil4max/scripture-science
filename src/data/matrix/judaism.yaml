  - topic: salvation
    summary: "Согласно традиции, Бог воздаёт добром соблюдающим заповеди и карает нарушающих их; путь к этому — жизнь по Торе и галахе (в ортодоксальном и консервативном понимании) или по её этическому ядру, как его самостоятельно принимает верующий (в реформистском иудаизме), а не спасение одной лишь верой."
