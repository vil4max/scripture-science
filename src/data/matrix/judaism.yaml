  - topic: scripture
    summary: "Канон иудаизма — Танах: аббревиатура трёх разделов — Тора (Пятикнижие Моисея), Невиим (Пророки) и Ктувим (Писания), всего 24 книги, составляющие Письменную Тору. Все течения признают один и тот же канон Танаха; расходятся они в статусе Устной Торы (см. «Предание и толкование»)."
    unity:
