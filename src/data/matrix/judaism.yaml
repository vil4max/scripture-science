  - topic: authority
    summary: "Письменную Тору дополняет Устная Тора, отражённая в Талмуде. Ортодоксальный иудаизм следует традиционному раввинистическому толкованию, а консервативный (масорти) признаёт обязательность галахи вместе с её историческим развитием. Реформистское направление подчёркивает осознанный выбор человека в рамках развивающегося завета."
    unity:
      kind: divided
      note: "ортодоксия менее склонна считать, что предписания меняются вместе с обществом; в консервативном иудаизме раввины коллективно определяют направление через Раввинскую ассамблею; реформисты делают осознанный личный выбор."
      proof:
        - url: "https://www.myjewishlearning.com/article/orthodox-judaism/"
          title: "Orthodox Judaism | My Jewish Learning"
          tier: "reference"
          excerpt: "Orthodox Judaism is more resistant than its liberal counterparts to the idea that biblical mandates can change in response to changing social"
          accessed: "2026-09-26"
        - url: "https://www.rabbinicalassembly.org/about-us/conservative-masorti"
          title: "Conservative/Masorti | The Rabbinical Assembly"
          tier: "official"
          excerpt: "our rabbis collectively give direction through the Rabbinical Assembly"
          accessed: "2026-09-26"
        - url: "https://urj.org/what-we-believe/what-is-reform-judaism"
          title: "What is Reform Judaism? | Union for Reform Judaism"
          tier: "official"
          excerpt: "strive to make thoughtful choices about how we put our values into action"
          accessed: "2026-09-26"
    proof:
