  - topic: name-of-god
    summary: "Тетраграмматон (собственное Имя Бога) традиционно не произносится так, как пишется; в молитве и при чтении Торы его заменяют словом «Адонай» («Господь»), а вне молитвы используют почтительные эпитеты, например «Всевышний»."
    unity:
      kind: shared
      note: "традиция не произносить имя вслух «как при богослужении, так и в обыденной жизни» восходит к персидскому периоду (VI–IV века до н. э.)."
      proof:
        - url: "https://ru.wikipedia.org/wiki/%D0%A2%D0%B5%D1%82%D1%80%D0%B0%D0%B3%D1%80%D0%B0%D0%BC%D0%BC%D0%B0%D1%82%D0%BE%D0%BD"
          title: "Тетраграмматон — Википедия (русская)"
          tier: "reference"
          excerpt: "Традиция не произносить имя Яхве вслух как при богослужении, так и в обыденной жизни появилась с периода персидского владычества над Иудеей"
          accessed: "2026-09-26"
    quote:
      text: "Пишется оно — Йуд-Кей-Вав-Кей; мы произносим Адой-ной (Господь)"
      source: "Как зовут Б-га? | Толдот.ру"
