  - topic: authority
    summary: "Священное Писание принадлежит Священному Преданию — жизни и передаче веры Церкви, восходящей к апостолам. Писание читается в согласии с верой Церкви, её соборными определениями и святоотеческим толкованием. Предание не сводится к обычаям: историческая привычка или частное мнение сами по себе не становятся непреложным правилом веры."
    unity:
      kind: shared
