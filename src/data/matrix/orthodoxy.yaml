  - topic: name-of-god
    summary: "Бог открывает Себя людям и именуется в Писании Сущим, Господом, Вседержителем, Отцом и другими именами. Имена выражают то, что Бог открывает о Себе и Своих действиях, но не исчерпывают Его непостижимого существа. «Иегова» не является единственным допустимым обращением к Богу; имя нельзя отделять от веры в Того, Кого оно обозначает."
    unity:
      kind: shared
      note: "Символ веры первого и второго Вселенских Соборов исповедует единого Бога Отца, «Вседержителя, Творца небу и земли»."
