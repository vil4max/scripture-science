  - topic: holy-days
    summary: "Днём церковного празднования и отдыха является не суббота, а воскресенье — «первый день седмицы», в память Воскресения Христова. Пасха, Воскресение Христово, — «праздник праздников, предначинание вечного праздника». Важнейшие праздники установлены в память главных событий, относящихся к воплощению Сына Божия, и в честь Пресвятой Богородицы: Рождество Богородицы, Введение во храм, Благовещение, Рождество Христово, Крещение Господне (Богоявление), Сретение, Преображение, Вход Господень в Иерусалим, Вознесение, Троица и сошествие Святого Духа, Успение Богородицы и Воздвижение Креста Господня."
    unity:
      kind: shared
      note: "воскресенье — по 29-му правилу Лаодикийского Собора, принятому Трулльским Собором для всей Церкви; Пасху 7-е Апостольское правило запрещает праздновать «раньше весеннего равноденствия вместе с иудеями». Календарь разный: юлианский в богослужебной практике используют 5 из 15 Поместных Церквей, в том числе Русская, остальные — новоюлианский."
