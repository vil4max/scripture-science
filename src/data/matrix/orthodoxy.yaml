        - url: "https://azbyka.ru/pravo/69-apostolskoe-pravilo/"
          title: "Правило 69 святых Апостолов — «Церковное право», «Азбука веры»"
          tier: "official"
          excerpt: "не постится в святую Четыредесятницу, или среду, или пятницу, да будет извержен, если только ему не препятствует поститься немощь телесная"
          accessed: "2026-09-26"
        - url: "https://azbyka.ru/pravo/64-apostolskoe-pravilo/"
          title: "Правило 64 святых Апостолов — «Церковное право», «Азбука веры»"
          tier: "official"
          excerpt: "постится в день Господень или в субботу (за исключением лишь одной субботы)"
