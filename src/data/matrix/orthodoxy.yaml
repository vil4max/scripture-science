  - topic: fasting
    summary: "Пост — время покаяния, молитвы, милосердия и борьбы со страстями. Воздержание в пище помогает этому труду, но без перемены жизни не достигает цели. В практике РПЦ есть четыре многодневных поста, среды и пятницы; меру телесного воздержания соотносят со здоровьем и обстоятельствами человека при пастырском руководстве."
    unity:
      kind: shared
      note: "69-е Апостольское правило обязывает поститься «в святую Четыредесятницу, или среду, или пятницу», если не препятствует немощь телесная; 64-е запрещает поститься в воскресенье и субботу, кроме одной субботы; Трулльский Собор (правило 2) подтвердил Апостольские правила для всей Церкви."
