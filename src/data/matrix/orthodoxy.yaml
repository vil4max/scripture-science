  - topic: afterlife
    summary: "После телесной смерти душа продолжает жить. Состояние до всеобщего воскресения отличается от окончательной участи после Страшного Суда: воскреснет весь человек, с душой и телом. Церковь молится об усопших и приносит за них бескровную Жертву. Учение о посмертии не означает ни переселения душ, ни их исчезновения; частные описания загробного пути не равнозначны догмату."
