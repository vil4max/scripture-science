  - topic: images
    summary: "Почитание икон связано с истиной Боговоплощения и утверждено VII Вселенским Собором. Честь, воздаваемая образу, относится к изображённому на нём; вещество иконы не обожествляется. Поклонение Богу отличается от почитания Его святых. Поэтому икона не является идолом, а обращение к святым не заменяет молитвы Богу."
