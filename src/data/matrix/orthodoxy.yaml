self_view:
  summary: "Православная Церковь есть истинная Церковь Христова, сохраняющая апостольскую веру и Таинства. Её единство основано на Христе и действии Святого Духа; самостоятельное управление Поместных Церквей не означает существования разных вероучений."
  proof:
    - url: "https://azbyka.ru/otechnik/dokumenty/osnovnye-printsipy-otnoshenija-russkoj-pravoslavnoj-tserkvi-k-inoslaviyu/"
      title: "Архиерейский Собор РПЦ, 2000. Основные принципы отношения к инославию, §§1.1–1.3, 7.1"
