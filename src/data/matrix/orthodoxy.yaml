  - topic: jesus
    summary: "Иисус Христос — предвечный Сын Божий, истинный Бог и истинный человек: одно Лицо в двух природах, Божественной и человеческой. Сын Божий воплотился от Духа Святого и Девы Марии ради нашего спасения, пострадал и умер по человечеству, телесно воскрес и вознёсся. Имя «Христос» означает «Помазанник»: Его человеческой природе безмерно сообщены дары Святого Духа."
    unity:
      kind: shared
      note: "догмат IV Вселенского (Халкидонского) Собора: Христос познаётся «во двух естествах неслитно, неизменно, нераздельно, неразлучно», в одном Лице и одной Ипостаси."
