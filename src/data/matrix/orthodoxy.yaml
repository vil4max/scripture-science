  - topic: worship
    summary: "Центр церковной жизни — Божественная литургия и Евхаристия. В Таинствах человек действительно приобщается благодати Божией. Церковь совершает Крещение, Миропомазание, Евхаристию, Покаяние, Священство, Брак и Елеосвящение; их нельзя свести к символическим действиям общины."
