  - topic: spirit
    summary: "Святой Дух — истинный Бог, исходящий от Отца. Православная Церковь вслед за словами Христа и Символом веры второго Вселенского Собора исповедует исхождение Святого Духа только от Отца и отвергает добавление «и от Сына» (Filioque)."
    unity:
      kind: shared
      note: "Символ веры второго Вселенского Собора, созванного против ложного учения Македония: Дух Святой — «Иже от Отца исходящаго»."
