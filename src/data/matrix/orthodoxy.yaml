  - topic: organisation
    summary: "Православная Церковь — Единая, Святая, Соборная и Апостольская Церковь Христова; её Глава — Иисус Христос. Поместные Церкви соединены единой верой и Таинствами. Епископы сохраняют апостольское преемство; вместе с пресвитерами и диаконами они служат церковному народу. Соборность выражает единство Церкви и не сводится к административной централизации."
    unity:
      kind: shared
      note: "34-е Апостольское правило: епископам каждого народа «подобает знать первого среди них, и признавать его за главу», но и первый «ничего да не творит без изволения всех»; вопросы всей Церкви решает Вселенский Собор."
