      kind: shared
      note: "Послание Патриархов Восточно-Кафолической Церкви о православной вере (1723), подписанное патриархами Константинопольским, Антиохийским и Иерусалимским: «Веруем, что души умерших блаженствуют или мучатся, смотря по делам своим»; совершенное блаженство или мучение каждый получит по общем воскресении."
