  - topic: rules
    summary: "Христианская нравственная жизнь строится на любви к Богу и ближнему, заповедях, ответственности и уважении к человеческой жизни. Послушание гражданской власти имеет предел: оно не оправдывает отступления от веры или совершения греха. Пищевые предписания, медицинская помощь, военная служба и общественные обязанности требуют отдельных церковных объяснений; их нельзя сводить к одному списку запретов."
    unity:
      kind: shared
      note: "запрет крови — 63-е Апостольское правило и 67-е правило Трулльского Собора; о государстве и армии позиция дана по документам Русской Православной Церкви — катехизису Филарета и Основам социальной концепции."
      proof:
        - url: "https://azbyka.ru/pravo/shestoj-vselenskij-sobor-67/"
          title: "Правило 67 Трулльского Собора (691) — «Церковное право», «Азбука веры»"
          tier: "official"
          excerpt: "Божественное Писание заповедало нам воздерживаться от крови, удавленины и блуда"
          accessed: "2026-09-26"
        - url: "https://azbyka.ru/pravo/63-apostolskoe-pravilo/"
          title: "Правило 63 святых Апостолов — «Церковное право», «Азбука веры»"
          tier: "official"
          excerpt: "съест мясо с кровью души его, или звероядину, или мертвечину, да будет извержен, ибо это запретил закон"
