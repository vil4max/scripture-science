  - topic: salvation
    summary: "Спасение даровано Иисусом Христом: Он освобождает человека от греха и смерти и открывает жизнь с Богом. Человек отвечает на благодать верой, покаянием, участием в Таинствах и исполнением заповедей любви. Синергия означает соработничество Бога и человека, а не приобретение спасения собственными заслугами. Цель христианской жизни — обожение, благодатное единение с Богом."
    unity:
      kind: shared
      note: "Послание Патриархов Восточно-Кафолической Церкви о православной вере (1723), подписанное патриархами Константинопольским, Антиохийским и Иерусалимским: «Веруем, что никто не может спастися без веры»; вера, «споспешествуема любовию, или, что все равно, исполнением Божественных заповедей», оправдывает через Христа."
