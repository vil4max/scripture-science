  - topic: spirit
    summary: "Святой Дух — третье Лицо Святой Троицы, истинный Бог, единосущный и равночестный Отцу и Сыну. Он предвечно исходит от Отца; Православная Церковь не принимает добавление Filioque — «и от Сына» — к Символу веры. Вечное исхождение нельзя смешивать с посланием Святого Духа в мир и Его действием в Церкви."
    unity:
      kind: shared
      note: "Символ веры второго Вселенского Собора, созванного против ложного учения Македония: Дух Святой — «Иже от Отца исходящаго»."
