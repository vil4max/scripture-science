self_view:
  summary: "Православная Церковь понимает себя как единую Церковь Христову, непрерывно существующую от Пятидесятницы через преемственное апостольское рукоположение. Отдельные Поместные Церкви (Иерусалимская, Антиохийская, Александрийская, Константинопольская, Российская и другие) самостоятельны по устройству, но составляют части одной Кафолической Церкви, соединённые общей верой, молитвой и таинствами."
  proof:
    - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
      title: "Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)"
      tier: official
      excerpt: "Церковь одна, однако имеются отдельные и самостоятельные Церкви, например: Иерусалимская, Антиохийская, Александрийская, Константинопольская, Российская"
      accessed: "2026-09-25"

