  - topic: fasting
    summary: "Важнейший пост — Великий пост, или Четыредесятница: сорок дней, не считая Страстной седмицы, потому что Сам Иисус Христос постился сорок дней. Кроме него, катехизис называет Рождественский и Успенский посты, пост в память святых апостолов и еженедельный пост в среду и пятницу — в воспоминание предания Иисуса Христа на страдание и в память Его страданий и смерти. В пост не вкушают скоромной пищи — продуктов, содержащих плоть теплокровных животных или получаемых от них (молоко, яйца); рыба занимает «срединное место» между постной и скоромной пищей и разрешается лишь при менее строгом посте. Перед Причащением принят приуготовительный пост — воздержание от скоромной пищи и развлечений с усердной молитвой и покаянием, — а евхаристический пост означает полное воздержание от пищи и питья с полуночи. Монашество — «особый образ христианского жительства», всецелое посвящение себя служению Богу; главные монашеские обеты — послушание, нестяжание и целомудрие."
