    summary: "Бог один по существу, но троичен в Лицах — Отец, Сын и Святой Дух, единосущная и нераздельная Троица. Лица различаются только личными свойствами происхождения: Отец не рождается и не исходит, Сын предвечно рождается от Отца, Святой Дух предвечно исходит от Отца."
    unity:
      kind: shared
      note: "Символ веры, который составили отцы первого (Никейского, 325) и второго (Константинопольского, 381) Вселенских Соборов; Вселенский Собор — «собрание пастырей и учителей христианской Кафолической Церкви, по возможности, со всей вселенной»."
