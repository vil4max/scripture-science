        - title: Молитвы святым
          text: Святые живы у Бога и молятся о Церкви. Обращаясь к ним, христиане просят их молитвенного предстательства перед Богом. Источник спасения и всякой благодати — Сам Бог.

  - topic: holy-days
    summary: "Пасха — праздник Воскресения Христова и победы над смертью; воскресенье — еженедельное воспоминание этой победы. Праздники вводят верующего в события спасения: Рождество, Богоявление, Преображение, Крест, Воскресение, Вознесение и Пятидесятницу. Церковный календарь также хранит память Богородицы и святых. Народный обычай не равнозначен церковному установлению."
    unity:
      kind: shared
      note: "воскресенье — по 29-му правилу Лаодикийского Собора, принятому Трулльским Собором для всей Церкви; Пасху 7-е Апостольское правило запрещает праздновать «раньше весеннего равноденствия вместе с иудеями». Календарь разный: юлианский в богослужебной практике используют 5 из 15 Поместных Церквей, в том числе Русская, остальные — новоюлианский."
