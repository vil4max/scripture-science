    summary: "Бог един по существу и троичен в Лицах: Отец, Сын и Святой Дух — единосущная и нераздельная Троица. Это не три бога и не три проявления одного Лица. Отец нерождён, Сын предвечно рождается от Отца, Святой Дух предвечно исходит от Отца; все три Лица имеют одно Божество."
    unity:
      kind: shared
      note: "Символ веры, который составили отцы первого (Никейского, 325) и второго (Константинопольского, 381) Вселенских Соборов; Вселенский Собор — «собрание пастырей и учителей христианской Кафолической Церкви, по возможности, со всей вселенной»."
