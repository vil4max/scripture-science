self_view:
  summary: "Церковь описывает себя как «Церковь Остатка», призванную в последнее время хранить заповеди Божьи и веру в Иисуса Христа, а не как новую религию: своё вероучение она основывает исключительно на Библии и допускает уточнение формулировок на съездах Генеральной конференции. Себя церковь считает движением, открытым к дальнейшему развитию понимания истины."
  proof:
    - url: "https://www.mosadvent.ru/index.php/adout/faith/item/509-polnoe-izlozhenie-doktrin"
      title: "Полное изложение доктрин, п. 13 «Церковь Остатка и ее миссия» — Московское объединение Церкви ХАСД"
      tier: official
      excerpt: "Бог при звал Церковь Остатка к соблюдению заповедей Божьих и сохранению веры в Иисуса"
      accessed: "2026-09-26"
    - url: "https://www.mosadvent.ru/index.php/adout/faith/item/510-chto-otlichaet-adventistskoe-verouchenie"
      title: "«Что отличает адвентистское вероучение?» — Московское объединение Церкви ХАСД"
      tier: official
      excerpt: "Адвентистская церковь была основана как движение, как нечто открытое для нового, для развития и продвижения вперед"
      accessed: "2026-09-25"
