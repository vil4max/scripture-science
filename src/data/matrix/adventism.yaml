      accessed: "2026-09-25"
scripture:
  name: "Библия: 66-книжный протестантский канон"
  comparison:
    common: "39 книг Ветхого и 27 книг Нового Завета — те же, что канонические книги православной Библии."
    difference: "11 неканонических книг в их канон не входят; труды Елены Уайт признаются пророческим наставлением, хотя в канон не включены."
    proof:
      - url: "https://azbyka.ru/bibliya"
        title: "Библия — энциклопедия «Азбука веры»: канонические и неканонические книги"
        tier: reference
        excerpt: "11 неканонических книг (Товита, Иудифи, Премудрости Соломона, Премудрости Иисуса сына Сирахова, Послание Иеремии, Варуха, 2 и 3 книги Ездры, 1, 2 и 3 Маккавейские книги) не являются богодухновенными"
        accessed: 2026-10-01
  overview:
    title: "Библия"
    text: "Адвентисты принимают 66-книжный протестантский канон и считают Библию единственным мерилом вероучения и опыта. Труды Елены Уайт признаются пророческим наставлением, но официально не включаются в библейский канон. Переводы Библии различаются по языкам."
  url: "https://azbyka.ru/biblia/"
  proof:
    - url: "https://adventist.org/beliefs/bible/understanding"
      title: "Seventh-day Adventists — Understanding the Bible"
      tier: official
      excerpt: "The Bible is a rich, diverse, complex collection of 66 books"
      accessed: "2026-09-27"
    - url: "https://bri.esd.adventist.org/uploaded_assets/113416"
      title: "«Библия и церковь о проблеме войны и мира» — Институт библейских исследований, Евро-Азиатский дивизион"
      tier: official
      excerpt: "используется тот же термин, переведенный как «разбойники» в Синодальной Библии и как «мятежники-сикарии» в современном русском переводе ИПБ"
      accessed: "2026-09-25"
    - url: "https://azbyka.ru/biblia/?Jn.3:16"
      title: "Евангелие от Иоанна 3:16 — Синодальный перевод (Азбука веры)"
