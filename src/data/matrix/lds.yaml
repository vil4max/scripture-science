self_view:
  summary: "Церковь описывает себя не как новую конфессию, а как восстановление полноты Евангелия Иисуса Христа и Его Церкви, утраченных после смерти апостолов; Восстановление началось с «Первого видения» Джозефа Смита. Церковь официально просит не называть её «мормонской церковью» и не использовать сокращение «LDS», настаивая на полном имени, данном, по её учению, Самим Господом."
  proof:
    - url: "https://www.churchofjesuschrist.org/topics/restoration/first-vision?lang=eng"
      title: "\"Restoration of the Gospel,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
      tier: official
      excerpt: "Heavenly Father and His Son Jesus Christ restored, or reestablished, the Church and the fulness of the gospel"
      accessed: "2026-09-25"
    - url: "https://newsroom.churchofjesuschrist.org/article/name-of-the-church"
      title: "The Name of the Church — Official Statement, Newsroom, The Church of Jesus Christ of Latter-day Saints"
      tier: official
      excerpt: "The Lord has impressed upon my mind the importance of the name He has revealed for His Church"
      accessed: "2026-09-25"
    - url: "https://newsroom.churchofjesuschrist.org/style-guide"
      title: "Style Guide — The Name of the Church, Newsroom, The Church of Jesus Christ of Latter-day Saints"
      tier: official
      excerpt: "please avoid using the abbreviation \"LDS\" or the nickname \"Mormon\" as substitutes for the name of the Church"
      accessed: "2026-09-25"
