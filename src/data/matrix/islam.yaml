self_view:
  summary: "Ислам видит себя восстановлением изначального единобожия, которое проповедовали все пророки от Нуха (Ноя) до Мусы (Моисея) и Исы (Иисуса); Ибрахим (Авраам) почитается как ханиф — чистый монотеист, не бывший ни иудеем, ни христианином, а Мухаммад — «печать пророков», последний в этой цепи."
  proof:
    - url: "https://api.quran.com/api/v4/quran/translations/45?verse_key=3:67"
      title: "Коран 3:67, перевод Э. Кулиева | Quran.com Content API"
      tier: official
      excerpt: "Ибрахим (Авраам) не был ни иудеем, ни христианином. Он был ханифом, мусульманином и не был из числа многобожников"
      accessed: "2026-09-25"
    - url: "https://api.quran.com/api/v4/quran/translations/45?verse_key=42:13"
      title: "Коран 42:13, перевод Э. Кулиева | Quran.com Content API"
      tier: official
      excerpt: "и то, что Мы заповедали Ибрахиму (Аврааму), Мусе (Моисею) и Исе (Иисусу): «Исповедуйте религию и не расходитесь во мнениях относительно нее»"
      accessed: "2026-09-25"

