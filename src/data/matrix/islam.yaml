  - topic: authority
    summary: "В суннитском исламе нет рукоположенного духовенства: авторитет принадлежит коллективно улемам (богословам-правоведам) в рамках одной из четырёх правовых школ (мазхабов) — ханафитской, маликитской, шафиитской и ханбалитской, сложившихся в VIII-IX веках. В шиитском (имамитском/джафаритском) исламе руководство общиной, по этому учению, возлагается на имама, назначаемого Богом; после сокрытия двенадцатого имама верующие следуют ныне живущим богословам."
    unity:
      kind: divided
      note: "сунниты следуют одной из четырёх правовых школ (мазхабов), шииты-имамиты — последователи Джафара ас-Садика — учат, что руководство общиной возлагается на имама, назначенного Богом."
      proof:
        - url: "https://cyberleninka.ru/article/n/mazhaby-v-islame"
          title: "Мазхабы в исламе | КиберЛенинка"
          tier: "reference"
