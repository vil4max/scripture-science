  - topic: end-times
    summary: "В конце времён Царство Божие достигнет полноты: после всеобщего Суда праведники навсегда воцарятся со Христом, прославленные в теле и в душе, а сама вселенная обновится."
    unity:
      kind: shared
      note: "Катехизис Католической Церкви — «изложение основного и фундаментального содержания католического вероучения»."
