self_view:
  summary: "Католическая Церковь видит своё начало в служении Христа, в Его крестной смерти (Церковь «родилась» из прободенного ребра распятого Спасителя) и в явлении Церкви миру в день Пятидесятницы. Апостол Пётр поставлен главой апостольской коллегии, и это служение продолжается в Римском Первосвященнике и епископах — преемниках апостолов, составляющих с ним единое целое."
  proof:
    - url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
      title: "Катехизис Католической Церкви (ccconline.ru, архивная копия), §763"
      tier: official
      excerpt: "Господь Иисус положил начало Своей Церкви, проповедуя Благую Весть"
      accessed: "2026-09-25"
    - url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
      title: "Катехизис Католической Церкви (ccconline.ru, архивная копия), §880"
      tier: official
      excerpt: "по установлению Господа св. Петр и другие апостолы составляют единый апостольский собор, так и Римский Первосвященник, Преемник Петра, и епископы, преемники апостолов, составляют единое"
      accessed: "2026-09-25"

positions:
  - topic: god
    summary: "Один Бог в трёх реально различных, единосущных Лицах («Троицу единосущную»). Лица не разделяют единую Божественность и различаются только взаимными отношениями происхождения: «Отец рождает, Сын рожден, Святой Дух исходит»."
    unity:
      kind: shared
      note: "Катехизис Католической Церкви — «изложение основного и фундаментального содержания католического вероучения»."
      proof:
        - url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
          title: "Катехизис Католической Церкви (ccconline.ru, архивная копия), §11"
          tier: "official"
          excerpt: "изложение основного и фундаментального содержания католического вероучения"
          accessed: "2026-09-26"
    quote:
      text: "Мы не исповедуем трех богов, но единого Бога в трех лицах: «Троицу единосущную»."
      source: "Катехизис Католической Церкви, §253"
      url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
    proof:
      - url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
        title: "Катехизис Католической Церкви (ccconline.ru, архивная копия), §253"
        tier: official
        excerpt: "Мы не исповедуем трех богов, но единого Бога в трех лицах: «Троицу единосущную»"
        accessed: "2026-09-25"
    status: verified

  - topic: name-of-god
    summary: "Бог открывает Своё «сокровенное имя» — Ягве, «Я есмь Тот, Кто есть». Это имя одновременно откровение и указание на непостижимую тайну Божию: «Его имя неизреченно», и Он Бог, Который приближается к людям."
    unity:
      kind: shared
      note: "Катехизис Католической Церкви — «изложение основного и фундаментального содержания католического вероучения»."
      proof:
        - url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
          title: "Катехизис Католической Церкви (ccconline.ru, архивная копия), §11"
          tier: "official"
          excerpt: "изложение основного и фундаментального содержания католического вероучения"
          accessed: "2026-09-26"
    quote:
      text: "Открывая Свое сокровенное имя — Ягве, «Я есмь Тот, Кто есть»... Бог говорит, Кто Он и каким именем следует Его называть."
      source: "Катехизис Католической Церкви, §206"
      url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
    proof:
      - url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
        title: "Катехизис Католической Церкви (ccconline.ru, архивная копия), §206"
        tier: official
        excerpt: "Открывая Свое сокровенное имя — Ягве, «Я есмь Тот, Кто есть»"
        accessed: "2026-09-25"
    status: verified

  - topic: jesus
    summary: "Иисус Христос — истинный Бог и истинный человек, предвечный Сын Божий, ставший человеком. Церковь верует и исповедует Его историческое рождение от Девы Марии в Вифлееме во времена царя Ирода Великого и Распятие при Понтии Пилате."
    unity:
      kind: shared
      note: "Катехизис Католической Церкви — «изложение основного и фундаментального содержания католического вероучения»."
      proof:
        - url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
          title: "Катехизис Католической Церкви (ccconline.ru, архивная копия), §11"
          tier: "official"
          excerpt: "изложение основного и фундаментального содержания католического вероучения"
          accessed: "2026-09-26"
    quote:
      text: "Мы веруем и исповедуем, что Иисус Назарянин, родившийся евреем от дочери Израилевой в Вифлееме во времена царя Ирода Великого и императора Цезаря Августа... есть предвечный Сын Божий, ставший человеком."
      source: "Катехизис Католической Церкви, §423"
      url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
    proof:
      - url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
        title: "Катехизис Католической Церкви (ccconline.ru, архивная копия), §423"
        tier: official
        excerpt: "Мы веруем и исповедуем, что Иисус Назарянин, родившийся евреем от дочери Израилевой в Вифлееме во времена царя Ирода Великого"
        accessed: "2026-09-25"
    status: verified

  - topic: spirit
    summary: "Святой Дух — истинный Бог. Латинская традиция исповедует, что Дух исходит «от Отца и Сына» (Filioque); это разъяснено Флорентийским Собором (1439 г.), хотя введение Filioque в Символ веры остаётся предметом спора с православными Церквами."
    unity:
      kind: shared
      note: "вероучение всей Церкви; Катехизис называет восточную формулу — Дух «исходит от Отца через Сына» — и западную Filioque законно взаимодополняющими: «Эта законная взаимодополняемость» не затрагивает существа веры."
      proof:
        - url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
          title: "Катехизис Католической Церкви (ccconline.ru, архивная копия), §248"
          tier: "official"
          excerpt: "она утверждает, что Дух исходит от Отца через Сына"
          accessed: "2026-09-26"
        - url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
          title: "Катехизис Католической Церкви (ccconline.ru, архивная копия), §248"
          tier: "official"
          excerpt: "Эта законная взаимодополняемость, если она не становится предметом обострения, не затрагивает существа веры в реальность той же исповедуемой тайны"
          accessed: "2026-09-26"
    quote:
      text: "Латинская традиция Символа веры исповедует, что Дух исходит «от Отца и Сына (Filioque)»."
      source: "Катехизис Католической Церкви, §246"
      url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
    proof:
      - url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
        title: "Катехизис Католической Церкви (ccconline.ru, архивная копия), §246"
        tier: official
        excerpt: "Латинская традиция Символа веры исповедует, что Дух исходит «от Отца и Сына (Filioque)»"
        accessed: "2026-09-25"
    status: verified

  - topic: scripture
    summary: "Канон включает 46 книг Ветхого Завета (45, если считать Иеремию и Плач Иеремии одной книгой) и 27 книг Нового Завета."
