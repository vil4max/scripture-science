  - topic: organisation
    summary: "Папа, Епископ Римский и Преемник апостола Петра, имеет над Церковью «полную, верховную и вселенскую власть, которую он вправе всегда свободно осуществлять» как наместник Христа и пастырь всей Церкви. Отдельную Церковь — диоцез (епархию) — возглавляет епископ; он управляет ею с помощью пресвитеров и диаконов, в общении со всей Церковью под руководством Папы."
