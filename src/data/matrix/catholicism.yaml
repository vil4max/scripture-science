  - topic: fasting
    summary: "Пост и воздержание служат покаянию: особое время — Великий пост и пятницы, а Пепельная среда и Страстная пятница соединяют оба ограничения. Воздержание от мяса предписано с 14 лет, пост — с совершеннолетия до 60 лет; епископские конференции уточняют правила и возможные замены делами милосердия. Перед Причащением соблюдают час без пищи и питья, кроме воды и лекарств; монашеская жизнь включает обеты целомудрия, бедности и послушания."
    unity:
      kind: shared
      note: "заповедь поста общая для всей Церкви (Катехизис, §2043); правила в позиции — по Кодексу канонического права, каноны которого относятся только к Латинской Церкви; для восточных католических церквей Катехизис ссылается на их кодекс (CCEO)."
