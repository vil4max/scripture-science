  - topic: images
    summary: "Почитание изображений не противоречит первой заповеди, запрещающей идолов, потому что «почитание, воздаваемое образу, обращено к прообразу». Почитание икон — «выражение глубокого почтения», а не поклонение, которое подобает одному только Богу. Католичество также исповедует догмат 1854 года о сохранении самой Девы Марии от первородного греха с первого мгновения её зачатия; это не то же самое, что девственное зачатие Иисуса Христа."
