id: catholicism
name: Католичество
full_name: Католическая Церковь
family: christianity

since:
  year: 33
  label: "ок. 33 г. · Пятидесятница; 1054 г. · разделение с Восточной (Православной) Церковью"
  note: "Катехизис возводит начало Церкви к служению Христа и к дню Пятидесятницы, когда «послан был Дух Святой... чтобы непрерывно освящать Церковь» и «Церковь была явлена открыто перед всеми» — это собственное понимание непрерывности Католической Церкви, не привязанное к конкретному году. Историческая (справочная) датировка относит разрыв общения с Восточной Церковью к 1054 году — «Великой схизме»."
  proof:
    - url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
      title: "Катехизис Католической Церкви (ccconline.ru, архивная копия), §767"
      tier: official
      excerpt: "послан был Дух Святой в день Пятидесятницы, чтобы непрерывно освящать Церковь"
      accessed: "2026-09-25"
    - url: "https://www.pewresearch.org/religion/2017/11/08/orthodox-christianity-in-the-21st-century/"
      title: "Orthodox Christianity in the 21st Century | Pew Research Center"
      tier: reference
      excerpt: "Following the Great Schism between the Eastern (Orthodox) churches and the Western (Catholic) church in 1054"
      accessed: "2026-09-25"

scripture:
  name: "Библия: церковно утверждённые переводы; язык богослужения зависит от обряда и местной церковной практики"
  overview:
    title: "Библия"
    text: "46 книг Ветхого Завета и 27 Нового. На мессе латинского обряда используют утверждённые церковью богослужебные тексты на латыни или другом языке. Для личного чтения — переводы Библии на понятном читателю языке; церковь поощряет регулярное чтение с молитвой."
  url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
  proof:
    - url: "https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib4-cann879-958_en.html"
      title: "Кодекс канонического права, канон 928 — язык мессы"
      tier: "official"
      excerpt: "in the Latin language or in another language provided that the liturgical texts have been legitimately approved."
      accessed: "2026-09-27"
    - url: "https://www.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_const_19651118_dei-verbum_en.html"
      title: "Dei Verbum, §§22, 25 — переводы и чтение Писания"
      tier: "official"
      excerpt: "suitable and correct translations are made into different languages"
      accessed: "2026-09-27"
    - url: "https://www.vatican.va/archive/hist_councils/ii_vatican_council/documents/vat-ii_const_19651118_dei-verbum_en.html"
      title: "Dei Verbum, §25 — чтение с молитвой"
      tier: "official"
      excerpt: "prayer should accompany the reading of Sacred Scripture"
      accessed: "2026-09-27"
    - url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
      title: "Катехизис Католической Церкви (ccconline.ru, архивная копия), §291"
      tier: official
      excerpt: "В начале было Слово (...) и Слово было Бог."
      accessed: "2026-09-25"
    - url: "https://azbyka.ru/biblia/?Jn.1:1&r"
      title: "Библия онлайн, Синодальный перевод — Азбука веры"
      tier: reference
      excerpt: "В начале было Слово, и Слово было у Бога, и Слово было Бог."
      accessed: "2026-09-25"

adherents:
