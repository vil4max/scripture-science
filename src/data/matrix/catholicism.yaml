  - topic: afterlife
    summary: "Те, кто умирает в благодати Божией, совершенно очищенными, видят Бога лицом к лицу (небо). Умершие в благодати, но несовершенно очищенными, проходят конечное очищение — чистилище, учение о котором сформулировано на Флорентийском и Тридентском Соборах. Всеобщее воскресение и Суд последуют в конце времён."
    unity:
      kind: shared
      note: "Катехизис Католической Церкви — «изложение основного и фундаментального содержания католического вероучения»."
      proof:
        - url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
          title: "Катехизис Католической Церкви (ccconline.ru, архивная копия), §11"
          tier: "official"
          excerpt: "изложение основного и фундаментального содержания католического вероучения"
          accessed: "2026-09-26"
    quote:
      text: "Церковь называет чистилищем это конечное очищение избранных, совершенно иное, нежели наказание проклятых."
      source: "Катехизис Католической Церкви, §1031"
      url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
    proof:
      - url: "http://web.archive.org/web/20260422005102/https://ccconline.ru/"
