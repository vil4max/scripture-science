  - topic: authority
    summary: "Обязанность подлинно толковать письменное или устно переданное Слово Божие вверена одному только Учительству Церкви — Папе и епископам в общении с ним. Русский перевод Катехизиса подготовлен комиссией с участием консультанта от Русской Православной Церкви и утверждён Ватиканом."
    unity:
      kind: shared
      note: "Катехизис Католической Церкви — «изложение основного и фундаментального содержания католического вероучения»."
      proof:
