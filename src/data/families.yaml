# The classification of each of the eight traditions, for the family line on
# the tradition cards and the «Классификация» row of the comparison. It began
# with the three nineteenth-century movements and Protestantism
# (docs/tasks/site-m5-reading-polish.md W3) and covers every tradition since
# the owner asked for no empty cells in the comparison (2026-09-26). `family`
# is a short Russian rendering of the classification a reference-tier source
# actually uses for that tradition - not an invented label - each backed by a
# verbatim excerpt of at most 25 words (docs/SOURCES.md "What verified
# means"). No proof -> no line: a tradition without a sourced classification
# stays out of this file rather than getting an invented one.
- tradition: judaism
  path: ["Авраамические религии", "Иудаизм"]
  family: "монотеистическая традиция, одна из авраамических религий (наряду с христианством и исламом)"
  proof:
    - url: "https://www.pewresearch.org/religion/2012/07/19/asian-americans-a-mosaic-of-faiths-appendix-6/"
      title: "Asian Americans: A Mosaic of Faiths, Appendix 6: Glossary | Pew Research Center"
      tier: reference
      excerpt: "Christianity, Islam and Judaism are monotheistic traditions—that is, their theologies are built on belief in one God"
      accessed: "2026-09-26"
    - url: "https://www.pewresearch.org/religion/2012/07/19/asian-americans-a-mosaic-of-faiths-appendix-6/"
      title: "Asian Americans: A Mosaic of Faiths, Appendix 6: Glossary | Pew Research Center"
      tier: reference
      excerpt: "that recognize Abraham as their first prophet; they are therefore known as the Abrahamic religions."
      accessed: "2026-09-26"
