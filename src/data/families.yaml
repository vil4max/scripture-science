  proof:
    - url: "https://www.pewresearch.org/religion/2017/11/08/orthodox-christianity-in-the-21st-century/"
      title: "Orthodox Christianity in the 21st Century | Pew Research Center"
      tier: reference
      excerpt: "all three major branches of Christianity (Orthodoxy, Catholicism and Protestantism) were predominantly concentrated in Europe"
      accessed: "2026-09-26"
