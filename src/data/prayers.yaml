- id: otche-nash
  title: "Отче наш"
  about: "«Отче наш» — молитва, которой научил учеников Сам Господь Иисус Христос; поэтому её называют ещё «Молитвой Господней». Она записана в Евангелии: в Нагорной проповеди (Мф 6:9–13) и в ответ на просьбу учеников научить их молиться (Лк 11:1–4). Православные читают её в составе практически любого общественного богослужения и домашнего молитвенного правила."
  text_cs: |
    Отче наш, Иже еси на небесех!
    Да святится имя Твое, да приидет Царствие Твое,
    да будет воля Твоя, яко на небеси и на земли.
    Хлеб наш насущный даждь нам днесь;
    и остави нам долги наша, якоже и мы оставляем должником нашим;
    и не введи нас во искушение, но избави нас от лукаваго.
    Яко Твое есть Царство и сила, и слава, Отца, и Сына, и Святаго Духа, ныне и присно, и во веки веков. Аминь.
  text_ru: |
    Отче наш, сущий на небесах! да святится имя Твое;
    да приидет Царствие Твое; да будет воля Твоя и на земле, как на небе;
    хлеб наш насущный дай нам на сей день;
    и прости нам долги наши, как и мы прощаем должникам нашим;
    и не введи нас в искушение, но избавь нас от лукавого. Ибо Твое есть Царство и сила и слава вовеки. Аминь.
  proof:
