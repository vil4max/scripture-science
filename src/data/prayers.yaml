- id: tsaryu-nebesnyj
  title: "Царю Небесный"
  about: "«Царю Небесный» — молитва Святому Духу, третьему Лицу Святой Троицы: в ней Его называют Утешителем и Духом истины и просят прийти, очистить от всякой скверны и спасти души. По происхождению это стихира праздника Пятидесятницы; сегодня она входит в «начало обычное» — молитвы, которыми начинается большая часть общественных богослужений и личных молитвословий. От Пасхи до Дня Святой Троицы её не читают."
  text_cs: |
    Царю Небесный, Утешителю, Душе истины, Иже везде сый и вся исполняяй, Сокровище благих и жизни Подателю, прииди и вселися в ны, и очисти ны от всякия скверны, и спаси, Блаже, души наша.
  text_ru: |
    Царь Небесный, Утешитель (Советник, Наставник), Дух истины, везде сущий (находящийся) и все наполняющий (присутствием Своим), Сокровище благ и Податель жизни, прииди и поселись в нас (среди нас), очисти нас от всякого греха и спаси, Преблагий, души наши.
