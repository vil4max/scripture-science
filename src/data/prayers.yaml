- id: dostojno-est
  title: "Достойно есть"
  about: "«Достойно есть» — одна из самых известных молитв Богородице. Это песнопение из двух частей, написанных разными авторами: вторую половину («Честнейшую Херувим…»), более древнюю, написал в VIII веке преподобный Косма Маюмский для службы Великой Пятницы, а происхождение первой части афонское предание относит к концу X века. Его употребляют в богослужении: на утрене и повечерии (после 9-й песни канона) и на литургии."
  text_cs: |
    Достойно есть яко воистину блажити Тя, Богородицу, Присноблаженную и Пренепорочную и Матерь Бога нашего.
    Честнейшую Херувим и славнейшую без сравнения Серафим, без истления Бога Слова рождшую, сущую Богородицу Тя величаем.
  text_ru: |
