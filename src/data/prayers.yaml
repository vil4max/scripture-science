- id: bogorodice-devo
  title: "Богородице Дево, радуйся"
  about: "«Богородице Дево, радуйся» — краткая молитва Пресвятой Богородице, составленная из евангельских приветствий: слов архангела Гавриила при Благовещении (Лк 1:28) и праведной Елисаветы при встрече с Девой Марией (Лк 1:42). Заканчивается она словами о том, что Богородица родила Спасителя наших душ. Тропарь с этими словами поют на вечерне, молитва входит в утренние молитвы, и христиане повторяют её ежедневно утром и вечером."
  text_cs: |
    Богородице Дево, радуйся, благодатная Марие, Господь с Тобою, Благословенна Ты в женах и благословен Плод чрева Твоего, яко Спаса родила еси душ наших.
  text_ru: |
    Богородица Дева Мария, исполненная благодати Божией, радуйся! Господь с Тобою; благословенна Ты между женами и благословен Плод, Тобою рожденный, потому что Ты родила Спасителя душ наших.
