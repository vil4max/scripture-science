- id: simvol-very
  title: "Символ веры"
  about: "Символ веры — краткое изложение основ христианской веры из двенадцати членов (предложений). Его составили отцы I и II Вселенских Соборов: первые семь членов — на Соборе в Никее (325 г.), остальные пять — на Соборе в Константинополе (381 г.). Строго говоря, это не молитва, а исповедание веры: в нём нет обращений к Богу. Православные христиане произносят его при Крещении, поют всем храмом за Литургией и читают каждый день в утреннем молитвенном правиле."
  text_cs: |
    Верую во единаго Бога Отца, Вседержителя, Творца небу и земли, видимым же всем и невидимым.
    И во единаго Господа Иисуса Христа, Сына Божия, единороднаго, Иже от Отца рожденнаго прежде всех век, Света от Света, Бога истинна от Бога истинна, рожденна, не сотворенна, единосущна Отцу, Имже вся быша.
    Нас ради человек и нашего ради спасения сшедшаго с небес, и воплотившагося от Духа Свята и Марии Девы, и вочеловечшася.
    Распятаго же за ны при Понтийстем Пилате, и страдавша и погребенна.
    И воскресшаго в третий день по Писанием.
    И возшедшаго на небеса, и седяща одесную Отца.
    И паки грядущаго со славою судити живым и мертвым, Егоже царствию не будет конца.
    И в Духа Святаго, Господа, животворящаго, Иже от Отца исходящаго, Иже со Отцем и Сыном спокланяема и сславима, глаголавшаго Пророки.
    Во едину Святую, Соборную и Апостольскую Церковь.
    Исповедую едино Крещение, во оставление грехов.
    Чаю воскресения мертвых.
    И жизни будущаго века. Аминь.
  text_ru: |
    Верую в единого Бога Отца, Вседержителя, Творца неба и земли, всего видимого и невидимого.
    И в единого Господа Иисуса Христа, Сына Божия, Единородного, Рожденного от Отца прежде всех веков: Света от Света, Бога истинного от Бога истинного, рожденного, не сотворенного, одного существа с Отцом, Им же все сотворено.
    Ради нас людей и ради нашего спасения сшедшего с небес и принявшего плоть от Духа Святого и Марии Девы, и ставшего человеком.
    Распятого же за нас при Понтийском Пилате, и страдавшего, и погребенного.
    И воскресшего в третий день, согласно Писаниям.
    И восшедшего на небеса, и сидящего по правую сторону Отца.
    И снова грядущего со славою, чтобы судить живых и мертвых. Его же царству не будет конца.
    И в Духа Святого, Господа, дающего жизнь, от Отца исходящего, с Отцом и Сыном сопоклоняемого и сопрославляемого, говорившего через пророков.
    В едину Святую, Соборную и Апостольскую Церковь.
    Признаю одно крещение для прощения грехов.
    Ожидаю воскресения мертвых,
    и жизни будущего века. Аминь (истинно так)
  proof:
