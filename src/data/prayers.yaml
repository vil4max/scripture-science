- id: psalom-50
  title: "Псалом 50"
  about: "Псалом 50 — покаянный псалом царя Давида и самый известный из псалмов. По его надписанию, Давид составил его, когда к нему приходил пророк Нафан, после того как царь согрешил с Вирсавией (2 Цар 11). В богослужении его читают чаще любого другого псалма — например, на повечерии, утрене и третьем часе, в утренних молитвах и в последовании ко Святому Причащению."
  text_cs: |
    В конец, псалом Давиду, – внегда внити к нему Нафану пророку, егда вниде к Вирсавии жене Уриеве.
    Помилуй мя, Боже, по велицей милости Твоей, и по множеству щедрот Твоих очисти беззаконие мое.
    Наипаче омый мя от беззакония моего и от греха моего очисти мя:
    яко беззаконие мое аз знаю, и грех мой предо мною есть выну.
    Тебе единому согреших и лукавое пред Тобою сотворих: яко да оправдишися во словесех Твоих и победиши, внегда судити Ти.
    Се бо, в беззакониих зачат есмь, и во гресех роди мя мати моя.
    Се бо, истину возлюбил еси, безвестная и тайная премудрости Твоея явил ми еси.
    Окропиши мя иссопом, и очищуся: омыеши мя, и паче снега убелюся.
    Слуху моему даси радость и веселие: возрадуются кости смиренныя.
    Отврати лице Твое от грех моих и вся беззакония моя очисти.
    Сердце чисто созижди во мне, Боже, и дух прав обнови во утробе моей.
    Не отвержи мене от лица Твоего и Духа Твоего Святаго не отыми от мене.
    Воздаждь ми радость спасения Твоего и Духом Владычним утверди мя.
    Научу беззаконныя путем Твоим, и нечестивии к Тебе обратятся.
    Избави мя от кровей, Боже, Боже спасения моего: возрадуется язык мой правде Твоей.
    Господи, устне мои отверзеши, и уста моя возвестят хвалу Твою.
    Яко аще бы восхотел еси жертвы, дал бых убо: всесожжения не благоволиши.
    Жертва Богу дух сокрушен: сердце сокрушенно и смиренно Бог не уничижит.
    Ублажи, Господи, благоволением Твоим Сиона, и да созиждутся стены Иерусалимския:
    тогда благоволиши жертву правды, возношение и всесожегаемая: тогда возложат на олтарь Твой тельцы.
  text_ru: |
    Начальнику хора. Псалом Давида, когда приходил к нему пророк Нафан, после того, как Давид вошел к Вирсавии
    Помилуй меня, Боже, по великой милости Твоей, и по множеству щедрот Твоих изгладь беззакония мои.
    Многократно омой меня от беззакония моего, и от греха моего очисти меня,
    ибо беззакония мои я сознаю, и грех мой всегда предо мною.
    Тебе, Тебе единому согрешил я и лукавое пред очами Твоими сделал, так что Ты праведен в приговоре Твоем и чист в суде Твоем.
    Вот, я в беззаконии зачат, и во грехе родила меня мать моя.
    Вот, Ты возлюбил истину в сердце и внутрь меня явил мне мудрость [Твою].
    Окропи меня иссопом, и буду чист; омой меня, и буду белее снега.
    Дай мне услышать радость и веселие, и возрадуются кости, Тобою сокрушенные.
    Отврати лице Твое от грехов моих и изгладь все беззакония мои.
    Сердце чистое сотвори во мне, Боже, и дух правый обнови внутри меня.
    Не отвергни меня от лица Твоего и Духа Твоего Святаго не отними от меня.
    Возврати мне радость спасения Твоего и Духом владычественным утверди меня.
    Научу беззаконных путям Твоим, и нечестивые к Тебе обратятся.
    Избавь меня от кровей, Боже, Боже спасения моего, и язык мой восхвалит правду Твою.
    Господи! отверзи уста мои, и уста мои возвестят хвалу Твою:
    ибо жертвы Ты не желаешь, – я дал бы ее; к всесожжению не благоволишь.
    Жертва Богу – дух сокрушенный; сердца сокрушенного и смиренного Ты не презришь, Боже.
    Облагодетельствуй, [Господи,] по благоволению Твоему Сион; воздвигни стены Иерусалима:
    тогда благоугодны будут Тебе жертвы правды, возношение и всесожжение; тогда возложат на алтарь Твой тельцов.
