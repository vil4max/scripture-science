- term: реставрационизм
  use_on_site: true
  definition: Реставрационизм — направление в христианстве, стремящееся вернуться к практике и вероучению ранней Церкви (также называемое христианским примитивизмом). В XIX веке в Америке оно породило ряд новых, не связанных друг с другом христианских групп, в том числе мормонов и свидетелей Иеговы, стремившихся воспроизвести принципы новозаветной Церкви.
  notes: По данным той же справочной статьи, движение восходит к Средним векам, получило новый импульс в эпоху Реформации XVI века, а в середине XX века на его формы повлияли харизматическое и пятидесятническое возрождения.
  proof:
    - url: https://www.ebsco.com/research-starters/religion-and-philosophy/restorationism
      title: Restorationism — EBSCO Research Starters (авт. Janine Ungvarsky, 2023)
      tier: reference
      excerpt: new denominations such as the Mormons, Jehovah's Witnesses, and the Disciples of Christ, all emphasizing unity and a return to Apostolic traditions
      accessed: 2026-09-25
    - url: https://www.ebsco.com/research-starters/religion-and-philosophy/restorationism
      title: Restorationism — EBSCO Research Starters (авт. Janine Ungvarsky, 2023)
      tier: reference
      excerpt: In the nineteenth century, various unaffiliated Christian groups emerged, striving to replicate the principles of the New Testament Church
      accessed: 2026-09-25
  status_check: verified
- term: адвентизм
  use_on_site: true
  definition: "Адвентизм — течение, восходящее к движению миллеритов: в начале 1830-х годов американский проповедник Уильям Миллер начал провозглашать скорое («адвент» — пришествие) телесное возвращение Христа, первоначально ожидавшееся около 1843–1844 годов. Из миллеритского движения после «великого разочарования» 1844 года сложился ряд адвентистских групп, включая Церковь адвентистов седьмого дня."
  notes: Название происходит от лат. adventus — «пришествие».
  proof:
    - url: http://web.archive.org/web/20250907220248/https://www.britannica.com/topic/Millerism
      title: Millerism — Encyclopaedia Britannica (архивная копия)
      tier: reference
      excerpt: a movement called Millerism that sought to revive belief that the bodily arrival ("advent") of Christ was imminent
      accessed: 2026-09-25
  status_check: verified
- term: религиозные меньшинства
  use_on_site: true
  definition: Религиозные меньшинства — нейтральный собирательный термин для религиозных групп, не относящихся к численно преобладающим традициям; используется, в частности, благотворительной организацией Inform как альтернатива оценочным обозначениям.
  notes: Inform описывает собственную задачу как предоставление точной, основанной на данных информации о «религиозных меньшинствах и сектах» (minority religions and sects) с целью предотвратить вред от недостоверных сведений о них.
  proof:
