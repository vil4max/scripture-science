- term: конфессия
  use_on_site: true
  definition: Конфессия (от лат. confessio — исповедание) — объединение верующих в пределах одной религии, имеющее собственное вероучение, особенности богослужения и определённую организационную структуру; к христианским конфессиям относят, в частности, католицизм и протестантизм.
  notes: Термин получил распространение в эпоху Реформации, когда отделявшиеся от католичества протестантские общины формулировали собственные исповедания веры — «confessiones».
  proof:
    - url: https://azbyka.ru/konfessiya
      title: Конфессия — Азбука веры
      tier: official
      excerpt: объединение верующих, в пределах одной религии, имеющее свое вероучение, особенности богослужения и определенную организационную структуру
      accessed: 2026-09-25
  status_check: todo
