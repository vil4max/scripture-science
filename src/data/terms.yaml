- term: раскол
  use_on_site: true
  definition: Нарушение церковного единства; в строгом различении с ересью — разделение по причинам, не связанным с учением о Боге. В исторической речи слово может обозначать и разделение, сопровождаемое вероучительными расхождениями.
  notes: Богословская классификация касается учения, а не человеческого достоинства последователей. Православный ответ должен соединять верность истине с христианской любовью. Определение из энциклопедии — пояснение; церковное отношение — документ РПЦ, §7.1.
