- term: неканонические книги
  slug: non-canonical-books
  group: basic
  short: "11 книг Ветхого Завета, которые есть в русской Библии, но не в еврейской. В русской традиции их читают в храме, но считают лишь добрыми и полезными, а не вдохновлёнными Богом."
  match:
    - "[Нн]еканоническ(ие|их|им|ими|ая|ой|ую|ое|ого|ому|ом)"
    - "[Вв]тороканоническ(ие|их|им|ими|ая|ой|ую|ое|ого|ому|ом)"
  use_on_site: true
  definition: "Неканоническими в русской традиции называют 11 книг Ветхого Завета, которые есть в славянской и русской Библии, но отсутствуют в еврейской: Товита, Иудифи, Премудрости Соломона, Премудрости Иисуса, сына Сирахова, 2 и 3 Ездры, Послание Иеремии, Варуха и три книги Маккавейские. В русском богословии их считают не богодухновенными, а добрыми и полезными для чтения; в издании Библии Московской Патриархии с 1968 года они отмечены звёздочкой в оглавлении, а многие из них звучат за богослужением. Католики называют большинство этих книг второканоническими и включают в канон, протестанты называют их апокрифами и обычно не включают в канон. В греческих Православных Церквах такого деления нет, и там эти книги, кроме 3 Ездры, считаются каноническими, а единого решения всех Поместных Церквей об их статусе нет."
  notes: "Термин «неканонические» принят в русской библеистике; названия «второканонические» и «апокрифы» принадлежат католической и протестантской традициям и приведены только для сравнения."
