- term: реставрационизм
  use_on_site: true
  definition: Реставрационизм — направление в христианстве, стремящееся вернуться к практике и вероучению ранней Церкви (также называемое христианским примитивизмом). В XIX веке в Америке оно породило ряд новых, не связанных друг с другом христианских групп, в том числе мормонов и свидетелей Иеговы, стремившихся воспроизвести принципы новозаветной Церкви.
  notes: По данным той же справочной статьи, движение восходит к Средним векам, получило новый импульс в эпоху Реформации XVI века, а в середине XX века на его формы повлияли харизматическое и пятидесятническое возрождения.
  proof:
