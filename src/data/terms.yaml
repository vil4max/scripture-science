- term: иноверие
  use_on_site: true
  definition: Нехристианские религии. В этом справочнике так обозначены иудаизм и ислам; их учения о Боге и откровении не тождественны православному.
  notes: Используется только определение термина из исторического словаря. Его описание законодательства Российской империи не является современным церковным предписанием. Отношение к людям — с христианской любовью.
