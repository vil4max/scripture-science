- term: секта
  use_on_site: false
  definition: В социологии религии, начиная с типологии Эрнста Трёльча (кон. XIX – нач. XX в.), сектой называют сравнительно небольшую группу, стремящуюся к «неопосредованному» спасению и относящуюся к окружающему миру безразлично или враждебно — в отличие от более крупного, институционально непрерывного типа «церкви».
  notes: Слово восходит к лат. secta (учение, направление, школа); по одной из версий — от глагола sequor («следовать»), по другой — от secare («отсекать, отделять»). Согласно порталу «Азбука веры», в западной христианской литературе термин закрепился при переводе Библии на латынь (Vulgata), где блаженный Иероним нередко передавал им греческое αἵρεσις. Тот же портал утверждает, что слова «секта» и «сектант» не имеют оскорбительного значения, и применяет их, в частности, к общинам адвентистов, свидетелей Иеговы и мормонов, — но фиксирует и то, что «некоторые общественные деятели и представители религиозных групп выступают против использования термина «секта»» применительно к тем или иным группам.
  proof:
    - url: http://web.archive.org/web/20260724185802/https://www.britannica.com/topic/Christianity/Church-sect-and-mystical-movement
      title: "Christianity: Church, sect, and mystical movement — Encyclopaedia Britannica (архивная копия)"
      tier: reference
      excerpt: sects, which are comparatively small groups that strive for unmediated salvation and that are related indifferently or antagonistically to the world
      accessed: 2026-09-25
