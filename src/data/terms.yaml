- term: деноминация
  use_on_site: true
  definition: Деноминация — конкретное религиозное объединение (церковь, община) в составе более широкой религии, обозначаемое собственным названием, историей, организацией и вероучением. Например, в США, где это словоупотребление особенно распространено, крупнейшей отдельной деноминацией называют католицизм, а протестантские церкви в совокупности составляют большинство религиозных приверженцев.
  notes: Термин нейтрально применяется энциклопедическими источниками как к католической, так и к протестантским церквам, без указания на численное или доктринальное меньшинство.
  proof:
    - url: http://web.archive.org/web/20260822231059/https://www.britannica.com/topic/denomination
      title: "United States: Religious groups — Encyclopaedia Britannica (архивная копия)"
      tier: reference
      excerpt: Roman Catholicism is the largest single denomination (about one-fifth of the U.S. population), the many churches of Protestantism constitute the majority
      accessed: 2026-09-25
  status_check: verified
- term: новое религиозное движение (НРД)
  use_on_site: true
  definition: Новое религиозное движение (НРД) — нейтральный, не содержащий оценочного значения термин для религиозных или философских объединений, предлагающих ответы на вопросы о смысле жизни. По словоупотреблению исследовательницы Айлин Баркер (её книга так и называется — «Новые религиозные движения»), это понятие в основном относится к движениям, принявшим современную форму после Второй мировой войны.
  notes: Основанная Баркер организация Inform описывает себя как «независимую образовательную благотворительную организацию, предоставляющую информацию о религиозных меньшинствах и сектах», стремящуюся к максимальной точности и опоре на данные. Православный портал «Азбука веры», пересказывая книгу Баркер, отмечает, что использование термина «НРД» «позволяет сохранить научную объективность, поскольку он не несёт в себе оценочного значения», но в собственной, конфессиональной оценке называет «влиятельными и агрессивными сектами, такими как свидетели Иеговы и мормоны» ряд движений, не охватываемых понятием НРД по возрасту (Святые последних дней — с 1830 года, свидетели Иеговы — с 1870-х).
  proof:
    - url: https://inform.ac/about-us/
      title: About Us — Inform
      tier: reference
      excerpt: an independent educational charity providing information about minority religions and sects which is as accurate, up-to-date and as evidence-based as possible
      accessed: 2026-09-25
