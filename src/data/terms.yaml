- term: Священное Предание
  slug: sacred-tradition
  group: basic
  short: "Всё, что верующие передают друг другу и потомкам из поколения в поколение: учение веры, закон Божий, Таинства и священные обряды. Хранит его Церковь."
  match:
    - "Священн(ое|ого|ому|ым|ом) Предани(е|я|ю|ем|и)"
    - "Предани(е|я|ю|ем|и)"
  use_on_site: true
  definition: "Священным Преданием называют то, что верующие словом и примером передают друг другу, а предки потомкам: учение веры, закон Божий, Таинства и священные обряды. Это древнейший способ передачи учения, открытого Богом: от Адама до Моисея священных книг не было, а Сам Христос передал Своё учение ученикам словом и примером. Хранительницей Предания православные считают Церковь и верят, что оно нужно и сегодня — чтобы правильно понимать Писание и правильно совершать Таинства."
  notes: "Определение дано по Пространному катехизису свт. Филарета, §§17–24; спор о Предании и Писании разобран в записи о Sola Scriptura."
  proof:
