      summary: "Правило делит не отступающие от веры крещения на три категории по степени отпадения от церковного единства: ереси — при полном отторжении от самой веры; расколы — при разногласиях по разрешимым церковным вопросам; самочинные сборища — собрания, составленные вышедшими из послушания пресвитерами или епископами и невежественным народом. Текст не называет какие-либо более поздние конкретные конфессии или движения."
