- id: tradition-and-creed
  order: 5
  title: "Священное Предание и Символ веры"
  points:
    - "Христос передал Своё учение ученикам словом и примером, а не книгой. Так же сначала проповедовали апостолы. Эта передача веры от поколения к поколению называется Священным Преданием: в него входят учение веры, закон Божий, Таинства и священные обряды."
    - "Хранительница Предания — Церковь. Поэтому православные читают Библию вместе с Церковью: Предание помогает правильно понимать Писание."
    - "Символ веры — кратко и точно изложенное содержание веры христиан. Его составили участники первого и второго Вселенских Соборов — собраний пастырей и учителей Церкви со всей вселенной. Соборы прошли в Никее (325 год) и в Константинополе (381 год)."
    - "Символ веры начинается словами «Верую во единаго Бога Отца, Вседержителя, Творца небу и земли» и продолжается словами о Христе, Святом Духе, Церкви и жизни будущего века."
