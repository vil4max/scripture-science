      excerpt: "в этих трёх ипостасях явлен один триипостасный Бог"
      accessed: "2026-10-09"
    - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
      title: "Свт. Филарет Московский. Пространный катехизис, §94: различие Лиц Троицы"
      tier: official
      excerpt: "Сын Божий предвечно рождается от Отца; Святой Дух предвечно исходит от Отца"
      accessed: "2026-10-09"
    - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
