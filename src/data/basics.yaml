- id: church-and-sacraments
  order: 4
  title: "Церковь и Таинства"
  points:
    - "Церковь — это Богом установленное общество людей, соединённых православной верой, законом Божиим, священноначалием (епископами и священниками) и Таинствами. Её Глава — Сам Иисус Христос."
    - "Церковь открыто явилась миру в день Пятидесятницы, когда Святой Дух сошёл на апостолов."
    - "Таинство — священное действие, в котором на человека тайно действует благодать, то есть спасительная сила Божия. В Церкви семь Таинств."
    - "Крещение — Таинство рождения для духовной жизни. Человека трижды погружают в воду с призыванием Отца и Сына и Святого Духа: он умирает для греховной жизни и возрождается Святым Духом."
    - "Причащение, или Евхаристия, — Таинство, в котором верующий под видом хлеба и вина вкушает подлинные Тело и Кровь Иисуса Христа для вечной жизни. Оно совершается на Литургии (слово значит общественное служение) и составляет главную часть богослужения."
  proof:
