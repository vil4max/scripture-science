- id: trinity
  order: 3
  title: "Бог Троица: один Бог в трёх Лицах"
  points:
    - "Христиане веруют в одного Бога. Церковь учит: Он один, но в трёх Лицах — Отец, Сын и Святой Дух. Это называется Троицей."
    - "Каждое Лицо — истинный Бог, и всё же Бог один. Поэтому Троица — не три бога и не один Бог, который по-разному проявляется."
    - "Лица различны: Сын предвечно (вне времени) рождается от Отца, а Святой Дух предвечно исходит от Отца."
    - "Человеческий ум не может до конца постичь эту тайну. Церковь верит в неё, потому что так свидетельствует слово Божие."
    - "Имена трёх Лиц Христос назвал ученикам: «Итак, идите, научите все народы, крестя их во имя Отца и Сына и Святого Духа» (Евангелие от Матфея, 28:19)."
  proof:
    - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
      title: "Свт. Филарет Московский. Пространный катехизис, §90: Троица"
      tier: official
      excerpt: "Бог один по существу, но троичен в лицах: Отец, Сын и Святой Дух, Троица единосущная и нераздельная"
      accessed: "2026-09-25"
    - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
      title: "Свт. Филарет Московский. Пространный катехизис, §95: достоинство Лиц Троицы"
