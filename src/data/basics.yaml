- id: how-to-read
  order: 7
  title: "Как читать этот сайт"
  points:
    - "Мерой для сравнения служит православное учение. В документе Архиерейского Собора (собрания епископов) Русской Церкви 2000 года сказано: «Православная Церковь есть истинная Церковь Христова»."
    - "Другие традиции описаны по их собственным документам. Что учит сама традиция и как это оценивает Православие, показано отдельно."
    - "Слова иноверие, инославие, раскол, ересь и секта — церковные понятия. Инославие — неправославные христианские исповедания, иноверие — нехристианские религии. Эти слова оценивают учение, а не людей."
    - "Тот же документ призывает православных относиться с христианской любовью к людям, чьи взгляды они отвергают, и не допускает оскорблений в адрес инославных. Незнакомое слово ищите в словаре, ответы традиций — в сравнении."
