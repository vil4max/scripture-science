- id: bible
  order: 2
  title: "Библия: Ветхий и Новый Завет"
  points:
    - "Библия — собрание священных книг. По учению Церкви, их написал Святой Дух через пророков (посланников Бога) и апостолов (учеников Христа)."
    - "Библия делится на две части. Ветхий Завет написан до Рождества Христова, Новый Завет — после. Завет — это союз Бога с людьми: в древнем союзе Бог обещал Спасителя, в новом даровал Его — Иисуса Христа."
    - "В русском православном издании 77 книг: 50 ветхозаветных и 27 новозаветных. Одиннадцать ветхозаветных книг неканонические: они не входят в канон — перечень книг, признанных богодухновенными, то есть внушёнными Святым Духом."
    - "Основу Нового Завета составляют четыре Евангелия. Это слово значит добрая, радостная весть: в них рассказано о жизни, учении, смерти и воскресении Христа."
