- id: divisions
  order: 6
  title: "Почему христиане разделились"
  points:
    - "Христос заповедал христианам единство, но заповедь не раз нарушалась. Православная Церковь учит: Церковь Христова едина и единственна, поэтому разделение — это отход от неё, а не рождение новой Церкви."
    - "В 1054 году от единства Православной Церкви отделилась Римская Церковь; от неё ведёт начало католицизм. Это называют Великим расколом — нарушением церковного единства. Дата условная: разрыв шёл постепенно."
    - "В 1517 году выступление Мартина Лютера в Германии принято считать началом Реформации. Из неё выросли лютеранство, кальвинизм, англиканство и другие протестантские направления."
    - "В XIX веке появились ещё три движения. В 1830 году организована Церковь Иисуса Христа Святых последних дней (в быту — мормоны), в 1863 году — Адвентисты седьмого дня. Свидетели Иеговы ведут начало от библейского кружка в Питтсбурге около 1870 года."
    - "Были и более ранние разделения, в первом тысячелетии. Церковь учит, что она основана Христом и явлена миру в Пятидесятницу, а не возникла ни в одну из этих дат."
