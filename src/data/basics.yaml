# «С чего начать: христианство коротко» (/basics/, docs/tasks/site-m34-newcomer-reading.md,
# outcome 4). Seven short sections for a reader with no religious education.
# Paraphrase carries no quotation marks; Scripture and documents are quoted
# exactly, and every section carries its own verified proof (docs/SOURCES.md).
- id: christ-and-christians
  order: 1
  title: "Кто такой Иисус Христос и кто такие христиане"
  points:
    - "Христиане — это люди, которые верят в Иисуса Христа и идут за Ним. Так впервые назвали учеников Христа в городе Антиохии (Деяния апостолов, 11:26)."
    - "Церковь учит: Иисус Христос — Сын Божий, ставший человеком. Он Бог и человек вместе."
    - "Имя Иисус означает Спаситель: Он родился, чтобы спасти людей. Имя Христос означает Помазанник — так издавна называли царей, первосвященников и пророков."
    - "Христиане верят: Христос был распят при Понтии Пилате, погребён и на третий день воскрес. Об этом сказано в Символе веры — о нём в пятом разделе."
  proof:
    - url: "https://azbyka.ru/biblia/?Act.11:26&r"
      title: "Библия онлайн, Синодальный перевод — Азбука веры: Деян. 11:26"
      tier: reference
      excerpt: "ученики в Антиохии в первый раз стали называться Христианами"
      accessed: "2026-10-09"
    - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
