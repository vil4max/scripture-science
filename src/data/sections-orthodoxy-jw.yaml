- id: "header"
  html: "\n    <p class=\"eyebrow\">Сравнительный обзор</p>\n    <h1>Православие и Свидетели Иеговы</h1>\n    <p class=\"lead\">Одна Библия, два прочтения. Позиции изложены так, как их описывают сами стороны: по материалам jw.org, wol.jw.org и православных источников. Во всех сравнениях слева — более старшая традиция, справа — более молодая; у каждой стороны — цитаты из её собственного перевода Библии.</p>\n    <p class=\"note\"><b>Сокращения:</b> ПНМ — «Перевод нового мира» (Библия Свидетелей Иеговы, 2021); Синод. — Синодальный перевод (1876); С. М. — год от сотворения мира; Р. Х. — Рождество Христово. Счёт возвещателей и верующих ведётся по-разному, поэтому числа не сравниваются напрямую.</p>\n    <div class=\"scale\">\n      <div class=\"o\"><span class=\"tag\">Православие</span><b>≈ 2000 лет</b><span>от Пятидесятницы; себя возводят к «Церкви от Авеля праведного»</span></div>\n      <div class=\"j\"><span class=\"tag\">Свидетели Иеговы</span><b>≈ 150 лет</b><span>как организация, с 1870-х; себя возводят к «свидетелям» от Авеля</span></div>\n      <div class=\"o\"><b>≈ 260 млн</b><span>крещёных и считающих себя православными (Pew, 2017)</span></div>\n      <div class=\"j\"><b>≈ 9,2 млн</b><span>возвещателей; на Вечере воспоминания — 20,6 млн (отчёт 2025)</span></div>\n    </div>\n  "
- id: "history"
  html: "\n    <p class=\"eyebrow\">1 · История</p>\n    <h2>Исторический масштаб</h2>\n    <div class=\"card\">\n      <h3>От сотворения мира: религии на одной шкале</h3>\n      <p class=\"note\">Счёт лет по византийской эре, принятой в православной традиции: сотворение мира — 5508 год до н. э., сейчас идёт 7535 год. Шкала слева — годы от сотворения мира (С. М.). <b>Сплошные полосы</b> — история православной Церкви (с Пятидесятницы) и организации Свидетелей Иеговы (с 1870-х). <b>Пунктир</b> — преемственность, которую каждая сторона видит за собой: православные говорят о «Церкви от Авеля праведного», Свидетели — об «облаке свидетелей», начиная с Авеля (Евр 11:4; 12:1).</p>\n      <div class=\"svgwrap\"><svg class=\"tl-svg tall\" viewBox=\"0 0 360 1139\" role=\"img\" aria-label=\"Шкала от сотворения мира по византийской эре (5508 до н. э.) до 2026 года с религиями и конфессиями. Сплошные полосы — история православной Церкви и организации Свидетелей Иеговы, пунктир — преемственность, которую каждая сторона возводит к Авелю. До Рождества Христова — Ветхий Завет, после — Новый Завет\"><path d=\"M22 24.0 L16 24.0 L16 751.1 L22 751.1\" class=\"brk\"></path><text x=\"11\" y=\"387.5\" text-anchor=\"middle\" class=\"era\" transform=\"rotate(-90 11 387.5)\">Ветхий Завет</text><path d=\"M22 759.1 L16 759.1 L16 1024.0 L22 1024.0\" class=\"brk nz\"></path><text x=\"11\" y=\"891.5\" text-anchor=\"middle\" class=\"era nz\" transform=\"rotate(-90 11 891.5)\">Новый Завет</text><line x1=\"67\" y1=\"156.6\" x2=\"77\" y2=\"156.6\" class=\"axis\"></line><text x=\"62\" y=\"160.6\" class=\"tick\" text-anchor=\"end\">1000</text><line x1=\"67\" y1=\"289.3\" x2=\"77\" y2=\"289.3\" class=\"axis\"></line><text x=\"62\" y=\"293.3\" class=\"tick\" text-anchor=\"end\">2000</text><line x1=\"67\" y1=\"422.1\" x2=\"77\" y2=\"422.1\" class=\"axis\"></line><text x=\"62\" y=\"426.1\" class=\"tick\" text-anchor=\"end\">3000</text><line x1=\"67\" y1=\"554.8\" x2=\"77\" y2=\"554.8\" class=\"axis\"></line><text x=\"62\" y=\"558.8\" class=\"tick\" text-anchor=\"end\">4000</text><line x1=\"67\" y1=\"687.5\" x2=\"77\" y2=\"687.5\" class=\"axis\"></line><text x=\"62\" y=\"691.5\" class=\"tick\" text-anchor=\"end\">5000</text><line x1=\"67\" y1=\"820.3\" x2=\"77\" y2=\"820.3\" class=\"axis\"></line><text x=\"62\" y=\"824.3\" class=\"tick\" text-anchor=\"end\">6000</text><line x1=\"67\" y1=\"953.0\" x2=\"77\" y2=\"953.0\" class=\"axis\"></line><text x=\"62\" y=\"957.0\" class=\"tick\" text-anchor=\"end\">7000</text><text x=\"62\" y=\"16\" class=\"tick\" text-anchor=\"end\">от С. М.</text><line x1=\"58\" y1=\"755.1\" x2=\"77\" y2=\"755.1\" class=\"axis strong\"></line><text x=\"54\" y=\"771.1\" class=\"tick b\" text-anchor=\"end\">Р. Х.</text><line x1=\"72\" y1=\"24\" x2=\"72\" y2=\"1024.0\" class=\"axis\"></line><line x1=\"66\" y1=\"41.1\" x2=\"66\" y2=\"759.3\" class=\"dash-o\"></line><line x1=\"78\" y1=\"41.1\" x2=\"78\" y2=\"1004.4\" class=\"dash-j\"></line><rect x=\"63\" y=\"759.3\" width=\"6\" height=\"264.7\" rx=\"3\" class=\"bar-o\"></rect><rect x=\"75\" y=\"1004.4\" width=\"6\" height=\"19.6\" rx=\"3\" class=\"bar-j\"></rect><path d=\"M76 24.0 L94 24.0 L106 23.0 L114 23.0\" class=\"lead\"></path><circle cx=\"72\" cy=\"24.0\" r=\"4\" class=\"cf-dot n\"></circle><text x=\"116\" y=\"28.0\" class=\"mname\">Сотворение мира</text><text x=\"116\" y=\"43.0\" class=\"msub\">5508 до н. э. · 1 год от С. М.</text><path d=\"M76 41.1 L94 41.1 L106 59.0 L114 59.0\" class=\"lead\"></path><circle cx=\"72\" cy=\"41.1\" r=\"4\" class=\"cf-dot n\"></circle><text x=\"116\" y=\"64.0\" class=\"mname\">Авель</text><text x=\"116\" y=\"79.0\" class=\"msub\">начало преемственности для обеих сторон</text><path d=\"M76 321.5 L94 321.5 L106 320.5 L114 320.5\" class=\"lead\"></path><circle cx=\"72\" cy=\"321.5\" r=\"4\" class=\"cf-dot n\"></circle><text x=\"116\" y=\"325.5\" class=\"mname\">Всемирный потоп</text><text x=\"116\" y=\"340.5\" class=\"msub\">2242 от С. М. (по Септуагинте)</text><path d=\"M76 489.6 L94 489.6 L106 488.6 L114 488.6\" class=\"lead\"></path><circle cx=\"72\" cy=\"489.6\" r=\"4\" class=\"cf-dot n\"></circle><text x=\"116\" y=\"493.6\" class=\"mname\">Авраам</text><text x=\"116\" y=\"508.6\" class=\"msub\">ок. 2000 до н. э.</text><path d=\"M76 556.0 L94 556.0 L106 555.0 L114 555.0\" class=\"lead\"></path><circle cx=\"72\" cy=\"556.0\" r=\"5\" class=\"cf-dot e\"></circle><rect x=\"112\" y=\"545.0\" width=\"74\" height=\"20\" rx=\"10\" class=\"chip e\"></rect><text x=\"119\" y=\"560.0\" class=\"cname e\">Индуизм</text><text x=\"116\" y=\"575.0\" class=\"msub\">ок. 1500 до н. э. · ведийская религия</text><path d=\"M76 589.2 L94 589.2 L106 591.0 L114 591.0\" class=\"lead\"></path><circle cx=\"72\" cy=\"589.2\" r=\"5\" class=\"cf-dot ju\"></circle><rect x=\"112\" y=\"581.0\" width=\"74\" height=\"20\" rx=\"10\" class=\"chip ju\"></rect><text x=\"119\" y=\"596.0\" class=\"cname ju\">Иудаизм</text><text x=\"116\" y=\"611.0\" class=\"msub\">ок. XIII в. до н. э. · Моисей, Синай</text><path d=\"M76 688.7 L94 688.7 L106 687.7 L114 687.7\" class=\"lead\"></path><circle cx=\"72\" cy=\"688.7\" r=\"5\" class=\"cf-dot e\"></circle><rect x=\"112\" y=\"677.7\" width=\"207\" height=\"20\" rx=\"10\" class=\"chip e\"></rect><text x=\"119\" y=\"692.7\" class=\"cname e\">Буддизм · конфуцианство</text><text x=\"116\" y=\"707.7\" class=\"msub\">ок. V в. до н. э.</text><path d=\"M76 759.3 L94 759.3 L106 758.3 L114 758.3\" class=\"lead\"></path><circle cx=\"72\" cy=\"759.3\" r=\"5\" class=\"cf-dot o\"></circle><rect x=\"112\" y=\"748.3\" width=\"116\" height=\"20\" rx=\"10\" class=\"chip o\"></rect><text x=\"119\" y=\"763.3\" class=\"cname o\">Христианство</text><text x=\"116\" y=\"778.3\" class=\"msub\">ок. 33 г. · Пятидесятница</text><path d=\"M76 835.9 L94 835.9 L106 834.9 L114 834.9\" class=\"lead\"></path><circle cx=\"72\" cy=\"835.9\" r=\"5\" class=\"cf-dot is\"></circle><rect x=\"112\" y=\"824.9\" width=\"58\" height=\"20\" rx=\"10\" class=\"chip is\"></rect><text x=\"119\" y=\"839.9\" class=\"cname is\">Ислам</text><text x=\"116\" y=\"854.9\" class=\"msub\">610 г.</text><path d=\"M76 894.9 L94 894.9 L106 893.9 L114 893.9\" class=\"lead\"></path><circle cx=\"72\" cy=\"894.9\" r=\"5\" class=\"cf-dot o\"></circle><rect x=\"112\" y=\"883.9\" width=\"215\" height=\"20\" rx=\"10\" class=\"chip o\"></rect><text x=\"119\" y=\"898.9\" class=\"cname o\">Православие · Католицизм</text><text x=\"116\" y=\"913.9\" class=\"msub\">1054 г. · разделение Церквей</text><path d=\"M76 956.3 L94 956.3 L106 955.3 L114 955.3\" class=\"lead\"></path><circle cx=\"72\" cy=\"956.3\" r=\"5\" class=\"cf-dot w\"></circle><rect x=\"112\" y=\"945.3\" width=\"124\" height=\"20\" rx=\"10\" class=\"chip w\"></rect><text x=\"119\" y=\"960.3\" class=\"cname w\">Протестантизм</text><text x=\"116\" y=\"975.3\" class=\"msub\">1517 г. · Реформация</text><path d=\"M76 997.9 L94 997.9 L106 996.9 L114 996.9\" class=\"lead\"></path><circle cx=\"72\" cy=\"997.9\" r=\"5\" class=\"cf-dot w\"></circle><rect x=\"112\" y=\"986.9\" width=\"74\" height=\"20\" rx=\"10\" class=\"chip w\"></rect><text x=\"119\" y=\"1001.9\" class=\"cname w\">Мормоны</text><text x=\"116\" y=\"1016.9\" class=\"msub\">1830 г.</text><path d=\"M76 1002.2 L94 1002.2 L106 1032.9 L114 1032.9\" class=\"lead\"></path><circle cx=\"72\" cy=\"1002.2\" r=\"5\" class=\"cf-dot w\"></circle><rect x=\"112\" y=\"1022.9\" width=\"99\" height=\"20\" rx=\"10\" class=\"chip w\"></rect><text x=\"119\" y=\"1037.9\" class=\"cname w\">Адвентисты</text><text x=\"116\" y=\"1052.9\" class=\"msub\">1863 г.</text><path d=\"M76 1004.4 L94 1004.4 L106 1068.9 L114 1068.9\" class=\"lead\"></path><circle cx=\"72\" cy=\"1004.4\" r=\"5\" class=\"cf-dot j\"></circle><rect x=\"112\" y=\"1058.9\" width=\"149\" height=\"20\" rx=\"10\" class=\"chip j\"></rect><text x=\"119\" y=\"1073.9\" class=\"cname j\">Свидетели Иеговы</text><text x=\"116\" y=\"1088.9\" class=\"msub\">1870-е · имя с 1931 г.</text><path d=\"M76 1024.0 L94 1024.0 L106 1104.9 L114 1104.9\" class=\"lead\"></path><circle cx=\"72\" cy=\"1024.0\" r=\"4\" class=\"cf-dot n\"></circle><text x=\"116\" y=\"1109.9\" class=\"mname\">Сегодня</text><text x=\"116\" y=\"1124.9\" class=\"msub\">2026 г. · 7535 от С. М.</text></svg></div>\n      <p class=\"note\"><b>Два Завета.</b> Слева на шкале — два периода священной истории. <b>Ветхий Завет</b> — от сотворения мира до Рождества Христова: заветы Бога с Ноем, Авраамом и через Моисея на Синае. <b>Новый Завет</b> начинается с пришествия Христа: «сия чаша есть Новый Завет в Моей крови» (Лк 22:20). Само слово «завет» (евр. <i>берит</i>, греч. <i>диатеке</i>) означает и союз Бога с человеком, и завещание.</p>\n      <p class=\"note\"><b>Здесь тоже есть различие.</b> Для православных Новый Завет заключён со всеми, кто во Христе, поэтому Причастие открыто всем верным. Свидетели Иеговы учат, что участники нового завета — только 144 000 помазанников; поэтому на Вечере воспоминания хлеб и вино вкушают лишь они. Свидетели также называют части Библии «Еврейскими» и «Христианскими Греческими Писаниями».</p>\n      <p class=\"note\">Это церковная хронология по Септуагинте, а не научная датировка; даты ранних событий условны. У Свидетелей своя хронология: сотворение Адама они относят к 4026 году до н. э. Ч. Т. Расселл в юности общался с адвентистами, но разошёлся с ними в ряде учений.</p>\n    </div>\n    <div class=\"card\">\n      <h3>Приближение: последние 2000 лет</h3>\n      <p class=\"note\">Та же шкала, увеличенная на участке от Пятидесятницы до наших дней. Обе полосы — в одном масштабе: вехи православия растянуты на двадцать веков, вехи Свидетелей Иеговы умещаются в последние 7% линии. Коричневая полоса — православие, фиолетовая — Свидетели Иеговы. Фиолетовый пунктир — как Свидетели понимают свою связь с христианами I века.</p>\n      <div class=\"svgwrap\"><svg class=\"tl-svg tall\" viewBox=\"0 0 360 814\" role=\"img\" aria-label=\"Последние 2000 лет в одном масштабе: полоса православия с I века и полоса Свидетелей Иеговы с 1879 года, с основными вехами\"><line x1=\"42\" y1=\"34.0\" x2=\"78\" y2=\"34.0\" class=\"grid\"></line><text x=\"38\" y=\"38.0\" text-anchor=\"end\" class=\"tick\">0</text><line x1=\"42\" y1=\"199.0\" x2=\"78\" y2=\"199.0\" class=\"grid\"></line><text x=\"38\" y=\"203.0\" text-anchor=\"end\" class=\"tick\">500</text><line x1=\"42\" y1=\"364.0\" x2=\"78\" y2=\"364.0\" class=\"grid\"></line><text x=\"38\" y=\"368.0\" text-anchor=\"end\" class=\"tick\">1000</text><line x1=\"42\" y1=\"529.0\" x2=\"78\" y2=\"529.0\" class=\"grid\"></line><text x=\"38\" y=\"533.0\" text-anchor=\"end\" class=\"tick\">1500</text><line x1=\"42\" y1=\"694.0\" x2=\"78\" y2=\"694.0\" class=\"grid\"></line><text x=\"38\" y=\"698.0\" text-anchor=\"end\" class=\"tick\">2000</text><rect x=\"47\" y=\"44.9\" width=\"10\" height=\"657.7\" rx=\"5\" class=\"bar-o\"></rect><rect x=\"65\" y=\"654.1\" width=\"10\" height=\"48.5\" rx=\"5\" class=\"bar-j\"></rect><line x1=\"70\" y1=\"44.9\" x2=\"70\" y2=\"654.1\" class=\"dash-j\"></line><path d=\"M58 44.9 L86 44.9 L98 44.9 L104 44.9\" class=\"lead\"></path><circle cx=\"52\" cy=\"44.9\" r=\"3\" class=\"dot\"></circle><text x=\"108\" y=\"48.9\" class=\"mname o\">Пятидесятница</text><text x=\"108\" y=\"61.9\" class=\"msub\">ок. 33 · рождение Церкви</text><path d=\"M58 141.2 L86 141.2 L98 141.2 L104 141.2\" class=\"lead\"></path><circle cx=\"52\" cy=\"141.2\" r=\"3\" class=\"dot\"></circle><text x=\"108\" y=\"145.2\" class=\"mname o\">I Вселенский собор</text><text x=\"108\" y=\"158.2\" class=\"msub\">325 · Никейский Символ веры</text><path d=\"M58 293.7 L86 293.7 L98 293.7 L104 293.7\" class=\"lead\"></path><circle cx=\"52\" cy=\"293.7\" r=\"3\" class=\"dot\"></circle><text x=\"108\" y=\"297.7\" class=\"mname o\">VII Вселенский собор</text><text x=\"108\" y=\"310.7\" class=\"msub\">787 · иконопочитание</text><path d=\"M58 360.0 L86 360.0 L98 360.0 L104 360.0\" class=\"lead\"></path><circle cx=\"52\" cy=\"360.0\" r=\"3\" class=\"dot\"></circle><text x=\"108\" y=\"364.0\" class=\"mname o\">Крещение Руси</text><text x=\"108\" y=\"377.0\" class=\"msub\">988</text><path d=\"M58 381.8 L86 381.8 L98 392.0 L104 392.0\" class=\"lead\"></path><circle cx=\"52\" cy=\"381.8\" r=\"3\" class=\"dot\"></circle><text x=\"108\" y=\"396.0\" class=\"mname o\">Разделение с Римом</text><text x=\"108\" y=\"409.0\" class=\"msub\">1054</text><path d=\"M58 513.5 L86 513.5 L98 513.5 L104 513.5\" class=\"lead\"></path><circle cx=\"52\" cy=\"513.5\" r=\"3\" class=\"dot\"></circle><text x=\"108\" y=\"517.5\" class=\"mname o\">Падение Константинополя</text><text x=\"108\" y=\"530.5\" class=\"msub\">1453</text><path d=\"M76 654.1 L86 654.1 L98 654.1 L104 654.1\" class=\"lead\"></path><circle cx=\"70\" cy=\"654.1\" r=\"3\" class=\"dot\"></circle><text x=\"108\" y=\"658.1\" class=\"mname j\">«Сторожевая башня»</text><text x=\"108\" y=\"671.1\" class=\"msub\">1879 · Ч. Т. Расселл</text><path d=\"M76 665.6 L86 665.6 L98 686.1 L104 686.1\" class=\"lead\"></path><circle cx=\"70\" cy=\"665.6\" r=\"3\" class=\"dot\"></circle><text x=\"108\" y=\"690.1\" class=\"mname j\">Ключевая дата СИ</text><text x=\"108\" y=\"703.1\" class=\"msub\">1914 · «невидимое воцарение»</text><path d=\"M76 671.2 L86 671.2 L98 718.1 L104 718.1\" class=\"lead\"></path><circle cx=\"70\" cy=\"671.2\" r=\"3\" class=\"dot\"></circle><text x=\"108\" y=\"722.1\" class=\"mname j\">Имя «Свидетели Иеговы»</text><text x=\"108\" y=\"735.1\" class=\"msub\">1931</text><path d=\"M76 681.1 L86 681.1 L98 750.1 L104 750.1\" class=\"lead\"></path><circle cx=\"70\" cy=\"681.1\" r=\"3\" class=\"dot\"></circle><text x=\"108\" y=\"754.1\" class=\"mname j\">Полный «Перевод нового мира»</text><text x=\"108\" y=\"767.1\" class=\"msub\">1961</text><path d=\"M76 702.6 L86 702.6 L98 782.1 L104 782.1\" class=\"lead\"></path><circle cx=\"70\" cy=\"702.6\" r=\"3\" class=\"dot\"></circle><text x=\"108\" y=\"786.1\" class=\"mname n\">Сегодня</text><text x=\"108\" y=\"799.1\" class=\"msub\">2026</text></svg></div>\n    </div>\n    <div class=\"card\">\n      <h3>Как Свидетели называют себя христианами, если появились недавно?</h3>\n      <p class=\"note\">Обе стороны считают себя продолжением веры I века, но понимают преемственность по-разному.</p>\n      <div class=\"duo\">\n        <div class=\"pos o\"><span class=\"who\">Православие</span><p class=\"thesis\">Преемственность общины</p><ul>\n          <li>Церковь — одно живое тело, которое не прерывалось с Пятидесятницы: «врата ада не одолеют её» (Мф 16:18)</li>\n          <li>Вера передаётся вместе с рукоположением от апостолов к епископам: «возложив на них руки» (Деян 13:3; 1 Тим 4:14)</li>\n          <li>Праведники Ветхого Завета — тоже члены Церкви: «Церковь от Авеля праведного» (блж. Августин)</li>\n          <li>Отсюда вывод: община, возникшая в XIX веке, не может быть той же Церковью</li></ul></div>\n        <div class=\"pos j\"><span class=\"who\">Свидетели Иеговы</span><p class=\"thesis\">Преемственность учения</p><ul>\n          <li><span class=\"ref\">Ис 43:10</span> «Вы мои свидетели, — говорит Иегова»: служители Бога были всегда</li>\n          <li><span class=\"ref\">Евр 12:1</span> «нас окружает такое большое облако свидетелей» — начиная с Авеля (Евр 11:4)</li>\n          <li><span class=\"ref\">Откр 3:14</span> сам Иисус — «преданный и надёжный свидетель»</li>\n          <li><span class=\"ref\">Мф 13:30</span> «Пусть растут вместе до жатвы»: истинные христиане веками жили среди «сорняков», а в 1870-х их учение было восстановлено</li></ul></div>\n      </div>\n      <p class=\"crux\"><b>Суть:</b> для православных христианство проверяется непрерывностью Церкви от апостолов. Для Свидетелей — соответствием учения Библии, а не возрастом организации. Поэтому одни видят на шкале 150 лет, другие — продолжение веры христиан I века.</p>\n    </div>\n    <p class=\"note\">Свидетели не считают себя «новой» традицией: по их взгляду, они восстанавливают веру христиан I века. Православие видит в непрерывной преемственности главный признак истинности.</p>\n  "
- id: "sources"
  html: "\n    <p class=\"eyebrow\">2 · Источники авторитета</p>\n    <h2>Писание, Предание и толкование</h2>\n    <div class=\"duo\"><div class=\"pos o\">\n      <span class=\"who\">Православие</span>\n      <p class=\"thesis\">Священное Писание + Священное Предание</p>\n      <ul><li>Библия (Ветхий Завет по Септуагинте)</li><li>Постановления Вселенских соборов</li><li>Труды Отцов Церкви</li><li>Литургия, гимнография, каноны, иконы</li></ul>\n    </div><div class=\"pos j\">\n      <span class=\"who\">Свидетели Иеговы</span>\n      <p class=\"thesis\">Только Библия — в толковании организации</p>\n      <ul><li>Библия, «Перевод нового мира»</li><li>Разъяснения Руководящего совета</li><li>«Сторожевая башня», «Пробудитесь!», книги и брошюры</li><li>Церковное Предание не признаётся</li></ul>\n    </div></div>\n    <figure class=\"flow\">\n      <figcaption class=\"fl-title\">Как стих становится учением: на примере Ин 1:1</figcaption>\n      <div class=\"fl-grid\">\n        <div class=\"fl-head o\">Православие</div><div class=\"fl-head j\">Свидетели Иеговы</div>\n        <div class=\"fl-step o\"><span class=\"fl-n\">1</span><div><b>Писание</b><p>Ин 1:1 — «и Слово было Бог»</p></div></div>\n        <div class=\"fl-step j\"><span class=\"fl-n\">1</span><div><b>Писание</b><p>Ин 1:1 (ПНМ) — «Слово… было богом»</p></div></div>\n<div class=\"fl-step o\"><span class=\"fl-n\">2</span><div><b>Святые Отцы</b><p>Свт. Афанасий Великий (IV в.): Сын не сотворён, Он единосущен Отцу</p></div></div>\n        <div class=\"fl-step j\"><span class=\"fl-n\">2</span><div><b>Руководящий совет</b><p>«Верный и благоразумный раб», поставленный «давать пищу вовремя» (Мф 24:45), готовит толкование</p></div></div>\n<div class=\"fl-step o\"><span class=\"fl-n\">3</span><div><b>Собор</b><p>Никея, 325: «Бога истинна от Бога истинна… несотворенна, единосущна Отцу»</p></div></div>\n        <div class=\"fl-step j\"><span class=\"fl-n\">3</span><div><b>Публикации</b><p>«Сторожевая башня» и книги для изучения излагают это толкование</p></div></div>\n<div class=\"fl-step o\"><span class=\"fl-n\">4</span><div><b>Литургия</b><p>Символ веры поют всей церковью на каждой литургии</p></div></div>\n        <div class=\"fl-step j\"><span class=\"fl-n\">4</span><div><b>Собрание</b><p>Одна и та же тема изучается во всех собраниях мира в одну неделю</p></div></div>\n        <div class=\"fl-out o\"><span class=\"eyebrow\">Итог</span><b>Христос — Бог</b><p>Проверка: вера Церкви «повсюду, всегда и все»</p></div>\n        <div class=\"fl-out j\"><span class=\"eyebrow\">Итог</span><b>Иисус — «бог», первое творение</b><p>Проверка: соответствие Писанию — «проверяя, верно ли то, что им говорят» (Деян 17:11); совет не считается непогрешимым</p></div>\n      </div>\n      <p class=\"note\">Один и тот же стих проходит разный путь. В православии толкование складывается веками и много раз подтверждается: Отцами, соборами, молитвой всей Церкви. У Свидетелей оно готовится одним центром, одинаково для всех, и может уточняться по мере того, как понимание становится «всё ярче» (Притч 4:18).</p>\n    </figure>\n    <details class=\"topic\" open>\n      <summary><h3>Что такое Священное Предание</h3></summary>\n      <div class=\"body\">\n        <p>Живая вера Церкви, передаваемая от апостолов из поколения в поколение. Писание — её записанная часть, а не отдельный источник.</p>\n        <blockquote>«Итак, братия, стойте и держите предания, которым вы научены или словом, или посланием нашим».<cite>2 Фессалоникийцам 2:15</cite></blockquote>\n        <p><b>Только ли устное?</b> Начиналось Предание как устная проповедь апостолов: Евангелия и послания записали не сразу, а общины уже жили верой, крещением и Евхаристией. Но это не «тайные устные легенды»: со временем Предание зафиксировано письменно — в Символе веры, решениях соборов, трудах Отцов, текстах богослужения — и живёт в практике Церкви.</p>\n        <p><b>Из чего состоит:</b> Символ веры (325 и 381 гг.), догматы и правила соборов, творения святых Отцов, литургия, иконы и жития святых. Сам состав Нового Завета из 27 книг впервые перечислил свт. Афанасий Великий в 367 году.</p>\n        <p><b>Критерий подлинности</b> (Викентий Лиринский, V век): то, во что верили «повсюду, всегда и все».</p>\n        <p><b style=\"color:var(--j)\">Взгляд Свидетелей:</b> Предание — это «человеческие традиции», о которых Иисус сказал: «Вы строго соблюдаете человеческие традиции, а заповеди Бога отвергаете» (Мк 7:8, ПНМ); авторитетно только Писание.</p>\n      </div>\n    </details>\n  "
- id: "common"
  html: "\n    <p class=\"eyebrow\">3 · Сравнение</p>\n    <h2>Что совпадает и что различается</h2>\n    <div class=\"cm-ratio\" role=\"img\" aria-label=\"10 совпадений и 25 различий\">\n      <div class=\"cm-bar\"><span class=\"s\" style=\"width:29%\"></span><span class=\"d\" style=\"width:71%\"></span></div>\n      <div class=\"cm-legend\"><span><b>10</b> совпадает</span><span><b>25</b> различается</span></div>\n    </div>\n    <div class=\"cm\">\n      <div class=\"cm-head\"><span class=\"o\">Православие</span><span class=\"j\">Свидетели Иеговы</span></div>\n      <h3 class=\"cm-group s\">✓ Совпадает</h3>\n      <div class=\"cm-row\"><span class=\"cm-topic\">Библия</span><div class=\"cm-same\"><span class=\"cm-ico\">✓</span>Богодухновенное Слово Божие (2 Тим 3:16)</div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Бог</span><div class=\"cm-same\"><span class=\"cm-ico\">✓</span>Один Бог — Творец неба и земли</div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Иисус</span><div class=\"cm-same\"><span class=\"cm-ico\">✓</span>Мессия, Сын Божий, Спаситель, рождён от Девы Марии</div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Жертва</span><div class=\"cm-same\"><span class=\"cm-ico\">✓</span>Смерть Христа — выкуп, искупление грехов</div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Воскресение</span><div class=\"cm-same\"><span class=\"cm-ico\">✓</span>Христос воскрес; будет воскресение мёртвых</div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Будущее</span><div class=\"cm-same\"><span class=\"cm-ico\">✓</span>Суд, Царство Божие и конец нынешнего зла</div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Крещение</span><div class=\"cm-same\"><span class=\"cm-ico\">✓</span>Через погружение в воду</div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Молитва</span><div class=\"cm-same\"><span class=\"cm-ico\">✓</span>«Отче наш» как образец молитвы</div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Мораль</span><div class=\"cm-same\"><span class=\"cm-ico\">✓</span>Десять заповедей, верность в браке, честность</div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Проповедь</span><div class=\"cm-same\"><span class=\"cm-ico\">✓</span>Долг нести Евангелие всем народам (Мф 28:19–20)</div></div>\n      <h3 class=\"cm-group d\">≠ Различается</h3>\n      <p class=\"cm-sub\">Учение</p>\n<div class=\"cm-row\"><span class=\"cm-topic\">Бог</span><div class=\"cm-pair\"><div class=\"cm-o\">Троица: Отец, Сын и Святой Дух — один Бог</div><div class=\"cm-j\">Одна Личность — Иегова; Троицы нет</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Имя Бога</span><div class=\"cm-pair\"><div class=\"cm-o\">«Господь», «Сущий»</div><div class=\"cm-j\">«Иегова» — имя, которое важно знать и прославлять (Мф 6:9)</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Иисус</span><div class=\"cm-pair\"><div class=\"cm-o\">Истинный Бог, не сотворён</div><div class=\"cm-j\">Первое творение Бога, архангел Михаил</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Святой Дух</span><div class=\"cm-pair\"><div class=\"cm-o\">Лицо Троицы, Бог</div><div class=\"cm-j\">Действующая сила Бога</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Молитва Христу</span><div class=\"cm-pair\"><div class=\"cm-o\">Да, Христу молятся как Богу</div><div class=\"cm-j\">Нет, молятся только Иегове</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Воскресение Христа</span><div class=\"cm-pair\"><div class=\"cm-o\">В том же, прославленном теле</div><div class=\"cm-j\">Воскрешён как дух</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Орудие казни</span><div class=\"cm-pair\"><div class=\"cm-o\">Крест</div><div class=\"cm-j\">Столб</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Душа</span><div class=\"cm-pair\"><div class=\"cm-o\">Бессмертна по благодати</div><div class=\"cm-j\">Смертна; мёртвые не существуют</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Ад</span><div class=\"cm-pair\"><div class=\"cm-o\">Вечная мука для нераскаянных</div><div class=\"cm-j\">Нет; нераскаянные уничтожаются</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Небо и земля</span><div class=\"cm-pair\"><div class=\"cm-o\">Одно Царство для всех спасённых; небо и земля обновятся и соединятся</div><div class=\"cm-j\">144 000 — на небе, остальные — на этой Земле, ставшей раем</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Второе пришествие</span><div class=\"cm-pair\"><div class=\"cm-o\">Видимое, в будущем; сроки не открыты</div><div class=\"cm-j\">Невидимо началось в 1914 году</div></div></div>\n<p class=\"cm-sub\">Авторитет</p>\n<div class=\"cm-row\"><span class=\"cm-topic\">Канон</span><div class=\"cm-pair\"><div class=\"cm-o\">66 книг + неканонические книги ВЗ</div><div class=\"cm-j\">66 книг</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Перевод</span><div class=\"cm-pair\"><div class=\"cm-o\">Церковнославянский, Синодальный</div><div class=\"cm-j\">«Перевод нового мира»</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Предание</span><div class=\"cm-pair\"><div class=\"cm-o\">Авторитетно вместе с Писанием</div><div class=\"cm-j\">Отвергается как «человеческие традиции» (Мк 7:8)</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Толкует</span><div class=\"cm-pair\"><div class=\"cm-o\">Церковь: Отцы и соборы</div><div class=\"cm-j\">Руководящий совет</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Учение со временем</span><div class=\"cm-pair\"><div class=\"cm-o\">Догматы неизменны</div><div class=\"cm-j\">Уточняется («новый свет»)</div></div></div>\n<p class=\"cm-sub\">Практика</p>\n<div class=\"cm-row\"><span class=\"cm-topic\">Крещение младенцев</span><div class=\"cm-pair\"><div class=\"cm-o\">Да</div><div class=\"cm-j\">Нет — только сознательно, после изучения Библии</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Причастие</span><div class=\"cm-pair\"><div class=\"cm-o\">На каждой литургии, для всех верных</div><div class=\"cm-j\">Раз в год; вкушают только 144 000</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Таинства</span><div class=\"cm-pair\"><div class=\"cm-o\">Семь Таинств</div><div class=\"cm-j\">Только крещение и Вечеря</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Иконы и крест</span><div class=\"cm-pair\"><div class=\"cm-o\">Почитаются</div><div class=\"cm-j\">Отвергаются как идолопоклонство</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Праздники</span><div class=\"cm-pair\"><div class=\"cm-o\">Пасха, Рождество, годовой круг</div><div class=\"cm-j\">Не отмечают из-за языческих корней, как и дни рождения; отмечают воспоминание смерти Христа</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Пост</span><div class=\"cm-pair\"><div class=\"cm-o\">Многодневные посты, среда и пятница</div><div class=\"cm-j\">Нет</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Духовенство</span><div class=\"cm-pair\"><div class=\"cm-o\">Епископы, священники, монашество</div><div class=\"cm-j\">Нет; собрания ведут старейшины</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Кровь</span><div class=\"cm-pair\"><div class=\"cm-o\">Переливание допускается</div><div class=\"cm-j\">Отказ от переливания; бескровное лечение, фракции крови — по совести</div></div></div>\n<div class=\"cm-row\"><span class=\"cm-topic\">Государство</span><div class=\"cm-pair\"><div class=\"cm-o\">Армия и присяга допустимы</div><div class=\"cm-j\">Нейтралитет: без армии и выборов; налоги и уважение к власти (Рим 13:1)</div></div></div>\n    </div>\n    <p class=\"note\">Общий словарь есть, но за одними словами часто стоит разное содержание. Подробные аргументы по учению — в разделе «Богословие».</p>\n  "
- id: "theology"
  html: "<p class=\"eyebrow\">4 · Богословские расхождения</p><h2>Аргументы обеих сторон</h2><p class=\"intro\">Двенадцать главных вопросов. Слева — православная позиция, справа — позиция Свидетелей Иеговы, с местами Писания, на которые ссылается каждая сторона. Под ними — где именно проходит спор.</p>"
- id: "literature"
  html: "\n    <p class=\"eyebrow\">5 · Литература</p>\n    <h2>Литература двух традиций</h2>\n    <p class=\"intro\">Две разные модели. Православная библиотека копится веками: старые тексты не отменяются, к ним добавляются новые. У Свидетелей — единый корпус материалов, который обновляется и переводится на языки всего мира.</p>\n    <div class=\"duo\">\n      <div class=\"pos o\"><span class=\"who\">Православие</span><p class=\"thesis\">Накопленное наследие</p>\n        <div class=\"lit\"><b>7 000+</b><span>сочинений греческих Отцов I–VIII веков (каталог Clavis Patrum Graecorum)</span></div>\n        <div class=\"lit\"><b>378 томов</b><span>патрологии Миня (XIX век): 161 греческий и 217 латинских</span></div>\n        <div class=\"lit\"><b>75 томов</b><span>«Православной энциклопедии» (2000–2025)</span></div>\n        <div class=\"lit\"><b>25 800+</b><span>трудов в онлайн-библиотеке «Азбука веры»</span></div>\n        <p class=\"small\">Всего — десятки тысяч сочинений на греческом, латыни, сирийском, славянском и других языках. Для чтения многих нужны знание языков и истории.</p>\n      </div>\n      <div class=\"pos j\"><span class=\"who\">Свидетели Иеговы</span><p class=\"thesis\">Единые и доступные материалы</p>\n        <div class=\"lit\"><b>1 000+</b><span>языков на jw.org (с 2019 года)</span></div>\n        <div class=\"lit\"><b>1 издатель</b><span>одинаковые материалы для собраний всего мира</span></div>\n        <div class=\"lit\"><b>Бесплатно</b><span>публикации и приложение JW Library, издаются на пожертвования</span></div>\n        <div class=\"lit\"><b>Просто</b><span>современный язык, практические темы: изучение Библии, семья, проповедь</span></div>\n        <p class=\"small\">Материалы обновляются по мере уточнения понимания; авторы публикаций не указываются.</p>\n      </div>\n    </div>\n    <p class=\"note\">Объём здесь — не мера истины. Традиции решают разные задачи: одна хранит многовековое наследие, другая стремится сделать своё учение понятным каждому на его родном языке.</p>\n  "
- id: "structure"
  html: "\n    <p class=\"eyebrow\">6 · Устройство</p>\n    <h2>Соборность и централизация</h2>\n    <div class=\"duo\"><div class=\"pos o\"><span class=\"who\">Православие</span><ul><li>Семья самостоятельных поместных Церквей</li><li>Епископат и апостольское преемство</li><li>Решения — через Синоды и Соборы</li><li>Патриарх Константинопольский — «первый среди равных», без власти над другими Церквами. Титул «Вселенский» исторический, византийский (с VI века): «вселенной» (греч. <i>ойкумена</i>) тогда называли Римскую империю, а Константинополь был её столицей. В том же смысле и соборы названы «Вселенскими»</li></ul></div><div class=\"pos j\"><span class=\"who\">Свидетели Иеговы</span><ul><li>Руководящий совет — единый центр учения</li><li>Штаб-квартира в Уорике (США), до 2017 года — Бруклин</li><li>Единые материалы для всех собраний мира</li><li>Единое понимание для всех собраний (1 Кор 1:10); глава собрания — Христос (Еф 5:23)</li><li>За серьёзные проступки без раскаяния и отход от учения — исключение из собрания</li></ul></div></div>\n    <figure class=\"dgwrap\"><svg class=\"dg\" viewBox=\"0 0 360 228\" role=\"img\" aria-label=\"Схема: православие — сеть равных поместных Церквей без главной, решающих вопросы на Соборах, глава Церкви — Христос; Свидетели Иеговы — пирамида: Руководящий совет, филиалы, собрания, возвещатели\"><line x1=\"180\" y1=\"6\" x2=\"180\" y2=\"222\" class=\"div\"></line><text x=\"90\" y=\"18\" text-anchor=\"middle\" class=\"hd o\">Православие</text><text x=\"270\" y=\"18\" text-anchor=\"middle\" class=\"hd j\">Свидетели Иеговы</text><line x1=\"90.0\" y1=\"54.0\" x2=\"138.5\" y2=\"82.0\" class=\"ln-o thin\"></line><line x1=\"90.0\" y1=\"54.0\" x2=\"138.5\" y2=\"138.0\" class=\"ln-o thin\"></line><line x1=\"90.0\" y1=\"54.0\" x2=\"90.0\" y2=\"166.0\" class=\"ln-o thin\"></line><line x1=\"90.0\" y1=\"54.0\" x2=\"41.5\" y2=\"138.0\" class=\"ln-o thin\"></line><line x1=\"90.0\" y1=\"54.0\" x2=\"41.5\" y2=\"82.0\" class=\"ln-o thin\"></line><line x1=\"138.5\" y1=\"82.0\" x2=\"138.5\" y2=\"138.0\" class=\"ln-o thin\"></line><line x1=\"138.5\" y1=\"82.0\" x2=\"90.0\" y2=\"166.0\" class=\"ln-o thin\"></line><line x1=\"138.5\" y1=\"82.0\" x2=\"41.5\" y2=\"138.0\" class=\"ln-o thin\"></line><line x1=\"138.5\" y1=\"82.0\" x2=\"41.5\" y2=\"82.0\" class=\"ln-o thin\"></line><line x1=\"138.5\" y1=\"138.0\" x2=\"90.0\" y2=\"166.0\" class=\"ln-o thin\"></line><line x1=\"138.5\" y1=\"138.0\" x2=\"41.5\" y2=\"138.0\" class=\"ln-o thin\"></line><line x1=\"138.5\" y1=\"138.0\" x2=\"41.5\" y2=\"82.0\" class=\"ln-o thin\"></line><line x1=\"90.0\" y1=\"166.0\" x2=\"41.5\" y2=\"138.0\" class=\"ln-o thin\"></line><line x1=\"90.0\" y1=\"166.0\" x2=\"41.5\" y2=\"82.0\" class=\"ln-o thin\"></line><line x1=\"41.5\" y1=\"138.0\" x2=\"41.5\" y2=\"82.0\" class=\"ln-o thin\"></line><circle cx=\"90.0\" cy=\"54.0\" r=\"13\" class=\"bo\"></circle><circle cx=\"138.5\" cy=\"82.0\" r=\"13\" class=\"bo\"></circle><circle cx=\"138.5\" cy=\"138.0\" r=\"13\" class=\"bo\"></circle><circle cx=\"90.0\" cy=\"166.0\" r=\"13\" class=\"bo\"></circle><circle cx=\"41.5\" cy=\"138.0\" r=\"13\" class=\"bo\"></circle><circle cx=\"41.5\" cy=\"82.0\" r=\"13\" class=\"bo\"></circle><text x=\"90\" y=\"114\" text-anchor=\"middle\" class=\"t b\" font-size=\"11\">Собор</text><text x=\"90\" y=\"200\" text-anchor=\"middle\" class=\"cap\">все Церкви равны, главной нет;</text><text x=\"90\" y=\"214\" text-anchor=\"middle\" class=\"cap\">Глава Церкви — Христос</text><polygon points=\"270.0,48 270.0,48 290.5,82 249.5,82\" class=\"sj_fill\"></polygon><polygon points=\"249.5,82 290.5,82 311.0,116 229.0,116\" class=\"bj\"></polygon><text x=\"270\" y=\"103.0\" text-anchor=\"middle\" class=\"t b\" font-size=\"11\">филиалы</text><polygon points=\"229.0,116 311.0,116 331.5,150 208.5,150\" class=\"bj\"></polygon><text x=\"270\" y=\"137.0\" text-anchor=\"middle\" class=\"t\" font-size=\"11\">собрания</text><polygon points=\"208.5,150 331.5,150 352.0,184 188.0,184\" class=\"bj\"></polygon><text x=\"270\" y=\"171.0\" text-anchor=\"middle\" class=\"t\" font-size=\"11\">возвещатели</text><text x=\"270\" y=\"40\" text-anchor=\"middle\" class=\"t b\" font-size=\"11\">Руководящий совет (11)</text><text x=\"270\" y=\"200\" text-anchor=\"middle\" class=\"cap\">единый центр,</text><text x=\"270\" y=\"214\" text-anchor=\"middle\" class=\"cap\">указания сверху вниз</text></svg><figcaption>Схема: соборность и централизация</figcaption></figure>\n  "
- id: "dynamics"
  html: "\n    <p class=\"eyebrow\">7 · Развитие учения</p>\n    <h2>Неизменность и «новый свет»</h2>\n    <div class=\"duo\"><div class=\"pos o\"><span class=\"who\">Православие</span><p class=\"thesis\">Догматы окончательны</p><p>Догматы Вселенских соборов не пересматриваются. Но вера не «застыла»: когда возникает новый вопрос или спор, Церковь находит для той же веры более точные слова. Принцип Викентия Лиринского (V век): «говоря по-новому, не говори нового».</p>\n        <ul class=\"timeline tl-o\">\n          <li><b>325</b> — спор с Арием: Сын «единосущен» Отцу</li>\n          <li><b>451</b> — Халкидон: во Христе две природы, Бог и человек</li>\n          <li><b>681</b> — две воли во Христе (Максим Исповедник)</li>\n          <li><b>787</b> — иконопочитание как следствие Боговоплощения</li>\n          <li><b>XIV век</b> — Григорий Палама: сущность и энергии Бога, основа учения об обожении</li>\n          <li><b>XX век</b> — богословие русской эмиграции: Флоровский, Лосский, Шмеман</li>\n        </ul>\n        <p class=\"small\">Каждое новое определение не отменяет прежнее, а объясняет его. Поэтому древние труды остаются авторитетными и сегодня.</p></div><div class=\"pos j\"><span class=\"who\">Свидетели Иеговы</span><p class=\"thesis\">Понимание уточняется</p><p>Понимание становится «всё ярче и ярче» (Притч 4:18, ПНМ), поэтому прежние толкования заменяются новыми, а старые публикации выходят из употребления.</p></div></div>\n    <div class=\"rows\">\n      <div class=\"row\"><h3>Что пересматривалось</h3>\n        <ul class=\"timeline tl-j\">\n          <li><b>1874</b> — по расчётам Расселла, началось «невидимое присутствие» Христа; позже эту дату заменил 1914 год</li>\n          <li><b>1914</b> — ожидался конец нынешнего мира; позже — дата невидимого воцарения Христа</li>\n          <li><b>1925</b> — «Миллионы ныне живущих никогда не умрут» (Рутерфорд): ожидалось воскресение патриархов</li>\n          <li><b>1945</b> — запрет на переливание крови; позднее допущены фракции крови по совести</li>\n          <li><b>1952</b> — отменено осуждение прививок</li>\n          <li><b>1975</b> — ожидания, связанные с концом 6000 лет истории</li>\n        </ul>\n      </div>\n    </div>\n    <div class=\"textdiff\">\n      <p class=\"eyebrow\">Как оценивают эти пересмотры</p>\n      <div class=\"duo\">\n        <div class=\"pos o\"><span class=\"who\">Православные полемисты</span><p class=\"thesis\">Несбывшиеся предсказания</p><ul>\n          <li><span class=\"ref\">Втор 18:22</span> «если пророк скажет именем Господа, но слово то не сбудется… то не Господь говорил сие»</li>\n          <li><span class=\"ref\">Мф 24:36</span> «о дне же том и часе никто не знает» — даты вообще не стоило называть</li>\n          <li>Организация называет себя каналом, через который Бог даёт понимание, поэтому её ошибки — не частное мнение отдельных людей</li>\n          <li>Каждое новое толкование обязательно для всех, а прежнее при этом отменяется</li></ul></div>\n        <div class=\"pos j\"><span class=\"who\">Свидетели Иеговы</span><p class=\"thesis\">Уточнение понимания</p><ul>\n          <li><span class=\"ref\">Притч 4:18</span> «путь праведных — как свет утренней зари, который становится всё ярче и ярче»</li>\n          <li><span class=\"ref\">Деян 1:6</span> и апостолы ошибались в сроках: «Господь, не теперь ли ты восстановишь Израильское царство?»</li>\n          <li>Руководящий совет не называет себя вдохновлёнными пророками: ошибались люди, а не Бог</li>\n          <li><span class=\"ref\">Мф 24:42</span> ожидание конца — исполнение призыва «Итак, бодрствуйте, потому что не знаете, в какой день придёт ваш Господь», а готовность исправляться — признак смирения</li></ul></div>\n      </div>\n    </div>\n  "
- id: "summary"
  html: "\n    <p class=\"eyebrow\">Итог</p>\n    <h2>Два подхода к одной Книге</h2>\n    <div class=\"duo\">\n      <div class=\"pos o\"><span class=\"who\">Православие</span><p class=\"thesis\">Преемственность</p><p>Вера читается через Предание, соборы и Отцов — наследие двадцати веков, общее для всей Церкви. Главное — непрерывность от апостолов.</p></div>\n      <div class=\"pos j\"><span class=\"who\">Свидетели Иеговы</span><p class=\"thesis\">Возвращение к Библии</p><p>Опора только на Писание, единое учение для собраний всего мира и личная проповедь каждого. Главное — восстановить веру христиан I века.</p></div>\n    </div>\n    <h3 class=\"qhead\">Голоса двух традиций</h3>\n    <div class=\"duo voices\">\n      <div class=\"pos o\"><span class=\"who\">Православие</span>\n        <figure class=\"vq\"><p class=\"vq-t\">О непостижимости Бога</p><blockquote>«…как некое море сущности, неопределимое и бесконечное, простирающееся за пределы всякого представления о времени и естестве».<cite>Свт. Григорий Богослов, Слово 38</cite></blockquote></figure>\n        <figure class=\"vq\"><p class=\"vq-t\">О встрече с реальностью</p><blockquote>«Ни один человек в мире не обогатился обсуждениями. Только встречей с реальностью, с правдой, добром, красотой».<cite>Прот. Александр Шмеман (1921–1983)</cite></blockquote></figure>\n      </div>\n      <div class=\"pos j\"><span class=\"who\">Свидетели Иеговы</span>\n        <figure class=\"vq\"><p class=\"vq-t\">О свидетельстве</p><blockquote>«Вы мои свидетели, — говорит Иегова, — мой служитель, которого я избрал, чтобы вы знали меня, верили в меня и понимали, что я тот же».<cite>Ис 43:10, «Перевод нового мира»</cite></blockquote></figure>\n        <figure class=\"vq\"><p class=\"vq-t\">О познании Бога</p><blockquote>«Чтобы обрести вечную жизнь, необходимо узнавать тебя, единственного истинного Бога, и посланного тобой Иисуса Христа».<cite>Ин 17:3, «Перевод нового мира»</cite></blockquote></figure>\n      </div>\n    </div>\n  "
- id: "glossary"
  html: "\n    <p class=\"eyebrow\">Словарь</p>\n    <h2>Термины двух традиций</h2>\n    <div class=\"duo\">\n      <div class=\"pos o\"><span class=\"who\">Православие</span><dl class=\"gl\">\n        <dt>Литургия</dt><dd>главное богослужение, на котором совершается Причастие</dd>\n        <dt>Таинство</dt><dd>священнодействие, в котором человек получает благодать: крещение, Причастие, исповедь и др.</dd>\n        <dt>Символ веры</dt><dd>краткое изложение веры, принятое соборами 325 и 381 годов</dd>\n        <dt>Единосущный</dt><dd>одной сущности, одной природы: так Сын соотносится с Отцом</dd>\n        <dt>Предание</dt><dd>живая вера Церкви от апостолов; Писание — его записанная часть</dd>\n        <dt>Отцы Церкви</dt><dd>святые учители, чьё учение Церковь признала верным</dd>\n        <dt>Поместная Церковь</dt><dd>самостоятельная Церковь страны или региона; все равны между собой</dd>\n        <dt>Септуагинта</dt><dd>греческий перевод Ветхого Завета III–I вв. до н. э.</dd>\n        <dt>Обожение</dt><dd>соединение человека с Богом по благодати</dd></dl></div>\n      <div class=\"pos j\"><span class=\"who\">Свидетели Иеговы</span><dl class=\"gl\">\n        <dt>Возвещатель</dt><dd>член собрания, который участвует в проповеди</dd>\n        <dt>Зал Царства</dt><dd>место встреч собрания</dd>\n        <dt>Собрание</dt><dd>местная община; ведут старейшины</dd>\n        <dt>Руководящий совет</dt><dd>группа помазанников, которая готовит духовную пищу для всех собраний</dd>\n        <dt>Помазанники</dt><dd>те, кто считает себя одним из 144 000 и надеется жить на небе</dd>\n        <dt>Другие овцы</dt><dd>верные, надеющиеся на вечную жизнь на земле (Ин 10:16)</dd>\n        <dt>Вечеря воспоминания</dt><dd>ежегодное воспоминание смерти Христа, 14 нисана</dd>\n        <dt>Выкуп</dt><dd>жизнь совершенного человека Иисуса, отданная за потомков Адама</dd>\n        <dt>«Новый свет»</dt><dd>уточнённое понимание Писания (Притч 4:18)</dd></dl></div>\n    </div>\n  "
- id: "refs"
  html: "\n    <p class=\"eyebrow\">Откуда информация</p>\n    <ol class=\"sources\">\n      <li><a href=\"https://www.jw.org/en/jehovahs-witnesses/faq/jehovah-witness-beliefs/\">Во что верят Свидетели Иеговы — jw.org</a></li>\n      <li><a href=\"https://wol.jw.org/ru/wol/b/r2/lp-u/nwtsty/43/1\">«Перевод нового мира», Ин 1 — wol.jw.org</a></li>\n      <li><a href=\"https://www.jw.org/en/library/books/2025-Service-Year-Report-of-Jehovahs-Witnesses-Worldwide/\">Годовой отчёт Свидетелей Иеговы за 2025 год</a></li>\n      <li><a href=\"https://azbyka.ru/svideteli-iegovy\">Свидетели Иеговы — энциклопедия «Азбука веры»</a></li>\n      <li><a href=\"https://azbyka.ru/otechnik/sekty/spetsifika-hristologii-sekty-svideteli-iegovy/\">Игумен Герасим (Дьячков). Специфика христологии — azbyka.ru</a></li>\n      <li><a href=\"https://azbyka.ru/otechnik/sekty/imja-boga-v-perevode-novogo-mira/\">Имя Бога в «Переводе нового мира» — azbyka.ru</a></li>\n      <li><a href=\"https://azbyka.ru/otechnik/Aleksandr_Mileant/lzheuchenie-svidetelej-iegovy/\">Еп. Александр (Милеант). Лжеучение Свидетелей Иеговы — azbyka.ru</a></li>\n      <li><a href=\"https://azbyka.ru/otechnik/sekty/opasnost-s-bibliej-v-rukah-o-sekte-svidetelej-iegovy/5\">Свящ. Николай Дубинин. Опасность с Библией в руках — azbyka.ru</a></li>\n      <li><a href=\"https://azbyka.ru/otechnik/sekty/lozhnye-svidetelstva-svidetelej-iegovy/2\">Свящ. Игорь Ефимов. Ложные свидетельства Свидетелей Иеговы — azbyka.ru</a></li>\n      <li><a href=\"https://pravoslavie.ru/106146.html\">Прот. Олег Стеняев. Диспут со «Свидетелями Иеговы» — pravoslavie.ru</a> (<a href=\"https://pravoslavie.ru/106353.html\">продолжение</a>, <a href=\"https://pravoslavie.ru/107051.html\">окончание</a>)</li>\n      <li><a href=\"https://pravoslavie.ru/6744.html\">Иером. Иов (Гумеров). О Пресвятой Троице — pravoslavie.ru</a></li>\n      <li><a href=\"https://pravoslavie.ru/30614.html\">Иером. Иов (Гумеров). О праздновании Пасхи — pravoslavie.ru</a></li>\n      <li><a href=\"https://pravoslavie.ru/87038.html\">Этот бесконечный конец света — pravoslavie.ru</a></li>\n      <li><a href=\"https://ekzeget.ru/bible/k-kolossanam-poslanie-ap-pavla/glava-1/stih-15/\">Толкования на Кол 1:15 — ekzeget.ru</a>; <a href=\"https://ekzeget.ru/bible/evangelie-ot-ioanna/glava-1/stih-1/\">Ин 1:1</a>; <a href=\"https://ekzeget.ru/bible/evangelie-ot-luki/glava-23/stih-43/\">Лк 23:43</a>; <a href=\"https://ekzeget.ru/bible/otkrovenie-ap-ioanna-bogoslova/glava-7/stih-4/\">Откр 7:4</a></li>\n      <li><a href=\"https://azbyka.ru/otechnik/Grigorij_Bogoslov/slovo/38\">Григорий Богослов. Слово 38 — azbyka.ru</a></li>\n      <li><a href=\"https://www.jw.org/en/news/region/global/Jehovahs-Witnesses-Reach-New-Preaching-Milestone-JWORG-Now-Features-Content-in-1000-Languages/\">JW.ORG — контент на 1000 языках — jw.org</a></li>\n      <li><a href=\"https://www.pewresearch.org/short-reads/2017/11/08/key-takeaways-about-orthodox-christians/\">Pew Research Center, 2017</a></li>\n      <li><a href=\"https://en.wikipedia.org/wiki/Clavis_Patrum_Graecorum\">Clavis Patrum Graecorum</a></li>\n      <li><a href=\"https://www.pravmir.ru/vypusk-75-tomnoj-pravoslavnoj-encziklopedii-zavershitsya-v-2025-godu/\">«Православная энциклопедия», 75 томов — Правмир</a></li>\n    </ol>\n    <p class=\"note\">Цифры о численности и объёме литературы — оценки; перед публичным использованием их стоит сверить с актуальными отчётами.</p>\n  "
