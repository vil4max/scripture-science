  - id: afterlife-and-end
    title: "Посмертие и конец времён"
    cards:
      - id: spirit-world
        title: "Духовный мир после смерти"
        short: "Церковь учит, что душа после смерти ждёт воскресения, а об умерших молятся; Святые последних дней верят, что в духовном мире умершим проповедуют Евангелие и они могут перейти из духовной тюрьмы в рай."
        topic: afterlife
        church:
          text: "После смерти душа продолжает жить: души праведников до всеобщего воскресения пребывают «во свете, покое и предначинании вечного блаженства», а души грешников — в противоположном состоянии (кат. §369). Полное воздаяние следует по воскресении тела и последнем Суде (§370). Церковь молится об умерших (§373)."
          proof:
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет Московский. Пространный катехизис, О членах 11 и 12 Символа веры"
              tier: official
              excerpt: "во свете, покое и предначинании вечного блаженства"
              accessed: 2026-09-27
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)"
              tier: official
              excerpt: "Души умерших праведников до всеобщего воскресения пребывают во свете, покое и предначинании вечного блаженства"
              accessed: 2026-09-25
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
