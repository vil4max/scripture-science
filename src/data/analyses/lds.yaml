  - id: man-and-salvation
    title: "Человек и спасение"
    cards:
      - id: premortal-life
        title: "Предземная жизнь и Небесная Мать"
        short: "Церковь учит, что человек не существовал до своего творения, а Святые последних дней верят, что до рождения все люди жили как духовные дети Небесного Отца и Небесной Матери."
        topic: salvation
        church:
          text: "Бог сотворил человека: тело — из праха, душу — как «дыхание жизни», существо духовное и бессмертное. Человек не существовал до своего творения; анафематизмы против оригенизма осуждают «мифологическое предсуществование душ». Бог — Отец; Писание не говорит о Небесной Матери."
          proof:
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §113: сотворение человека"
              tier: official
              excerpt: "И сотворил Бог из земли тело первого человека Адама, вдунул в лицо его дыхание жизни"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §115: душа"
              tier: official
              excerpt: "Дыхание жизни – это душа, существо духовное и бессмертное"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/otechnik/bogoslovie/put-istina-i-zhizn-verouchitelnye-teksty-pravoslavnoj-tserkvi/3"
              title: "Вероучительные определения вселенских соборов — «Против оригенизма», анафематизм 1 (Т. Борозенец, «Путь, истина и жизнь»)"
              tier: reference
              excerpt: "Если кто признает мифологическое предсуществование душ"
              accessed: 2026-10-01
        tradition:
          text: "Святые последних дней учат, что до рождения все люди жили с небесными родителями — Небесным Отцом и Небесной Матерью — как Их духовные дети. На совете Небесный Отец представил план спасения; треть духовных детей отвергла его и последовала за Люцифером. Земная жизнь нужна, в частности, чтобы получить физическое тело."
          proof:
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/plan-of-salvation?lang=eng"
              title: "\"Plan of Salvation,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "Before we were born on earth, we lived with our heavenly parents as Their spirit children."
              accessed: 2026-10-01
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/plan-of-salvation?lang=eng"
              title: "\"Plan of Salvation,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "They chose to follow Lucifer, who became the devil, and were cast out of the presence of God."
              accessed: 2026-10-01
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/plan-of-salvation?lang=eng"
              title: "\"Plan of Salvation,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "One significant purpose of mortality is to gain a physical body."
              accessed: 2026-10-01
