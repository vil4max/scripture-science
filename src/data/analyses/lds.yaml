      - id: fall-and-atonement
        title: "Падение Адама и Искупление"
        short: "Обе традиции говорят, что потомки Адама не несут личной вины за его грех, но Церковь видит в Падении уклонение человека от пути к блаженству, а Святые последних дней — часть плана Небесного Отца."
        topic: salvation
        church:
          text: "Грехопадение первых людей повредило человеческую природу: потомки Адама рождаются со склонностью ко злу и подвержены тлению и смерти. Православие говорит скорее о последствиях первородного греха, чем о передаваемой личной вине. Спасает Христос: в Крещении человек возрождается, а смерть побеждена Воскресением."
          proof:
            - url: "https://azbyka.ru/grex-pervorodnyj"
              title: "Азбука веры. Грех первородный"
              tier: reference
              excerpt: "греховная порча, поразившая человеческое естество вследствие грехопадения прародителей"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/grex-pervorodnyj"
              title: "Азбука веры. Грех первородный"
              tier: reference
              excerpt: "первородный (прародительский) грех можно более точно именовать последствиями первородного греха"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §122: предопределение Божие"
              tier: official
              excerpt: "Уклонившемуся от пути блаженства человеку Бог по предведению и по бесконечному милосердию Своему изволил открыть новый путь"
              accessed: 2026-10-01
        tradition:
          text: "Второй Символ веры Церкви: «люди будут наказаны за свои собственные грехи, а не за согрешение Адама». Церковь признаёт унаследованное падшее состояние — разлучение с Богом и физическую смерть — и называет Падение неотъемлемой частью плана Небесного Отца: оно дало людям возможность родиться, учиться и расти. Через Искупление Христа, учит она, всё человечество может быть спасено повиновением законам и таинствам Евангелия."
          proof:
            - url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=rus"
              title: "Символы веры 1:2 — Священные Писания, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "Мы верим, что люди будут наказаны за свои собственные грехи, а не за согрешение Адама"
              accessed: 2026-10-01
            - url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=rus"
              title: "Символы веры 1:3 — Священные Писания, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "Мы верим, что через Искупление Христа всё человечество может быть спасено посредством повиновения законам и таинствам Евангелия"
              accessed: 2026-10-01
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/fall-of-adam-and-eve?lang=eng"
              title: "\"Fall of Adam and Eve,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "As descendants of Adam and Eve, we inherit a fallen condition during mortality."
              accessed: 2026-10-01
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/fall-of-adam-and-eve?lang=eng"
              title: "\"Fall of Adam and Eve,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "The Fall is an integral part of Heavenly Father"
              accessed: 2026-10-01
        answer:
          points:
            - "Общее: Православие тоже не учит, что потомки Адама несут личную вину за его проступок. Энциклопедия «Азбука веры» считает точнее называть его «последствиями первородного греха», а Писание — «душа согрешающая, она умрёт; сын не понесёт вины отца» (Иез 18:20)."
            - "Но последствия касаются всех: «как одним человеком грех вошёл в мир, и грехом смерть, так и смерть перешла во всех человеков» (Рим 5:12); «в Адаме все умирают, так во Христе все оживут» (1 Кор 15:22). Обе традиции признают унаследованное падшее состояние."
            - "Расхождение в оценке самого Падения: катехизис видит в нём уклонение человека от пути к блаженству, для которого Бог «изволил открыть новый путь» через Сына (§122), а не необходимый шаг плана спасения."
            - "Спасение — не только избавление от общих последствий, но и возрождение: Бог «спас нас... банею возрождения и обновления Святым Духом» (Тит 3:5)."
