              accessed: 2026-10-01
        answer:
          points:
            - "Общее: сознательная жизнь души после смерти, покой праведных («ныне же будешь со Мною в раю», Лк 23:43; «отнесен был Ангелами на лоно Авраамово», Лк 16:22) и ожидание воскресения; обе традиции заботятся об умерших."
            - "Притча о Лазаре: «между нами и вами утверждена великая пропасть» (Лк 16:26); «человекам положено однажды умереть, а потом суд» (Евр 9:27); каждый получит «соответственно тому, что он делал, живя в теле» (2 Кор 5:10). Состояние до Суда не описывается как путь развития и перехода между областями."
            - "Слова о проповеди «находящимся в темнице духам» (1 Пет 3:19; 4:6) говорят о деле Христа; катехизис не выводит из них учения о проповеди и заместительных обрядах для умерших, а учит о помощи им молитвой и Евхаристией (§373)."
            - "Различие: духовная тюрьма и рай как области, между которыми возможен переход после принятия обрядов, Православие не описывает; Церковь молится о душах «с верой, но не успевших принести достойных плодов покаяния» (§373)."
          proof:
