        answer:
          points:
            - "Чин Мелхиседека в Писании принадлежит Христу: «Ты священник вовек по чину Мелхиседека» (Евр 5:6); «Сей, как пребывающий вечно, имеет и священство непреходящее» (Евр 7:24). Послание к Евреям не говорит о передаче этого порядка людям как отдельного Мелхиседекова священства."
            - "Общее: власть служения не берётся самовольно, а даётся призванием и поставлением: «никто сам собою не приемлет этой чести, но призываемый Богом, как и Аарон» (Евр 5:4); апостолы «рукоположив же им пресвитеров к каждой церкви» (Деян 14:23), Тимофей получил дар «с возложением рук священства» (1 Тим 4:14), Тит поставлял пресвитеров (Тит 1:5). Спор — о том, прервалась ли цепь поставлений и была ли восстановлена в XIX веке."
            - "Преемство видно уже в ранней Церкви: сщмч. Ириней Лионский указывает на «епископов, поставленных апостолами в церквах, и преемников их до нас» (Против ересей, III, 3 — цитата на Азбуке веры)."
            - "Всеобщее священство христиан (1 Пет 2:9) не отменяет особого служения пастырей, поставляемых епископом (кат. §357): служение определяется не возрастом или достоинством в глазах общины, а рукоположением в Церкви."
