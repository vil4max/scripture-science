          points:
            - "Святой Дух назван Богом: Пётр говорит Анании, что тот допустил сатане вложить в сердце мысль «солгать Духу Святому», и тут же — «солгал не человекам, а Богу» (Деян 5:3–4). Поэтому Церковь исповедует Духа Лицом Божественным и единосущным Отцу и Сыну, а не отдельным существом."
            - "Дух «от Отца исходит» (Ин 15:26); Символ веры называет Его Тем, Кто «со Отцем и Сыном спокланяема и сславима»."
            - "Общее — дар Духа после крещения. Апостолы действительно подавали Духа возложением рук (Деян 8:14–17); катехизис признаёт это и объясняет, что их преемники — епископы — стали употреблять Миропомазание (§§306–307). Спор — о праве совершать этот обряд, то есть о преемстве от апостолов."
            - "«Вы имеете помазание от Святаго и знаете всё» (1 Ин 2:20): Церковь видит в этих словах внутреннее действие Таинства (§305)."
          proof:
