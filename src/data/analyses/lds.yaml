      - id: rules
        title: "Слово Мудрости и десятина"
        short: "Церковь строит нравственную жизнь на любви к Богу и ближнему, а не на списке запретов; Святые последних дней по Слову Мудрости воздерживаются от вина, табака, чая и кофе и отдают десятую часть дохода."
        topic: rules
        church:
          text: "Нравственная жизнь христианина строится на любви к Богу и ближнему: все люди — наши ближние, потому что все — создания единого Бога (кат. §§489–492). Церковные правила, например о воздержании от крови (Прав. ап. 63; Трулльский собор, 67), — установления Церкви. Пищевые и бытовые нормы не сводятся к одному списку запретов."
          proof:
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6"
              title: "Свт. Филарет. Пространный катехизис, §§489–492: любовь к Богу и ближнему"
              tier: official
              excerpt: "Все люди являются нашими ближними. Потому что все – создания единого Бога"
              accessed: 2026-09-27
