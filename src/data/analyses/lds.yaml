              tier: official
              excerpt: "Мы верим в ту же организацию, которая существовала в Первоначальной Церкви, а именно: в апостолов, пророков, пасторов, учителей, евангелистов и так далее"
              accessed: 2026-10-01
        answer:
          points:
            - "Общее: названия «апостол», «пророк», «пастырь», «учитель» взяты из Нового Завета (Еф 4:11), и Православие тоже говорит о Церкви, «утверждены на основании апостолов и пророков» (Еф 2:20)."
            - "Но название должности не доказывает преемства: Церковь «непрерывно и неизменно сохраняет от апостолов и учение, и преемство даров Святого Духа через священное рукоположение» (кат. §272); апостолы поставляли пресвитеров (Деян 14:23)."
            - "Православное служение — это поставленные епископом пресвитеры и диаконы (кат. §§356–357), которым поручено «пасти Церковь Господа» (Деян 20:28); у епископа есть требования к достоинству и жизни (1 Тим 3:2)."
            - "Единство веры в Православии выражает Вселенский Собор (§276), а Глава Церкви — Христос: «Иисус Христос есть единственная глава единственной Церкви» (§256)."
