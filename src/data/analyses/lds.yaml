  - id: scripture-and-authority
    title: "Писание, Церковь и власть"
    cards:
      - id: canon
        title: "Книга Мормона и канон Писания"
        short: "Церковь принимает как Писание Библию и считает Откровение завершённым во Христе, а Святые последних дней признают вместе с Библией ещё три священные книги, главная из них — Книга Мормона."
        topic: scripture
        church:
          text: "Православная Библия на русском языке включает 77 книг: Ветхий Завет — 50, Новый — 27. Ветхий Завет в древней Церкви считали по еврейскому счёту — двадцать две книги; Новый Завет — двадцать семь книг. Писание понимается согласно толкованию Церкви и святых отцов."
          proof:
            - url: "https://azbyka.ru/bibliya"
              title: "Азбука веры. Библия: состав и язык библейских книг"
              tier: reference
              excerpt: "Библия включает в себя 77 книг: Ветхий Завет – 50 книг, Новый завет – 27 книг."
              accessed: 2026-09-27
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/1"
              title: "Свт. Филарет Московский. Пространный катехизис, О Священном Писании: число ветхозаветных книг"
              tier: official
