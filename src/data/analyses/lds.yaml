        tradition:
          text: "Духовный мир (spirit world), по учению Церкви Иисуса Христа Святых последних дней, — место, где духи умерших ждут Воскресения: рай для праведных и духовная тюрьма (spirit prison) для тех, кто не принял Евангелия или был нечестив. Там проповедуется Евангелие: принявшие его и обряды, совершённые за них в храмах, могут перейти из тюрьмы в рай."
          proof:
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/spirit-world?lang=eng"
              title: "\"Spirit World,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "The postmortal spirit world is a place where the spirits of those who have died dwell before the Resurrection."
              accessed: 2026-10-01
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/spirit-world?lang=eng"
              title: "\"Spirit World,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "If they accept the gospel and the ordinances performed for them in temples, they may leave spirit prison and dwell in paradise."
              accessed: 2026-10-01
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/postmortality?lang=eng"
              title: "\"Postmortality,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
