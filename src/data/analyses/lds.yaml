        church:
          text: "В Церкви три степени священства — епископ, пресвитер и диакон; иерархия ведёт начало от Христа и от сошедшего на апостолов Святого Духа и непрерывно продолжается через рукоположение (кат. §§275, 356). Апостольское преемство — благодатная передача церковной власти от апостолов. Единственный Священник «по чину Мелхиседека» — Христос."
