  - id: church-life
    title: "Церковная жизнь и обычаи"
    cards:
      - id: organisation
        title: "Первое президентство, епископы и приходы"
        short: "Церковь возглавляет Христос, а служат в ней епископы, священники и диаконы; у Святых последних дней Церковь возглавляют 15 апостолов, а приходами руководят неоплачиваемые миряне."
        topic: organisation
        church:
          text: "Православная Церковь — Единая, Святая, Соборная и Апостольская Церковь Христова; её Глава — Иисус Христос. Поместные Церкви соединены единой верой и Таинствами; священство имеет три степени — епископ, пресвитер, диакон. Священноначалием, действующим от имени всей Церкви, является Вселенский Собор."
          proof:
            - url: "https://azbyka.ru/otechnik/dokumenty/osnovnye-printsipy-otnoshenija-russkoj-pravoslavnoj-tserkvi-k-inoslaviyu/"
