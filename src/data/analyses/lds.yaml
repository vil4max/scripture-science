        answer:
          points:
            - "Откровение завершено во Христе: «Бог, многократно и многообразно говоривший издревле отцам в пророках, в последние дни сии говорил нам в Сыне» (Евр 1:1–2); надо «подвизаться за веру, однажды преданную святым» (Иуд 1:3)."
            - "Православие не отрицает действия Духа в Церкви, но требует проверки: «не всякому духу верьте, но испытывайте духов» (1 Ин 4:1); пророк, слово которого не сбылось, говорит «по дерзости своей» (Втор 18:22); благовествующий иное — «анафема» (Гал 1:8)."
            - "Единство учения в Православии выражает не один руководитель, а соборное свидетельство Церкви: «Священноначалием, которое может действовать от имени всей Кафолической Церкви, является Вселенский Собор» (кат. §276); Церковь — «столп и утверждение истины» (1 Тим 3:15)."
            - "Общее: обе традиции верят, что Бог говорит людям и что Библия — слово Божие; расхождение — в том, что считать нормой веры после апостолов."
