        answer:
          points:
            - "Мир создан словом Божиим: «из невидимого произошло видимое» (Евр 11:3); Авраам поверил пред Богом, «животворящим мертвых и называющим несуществующее, как существующее» (Рим 4:17); «без Него ничто не начало быть, что начало быть» (Ин 1:3)."
            - "Всё, кроме Бога, имеет начало: Бог — «единый, имеющий бессмертие» (1 Тим 6:16), а человеку Он «вдунул в лицо его дыхание жизни» (Быт 2:7). Церковь не принимает мысли о несотворённом «разуме» в основе души: человек — творение Божие."
            - "Образ Божий в человеке понимается духовно — «в праведности и святости истины» (Еф 4:24; кат. §114): «Бог есть дух» (Ин 4:24), и подобие Богу не сводится к подобию телу."
            - "Общее — вера в Бога как Творца и Отца, любящего людей; расхождение в том, творил ли Бог из ничего и в чём состоит образ Божий."
          proof:
