        tradition:
          text: "Церковь Иисуса Христа Святых последних дней верит в продолжающееся откровение: «Мы верим во всё, что открыл Бог, во всё, что Он ныне открывает, и мы верим, что Он ещё откроет много великого и важного, касающегося Царства Божьего» (Символы веры 9). Учение провозглашается и истолковывается Президентом Церкви и поддерживается Первым президентством и Кворумом двенадцати апостолов единогласно."
          proof:
            - url: "https://www.churchofjesuschrist.org/study/scriptures/pgp/a-of-f/1?lang=rus"
