        church:
          text: "Откровение Божие передавали пророки; «в полноте же и совершенстве» принёс его воплощённый Сын Божий и распространил через апостолов (кат. §14). Оно хранится в Церкви в Священном Предании и Священном Писании: Предание нужно и сегодня для правильного понимания Писания, а Писание читается согласно толкованию Церкви и святых отцов."
