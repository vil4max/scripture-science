              title: "Символы веры 1 — Священные Писания, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "Мы верим в Бога, Отца Вечного, и в Сына Его, Иисуса Христа, и в Духа Святого"
              accessed: 2026-09-26
