        answer:
          points:
            - "Общее: Православие тоже учит, что все воскреснут (Ин 5:28–29), что судят «по делам» и что блаженство не равно для всех: «иная слава солнца, иная слава луны, иная звезд» (1 Кор 15:41–42; кат. §379)."
            - "Но Христос говорит о двух исходах Суда: «изыдут творившие добро в воскресение жизни, а делавшие зло – в воскресение осуждения» (Ин 5:29; Мф 25:46). Трёхчастную систему царств «славы» Православие не принимает как апостольское учение."
            - "«В доме Отца Моего обителей много» (Ин 14:2) — слова об одном доме Отца; для различия степеней блаженства катехизис опирается на 1 Кор 15:41–42 (§379), а не делит верующих на разные царства."
            - "Условие блаженства — вера, любовь и добрые дела (кат. §379), а не определённый обряд, такой как брак в храме для высшей степени."
          proof:
