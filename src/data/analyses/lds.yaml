        tradition:
          text: "«Слово Мудрости» (Учение и Заветы 89) предписывает воздерживаться от вина и крепких напитков, табака и «горячих напитков» (Церковь поясняет — чая и кофе); закон десятины (Учение и Заветы 119) обязывает ежегодно отдавать одну десятую часть дохода. Обе нормы Церковь выводит из откровений, данных Джозефу Смиту."
