  - id: sacraments-worship
    title: "Таинства и богослужение"
    cards:
      - id: baptism
        title: "Крещение: возраст и власть"
        short: "Церковь крестит и младенцев по вере родителей и крёстных, а Святые последних дней крестят не ранее восьми лет: младенцы, по их учению, уже искуплены Христом и в крещении не нуждаются."
        topic: worship
        church:
          text: "Крещение — Таинство, в котором верующий при троекратном погружении в воду с призыванием Отца и Сына и Святого Духа умирает для греховной жизни и возрождается Духом (Ин 3:5). Младенцев крестят по вере родителей и восприемников. Как духовное рождение, Крещение совершается один раз."
          proof:
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §§289–291: Крещение младенцев"
              tier: official
              excerpt: "Младенцев крестят по вере родителей и восприемников"
              accessed: 2026-09-27
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §285: Таинство Крещения"
              tier: official
              excerpt: "Крещение есть Таинство, в котором верующий при троекратном погружении тела в воду с призыванием Бога Отца и Сына и Святого Духа умирает для жизни плотской, греховной и возрождается Святым Духом в жизнь духовную, святую"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §301: Крещение не повторяется"
              tier: official
              excerpt: "Крещение не повторяется потому, что оно есть духовное рождение"
              accessed: 2026-10-01
        tradition:
          text: "Святые последних дней крестят погружением в воду детей не ранее восьми лет, то есть возраста подотчётности (age of accountability); крестить может только тот, кто имеет священническую власть. Младенцы, по их учению, искуплены Христом и не нуждаются в крещении; утверждение обратного, по Книге Мормона, отвергает милости Христа. Крещение и последующее возложение рук для дара Святого Духа Церковь называет началом пути к вечной жизни."
          proof:
            - url: "https://www.churchofjesuschrist.org/topics/salvation?lang=eng"
