        church:
          text: "Бог открывает Себя в Писании многими именами — Сущий, Господь, Вседержитель, Отец. Имена выражают то, что Бог открывает о Себе, но не исчерпывают Его существа. Церковь не делит Божество на двух богов, носящих разные имена: «Господь, Бог наш, Господь един есть» (Втор 6:4)."
