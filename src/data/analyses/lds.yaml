      - id: sacrament-eucharist
        title: "Причастие: хлеб и вода или Евхаристия"
        short: "Церковь учит, что в Причастии под видом хлеба и вина верующие вкушают подлинные Тело и Кровь Христовы, а Святые последних дней вкушают хлеб и воду в память о жертве Христа."
        topic: worship
        church:
          text: "Причащение (Евхаристия) — Таинство, в котором верующий под видом хлеба и вина вкушает подлинные Тело и Кровь Иисуса Христа для вечной жизни. За Литургией хлеб и вино прелагаются Святым Духом в истинное Тело и истинную Кровь Христовы; это главная часть христианского богослужения."
          proof:
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §312: Таинство Причащения"
              tier: official
              excerpt: "под видом хлеба и вина вкушает подлинные Тело и Кровь Иисуса Христа для вечной жизни."
              accessed: 2026-09-27
            - url: "https://azbyka.ru/prichastie"
              title: "Азбука веры. Причастие: Таинство Евхаристии и преложение Даров"
              tier: reference
              excerpt: "они становятся Телом и Кровью Христовыми"
              accessed: 2026-09-27
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §314: место Причащения в богослужении"
              tier: official
              excerpt: "Таинство Причащения составляет главную и существенную часть христианского богослужения"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §336: смысл действия"
              tier: official
              excerpt: "прелагаются или пресуществляются в истинное Тело Христово и в истинную Кровь Христову"
              accessed: 2026-10-01
        tradition:
          text: "Святые последних дней совершают причастие («sacrament») каждое воскресенье на собрании причастия: члены Церкви вкушают хлеб и воду в память об искупительной жертве Христа и тем возобновляют заветы, данные при крещении. Хлеб напоминает о Его теле и страданиях, вода — о пролитой Крови. Церковь называет это собрание самым священным и важным в Церкви."
          proof:
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/sacrament?lang=eng"
              title: "\"Sacrament,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "Today the sacrament is an ordinance in which Church members partake of bread and water in remembrance of Jesus Christ"
              accessed: 2026-10-01
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/sacrament?lang=eng"
              title: "\"Sacrament,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "Through this ordinance, Church members renew the covenants they made with God when they were baptized."
              accessed: 2026-10-01
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/sacrament?lang=eng"
              title: "\"Sacrament,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "The water is a reminder that the Savior shed His blood"
              accessed: 2026-10-01
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/sabbath-day?lang=eng"
              title: "\"Sabbath Day,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "At church, members participate in the sacred ordinance of the sacrament"
              accessed: 2026-10-01
        answer:
          points:
            - "Общее: обе традиции ведут причастие от Тайной вечери и слов «сие творите в Мое воспоминание» (Лк 22:19), и совершают его на воскресном богослужении (Деян 20:7)."
            - "Но Господь говорит не «знак», а: «сие есть Тело Мое», «сия чаша есть Новый Завет в Моей Крови» (Мф 26:26–28; Лк 22:20). «Плоть Моя истинно есть пища, и Кровь Моя истинно есть питие» (Ин 6:55); апостол спрашивает: «не есть ли приобщение Крови Христовой» чаша благословения (1 Кор 10:16)."
            - "Христос подал ученикам «чашу» (Мф 26:27): Церковь причащает под видами хлеба и вина (кат. §312), а не хлеба и воды."
            - "Причащение соединяет с Самим Христом: «Ядущий Мою Плоть и пиющий Мою Кровь имеет жизнь вечную» (Ин 6:54; кат. §339); поэтому к нему приступают с покаянием, постом и молитвой (кат. §338)."
          proof:
            - url: "https://azbyka.ru/biblia/?Lk.22:19&r"
              title: "Лк. 22:19 — Синодальный перевод"
              tier: official
              excerpt: "сие творите в Мое воспоминание"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/biblia/?Act.20:7&r"
              title: "Деян. 20:7 — Синодальный перевод"
              tier: official
              excerpt: "В первый же день недели, когда ученики собрались для преломления хлеба"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/biblia/?Mt.26:26&r"
              title: "Мф. 26:26 — Синодальный перевод"
              tier: official
              excerpt: "сие есть Тело Мое"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/biblia/?Mt.26:27&r"
              title: "Мф. 26:27 — Синодальный перевод"
              tier: official
              excerpt: "взяв чашу и благодарив, подал им"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/biblia/?Mt.26:28&r"
              title: "Мф. 26:28 — Синодальный перевод"
              tier: official
              excerpt: "сие есть Кровь Моя Нового Завета"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/biblia/?Lk.22:20&r"
              title: "Лк. 22:20 — Синодальный перевод"
              tier: official
              excerpt: "сия чаша есть Новый Завет в Моей Крови"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/biblia/?Jn.6:55&r"
              title: "Ин. 6:55 — Синодальный перевод"
              tier: official
              excerpt: "Плоть Моя истинно есть пища, и Кровь Моя истинно есть питие"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/biblia/?Jn.6:54&r"
              title: "Ин. 6:54 — Синодальный перевод"
              tier: official
              excerpt: "Ядущий Мою Плоть и пиющий Мою Кровь имеет жизнь вечную"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/biblia/?1Cor.10:16&r"
              title: "1 Кор. 10:16 — Синодальный перевод"
              tier: official
              excerpt: "не есть ли приобщение Крови Христовой"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §339: что происходит в Причащении"
              tier: official
              excerpt: "Причащающийся Тела и Крови Христовой соединяется с Самим Иисусом Христом и в Нём приобщается к вечной жизни"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
