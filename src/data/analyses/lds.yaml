              title: "\"Godhead,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "the members of the Godhead are three separate beings. The Father and the Son have tangible bodies of flesh and bones"
              accessed: 2026-09-26
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/godhead?lang=eng"
              title: "\"Godhead,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints (о единстве членов Божества)"
              tier: official
