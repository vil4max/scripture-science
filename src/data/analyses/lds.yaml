        answer:
          points:
            - "Общее: Церковь Иисуса Христа Святых последних дней чтит искупительную жертву Христа и Его Воскресение, и Православие не противопоставляет Крест и Воскресение: Крест — «сила Божия» для спасаемых (1 Кор 1:18), а Воскресение — его плод."
            - "Апостол: «я не желаю хвалиться, разве только крестом Господа нашего Иисуса Христа» (Гал 6:14); «незнающим ничего, кроме Иисуса Христа, и притом распятого» (1 Кор 2:2). Христос уподобляет Своё вознесение на Кресте змию в пустыне (Ин 3:14)."
            - "Изображения Писание не запрещает: по повелению Божию были сделаны золотые херувимы (Исх 25:18–20); катехизис: «Иметь какие бы то ни было священные изображения вовсе не запрещается»."
            - "Икона связана с Воплощением: Бог стал видим — «Слово стало плотию» (Ин 1:14); поэтому образ Христа — и распятого, и воскресшего — Православие почитает как напоминание о спасении."
          proof:
