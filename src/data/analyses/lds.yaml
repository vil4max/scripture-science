    title: "Бог и Христос"
    cards:
      - id: godhead
        title: "Троица и «Божество»"
        short: "Церковь учит, что Бог один — Троица: Отец, Сын и Святой Дух составляют одно Божественное существо, а Святые последних дней считают Их тремя отдельными существами, едиными в цели и учении."
        topic: god
        church:
          text: "Бог один по существу и троичен в Лицах: Отец, Сын и Святой Дух — Троица единосущная и нераздельная. Бог есть Дух (Ин 4:24), и Божественная природа бестелесна; человеческое тело Сын принял в Воплощении. Церковь не исповедует ни трёх богов, ни единства Лиц лишь в цели и учении."
          proof:
