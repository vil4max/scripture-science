        tradition:
          text: "Церковь Иисуса Христа Святых последних дней возглавляют 15 апостолов: Президент и два его советника образуют Первое президентство, ещё двенадцать — Кворум двенадцати апостолов. Приходы (wards) возглавляют епископы, группы приходов («колья», stakes) — президенты кольев; эти местные руководители — неоплачиваемые миряне со значительной самостоятельностью. Должности Церковь выводит из «Первоначальной Церкви» — апостолы, пророки, пасторы, учителя, евангелисты."
