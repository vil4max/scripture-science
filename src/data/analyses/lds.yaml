        tradition:
          text: "Святые последних дней постятся обычно в первое воскресенье месяца: 24 часа без пищи и питья, если позволяет здоровье, и вносят пожертвования от поста на помощь нуждающимся; в этот день проходит собрание свидетельств. Церковь признаёт брак установленным Богом и в Учении и Заветах (раздел 49) говорит: «Тот, кто запрещает вступать в брак, не назначен Богом» (УЗ 49:15); «И тот, кто повелевает воздерживаться от мяса, чтобы человек не ел его, Богом не назначен» (УЗ 49:18)."
