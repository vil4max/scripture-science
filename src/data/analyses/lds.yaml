        answer:
          points:
            - "Крещение совершается «во имя Отца и Сына и Святаго Духа» (Мф 28:19): имя одно, а Лиц три; Дух поставлен рядом с Отцом и Сыном и в апостольском благословении: «благодать Господа нашего Иисуса Христа, и любовь Бога Отца, и общение Святаго Духа» (2 Кор 13:13)."
            - "«Бог есть дух» (Ин 4:24). Слова воскресшего Господа «дух плоти и костей не имеет, как видите у Меня» (Лк 24:39) относятся к Его воскресшему человеческому телу; телесное Воскресение Христа исповедует и Православие, но плоть Сын принял в Воплощении (Ин 1:14), а не Отец."
            - "Различие Лиц Православие признаёт: Дух «от Отца исходит» (Ин 15:26), Сын рождён от Отца. Но их единство не только в цели и учении: «Я и Отец – одно» (Ин 10:30), и Церковь исповедует Сына единосущным Отцу."
            - "Бог один: «прежде Меня не было Бога и после Меня не будет» (Ис 43:10). Поэтому единство Лиц понимается как единство Божественного существа, а не как согласие трёх отдельных божественных существ."
          proof:
            - url: "https://azbyka.ru/biblia/?Mt.28:19&r"
              title: "Мф. 28:19 — Синодальный перевод"
              tier: official
              excerpt: "крестя их во имя Отца и Сына и Святого Духа"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/biblia/?2Cor.13:13&r"
              title: "2 Кор. 13:13 — Синодальный перевод"
              tier: official
              excerpt: "Благодать Господа нашего Иисуса Христа, и любовь Бога Отца, и общение Святаго Духа"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/biblia/?Jn.4:24&r"
              title: "Ин. 4:24 — Синодальный перевод"
              tier: official
