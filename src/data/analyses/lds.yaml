        answer:
          points:
            - "Слово «обожение» Православию не чуждо: «соделались причастниками Божеского естества» (2 Пет 1:4); «будем подобны Ему» (1 Ин 3:2); «сонаследники же Христу» (Рим 8:17). Статья самой Церкви Иисуса Христа Святых последних дней признаёт, что обожение остаётся центральным учением Восточного Православия."
            - "Различие — в том, чем человек становится. В Православии он богом «по благодати», а не по существу: Бог один и без начала, «прежде Меня не было Бога и после Меня не будет» (Ис 43:10; 44:8). По словам митр. Афанасия (Николау), приведённым в Азбуке веры, человек «не может стать частью Божией сущности»."
            - "«Я сказал: вы – боги» (Пс 81:6; Ин 10:34–35) Церковь читает в свете обожения как «дар нетварной божественной благодати», а не как раскрытие природы, которой человек обладал всегда."
            - "Путь к обожению — Боговоплощение и Таинства Церкви: «Обожение недостижимо человеческими усилиями»."
          proof:
