        answer:
          points:
            - "Книга Бытия говорит, что человек стал «душою живою», когда Бог «вдунул в лицо его дыхание жизни» (Быт 2:7): душа получает бытие вместе с человеком. «Дух возвратится к Богу, Который дал его» (Еккл 12:7); Господь «создал сердца всех их» (Пс 32:15)."
            - "«Избрал нас в Нём прежде создания мира» (Еф 1:4) говорит об избрании Богом, а не о жизни душ до рождения: катехизис понимает это как предопределение Божие — изволение Бога о нашем блаженстве (§§121–122). Через Христа Бог «предопределив усыновить нас Себе чрез Иисуса Христа» (Еф 1:5): сыновство людей — по усыновлению (Рим 8:15)."
            - "Анафематизмы против оригенизма (сб. Т. Борозенец) осуждают «мифологическое предсуществование душ». Оригенизм не тождествен учению святых последних дней, но отношение Церкви к самой идее предсуществования выражено ясно."
            - "О Небесной Матери: Христос учит молиться «Отче наш» (Мф 6:9). Статья самой Церкви признаёт, что формального откровения Джозефа Смита об этом нет и учение опирается на позднейшие свидетельства; Православие такого учения не знает. Общее — вера в ценность каждого человека перед Богом."
          proof:
