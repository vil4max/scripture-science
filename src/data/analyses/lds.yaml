        answer:
          points:
            - "Общее: Пасха — Воскресение Христа, а воскресенье — день богослужения уже в апостольское время: «в первый же день недели, когда ученики собрались для преломления хлеба» (Деян 20:7); «в день воскресный» (Откр 1:10); «Пасха наша, Христос, заклан за нас» (1 Кор 5:7)."
            - "Различие — в годовом круге: Православие проживает Воскресение через Великий пост (сорок дней, кат. §§539–541), Страстную седмицу и Пасху как «праздник праздников» (§538), а не только вспоминает его в воскресной службе."
            - "Всеобщая конференция — собрание руководства и верующих, а не замена праздника: по её наличию нельзя заключать, что община не отмечает Рождества или Пасхи (страницы Церкви «Easter» и «Christmas»)."
            - "Надежда общая: Церковь Иисуса Христа Святых последних дней видит в Пасхе обещание вечной жизни через Христа, а Православие — «предначинание вечного праздника, вечного блаженства» (кат. §538); различаются форма и годовой круг празднования."
          proof:
            - url: "https://azbyka.ru/biblia/?Act.20:7&r"
              title: "Деян. 20:7 — Синодальный перевод"
              tier: official
              excerpt: "В первый же день недели, когда ученики собрались для преломления хлеба"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/biblia/?Apok.1:10&r"
              title: "Откр. 1:10 — Синодальный перевод"
              tier: official
              excerpt: "Я был в духе в день воскресный"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/biblia/?1Cor.5:7&r"
              title: "1 Кор. 5:7 — Синодальный перевод"
              tier: official
              excerpt: "Пасха наша, Христос, заклан за нас"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6"
              title: "Свт. Филарет. Пространный катехизис, §539: Великий пост"
              tier: official
              excerpt: "Важнейшим постом является Великий пост, или святая Четыредесятница"
