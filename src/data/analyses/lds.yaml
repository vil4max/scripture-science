        tradition:
          text: "Святые последних дней празднуют Пасху как Воскресение Христа и собираются на воскресные богослужения, но не следуют обрядам Пепельной среды, Великого поста и Страстной седмицы; пасхальные службы включают чтения из Нового Завета и Книги Мормона. Рождество Церковь тоже отмечает. Всеобщие конференции проходят дважды в год — в первые выходные апреля и октября — и не заменяют Пасхи."
          proof:
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/easter?lang=eng"
              title: "Easter — Overview; пасхальное воскресное богослужение"
              tier: official
              excerpt: "Latter-day Saints conduct Easter Sunday services"
              accessed: 2026-09-27
