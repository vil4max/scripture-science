        answer:
          points:
            - "Обетования Христа: Церковь не одолеют «врата ада» (Мф 16:18), Он с учениками «во все дни до скончания века» (Мф 28:20), Ему «слава в Церкви... во все роды, от века до века» (Еф 3:21), Утешитель «да пребудет с вами вовек» (Ин 14:16); Церковь Божия — «столп и утверждение истины» (1 Тим 3:15). Церковь не могла исчезнуть, а затем быть учреждена заново."
            - "Предупреждение апостола о том, что войдут «лютые волки» и из самой общины восстанут ложные учителя, (Деян 20:29–30) говорит об опасности, но не об исчезновении Церкви: в той же речи он поручает пастырям «пасти Церковь Господа» (Деян 20:28)."
            - "Архиерейский Собор РПЦ 1994 г. назвал «церковь святых последних дней» (мормонов) среди сект и новых религиозных движений, которые, по его свидетельству, «с христианством несовместимы» (п. 7 и 13); тот же документ требует, чтобы противостояние ложным взглядам не сопровождалось нетерпимым отношением к самим людям (п. 15)."
            - "Критерий истинной Церкви в Православии — непрерывное преемство веры и рукоположения (кат. §§272–275), а не рассказ о небесном поручении: даже «Ангел с неба», благовествующий иное, — «анафема» (Гал 1:8)."
          proof:
