      - id: creation-and-image
        title: "Творение и образ Божий"
        short: "Церковь учит, что Бог создал мир из ничего, а Святые последних дней верят, что Он устроил мир из уже существовавших элементов и что разум в основе каждой души не был создан."
        topic: god
        church:
          text: "Бог из ничего сотворил небо и землю, и всё, что есть, создано Им. Образ Божий в человеке катехизис видит «в праведности и святости истины» (Еф 4:24), то есть духовно; «дыхание жизни» — душа, существо духовное и бессмертное."
          proof:
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §111: о сотворении мира"
              tier: official
