        tradition:
          text: "Святые последних дней учат, что каждый человек божествен по происхождению, природе и потенциалу и через Христа может быть превознесён (exalted) — достичь состояния божественности (godliness) и жить с Богом, продолжая семью. Церковь утверждает, что превознесённые всегда будут поклоняться Богу, и отвергает обвинение в политеизме. Она сообщает, что о первой половине известного изречения Лоренцо Сноу (в переводе: как человек ныне есть, так Бог был когда-то) открыто мало и потому мало преподаётся."
