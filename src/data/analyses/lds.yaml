              title: "Свт. Филарет. Пространный катехизис, §115: душа"
              tier: official
              excerpt: "Дыхание жизни – это душа, существо духовное и бессмертное"
              accessed: 2026-10-01
        tradition:
          text: "По учению Церкви Иисуса Христа Святых последних дней, Бог устроил Вселенную из существовавших элементов, а не создал её из ничего; Церковь связывает учение о творении из ничего с философскими идеями II века. Люди, по её учению, созданы по образу Бога и по физическому облику, а свет, или разум (light or intelligence) в основе каждой души не был создан."
          proof:
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/becoming-like-god?lang=eng"
              title: "\"Becoming Like God,\" Gospel Topics Essays — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
