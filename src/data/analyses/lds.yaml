        answer:
          points:
            - "Общее: и Православие, и Церковь Иисуса Христа Святых последних дней почитают Библию как слово Божие, а в России Церковь пользуется тем же Синодальным переводом, что и Православие (по её странице «Русский язык»)."
            - "Откровение завершено во Христе: «Бог... в последние дни сии говорил нам в Сыне» (Евр 1:1–2), и надо «подвизаться за веру, однажды преданную святым» (Иуд 1:3). Апостол предупреждает: если бы даже «Ангел с неба стал благовествовать вам не то, что мы благовествовали вам, да будет анафема» (Гал 1:8). Поэтому новые книги проверяются апостольской верой Церкви."
            - "Слово Божие хранится: «небо и земля прейдут, но слова Мои не прейдут» (Мф 24:35); «слово Господне пребывает вовек» (1 Пет 1:25). Церковь не знает утраты простых и драгоценных истин из Писания, которую нужно восполнять новыми книгами."
            - "Предание Церковь хранит «согласное с Божественным откровением и Священным Писанием» (кат. §23): ни Предание, ни новое «откровение» не отменяют апостольского свидетельства. Откровение «в полноте же и совершенстве» принёс воплощённый Сын Божий (кат. §14)."
          proof:
            - url: "https://azbyka.ru/biblia/?Hebr.1:2&r"
              title: "Евр. 1:2 — Синодальный перевод"
              tier: official
              excerpt: "в последние дни сии говорил нам в Сыне"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/biblia/?Juda.1:3&r"
              title: "Иуд. 1:3 — Синодальный перевод"
              tier: official
              excerpt: "подвизаться за веру, однажды преданную святым"
