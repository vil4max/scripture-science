          points:
            - "«О дне же том и часе никто не знает» (Мф 24:36); «не ваше дело знать времена или сроки» (Деян 1:7): Церковь не строит схем земного царства по срокам и местам."
            - "Откр 20:4–6 («царствовали со Христом тысячу лет») Церковь, как правило, не читает буквально: по энциклопедии «Азбука веры», после II Вселенского собора буквальное толкование обычно отвергалось (так у свт. Иоанна Златоуста, прп. Ефрема Сирина, свт. Игнатия Брянчанинова). Ранние хилиастические мнения у св. Иустина и св. Иринея Лионского — лишь частные мнения отдельных авторов."
            - "Новый Иерусалим не город на континенте: к «небесному Иерусалиму» (Евр 12:22), «святый город Иерусалим, новый, сходящий от Бога с неба» (Откр 21:2), «вышний Иерусалим... матерь всем нам» (Гал 4:26)."
            - "Общее: личное возвращение Христа, воскресение и обновление мира — по слову Петра, ожидаем «нового неба и новой земли» (2 Пет 3:13; Откр 21:1); «Царству Его не будет конца» (Лк 1:33), поэтому Православие не вставляет в этот порядок временного земного царства."
