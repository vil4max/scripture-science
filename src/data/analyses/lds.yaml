      - id: priesthood
        title: "Священство: Ааронов и Мелхиседеков порядки"
        short: "Церковь учит, что священство передаётся без перерыва от апостолов через рукоположение, а Святые последних дней верят, что оно было утрачено и восстановлено в 1829 году."
