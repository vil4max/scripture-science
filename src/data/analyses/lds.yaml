        tradition:
          text: "Первый Символ веры Церкви гласит: «Мы верим в Бога, Отца Вечного, и в Сына Его, Иисуса Христа, и в Духа Святого». По её учению, члены Божества — три отдельных существа: Отец и Сын имеют осязаемые тела из плоти и костей, Святой Дух — личность духа, и все они едины в цели и учении. Церковь считает, что истинное учение о Божестве было утрачено в отступничестве (apostasy) после смерти апостолов и восстановлено через Джозефа Смита."
          proof:
