              title: "\"Mother in Heaven,\" Gospel Topics Essays — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "all human beings, male and female, are beloved spirit children of heavenly parents, a Heavenly Father and a Heavenly Mother"
              accessed: 2026-10-01
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics-essays/mother-in-heaven?lang=eng"
              title: "\"Mother in Heaven,\" Gospel Topics Essays — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
