          points:
            - "Общее: обе традиции отвергают спасение одними заслугами и ждут плодов веры: «благодатью вы спасены через веру, и сие не от вас, Божий дар» (Еф 2:8) и «мы — Его творение, созданы... на добрые дела» (Еф 2:10); «вера без дел мертва» (Иак 2:20)."
            - "Синергия: «со страхом и трепетом совершайте свое спасение» (Флп 2:12), «потому что Бог производит в вас и хотение и действие» (Флп 2:13) — и воля человека, и действие Божие остаются дарами."
