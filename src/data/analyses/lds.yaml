          text: "Христос обещал: «Я создам Церковь Мою, и врата ада не одолеют ее» (Мф 16:18) и «Я с вами во все дни до скончания века» (Мф 28:20). Благодать пребывает в Церкви до скончания времён, и Церковь непрерывно сохраняет от апостолов учение и преемство даров Святого Духа через рукоположение (кат. §§255, 269, 272)."
