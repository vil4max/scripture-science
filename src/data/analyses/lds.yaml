        answer:
          points:
            - "Общее: трезвость, милосердие и ответственность за здоровье важны и для Православия: «не упивайтесь вином, от которого бывает распутство» (Еф 5:18)."
            - "Но Писание не осуждает вино само по себе: «вино, которое веселит сердце человека» (Пс 103:15); апостол советует Тимофею «употребляй немного вина, ради желудка твоего» (1 Тим 5:23); на свадьбе в Кане вода стала вином (Ин 2:9)."
            - "Десятина в Новом Завете — свободный дар: «Каждый уделяй по расположению сердца, не с огорчением и не с принуждением» (2 Кор 9:7); Христос напоминает о том, что книжники «оставили важнейшее в законе: суд, милость и веру» (Мф 23:23). Слово Малахии о десятинах (Мал 3:8–10) обращено к Израилю."
            - "Полезность правила не придаёт ему божественного авторитета: Слово Мудрости и десятина основаны на текстах, которые Православие не признаёт Писанием (см. карточку о каноне Писания)."
