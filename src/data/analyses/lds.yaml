# the tradition's teaching from its own documents. Validated for full evidence coverage.
# Detailed analysis: Orthodoxy and The Church of Jesus Christ of Latter-day Saints
# (self-name per docs/EDITORIAL.md principle 12). Card order follows the reading order;
# `topic` links a card from the comparison. Source rules: docs/SOURCES.md.
# Existing matrix/assessment proofs are reused unchanged; new proofs were opened on 2026-10-01.
tradition: lds
lead: "Все расхождения православного учения и учения Церкви Иисуса Христа Святых последних дней (мормонов) — по тезисам: учение Церкви, учение святых последних дней, православный ответ."
authorityNote: "Архиерейский Собор Русской Православной Церкви 1994 г. в Определении «О псевдохристианских сектах, неоязычестве и оккультизме» (п. 7 и 13) назвал «церковь святых последних дней» (мормонов) среди сект и «новых религиозных движений», которые, по его свидетельству, с христианством несовместимы; тот же документ (п. 15) требует не проявлять нетерпимости к самим людям. Это определение не разбирает вероучение по существу, и отдельного соборного или синодального акта с таким разбором в проверенных источниках не найдено. Православная позиция в карточках изложена по Писанию, Символу веры и катехизису свт. Филарета; оценки отдельных авторов (проф. А. Л. Дворкин и др.) вынесены в раздел «Подробнее» как их мнения и не используются как свидетельство о нынешнем учении Церкви Иисуса Христа Святых последних дней."
keyPoints:
  - text: "Церковь верит в единого Бога — Троицу из трёх Лиц одного существа, а Святые последних дней считают Отца, Сына и Святого Духа тремя отдельными существами, едиными в цели и учении."
    card: godhead
  - text: "Святые последних дней исповедуют жертву и телесное воскресение Христа, но называют Его Первородным Сыном Небесного Отца, а Церковь верит, что Он вечный несотворённый Бог, равный Отцу."
    card: christ-son-of-god
  - text: "Святые последних дней признают вместе с Библией ещё три священные книги, главная из них — Книга Мормона, а Церковь считает Откровение завершённым во Христе и понимает Писание по толкованию Церкви и святых отцов."
    card: canon
  - text: "Святые последних дней верят, что после апостолов истинное учение исказилось и было восстановлено через Джозефа Смита, а Церковь по обетованию Христа непрерывно хранит учение и преемство от апостолов."
    card: great-apostasy
  - text: "Святые последних дней верят в продолжающееся откровение через Президента Церкви, а Церковь считает Откровение полностью данным во Христе и проверяет любые новые притязания."
    card: prophets-revelation
  - text: "Святые последних дней верят, что до рождения люди жили как духовные дети Небесного Отца и Небесной Матери, а Церковь учит, что человек не существовал до своего творения."
    card: premortal-life
  - text: "Святые последних дней верят, что человек божествен по природе и может достичь божественности, а Церковь учит, что человек соединяется с Богом по благодати, но остаётся творением."
    card: exaltation
  - text: "Святые последних дней проводят в храмах особые обряды для достойных членов, включая брак на вечность, нужный для высшей славы, а Церковь совершает Таинства для всех крещёных."
    card: temple-ordinances
  - text: "Святые последних дней крестят живых вместо умерших, а Церковь учит, что крестится сам верующий, а об умерших молится и помогает им добрыми делами."
    card: proxy-baptism
groups:
