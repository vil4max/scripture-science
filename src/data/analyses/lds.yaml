        tradition:
          text: "Церковь Иисуса Христа Святых последних дней учит, что после смерти Христа и апостолов люди исказили учение и устройство Церкви, и Господь отнял власть священства от земли (Великое отступничество, Great Apostasy). Явление Отца и Сына Джозефу Смиту в 1820 году, по её учению, начало Восстановление: это восстановленное, а не реформированное христианство (restored, not reformed). Церковь заявляет, что она не происходит ни от какой другой веры, и однозначно называет себя христианской."
