      - id: exaltation
        title: "Превознесение и обожение"
        short: "Церковь учит, что человек может соединиться с Богом по благодати и уподобиться Ему, но остаётся творением, а Святые последних дней верят, что человек божествен по природе и может достичь божественности."
        topic: salvation
        church:
          text: "Цель христианской жизни — обожение: благодатное единение с Богом и уподобление Ему (2 Пет 1:4). Православие различает Божественную сущность и нетварные энергии: человек причастен энергиям Божиим, но не сущности, и остаётся тварью. Это различие, по Азбуке веры, закреплено в Актах Константинопольского собора 1351 года."
          proof:
            - url: "https://azbyka.ru/obozhenie"
              title: "Азбука веры. Обожение"
              tier: reference
              excerpt: "процесс уподобления верующего Богу и единения с Богом."
              accessed: 2026-09-27
            - url: "https://azbyka.ru/obozhenie"
              title: "Азбука веры. Обожение"
              tier: reference
              excerpt: "Дар обожения – дар нетварной божественной благодати."
              accessed: 2026-10-01
