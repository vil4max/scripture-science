      - id: kingdoms-of-glory
        title: "Три степени славы"
        short: "Церковь учит, что Суд имеет два исхода — жизнь вечную и муку вечную, а Святые последних дней верят в три царства славы, и для высшего из них нужен брак, заключённый на вечность."
        topic: afterlife
        church:
          text: "Православие исповедует воскресение мёртвых — тела соединятся с душами и станут духовными и бессмертными (кат. §363) — и жизнь будущего века после всеобщего Суда. Блаженство будет не равным для всех (1 Кор 15:41–42; кат. §379), но итог Суда — два исхода: «в муку вечную, а праведники в жизнь вечную» (Мф 25:46)."
          proof:
            - url: "https://azbyka.ru/simvol_very"
              title: "Никео-Цареградский Символ веры, член 11: воскресение мёртвых"
              tier: official
              excerpt: "Чаю воскресения мертвых"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §363: воскресение мёртвых"
              tier: official
              excerpt: "Воскресение мёртвых, которого мы ожидаем – это действие всемогущества Божия, через которое тела умерших людей, соединившись опять с их душами, оживут и станут духовны и бессмертны"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §379: степени блаженства"
              tier: official
              excerpt: "Не все будут блаженны в одинаковой мере. Будут разные степени блаженства, в зависимости от того, как кто здесь подвизался в вере, любви и добрых делах"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §380: участь неверующих"
              tier: official
              excerpt: "Неверующие и беззаконники будут преданы вечной смерти, или, иначе говоря, вечному огню"
              accessed: 2026-10-01
        tradition:
          text: "Церковь Иисуса Христа Святых последних дней учит, что все люди воскреснут и предстанут перед Судом, после чего получат степень славы в одном из трёх царств — целестиальном, терристриальном или телестиальном; вне царств славы окажутся лишь сыновья погибели (sons of perdition). В высшей степени целестиального царства — «вечная жизнь», или превознесение, то есть жизнь с Небесным Отцом и Иисусом Христом и продолжение семьи, для чего требуется новый и вечный завет брака."
          proof:
            - url: "https://www.churchofjesuschrist.org/topics/salvation?lang=eng"
