      - id: temple-ordinances
        title: "Храмовые обряды и «вечный брак»"
        short: "Церковь учит, что Таинства, в том числе брак, доступны всем крещёным, а Святые последних дней проводят в храмах особые обряды для достойных членов, включая брак на вечность, нужный для высшей славы."
        topic: worship
        church:
          text: "Церковь совершает семь Таинств: Крещение, Миропомазание, Евхаристию, Покаяние, Священство, Брак и Елеосвящение. Литургию верных вправе посещать все крещёные (кат. §334). Брак — Таинство, в котором союз «благословляется их супружеский союз во образ духовного союза Христа и Церкви» (кат. §358)."
          proof:
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/"
              title: "Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов) — Азбука веры"
              tier: official
              excerpt: "подробно рассказывается о 7-ми таинствах Церкви (Крещение, Миропомазание, Евхаристия, Покаяние, Священство, Брак, Елеосвящение)"
              accessed: 2026-09-25
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §318: храм"
              tier: official
              excerpt: "Храм называется церковью потому, что в нём для молитвы и Таинств собираются составляющие Церковь верующие"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §334: Литургия верных"
              tier: official
              excerpt: "На этом Богослужении имеют право быть одни верные, т. е. принявшие Крещение"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §358: Таинство Брака"
              tier: official
              excerpt: "благословляется их супружеский союз во образ духовного союза Христа и Церкви"
              accessed: 2026-10-01
        tradition:
          text: "Помимо воскресных собраний, в храмах Церкви Иисуса Христа Святых последних дней совершаются священные обряды: эндаумент (endowment, наделение) — наставления и заветы, и запечатывание (sealing) — брак на вечность. В храм входят лишь достойные члены Церкви, имеющие рекомендацию после двух собеседований и состоящие в Церкви не менее года. Брак в храме, по её учению, необходим для высшей степени небесной славы."
          proof:
            - url: "https://www.churchofjesuschrist.org/temples/faq?lang=eng"
              title: "Temple FAQ — The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "Modern temples are dedicated to the Lord and have purposes similar to biblical ones"
              accessed: 2026-09-25
            - url: "https://www.churchofjesuschrist.org/temples/faq?lang=eng"
              title: "Temple FAQ — The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "Once dedicated, attendance is reserved for faithful members of the Church who are ready to participate in additional gospel ordinances"
              accessed: 2026-10-01
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/temples?lang=eng"
              title: "\"Temples,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "individuals cannot enter the temple to receive their endowment or be sealed in marriage for eternity until they have fully prepared themselves and been members of the Church for at least a year"
              accessed: 2026-10-01
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/temples?lang=eng"
              title: "\"Temples,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "In this ordinance husband and wife are sealed to one another for eternity."
              accessed: 2026-10-01
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/temples?lang=eng"
              title: "\"Temples,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "Church members certify their worthiness to enter the temple"
              accessed: 2026-10-01
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/kingdoms-of-glory?lang=eng"
              title: "\"Kingdoms of Glory,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "temple marriage is a requirement for obtaining the highest degree of celestial glory"
              accessed: 2026-10-01
        answer:
          points:
            - "О воскресении Христос говорит: «ни женятся, ни выходят замуж, но пребывают, как Ангелы Божии на небесах» (Мф 22:30): Церковь не находит в Писании основания для запечатывания браков на вечность как условия высшей славы."
            - "Православие тоже освящает брак: «Тайна сия велика; я говорю по отношению ко Христу и к Церкви» (Еф 5:32); «что Бог сочетал, того человек да не разлучает» (Мф 19:6). Общее — понимание брака как священного союза, различие — в его «вечном» запечатлении как условии спасения."
            - "Таинства Церкви принадлежат всему народу Божию: за Литургией верных присутствуют все крещёные, а условия — покаяние, пост и молитва (кат. §§334, 338), а не рекомендация и годичный стаж."
            - "Храм почитается и в Православии — как место, где «для молитвы и Таинств собираются» верующие (кат. §318); но отдельного от Литургии обряда, доступного лишь по рекомендации, Церковь не знает."
          proof:
            - url: "https://azbyka.ru/biblia/?Mt.22:29&r"
              title: "Мф. 22:29 — Синодальный перевод"
              tier: official
              excerpt: "заблуждаетесь, не зная Писаний, ни силы Божией"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/biblia/?Mt.22:30&r"
              title: "Мф. 22:30 — Синодальный перевод"
              tier: official
              excerpt: "в воскресении ни женятся, ни выходят замуж, но пребывают, как Ангелы Божии на небесах"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/biblia/?Eph.5:32&r"
              title: "Еф. 5:32 — Синодальный перевод"
              tier: official
              excerpt: "Тайна сия велика; я говорю по отношению ко Христу и к Церкви"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/biblia/?Mt.19:6&r"
              title: "Мф. 19:6 — Синодальный перевод"
              tier: official
              excerpt: "Итак, что Бог сочетал, того человек да не разлучает"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §359: почему брак — Таинство"
              tier: official
              excerpt: "Тайна сия велика"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §338: как приступать к Причащению"
              tier: official
              excerpt: "Приступающий к Таинству Причащения должен испытать (открыть) перед Богом свою совесть и очистить её покаянием в грехах, чему способствуют пост и молитва"
              accessed: 2026-10-01
