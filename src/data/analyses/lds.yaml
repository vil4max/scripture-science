        tradition:
          text: "Церковь Иисуса Христа Святых последних дней признаёт четыре канонические книги, стандартные труды (standard works): Библию, Книгу Мормона, Учение и Заветы и Драгоценную жемчужину. Библия, согласно восьмому Символу веры, — слово Божье в той мере, в какой она переведена правильно, а Книга Мормона — слово Божье; Церковь учит, что Книга Мормона восстанавливает простые и драгоценные истины (plain and precious), утраченные из Библии. На русском языке Церковь предпочитает Синодальный перевод издания Российского Библейского общества 1994 года."
          proof:
            - url: "https://www.churchofjesuschrist.org/topics/salvation?lang=eng"
              title: "\"Salvation,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints (список отсылок к Писанию)"
