        answer:
          points:
            - "Общее: пост соединён с молитвой — «они служили Господу и постились» (Деян 13:2–3), и Христос учит не показной скорби, а чистоты помысла: «когда постишься, помажь голову твою и умой лице твое» (Мф 6:16–17)."
            - "Различие — в мере и времени: Православие знает Великий пост по примеру Христа (§§540–541), среды и пятницы (§542) и посты перед праздниками (§543); евхаристический пост — полное воздержание от пищи и питья с полуночи до Причастия (Собор 2016)."
            - "«Придут дни, когда отнимется у них жених, и тогда будут поститься» (Мф 9:15): пост — часть жизни Церкви в ожидании Жениха."
            - "Слова Учения и Заветов 49:15–18 перекликаются с 1 Тим 4:3–4 о тех, кто запрещает брак и «употреблять в пищу то, что Бог сотворил»; Православие тоже не отвергает брака и сотворённой пищи: «всякое творение Божие хорошо» (1 Тим 4:4); пост — воздержание ради духовного труда, а монашество — добровольное призвание (§360)."
          proof:
            - url: "https://azbyka.ru/biblia/?Act.13:2&r"
              title: "Деян. 13:2 — Синодальный перевод"
              tier: official
              excerpt: "Когда они служили Господу и постились"
