      - id: great-apostasy
        title: "Церковь Христова: «Великое отступничество» и «Восстановление»"
        short: "Церковь учит, что она непрерывно хранит учение и преемство от апостолов, а Святые последних дней считают, что после апостолов учение исказилось и было восстановлено через Джозефа Смита с 1820 года."
