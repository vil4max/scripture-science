      - id: proxy-baptism
        title: "Крещение за умерших"
        short: "Церковь учит, что человек крестится сам, а за умерших молятся; Святые последних дней крестят живых вместо умерших и видят в этом обряд апостольских времён."
        topic: worship
        church:
          text: "Крещение совершается над самим верующим, который приходит с покаянием и верой, и не повторяется (кат. §§288, 301). О умерших Церковь молится: молитвы, особенно при бескровной Жертве Тела и Крови Христовой, и добрые дела, совершаемые с верой в их память, могут помочь душам умерших с верой, не успевшим принести плоды покаяния."
          proof:
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §288: что требуется от крещаемого"
              tier: official
              excerpt: "От желающего принять Крещение требуется покаяние и вера"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Свт. Филарет. Пространный катехизис, §301: Крещение не повторяется"
              tier: official
              excerpt: "Крещение не повторяется потому, что оно есть духовное рождение"
              accessed: 2026-10-01
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12"
              title: "Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)"
              tier: official
              excerpt: "Душам умерших с верой, но не успевших принести достойных плодов покаяния, для достижения блаженного воскресения могут помочь возносимые за них молитвы"
              accessed: 2026-09-25
        tradition:
          text: "Святые последних дней совершают в храмах крещение за умерших: живой член Церкви, часто потомок, крестится вместо умершего. По их учению, умершие в духовном мире вольны принять или отвергнуть совершённые за них обряды, а имена умерших не заносятся в списки членов Церкви. Церковь видит в этой практике восстановленный апостольский обряд (1 Кор 15:29)."
          proof:
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/baptisms-for-the-dead?lang=eng"
              title: "\"Baptisms for the Dead,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "By performing proxy baptisms on behalf of those who have died, Church members offer these blessings to deceased ancestors."
              accessed: 2026-10-01
            - url: "https://www.churchofjesuschrist.org/study/manual/gospel-topics/baptisms-for-the-dead?lang=eng"
              title: "\"Baptisms for the Dead,\" Topics and Questions — Gospel Library, The Church of Jesus Christ of Latter-day Saints"
              tier: official
              excerpt: "Individuals can then choose to accept or reject the ordinances that have been performed on their behalf."
