      - id: prophets-revelation
        title: "Живой пророк и продолжающееся откровение"
        short: "Церковь учит, что Откровение полностью дано во Христе и хранится в Писании и Предании, а Святые последних дней верят в продолжающееся откровение, которое провозглашает и истолковывает Президент Церкви."
