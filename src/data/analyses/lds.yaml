        answer:
          points:
            - "Сын — Бог по природе: «Слово было Бог» (Ин 1:1); «Единородный Сын, сущий в недре Отчем, Он явил» (Ин 1:18); Он — «образ ипостаси Его», то есть Отца (Евр 1:3). Символ веры исповедует Его «рожденна, несотворенна, единосущна Отцу»."
            - "«Рожденный прежде всякой твари» (Кол 1:15) говорит о Сыне, через Которого «создано всё» (Кол 1:16): Церковь различает вечное рождение Сына от Отца и сотворение тварей («рождён, не сотворён», кат. §§144–145), а потому не видит в Нём одного из духовных детей Отца."
            - "Общее: Церковь Иисуса Христа Святых последних дней и Православие исповедуют искупительную смерть Христа, Его телесное Воскресение (Лк 24:39) и всеобщее воскресение: «как в Адаме все умирают, так во Христе все оживут» (1 Кор 15:22). Расхождение — в том, Кто такой Воскресший."
            - "Воплощение — это принятие человеческой природы Тем, Кто «было у Бога» (Ин 1:1) как Слово: оно «стало плотию» (Ин 1:14). Церковь исповедует одно Лицо в двух природах, Бога и человека вместе (кат. §§180–181)."
