        answer:
          points:
            - "Общее: обе традиции крестят погружением (кат. §285), обращаются к словам «во имя Отца и Сына и Святого Духа» (Мф 28:19) и считают Крещение необходимым: «если кто не родится от воды и Духа, не может войти в Царствие Божие» (Ин 3:5); «кто будет веровать и креститься, спасен будет» (Мк 16:16)."
            - "О младенцах: «вам принадлежит обетование и детям вашим» (Деян 2:39); апостолы крестили целые дома (Деян 16:33); Крещение заменило обрезание, совершавшееся над восьмидневными (Кол 2:11–12; кат. §§290–291); Христос говорит: «пустите детей... ибо таковых есть Царство Небесное» (Мф 19:14)."
            - "Различие — в вере принимающего: в Православии младенца крестят «по вере родителей и восприемников» (кат. §289), у святых последних дней действует личная подотчётность с восьми лет. Церковь не считает, что Крещение младенцев умаляет милость Христа: оно — дар возрождения (Тит 3:5)."
            - "Власть крестить Православие связывает с апостольским повелением «Идите, научите все народы, крестя их...» (Мф 28:19), хранимым преемственной иерархией, а не с восстановлением в XIX веке."
