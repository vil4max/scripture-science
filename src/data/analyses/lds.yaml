        answer:
          points:
            - "Стих 1 Кор 15:29 — часть доказательства воскресения: «если мертвые совсем не воскресают, то для чего и крестятся для мертвых?» Апостол не предписывает такого обряда, а ссылается на то, что делают другие, чтобы показать нелепость отрицания воскресения."
            - "Блж. Феофилакт Болгарский связывает это место с еретиками-маркионитами, которые крестили живого вместо умершего без крещения; правильный смысл, по нему, в том, что желающие креститься произносят Символ веры: «Верую в воскресение мертвых»."
            - "А. П. Лопухин (Толковая Библия) отмечает: «Это выражение толкуется весьма различно»; толкование об обряде заместительного крещения он называет неосновательным, так как такой обычай известен лишь в еретических общинах."
            - "Общее — забота о судьбе умерших. Но в Православии помощь им — молитва, милостыня и Литургия (кат. §373), а судьба определяется жизнью «в теле»: «всем нам должно явиться пред судилище Христово, чтобы каждому получить соответственно тому, что он делал, живя в теле» (2 Кор 5:10); «человекам положено однажды умереть, а потом суд» (Евр 9:27)."
