      - id: holy-days
        title: "Пасха, Рождество и воскресный день"
        short: "Церковь проживает Воскресение Христа через Великий пост и Страстную седмицу перед Пасхой, а Святые последних дней тоже празднуют Пасху и Рождество, но без Великого поста и Страстной седмицы."
        topic: holy-days
        church:
          text: "Пасха — праздник Воскресения Христова и победы над смертью, «праздник праздников»; воскресенье — еженедельное воспоминание этой победы. Важнейшие праздники установлены в память о главных событиях Воплощения Сына Божия, затем — в честь Богородицы. Церковный календарь вводит верующего в события спасения."
          proof:
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6"
              title: "Свт. Филарет. Пространный катехизис, §§535–536: воскресный день"
              tier: official
              excerpt: "День воскресный празднуется со времени воскресения Христа."
              accessed: 2026-09-27
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6"
              title: "Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)"
              tier: official
              excerpt: "В христианской Церкви празднуется через каждые шесть дней седьмой, только не последний из семи дней"
              accessed: 2026-09-25
            - url: "https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6"
              title: "Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)"
