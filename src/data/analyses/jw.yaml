          points:
            - "Поручение в Мф 28:19 включает крещение «во имя Отца и Сына и Святаго Духа»: проповедь Церкви — не только передача сведений, но и введение в жизнь Церкви и Таинства."
            - "Проповедник посылается (Рим 10:15): Дух Святой отделяет Варнаву и Савла, и Церковь, постившись и помолившись, возлагает на них руки (Деян 13:2–3). Важно не только усердие, но и то, что возвещается (Гал 1:8)."
            - "Хождение по домам Церковь как таковое не отвергает: апостол сам учил «всенародно и по домам» (Деян 20:20); различие — в содержании вести и в её основании."
            - Рассказ Церкви о сделанном есть и в Деяниях (Деян 14:27), поэтому сама практика отчётов не спорна. Что же до вопроса, заслуживается ли спасение делами, Свидетели отвечают отрицательно (Еф 2:8); православное учение о спасении изложено в соответствующей теме.
