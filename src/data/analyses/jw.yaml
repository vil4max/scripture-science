        tradition:
          text: Свидетели Иеговы учат, что у Бога есть личное имя — Иегова — и что тот, кто хочет стать другом Бога, должен знать и употреблять его. В Еврейских Писаниях имя стоит около 7 000 раз; в своём «Переводе нового мира» они вносят его и в Новый Завет (237 раз), считая, что переписчики заменили имя словом «Господь». Точное древнееврейское произношение, как они признают, неизвестно.
