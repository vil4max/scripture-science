# Detailed analysis: Orthodoxy and Jehovah's Witnesses
# (docs/tasks/site-m33-jw-analysis.md). Card order inside a group follows the
# reading order of the analysis; `topic` links a card from the comparison.
# Source rules: docs/SOURCES.md; catalog: docs/research/jw-azbyka-catalog.md.
tradition: jw
lead: "Все расхождения православного учения и учения Свидетелей Иеговы — по тезисам: учение Церкви, учение Свидетелей Иеговы, православный ответ."
authorityNote: Ни один соборный или синодальный акт Русской Православной Церкви не посвящён Свидетелям Иеговы отдельно. Православная позиция здесь изложена по Писанию, Символу веры и катехизису; оценки отдельных богословов, в том числе проф. А. Л. Дворкина, и церковных конференций подписаны как их мнения.
keyPoints:
  - text: "Церковь исповедует одного Бога в трёх Лицах — Отца, Сына и Святого Духа, а Свидетели Иеговы отвергают Троицу, считают Богом одного Иегову, а святой дух — Его действующей силой."
    card: trinity
  - text: "Православие верует, что Иисус Христос — Сын Божий и Сам Бог, Творец всего, а Свидетели Иеговы чтут Его как Спасителя и Царя, но считают первым созданным Богом существом, а не Всемогущим Богом."
    card: divinity-of-christ
  - text: "Церковь учит, что душа не погибает со смертью тела и что грешников ждёт вечная мука, а Свидетели Иеговы считают, что умерший перестаёт существовать до воскресения, а ад — это могила."
    card: soul
  - text: "Церковь не делит спасённых на небесных и земных, а Свидетели Иеговы учат, что вместе с Христом на небе будут править 144 000 человек, а остальные верные будут жить на земле."
    card: two-classes
  - text: "Церковь верит, что она непрерывно существует от апостолов, а Свидетели Иеговы учат, что после смерти апостолов началось великое отступничество, а с 1914 года Бог восстанавливает чистое поклонение."
    card: great-apostasy
  - text: "Церковь опирается на апостольское Предание и соборы епископов, а Свидетели Иеговы признают руководящей властью Руководящий совет — небольшую группу мужчин, назначенную, по их учению, Христом."
    card: governing-body
  - text: "Церковь понимает апостольский запрет крови как запрет есть её и исходит из ценности человеческой жизни, а Свидетели Иеговы распространяют запрет на переливание цельной крови и отказываются от него."
    card: blood
  - text: "Церковь празднует события спасения, например Рождество и Пасху, а Свидетели Иеговы не отмечают Рождество, Пасху и дни рождения, считая их языческими по происхождению."
    card: holidays
  - text: "Церковь учит, что проповедь ведут посланные ею люди и что она неотделима от Таинств, а Свидетели Иеговы считают проповедь по домам обязанностью каждого верующего."
    card: preaching
  - text: "Церковь отлучает от церковного общения лишь до покаяния, ради возвращения человека, а Свидетели Иеговы удаляют нераскаявшегося грешника из собрания, и верующие перестают с ним общаться."
    card: disfellowshipping
groups:
  - id: god
    title: Бог
    cards:
      - id: trinity
        title: Троица
        short: "Церковь учит, что Бог один и в то же время Троица — Отец, Сын и Святой Дух, а Свидетели Иеговы отвергают Троицу: для них Бог — один Иегова, Иисус меньше Него, а святой дух — Его сила."
        topic: god
        church:
          text: "Бог один по существу и троичен в Лицах: Отец, Сын и Святой Дух — Троица единосущная и нераздельная. Единство Бога и троичность Лиц не противоречат друг другу: Церковь не исповедует трёх богов и не сливает Лица в одно."
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: "Свт. Филарет. Пространный катехизис, §§90–94: единосущная Троица"
              tier: official
              excerpt: "Бог один по существу, но троичен в лицах: Отец, Сын и Святой Дух"
              accessed: 2026-09-27T00:00:00.000Z
        tradition:
          text: Свидетели Иеговы поклоняются одному Всемогущему Богу-Творцу, чьё личное имя — Иегова. Иисус для них — Сын Бога, но не Всемогущий Бог и меньший Отца; святой дух — действующая сила Бога, а не Лицо. Учение о Троице они отвергают как небиблейское.
          proof:
            - url: https://www.jw.org/ru/свидетели-иеговы/часто-задаваемые-вопросы/верования-свидетелей-иеговы/
              title: «Во что верят Свидетели Иеговы?» — Часто задаваемые вопросы, jw.org
              tier: official
              excerpt: Мы поклоняемся единственному истинному и Всемогущему Богу, Создателю, чье имя — Иегова
              accessed: 2026-09-25T00:00:00.000Z
            - url: https://www.jw.org/ru/свидетели-иеговы/часто-задаваемые-вопросы/вера-в-иисуса-христа/
              title: «Верят ли Свидетели Иеговы в Иисуса Христа?» — Часто задаваемые вопросы, jw.org
              tier: official
              excerpt: "мы не сомневаемся в правдивости его слов: «Отец больше меня»"
              accessed: 2026-09-25T00:00:00.000Z
            - url: https://www.jw.org/ru/библейские-учения/вопросы/что-такое-святой-дух/
              title: «Что такое святой дух?» — Библейские вопросы, jw.org
              tier: official
              excerpt: Святой дух — это действующая сила Бога, то есть его сила в действии
              accessed: 2026-09-25T00:00:00.000Z
            - url: https://wol.jw.org/ru/wol/d/r2/lp-u/1200001729
              title: «Бог» — Указатель к публикациям Свидетелей Иеговы, wol.jw.org
              tier: official
              excerpt: Иегова — Всемогущий, единственный истинный Бог, и он по праву требует исключительной преданности
              accessed: "2026-09-25"
        answer:
          points:
            - "Крещение совершается «во имя Отца и Сына и Святаго Духа» (Мф 28:19): одно имя, а не три, и Сын и Дух поставлены рядом с Отцом, а не ниже Его как творение и сила."
            - Апостол призывает на верных благодать Христа, любовь Бога и причастие Святого Духа как три равночестных источника одного благословения (2 Кор 13:13).
            - "Отсутствие самого слова «Троица» в Писании не опровергает учения: Церковь назвала словом то, что открыто в Писании, — так же, как слово «Библия» не встречается в самой Библии."
            - "«Отец Мой более Меня» (Ин 14:28) сказано Сыном, Который «уничижил Себя Самого, приняв образ раба» (Флп 2:6–7); в том же Евангелии Фома исповедует воскресшего Христа: «Господь мой и Бог мой!» (Ин 20:28)."
            - Стих о трёх свидетельствующих на небе (1 Ин 5:7) отсутствует в древних греческих рукописях; это вопрос текстологии, а не догмата. Учение о Троице опирается на другие места Писания и на веру Церкви, выраженную в Символе.
          proof:
            - url: https://azbyka.ru/simvol_very
              title: "Никео-Цареградский Символ веры, член 2: о Сыне"
              tier: official
              excerpt: Бога истинна от Бога истинна, рожде́нна, несотворе́нна, единосущна Отцу
              accessed: 2026-10-01T00:00:00.000Z
            - url: https://azbyka.ru/simvol_very
              title: "Никео-Цареградский Символ веры, член 8: о Святом Духе"
              tier: official
              excerpt: Иже со Отцем и Сыном спокланя́ема и ссла́вима
              accessed: 2026-10-01T00:00:00.000Z
