        answer:
          points:
            - "Христос говорит: «сие есть Тело Мое… сие есть Кровь Моя» (Мф 26:26–28), а апостол Павел называет чашу и хлеб «приобщением Крови Христовой» и «приобщением Тела Христова» (1 Кор 10:16). Недостойно причащающийся «виновен будет против Тела и Крови Господней» (1 Кор 11:27) — так не говорят о простом символе."
            - "«Плоть Моя истинно есть пища, и Кровь Моя истинно есть питие» (Ин 6:55). Запрет употреблять кровь (Быт 9:4), на который ссылаются Свидетели, не отменяет слов Законодателя: Сам Господь велит пить Его Кровь (Ин 6:54; Мф 26:27)."
            - "Слова Христа обращены ко всем: «если не будете есть Плоти Сына Человеческого… не будете иметь в себе жизни» (Ин 6:53) и «пейте из неё все» (Мф 26:27). Деления на небесных избранных и остальных, которым достаточно присутствовать, в этих словах нет."
            - "Церковь читает Ин 6 как обетование Евхаристии, которую Господь затем установил на Тайной вечери. Блаж. Феофилакт Болгарский говорит, что здесь Христос «ясно говорит… о таинственном причастии Его тела», и хлеб Таинства «не есть образ тела Господня, но есть самая Плоть Господа». Вера в жертву не отменяет причастия: Господь требует и того, и другого."
            - "Частота не определена Писанием: «сие творите в Мое воспоминание» (Лк 22:19). Первые христиане «постоянно пребывали… в преломлении хлеба» (Деян 2:42) и собирались для него «в первый день недели» (Деян 20:7), то есть не раз в год."
