        answer:
          points:
            - "В Откр 7 слышится число запечатлённых — «сто сорок четыре тысячи из всех колен сынов Израилевых» (7:4), а видится «великое множество… из всех племён» пред престолом и пред Агнцем (7:9): это один народ Божий. Архиеп. Аверкий (Таушев) понимает ограниченное число как малую часть спасённых по сравнению с множеством из всех народов, пребывающим «перед престолом Божиим»."
            - "Число выглядит символическим: в Откр 7:5–8 от каждого из двенадцати колен запечатлено ровно «двенадцать тысяч». Название «малое стадо» (Лк 12:32) относится к ученикам, которым Отец «благоволил дать Царство», а не к закрытому числу."
            - "Христос не делит верных на два разряда: «Есть у Меня и другие овцы… и будет одно стадо и один Пастырь» (Ин 10:16); «одна надежда вашего звания» (Еф 4:4); «все вы одно во Христе Иисусе» (Гал 3:28). В заповедях блаженства «кроткие наследуют землю» стоит рядом с «их есть Царство Небесное» (Мф 5:3, 5) — это одно обетование."
            - "Небо и земля не разделены: «новое небо и новая земля», и «скиния Бога с человеками» (Откр 21:1–3); «так всегда с Господом будем» (1 Фес 4:17). В Синодальном переводе Откр 5:10 — «будем царствовать на земле», тогда как «Перевод нового мира» читает «они будут править землёй»."
