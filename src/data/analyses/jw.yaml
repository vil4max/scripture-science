      - id: preaching
        title: Проповедь и отчёты
        short: "Церковь учит, что проповедь неотделима от Таинств и ведётся теми, кого Церковь послала, а Свидетели Иеговы считают проповедь по домам обязанностью каждого верующего и отчитываются о ней перед своим собранием."
        topic: worship
        church:
          text: "Церковь продолжает дело, которое Господь поручил апостолам: «идите, научите все народы, крестя их во имя Отца и Сына и Святого Духа» (Мф 28:19). Проповедь в Церкви неотделима от Таинств и от апостольского посланничества: «как проповедовать, если не будут посланы?» (Рим 10:15). Церковь исповедуется в Символе веры Единой, Святой, Соборной и Апостольской, а апостольское преемство иерархии — основание общности и единства благодатной жизни."
