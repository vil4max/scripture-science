      - id: holy-spirit
        title: "Святой Дух: Лицо или сила"
        short: "Церковь учит, что Святой Дух — третье Лицо Троицы, истинный Бог, равный Отцу и Сыну, а Свидетели Иеговы считают святой дух не личностью, а действующей силой Бога."
        topic: spirit
        church:
          text: "Святой Дух — третье Лицо Святой Троицы, истинный Бог: Господь животворящий, Который от Отца исходит, Которому поклоняются и Которого славят вместе с Отцом и Сыном и Который говорил через пророков. Он не безличная сила, а Лицо, равное Отцу и Сыну по Божественному достоинству."
