              title: Лк. 24:39 — Синодальный перевод
              tier: official
              excerpt: осяжите Меня и рассмотри́те; ибо дух плоти и костей не имеет
              accessed: 2026-10-01T00:00:00.000Z
            - url: https://azbyka.ru/biblia/?Jn.20:27&r
              title: Ин. 20:27 — Синодальный перевод
              tier: official
              excerpt: подай руку твою и вложи в ребра Мои
              accessed: 2026-10-01T00:00:00.000Z
        tradition:
          text: "Свидетели Иеговы учат, что Иисус был воскрешён как духовная личность: «предан смерти в плоти, но оживлён в духе» (1 Пет 3:18). По их учению, плоть он отдал как выкуп и вернуть её не мог, а ученикам являлся в телах, которые временно принимал, как ангелы, — поэтому его не сразу узнавали. Тело с ранами Фоме он показал, чтобы укрепить веру апостола."
          proof:
            - url: https://www.jw.org/ru/библейские-учения/вопросы/тело-иисуса/
              title: "«Каким было тело Иисуса Христа после воскресения: плотским или духовным?» — Библейские вопросы, jw.org"
              tier: official
              excerpt: В Библии сказано, что Иисус был «предан смерти в плоти, но оживлен в духе»
              accessed: 2026-10-01T00:00:00.000Z
            - url: https://www.jw.org/ru/библейские-учения/вопросы/тело-иисуса/
              title: "«Каким было тело Иисуса Христа после воскресения: плотским или духовным?» — Библейские вопросы, jw.org"
              tier: official
              excerpt: Если бы он после воскресения вновь обрел свое плотское тело, то это свело бы на нет его искупительную жертву
              accessed: 2026-10-01T00:00:00.000Z
            - url: https://www.jw.org/ru/библейские-учения/вопросы/тело-иисуса/
              title: "«Каким было тело Иисуса Христа после воскресения: плотским или духовным?» — Библейские вопросы, jw.org"
              tier: official
              excerpt: Всякий раз он материализовался в разных физических телах
              accessed: 2026-10-01T00:00:00.000Z
            - url: https://www.jw.org/ru/библейские-учения/вопросы/тело-иисуса/
              title: "«Каким было тело Иисуса Христа после воскресения: плотским или духовным?» — Библейские вопросы, jw.org"
              tier: official
              excerpt: Апостолу Фоме Иисус явился в теле, на котором были раны
              accessed: 2026-10-01T00:00:00.000Z
        answer:
          points:
            - "Христос Сам отвергает мысль о призраке: «осяжите Меня… ибо дух плоти и костей не имеет» (Лк 24:39), и ест пред учениками (Лк 24:42–43); Фоме Он велит вложить руку в рёбра Свои (Ин 20:27). Это не «материализованный» образ, а то самое тело, пронзённое на кресте."
            - "Господь предсказал это: «разрушьте храм сей, и Я в три дня воздвигну его» — «о храме тела Своего» (Ин 2:19–21); «имею власть отдать её и власть имею опять принять её» (Ин 10:18). Плоть отдана на кресте добровольно, и Он Сам принимает её вновь; искупление этим не отменяется."
            - "Слова «ожив духом» (1 Пет 3:18) свт. Филарет приводит в катехизисе при учении о сошествии Христа во ад (§§213–214): они говорят о Его жизни по смерти, а не о том, что тела не стало."
            - "«Тело духовное» (1 Кор 15:44) — не бестелесное: Христос «преобразит уничиженное тело наше, чтобы оно было сообразно славному телу Его» (Флп 3:21). «Плоть и кровь не могут наследовать Царствия Божия» (1 Кор 15:50) апостол поясняет словами «и тление не наследует нетления»: речь о тленности, а не об отсутствии тела."
          proof:
            - url: https://azbyka.ru/biblia/?Lk.24:39&r
              title: Лк. 24:39 — Синодальный перевод
              tier: official
              excerpt: это Я Сам
              accessed: 2026-10-01T00:00:00.000Z
            - url: https://azbyka.ru/biblia/?Lk.24:43&r
              title: Лк. 24:43 — Синодальный перевод
