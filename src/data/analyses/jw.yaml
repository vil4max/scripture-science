      - id: great-apostasy
        title: Церковь и «великое отступничество»
        short: "Церковь учит, что она непрерывно существует от апостолов и не исчезала, а Свидетели Иеговы — что после смерти апостолов началось великое отступничество, а с 1914 года Бог восстанавливает чистое поклонение."
        topic: organisation
        church:
          text: "Церковь исповедует себя Единой, Святой, Соборной и Апостольской: Господь основал её, и «врата ада не одолеют её» (Мф 16:18). Её преемство — не сохранение отдельных верных тезисов, а непрерывность благодатной жизни, веры, священства и Таинств от апостолов. Христос — единственная Глава Церкви, и Он с учениками «во все дни до скончания века» (Мф 28:20)."
