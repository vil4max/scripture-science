        tradition:
          text: Свидетели Иеговы учат, что после смерти апостолов началось великое отступничество, а с 1914 года Бог, по их учению, восстанавливает чистое поклонение. Вместе с тем, по их словам, с первого века на земле всегда был кто-то из помазанных истинных христиан — «пшеница» среди «сорняков» (Мф 13:30); первым свидетелем Иеговы они называют Авеля. Современную организацию они ведут от группы исследователей Библии, начавшей искать истину в 1870 году, и считают их «пшеницей».
