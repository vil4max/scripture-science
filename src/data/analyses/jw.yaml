        answer:
          points:
            - "1 Кор 5:11 говорит о христианине, впавшем в блуд, и тот же апостол называет цель — «чтобы дух был спасен в день Господа нашего Иисуса Христа» (1 Кор 5:5), а о раскаявшемся пишет: «вам лучше уже простить его и утешить» (2 Кор 2:7). Цель дисциплины — спасение, а не изоляция."
            - "2 Фес 3:14–15 ставит предел: даже непослушного «не считайте его за врага, а вразумляйте, как брата». Господь Сам радуется об одном кающемся грешнике (Лк 15:7), поэтому правило 52 святых Апостолов осуждает епископа, не принимающего обращающегося от греха."
            - Церковь тоже знает отлучение, но оно касается церковного общения — богослужения и Таинств — и снимается покаянием; по Азбуке веры, полностью отлучённому ни один верный не должен давать религиозного общения, а частного общения не должны иметь только духовные лица. Канонов, предписывающих разрыв семейных отношений, в этом описании нет.
            - Свидетели указывают, что в семье, живущей под одной крышей, привычная жизнь продолжается (jw.org). Православные авторы — проф. А. Л. Дворкин и К. Кириллова — и бывший Свидетель Иеговы Д. Рид описывают последствия избегания для семей тяжелее; это оценки и свидетельства авторов, а не церковное определение.
          proof:
