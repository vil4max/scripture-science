        title: Крест или столб
        short: "Церковь чтит Крест как орудие, которым совершилось спасение, а Свидетели Иеговы учат, что Иисус умер на вертикальном столбе, и не используют крест в поклонении."
        topic: images
        church:
          text: "Церковь чтит Крест Христов как орудие, которым совершилось спасение: «слово о кресте… для нас, спасаемых, — сила Божия» (1 Кор 1:18). Крест почитается не как идол и не как талисман, а ради Распятого на нём Господа: апостол Павел не желал «хвалиться, разве только крестом Господа нашего Иисуса Христа» (Гал 6:14). Крестное знамение, по катехизису, ведёт начало со времён апостольских."
          proof:
