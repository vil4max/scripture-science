      - id: michael
        title: Христос и архангел Михаил
        short: "Церковь учит, что Сын Божий — Творец ангелов, а архангел Михаил — сотворённый ангел, тогда как Свидетели Иеговы считают Михаила именем, которое Иисус Христос носит на небе."
        topic: jesus
        church:
          text: Сын Божий — Творец всего видимого и невидимого, в том числе ангелов, и Ему поклоняются все ангелы. Архангел Михаил — сотворённый ангел, один из высших начальников небесного воинства, а не имя Самого Христа.
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: "Свт. Филарет. Пространный катехизис, §§99–103: об ангелах"
              tier: official
              excerpt: Невидимое сотворено прежде видимого, и Ангелы – прежде людей
              accessed: 2026-10-01T00:00:00.000Z
            - url: https://azbyka.ru/biblia/?Col.1:16&r
              title: Кол. 1:16 — Синодальный перевод
              tier: official
              excerpt: "видимое и невидимое: престолы ли, господства ли, начальства ли, власти ли"
              accessed: 2026-10-01T00:00:00.000Z
            - url: https://azbyka.ru/biblia/?Hebr.1:6&r
              title: Евр. 1:6 — Синодальный перевод
              tier: official
              excerpt: и да поклонятся Ему все Ангелы Божии
              accessed: 2026-10-01T00:00:00.000Z
        tradition:
          text: "Свидетели Иеговы учат, что архангел Михаил, по всей видимости, — это Иисус Христос: такое имя Он носил до прихода на землю и носит после вознесения на небо. Основания они видят в том, что слово «архангел» в Библии стоит только в единственном числе (Иуд 9; 1 Фес 4:16) и что Михаил возглавляет воинство ангелов (Откр 12:7). Они полагают, что над ангелами не могут стоять два командующих, и потому видят в Михаиле и Иисусе одну личность."
          proof:
            - url: https://www.jw.org/ru/библейские-учения/вопросы/архангел-михаил/
              title: «Архангел Михаил — кто он?» — Библейские вопросы, jw.org
