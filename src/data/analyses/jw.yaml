        answer:
          points:
            - "Христос обещал: «врата ада не одолеют» Церковь (Мф 16:18) и «Я с вами во все дни до скончания века» (Мф 28:20); Павел называет Церковь Бога живого «столп и утверждение истины» (1 Тим 3:15) — то же слово приводит и «Понимание Писания» («столпом и опорой истины»). Полное исчезновение Церкви на 18 веков с такими обетованиями несовместимо."
            - "«Оставьте расти вместе то и другое до жатвы» (Мф 13:30), а «поле есть мир» (Мф 13:38): притча о сосуществовании в одном мире, а не об исчезновении пшеницы. Сами Свидетели пишут: «мы не можем точно сказать», какие группы или люди составляли «пшеницу» («Сторожевая башня», 15 января 2012 г.), и называют лишь отдельных лиц, живших в Западной Европе."
            - "Преемство включает рукоположение, единство веры и Таинств, а не только согласие с отдельными положениями: Павел и Варнава, «рукоположив... пресвитеров к каждой церкви» (Деян 14:23); Тимофей получил дар «с возложением рук священства» (1 Тим 4:14); ср. Основные принципы РПЦ к инославию, §1.9."
            - "Упоминание Авеля (Евр 11:4) не доказывает тождества праведника древности и организации XIX века: по Евр 11:40, ветхозаветные праведники достигают совершенства «не без нас» — вместе с Церковью. Слова Ис 43:10 о свидетелях Господа обращены к Израилю (Ис 43:1), а апостолам Христос говорит: «будете Мне свидетелями» (Деян 1:8)."
