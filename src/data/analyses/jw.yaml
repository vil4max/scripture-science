        answer:
          points:
            - "Апостол Пётр говорит Анании, что тот решился «солгать Духу Святому», и тут же поясняет: «ты солгал не человекам, а Богу» (Деян 5:3–4). Обмануть можно лицо, а не силу, и это Лицо названо Богом."
            - "Дух говорит о Себе в первом лице: «Дух Святой сказал: отделите Мне Варнаву и Савла на дело, к которому Я призвал их» (Деян 13:2). Он «разделяет каждому особо, как Ему угодно» (1 Кор 12:11) и «Сам Дух ходатайствует за нас» (Рим 8:26)."
            - Святого Духа можно «оскорбить» (Еф 4:30), а это невозможно по отношению к безличной силе.
            - "Господь называет Духа Утешителем и говорит о Нём «Он»: «Дух истины, Который от Отца исходит, Он будет свидетельствовать о Мне» (Ин 15:26), «будет говорить, что услышит» (Ин 16:13)."
            - Олицетворение мудрости или греха — поэтическая речь; в Деян 5:3–4 же Дух прямо назван Богом, и в Церкви Он исповедуется Лицом Троицы, равным Отцу и Сыну.
