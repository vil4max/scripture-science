        answer:
          points:
            - "Служения различны: Христос «поставил одних апостолами, других пророками, иных Евангелистами, иных пастырями и учителями» (Еф 4:11); «Все ли апостолы? Все ли пророки? Все ли учители?» (1 Кор 12:29). Проповедь — общее призвание, но учить и священнодействовать поручено поставленным."
            - "Апостолы совершали рукоположение: «рукоположив же им пресвитеров к каждой церкви, они помолились с постом» (Деян 14:23); Тимофею напоминается о «даровании, которое дано тебе по пророчеству с возложением рук священства» (1 Тим 4:14), а Тит оставлен в Крите, чтобы «поставил по всем городам пресвитеров» (Тит 1:5) — на этот стих ссылается и «Сторожевая башня» (2000)."
            - "Всеобщее священство христиан (1 Пет 2:9) не отменяет особого служения пастырей: тот же апостол обращается к пастырям: «пасите Божие стадо» (1 Пет 5:1–2)."
            - "Крещение — не только символ: «если кто не родится от воды и Духа, не может войти в Царствие Божие» (Ин 3:5); Бог спас нас «банею возрождения» (Тит 3:5). Вечеря — не только воспоминание: «Чаша благословения... не есть ли приобщение Крови Христовой? Хлеб... не есть ли приобщение Тела Христова?» (1 Кор 10:16)."
