            - url: https://wol.jw.org/ru/wol/d/r2/lp-u/2013533
              title: «Кто же верный и благоразумный раб?» — «Сторожевая башня», 15 июля 2013, с. 20—25, wol.jw.org
              tier: official
              excerpt: В 1919 году — это было временем духовного возрождения — Иисус избрал из их числа опытных помазанных братьев для служения в качестве верного и благоразумного раба и поставил их над своими домашними.
              accessed: 2026-10-01T00:00:00.000Z
        answer:
          points:
            - "По изложению самих Свидетелей («Сторожевая башня», 15 июля 2013 г.), «раб» прежде означал всех помазанников с Пятидесятницы 33 года, а теперь — малую группу, назначенную в 1919 году. Ни Мф 24:45–47, ни Мал 3:1–4, на который опирается эта дата, не называют ни 1919 года, ни организации: связь вводит толкование Общества."
            - "Если «раб» назначен в 1919 году, кто в прежние века давал домашним «пищу вовремя»? В «Понимании Писания» сказано: «После смерти апостолов началось великое отступничество». Христос же обещал быть с учениками «во все дни до скончания века» (Мф 28:20), а Церковь — «столп и утверждение истины» (1 Тим 3:15)."
            - Иерусалимский собор (Деян 15), на который ссылаются Свидетели, — это «апостолы и пресвитеры со всею церковью» (Деян 15:22) и слова «угодно Святому Духу и нам» (Деян 15:28); его определения в городах «предавали верным соблюдать» (Деян 16:4). Это образец собора служителей всей Церкви, а не постоянного органа в одном центре.
            - "Писание связывает «верность» домоправителя со служением в Церкви: «требуется, чтобы каждый оказался верным» (1 Кор 4:2); епископ — «Божий домостроитель» (Тит 1:7); в Лк 12:42 — «кто верный и благоразумный домоправитель». Притча не называет ни организации, ни даты."
          proof:
