        tradition:
          text: Свидетели Иеговы заявляют, что основывают свои учения на всех 66 книгах Библии, и признают авторитетным только записанное слово Бога. В «Понимании Писания» они пишут, что традиции Иисуса и апостолов угодны Богу, но «вошли в боговдохновенные Писания» и сохранились в них неизменными, а предание, на которое ссылаются церкви, противопоставляют Писанию как «человеческие традиции» (Мк 7:8). Единое обучение и указания для всех собраний, по их словам, исходят от Руководящего совета.
