        tradition:
          text: Свидетели Иеговы учат, что руководство организацией и обучение собраний осуществляет Руководящий совет — небольшая группа помазанных мужчин в Уорвике, которая, по их учению, и есть «верный и благоразумный раб» (Мф 24:45), назначенный Христом в 1919 году. Члены совета, как они подчёркивают, не являются лидерами организации и обращаются за разъяснением к Библии. В 2013 году прежнее понимание «раба» как всех помазанных христиан, живущих на земле с Пятидесятницы 33 года, было заменено этим.
