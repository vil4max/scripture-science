          text: "Церковь молится Христу и поклоняется Ему как Богу вместе с Отцом: Сын достоин той же чести, что и Отец (Ин 5:23). Так молился первомученик Стефан, умирая: «Господи Иисусе! приими дух мой» (Деян 7:59); так христиане с апостольских времён «призывают имя Господа нашего Иисуса Христа» (1 Кор 1:2). В небесном видении благословение, честь и слава воздаются Агнцу вместе с Сидящим на престоле (Откр 5:13)."
