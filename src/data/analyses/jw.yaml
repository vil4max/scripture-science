        tradition:
          text: "Свидетели Иеговы верят в воскресение, но понимают его как воссоздание той же личности, а не как соединение души с телом: душа, по их учению, — это сам человек. Небольшое число людей, 144 000, воскресает к жизни на небе, а большинство — на земле, во время Тысячелетнего правления Христа. Тех, кто закоснел в грехе настолько, что его уже не исправить, они считают не подлежащими воскресению."
