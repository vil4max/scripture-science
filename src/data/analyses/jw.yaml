    cards:
      - id: ransom
        title: Искупление и «соответствующий выкуп»
        short: "Церковь учит, что от греха и смерти людей избавил Своей крестной смертью Христос, Бог и человек, а Свидетели Иеговы — что Иисус отдал совершенную человеческую жизнь взамен утраченной Адамом."
        topic: salvation
        church:
          text: Господь Иисус Христос, Бог и человек в одном Лице, Своей крестной смертью избавил людей от греха, проклятия и смерти. Его добровольные страдания имеют бесконечную цену, потому что страдал безгрешный Богочеловек. Жертва принесена за всех людей (1 Ин 2:2), но плодами её пользуются те, кто с верой принимает её в Церкви.
