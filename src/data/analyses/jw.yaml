        answer:
          points:
            - "Крещение — не только символ посвящения, но и рождение свыше: «если кто не родится от воды и Духа, не может войти в Царствие Божие» (Ин 3:5). Бог спасает нас «банею возрождения и обновления Святым Духом» (Тит 3:5); «крестись и омой грехи твои» (Деян 22:16); «крещение… ныне спасает нас» (1 Пет 3:21)."
            - "Писание знает крещение целых домов: Лидии «и домашних её» (Деян 16:15), темничного стража «и всех домашних его» (Деян 16:33), «Стефанов дом» (1 Кор 1:16). Крещение заменило обрезание, совершавшееся над младенцами (Кол 2:11–12; свт. Филарет, катехизис, §§290–291)."
            - "Господь не гонит детей: «пустите детей приходить ко Мне и не препятствуйте им, ибо таковых есть Царствие Божие» (Мк 10:14), а обетование принадлежит «вам и детям вашим» (Деян 2:39)."
            - "«Одно крещение» (Еф 4:5) не повторяется: оно есть духовное рождение, а рождается человек однажды (свт. Филарет, катехизис, §301). Случай из Деян 19:1–5, на который ссылаются Свидетели, — о людях, принявших лишь «Иоанново крещение» и не слыхавших о Духе Святом: это иное, дохристианское крещение."
