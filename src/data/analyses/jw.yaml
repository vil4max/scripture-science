        answer:
          points:
            - "Предел повиновения Церковь определяет так же, как и Свидетели: «должно повиноваться больше Богу, нежели человекам» (Деян 5:29); неповиновение допустимо, когда власть принуждает к тяжкому греху (Основы социальной концепции, III.5). Спор идёт о том, является ли службу в армии или почтение государственных символов таким грехом."
            - "Воинское звание Писание не осуждает: Креститель говорит воинам «никого не обижайте… довольствуйтесь своим жалованьем» (Лк 3:14), Господь не находит «такой веры» даже в Израиле, как у сотника (Мф 8:10), сотник Корнилий — «благочестивый и боящийся Бога» (Деян 10:2). Это православное прочтение; прямого запрета на службу в этих местах нет."
            - "«Все, взявшие меч, мечом погибнут» (Мф 26:52) сказано ученику в Гефсимании, а Ис 2:4 говорит о том, что будет «в последние дни» (Ис 2:2). Церковь признаёт войну злом, но помнит слова Господа: «нет больше той любви, как если кто положит душу свою за друзей своих» (Ин 15:13; Основы социальной концепции, VIII.2)."
            - "Различие между почестью власти и богопоклонением апостол проводит прямо: «Бога бойтесь, царя чтите» (1 Пет 2:17). Свидетели сами признают, что у других есть право участвовать в церемониях, и считают такое участие недопустимым только для себя."
          proof:
