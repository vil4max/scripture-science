        tradition:
          text: Свидетели Иеговы раз в год, вечером 14 нисана, отмечают Вечерю воспоминания смерти Христа. Хлеб без закваски и красное вино, по их учению, — лишь символы его тела и крови, а само празднование не таинство и не обряд, дарующий благодать. Вкушают от них только «помазанные» — те, с кем, по их вере, заключено новое соглашение и кто будет править с Христом на небе; остальные присутствуют, не причащаясь. Слова «если не будете есть Плоти Сына Человеческого» (Ин 6:53) они понимают в переносном смысле — как веру в жертву Иисуса — и не относят к Вечере, ведь, по их хронологии, речь произнесена в 32 году, за год до её установления. «Иметь в себе жизнь», по их учению, помазанные обретут на небе, а христиане с земной надеждой — лишь по окончании Тысячелетнего правления Христа.
