            - url: https://www.jw.org/ru/библиотека/библия/nwt/содержание/Луки/23/
              title: Евангелие от Луки, глава 23 — Перевод нового мира, jw.org
              tier: official
              excerpt: "Обещаю тебе сегодня: ты будешь со мной в раю"
              accessed: 2026-10-01T00:00:00.000Z
            - url: https://www.jw.org/ru/библейские-учения/вопросы/богач-и-лазарь/
              title: «Кем были богач и Лазарь? Значение притчи Иисуса (Луки 16:19—31)» — Библейские вопросы, jw.org
              tier: official
              excerpt: Это притча, которую Иисус рассказал, чтобы преподать важный урок
              accessed: 2026-10-01T00:00:00.000Z
        answer:
          points:
            - "Слова «мёртвые ничего не знают» (Еккл 9:5) относятся к земной жизни: у умерших нет более «части во веки ни в чём, что делается под солнцем» (Еккл 9:6). О душе та же книга говорит иначе: «дух возвратится к Богу, Который дал его» (Еккл 12:7)."
            - "«Душа согрешающая, та умрёт» (Иез 18:4) говорит о смерти как плате за грех. По катехизису свт. Филарета душа может умереть, но не так, как тело: умирая через грех, она лишается света и блаженства, «но не разрушается и не уничтожается» (§165); а Господь различает тех, кто убивает тело, и душу, которую убить не могут (Мф 10:28)."
            - "Христос отвечает кающемуся разбойнику, просившему помянуть его «когда приидешь в Царствие Твое» (Лк 23:42): «ныне же будешь со Мною в раю» (Лк 23:43). «Перевод нового мира» ставит знак препинания иначе («Обещаю тебе сегодня: ты будешь со мной в раю»), а свт. Игнатий (Брянчанинов) понимает стих так: «Очевидно, что разбойник душою помещен в рай»."
            - "Апостол Павел говорит, что имеет «желание разрешиться и быть со Христом», потому что «это несравненно лучше» (Флп 1:23): он ждёт за смертью пребывания со Христом, а не небытия."
            - В притче о богаче и Лазаре оба сознают себя сразу после смерти (Лк 16:22–23). Свидетели видят в ней лишь иллюстрацию, но Церковь опирается не на одну притчу, а и на слова Христа, что Бог — «Бог не мёртвых, но живых» (Мф 22:32; Лк 20:38).
