        answer:
          points:
            - "Спасает Христос, а не принадлежность к человеческой организации: «нет другого имени под небом, данного человекам, которым надлежало бы нам спастись» (Деян 4:12) — слова, на которые ссылаются и сами Свидетели. Христос — «глава тела Церкви» и «Спаситель тела» (Кол 1:18; Еф 5:23)."
            - "Церковь — не созданная людьми организация, а Тело Христово: Господь Сам обещал создать её, и «врата ада не одолеют её» (Мф 16:18). Она — «столп и утверждение истины» (1 Тим 3:15), и в ней Господь «ежедневно прилагал спасаемых» (Деян 2:47)."
            - "Благодать и дела не противоположны: «Он спас нас не по делам праведности, которые бы мы сотворили, а по Своей милости, банею возрождения и обновления Святым Духом» (Тит 3:5). «Баня возрождения» — таинство крещения (Ин 3:5); оно же возвещено в Мк 16:16."
            - "Благодать принимается верой и жизнью в Церкви: «мы — Его творение, созданы во Христе Иисусе на добрые дела» (Еф 2:10). Именно так Церковь понимает синергию — соработничество человека с Богом."
          proof:
            - url: https://azbyka.ru/biblia/?Act.4:12&r
