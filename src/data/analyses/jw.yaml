        answer:
          points:
            - "«Всё чрез Него начало быть» (Ин 1:3): тот, чрез Кого создано всё, не может быть одним из созданных. Отсутствие артикля при слове «Бог» в Ин 1:1 не умаляет Сына: свт. Иоанн Златоуст напоминает, что апостол и об Отце говорит без члена (Флп 2:6), и потому Сын не меньший."
            - "Кол 1:15 в Синодальном переводе — «рожденный прежде всякой твари»: рождённый, а не сотворённый (так понимают свт. Иоанн Златоуст и свт. Афанасий Великий: Сын назван перворождённым, потому что Им получила бытие тварь). «Перевод нового мира» читает «первый из всех творений» и добавляет в Кол 1:16–17 слово «остальное», которого нет в Синодальном переводе."
            - "Христос в Писании назван Богом: «Господь мой и Бог мой!» (Ин 20:28; так передаёт слова Фомы и «Перевод нового мира»), «престол Твой, Боже, в век века» (Евр 1:8), «великого Бога и Спасителя нашего Иисуса Христа» (Тит 2:13), «сущий над всем Бог» (Рим 9:5)."
            - "«Отец больше меня» (Ин 14:28) сказано воплотившимся Сыном, «приявшим образ раба» (Флп 2:6–7). О Его вечном достоинстве те же Писания говорят: «прежде нежели был Авраам, Я есмь» (Ин 8:58), «в Нём обитает вся полнота Божества телесно» (Кол 2:9)."
