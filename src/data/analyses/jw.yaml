        answer:
          points:
            - "Мир не просто очищается для прежней жизни, а преображается: «прежнее небо и прежняя земля миновали» (Откр 21:1), тварь «освобождена будет от рабства тлению» (Рим 8:21), «в воскресении ни женятся, ни выходят замуж, но пребывают, как Ангелы Божии на небесах» (Мф 22:30), и «Бог все во всем» (1 Кор 15:28)."
            - "Свт. Филарет различает три царства Христа — природы (весь мир), благодати (верующие на земле) и славы (блаженные на небесах) — и слова Символа «Егоже Царствию не будет конца» относит к царству славы. Христос говорит Пилату: «Царство Мое не от мира сего» (Ин 18:36)."
            - "Архиеп. Аверкий (Таушев) вслед за св. Андреем Кесарийским видит в «тысяче лет» Откр 20 время от Воплощения Христа до пришествия антихриста и отмечает, что хилиазм вводит два воскресения, тогда как Христос говорит об одном: «Я воскрешу его в последний день» (Ин 6:40)."
            - "Армагеддон (Откр 16:16) — место, куда бесовские духи выходят «к царям земли всей вселенной, чтобы собрать их на брань в оный великий день Бога Вседержителя» (Откр 16:14); по св. Андрею Кесарийскому, как его приводит архиеп. Аверкий, там будут избиты народы, предводимые диаволом. Срока Христос не открыл: «О дне же том и часе никто не знает» (Мф 24:36)."
