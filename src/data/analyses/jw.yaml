        answer:
          points:
            - "Церковь празднует события спасения: «возвещаю вам великую радость… родился вам в городе Давидовом Спаситель» (Лк 2:10–11), «Пасха наша, Христос, заклан за нас. Посему станем праздновать» (1 Кор 5:7–8). Довод о происхождении дат или обычаев не касается смысла праздника."
            - "Свидетели ссылаются на два дня рождения в Библии — фараона и Ирода (Быт 40:20; Мф 14:6), но Писание говорит и о радости при рождении праведного: «многие о рождении его возрадуются» (Лк 1:14). Церковь празднует не «дни рождения» вообще, а Рождество Христово и события священной истории."
            - Апостол допускает различение дней «для Господа» (Рим 14:5–6). Сам Христос приходит в храм на праздник Обновления, не предписанный Моисеем (Ин 10:22–23).
            - "Слова «сие творите в Мое воспоминание» (Лк 22:19) не ограничивают Вечерю одним днём в году: ученики собрались «в первый же день недели… для преломления хлеба» (Деян 20:7), а апостол пишет «всякий раз, когда вы едите хлеб сей» (1 Кор 11:26). Церковь совершает Евхаристию постоянно."
          proof:
