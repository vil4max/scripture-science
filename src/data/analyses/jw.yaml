        tradition:
          text: "Свидетели Иеговы учат, что Адам потерял для себя и потомков совершенную человеческую жизнь, а Иисус отдал жертву, которая в точности ей соответствует: одну совершенную человеческую жизнь — «соответствующий выкуп за всех» (1 Тим 2:6 в «Переводе нового мира»). Избавление от греха и смерти даётся тем, кто проявляет веру в Христа и слушается его."
