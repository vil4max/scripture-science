        tradition:
          text: "Свидетели Иеговы не называют Марию Богородицей и не почитают её: по их учению, она родила «Сына Всевышнего», а не самого Бога, а у Марии и Иосифа были и другие дети. Молиться, как они учат, нужно только Богу, во имя Иисуса Христа; молиться святым и ангелам не следует."
          proof:
            - url: https://www.jw.org/ru/библейские-учения/вопросы/мать-мария-богородица-теотокос/
