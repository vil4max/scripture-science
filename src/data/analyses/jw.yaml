        answer:
          points:
            - "Праведная Елисавета называет Марию «Матерью Господа моего» (Лк 1:43), ангел — «Благодатной» (Лк 1:28), а Сама Она предрекает: «отныне будут ублажать Меня все роды» (Лк 1:48). Слово Христа в Лк 11:27–28 не отрицает блаженства Матери, а указывает путь: слышать слово Божие — так Мария и ответила ангелу (Лк 1:38)."
            - "«Богородица» исповедует веру о Христе, а не обожествляет Марию: Она — Мать по человечеству, а Сын вечен по Божеству (катехизис, §187). Довод, что у Бога не может быть матери, а небеса Его не вмещают, относится к Божеству; Церковь же исповедует, что «Слово стало плотию» (Ин 1:14)."
            - «Братьев Господних» (Мк 6:3) прот. Олег Стеняев понимает как детей праведного Иосифа; Церковь исповедует Марию Приснодевой (катехизис, §184). Это православное толкование, а не слово самого Писания.
            - "Христос — «Бог не мёртвых, но живых» (Мф 22:32), праведники — «облако свидетелей» (Евр 12:1), а «молитвы святых» возносятся перед Агнцем (Откр 5:8): если можно просить о молитве друг друга (Иак 5:16; 1 Тим 2:1), то можно и тех, кто уже со Христом. Поклонение, которое отвергает ангел (Откр 19:10), и почитание святых Церковь различает (катехизис, §511)."
          proof:
