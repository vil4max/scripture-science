      - id: resurrection-of-christ
        title: Воскресение Христа
        short: "Церковь учит, что Христос воскрес в том же теле, только прославленном, а Свидетели Иеговы — что Иисус воскрешён как духовная личность, а ученикам являлся во временно принятых телах."
        topic: jesus
        church:
          text: "Христос воскрес в третий день по Писанию — не только духом, но и телом: тот же Господь, Который был распят, предстал ученикам в Своём теле, носящем раны, ел с ними и допускал осязать Себя. Его тело прославлено и преображено, но не заменено иным; с этим телом, человечеством, Он вознёсся на небо."
          proof:
            - url: https://azbyka.ru/simvol_very
              title: "Никео-Цареградский Символ веры, член 5: о Воскресении"
              tier: official
