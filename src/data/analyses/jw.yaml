        title: Священство и таинства
        short: "Церковь учит, что священство — Таинство, идущее от апостолов через рукоположение епископов, а Свидетели Иеговы считают особое духовенство позднейшим явлением: по их учению, все ученики Христа — служители."
        topic: organisation
        church:
          text: "Священство — Таинство, в котором Святой Дух посредством епископского рукоположения поставляет правильно избранного кандидата совершать Таинства и пасти стадо Христово; степеней священства три: епископ, пресвитер и диакон. Иерархия Церкви ведёт начало от Христа и сошедшего на апостолов Святого Духа и непрерывно продолжается через преемственное рукоположение. Таинство — священное действие, через которое тайным образом действует на человека благодать; в Крещении человек таинственно рождается в жизнь духовную."
