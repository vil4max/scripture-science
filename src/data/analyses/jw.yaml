        answer:
          points:
            - 20 апреля 2017 года Верховный суд РФ по иску Минюста решил ликвидировать Религиозную организацию «Управленческий центр Свидетелей Иеговы в России» и входящие в её структуру местные религиозные организации и обратить имущество в собственность РФ; 17 июля 2017 года Апелляционная коллегия Верховного суда оставила решение в силе (реестр Минюста).
            - Выборгский городской суд Ленинградской области 17 августа 2017 года признал экстремистским «Перевод нового мира» на русском языке (издание марта 2014 года); он внесён в Федеральный список экстремистских материалов под № 4488.
            - 7 июня 2022 года Европейский суд по правам человека в деле «Таганрогская МРО и другие против России» (жалоба № 32401/10 и ещё 19) шестью голосами против одного признал нарушения статей 9, 10, 11 Конвенции, а также статьи 5 и статьи 1 Протокола № 1. С 16 сентября 2022 года Россия не является участником Конвенции.
            - Приведены факты и формулировки самих решений; оценки этим решениям здесь не даются.
