        answer:
          points:
            - Соборный акт Церкви (1994) не называет Свидетелей Иеговы; его перечень открыт («среди них…»), и из него нельзя выводить того, чего в нём нет.
            - Белокурихинская конференция (1999) в своём заявлении и Нижегородская конференция (2001) в приложении включили Свидетелей Иеговы в число «тоталитарных сект» и «деструктивных культов». Это итоговые документы конференций, а не определения Церкви.
            - По оценке проф. А. Л. Дворкина, структура «Свидетелей Иеговы» «удивительно похожа на структуру КПСС», а «Общество Сторожевой башни» он назвал бы «псевдорелигиозной коммерческой организацией, основанной на квазикоммунистической идеологии». Это его личная оценка, а не вероучительное определение.
            - Критерий «тоталитарной секты» в той же книге — группа, которая «в значительной степени контролирует поведение, мысли и эмоции своих членов» (определение канадского Info-Cult, приводимое Дворкиным). Применимость этого критерия к Свидетелям Иеговы — предмет оценки автора; сами Свидетели называют свою организацию не сектой, а христианской общиной.
