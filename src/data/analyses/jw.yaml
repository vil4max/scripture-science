      - id: blood
        title: Переливание крови
        short: "Церковь понимает запрет на кровь как запрет употреблять её в пищу и исходит из ценности человеческой жизни, а Свидетели Иеговы относят этот запрет и к переливанию цельной крови и отказываются от него."
        topic: rules
        church:
          text: "Православная этика исходит из ценности человеческой жизни и заповеди любви к ближнему: Господь спрашивает, должно ли «душу спасти, или погубить» (Мк 3:4). Апостольское определение «воздерживаться от идоложертвенного и крови, и удавленины, и блуда» (Деян 15:29) Церковь хранит в канонах как запрет употреблять кровь в пищу (Апостольское правило 63; Трулльское 67). Отношения врача и пациента Церковь предлагает строить на уважении «целостности, свободного выбора и достоинства личности»."
