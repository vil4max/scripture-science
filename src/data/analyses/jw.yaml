        answer:
          points:
            - "«Пойдут сии в муку вечную, а праведники в жизнь вечную» (Мф 25:46): при муке и при жизни стоит одно и то же слово «вечный», и смысл нельзя ограничить в одном случае, сохранив в другом. «Перевод нового мира» (2021) читает «будут навсегда уничтожены», а в сноске сам даёт буквальное «отрезаны; отсечены»."
            - Дьявол, зверь и лжепророк «будут мучиться день и ночь во веки веков» (Откр 20:10), а поклоняющиеся зверю «не будут иметь покоя ни днем, ни ночью» (Откр 14:11). Так же, «будут мучиться день и ночь вечно», читает Откр 20:10 и «Перевод нового мира», допуская лишь в сноске «будут изолированы; заключены в тюрьму».
            - "Христос говорит о человеке, «ввержену в геенну огненную, где червь их не умирает и огонь не угасает» (Мк 9:47–48), и о том, кого выбрасывают «во тьму внешнюю: там будет плач и скрежет зубов» (Мф 25:30). Свидетели видят здесь образ уничтожения трупов (Ис 66:24), но плач предполагает существующего."
            - "Ад в Писании — не просто могила: Бог не оставил «души Моей в аде» и не дал «святому Твоему увидеть тления» (Деян 2:27) — душа и тело названы раздельно; богач из притчи «в аде, будучи в муках, он поднял глаза свои» (Лк 16:23)."
