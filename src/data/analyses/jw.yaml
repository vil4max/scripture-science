              accessed: 2026-09-26T00:00:00.000Z
        answer:
          points:
            - Форма орудия казни в Писании не описана — это признаёт и jw.org. Евангелие говорит, что Христос, «неся крест Свой», вышел на Голгофу (Ин 19:17), а Свидетели в своём переводе читают «столб»; спор о слове не отменяет того, чему учит Писание о смысле Креста (1 Кор 1:18; Гал 6:14).
            - "Почитается не дерево, а Распятый: Господь Сам зовёт «возьми крест свой, и следуй за Мною» (Мф 16:24), а Церковь с апостольских времён осеняет себя крестным знамением (катехизис, §296)."
            - "Заповедь «бегайте идолослужения» (1 Кор 10:14) Церковь принимает: идол — это изображение, которому поклоняются и служат вместо Бога (катехизис, §512). Крест таким не является."
