        answer:
          points:
            - "Спасти может только Бог: «нет Спасителя кроме Меня» (Ис 43:11). Свидетели ссылаются на слова псалма о том, что человек не может выкупить брата (Пс 48:8 в Синодальном переводе, Пс 49:7 в «Переводе нового мира»): именно поэтому Искупитель — не просто совершенный человек, а Бог, ставший человеком, — «великий Бог и Спаситель наш Иисус Христос» (Тит 2:13)."
            - "Апостол говорит о «Церкви Господа и Бога, которую Он приобрёл Себе Кровию Своею» (Деян 20:28). Цена искупления измеряется не тем, что потерял Адам, а достоинством Того, Кто принёс жертву: «драгоценною Кровию Христа» (1 Пет 1:18–19)."
            - "Дар превышает потерю: «тем более благодать Божия и дар по благодати одного Человека, Иисуса Христа, преизбыточествуют для многих» (Рим 5:15). Христос — новый глава людей, соединённых с Ним верою (свт. Филарет, катехизис, §206)."
            - В Синодальном переводе 1 Тим 2:6 читается «предавший Себя для искупления всех», а Мф 20:28 — «отдать душу Свою для искупления многих»; Жертва принесена «за грехи всего мира» (1 Ин 2:2). Игум. Герасим (Дьячков) видит в «выкупе» Свидетелей Иеговы сведение спасения к внешнему по отношению к человеку акту возмещения.
