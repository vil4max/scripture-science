      - id: disfellowshipping
        title: Исключение и избегание
        short: "Церковь знает отлучение, но оно длится лишь до покаяния и направлено на возвращение человека, а Свидетели Иеговы удаляют нераскаявшегося грешника из собрания, и верующие перестают с ним общаться."
        topic: organisation
        church:
          text: Церковная дисциплина направлена на покаяние и возвращение. За нераскаянную греховную жизнь или упорное заблуждение человек может быть отлучён от церковного общения, но отлучение продолжается лишь до покаяния, а кающегося Церковь не вправе отвергнуть. Господь предписывает идти к согрешившему последовательно — наедине, при свидетелях, затем перед Церковью (Мф 18:15–17), а апостол велит не считать непослушного врагом, но вразумлять как брата (2 Фес 3:14–15).
