        answer:
          points:
            - "Стефан умирающий обращается ко Христу: «Господи Иисусе! приими дух мой» (Деян 7:59). Синодальный перевод говорит «молился»; но даже в «Переводе нового мира» Стефан просит Иисуса принять его дух — как Сам Христос вручил дух Отцу (Лк 23:46)."
            - "Апостол Павел «трижды молил Господа» об избавлении от немощи, и ответ даёт Тот, Кто называет эту силу Своей: «довольно для тебя благодати Моей» — «чтобы обитала во мне сила Христова» (2 Кор 12:8–9). Верующие названы «призывающими имя Господа нашего Иисуса Христа» (1 Кор 1:2)."
            - "Христос принимает поклонение: ученики «поклонились Ему» (Мф 14:33; Мф 28:17; Лк 24:52), тогда как ангел Иоанну запрещает это: «Богу поклонись» (Откр 22:9)."
            - "Сын достоин той же чести, что и Отец: «кто не чтит Сына, тот не чтит и Отца» (Ин 5:23). Агнцу воздаётся хвала вместе с Сидящим на престоле (Откр 5:13), и пред именем Иисуса «преклонилось всякое колено» (Флп 2:10)."
          proof:
