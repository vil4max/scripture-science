      - id: armageddon-paradise
        title: Армагеддон, тысячелетие и земной рай
        short: "Церковь учит, что Христос придёт судить живых и мёртвых, а мир преобразится в мир без смерти, а Свидетели Иеговы ждут битву Армагеддон, затем тысячелетнее правление Христа и рай на земле."
