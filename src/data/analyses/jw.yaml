        answer:
          points:
            - "Ин 1:1: «и Слово было Бог» (Синодальный перевод). Слово «было у Бога» и «было Бог»; «без Него ничто не начало быть, что начало быть» (Ин 1:3), значит, Само не сотворено. Свт. Иоанн Златоуст замечает, что отсутствие члена при слове «Бог» не делает Сына меньшим, а Фома исповедует воскресшего: «Господь мой и Бог мой» (Ин 20:28)."
            - "Кол 1:16–17: «Им создано всё, что на небесах и что на земле... все Им и для Него создано». Слова «остальное» в греческом тексте нет — это признаёт примечание самого издания («в греческом тексте здесь буквально говорится „всё“»); Перервинская семинария видит в этой вставке искажение смысла."
            - "Флп 2:6: «Он, будучи образом Божиим, не почитал хищением быть равным Богу» (Синодальный перевод). Свт. Иоанн Златоуст, как его приводит Перервинская семинария, возражал против чтения, делающего Сына меньшим Богом: в Писаниях «великого найдешь везде, а малого нигде»."
            - "Евр 1:8: Синодальный перевод — «престол Твой, Боже, в век века» (из Пс 44:7–8). Перервинская семинария признаёт чтение «Бог — престол твой» допустимым грамматически, но считает неверным по контексту Пс 44; а в Евр 1:10 Сыну сказано: «в начале Ты, Господи, основал землю»."
          proof:
