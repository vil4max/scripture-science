        title: Правовой статус в России
        short: "Церковь оценивает учение Свидетелей Иеговы богословски, а правовой статус определяет государство: в 2017 году Верховный суд России ликвидировал их организации, и Свидетели называют это несправедливым."
        church:
          text: Церковная оценка учения Свидетелей Иеговы — богословская и не зависит от их правового положения. По Основам социальной концепции РПЦ, Церковь и государство имеют разные природы и разные средства, а юридический статус религиозной организации на территории государства определяют его власти. Ниже — только факты, без оценки судебных решений.
