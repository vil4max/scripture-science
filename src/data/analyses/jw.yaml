        church:
          text: Божественное откровение сохраняется в Церкви двумя способами — Священным Преданием и Священным Писанием. Предание — то, что апостолы передали «словом или посланием» (2 Фес 2:15), а Церковь, «столп и утверждение истины» (1 Тим 3:15), хранит его; Писание дано для того, чтобы откровение «сохранилось более точно и неизменно». Читать Писание, по катехизису, следует «согласно толкованию Православной Церкви и святых отцов».
