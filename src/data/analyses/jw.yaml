    cards:
      - id: soul
        title: Душа и смерть
        short: "Церковь учит, что душа не погибает со смертью тела и продолжает жить, а Свидетели Иеговы — что душа смертна: умерший человек перестаёт существовать до воскресения."
        topic: afterlife
        church:
          text: "Душа человека духовна и не погибает, когда тело умирает: до всеобщего воскресения души праведных пребывают во свете и покое, а души грешников — в противоположном состоянии. Полное воздаяние человек получит по воскресении тела и на Суде Божием: праведники пойдут в жизнь вечную, а грешники — в муку вечную."
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: "Свт. Филарет. Пространный катехизис, §115: дыхание жизни"
