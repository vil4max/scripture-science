        answer:
          points:
            - Преемство Церковь видит в непрерывной жизни и рукоположении (Мф 16:18; 28:20; Деян 13:3; 1 Тим 4:14), а не в сохранении отдельных верных мыслей. Ссылка на «облако свидетелей» от Авеля (Евр 11:4; 12:1) говорит о единстве праведных во Христе, но не о тождестве с ними организации, начавшейся, по собственным словам Свидетелей, в 1870-х годах.
            - "Имя «Свидетели Иеговы» принято в 1931 году (jw.org). Слова «Мои свидетели, говорит Господь, вы» (Ис 43:10) обращены к Израилю; в Новом Завете Христос говорит ученикам: «будете Мне свидетелями» (Деян 1:8) — свидетельство о Христе."
            - По собственному изложению Свидетелей, в 1874 году ожидалось «невидимое присутствие» Христа, позднее хронологию уточнили и началом присутствия стали считать 1914-й; небесной награды помазанников ждали в 1925-м, а в 1975-м не оправдались ожидания Тысячелетнего правления, и они видят в этом уточнение понимания (Притч 4:18). Церковь не называет сроков (Мф 24:36), а мерилом пророчества Писание ставит исполнение (Втор 18:22).
            - Руководящий совет, по jw.org, сложился в XX веке и с 1976 года действует через комитеты; сам он не называет себя лидером организации. Церковное же устройство основано на апостольском преемстве епископата (Основные принципы РПЦ к инославию, §1.9).
