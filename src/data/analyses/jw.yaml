        answer:
          points:
            - «О дне же том и часе никто не знает, ни Ангелы небесные, а только Отец Мой один» (Мф 24:36); «не ваше дело знать времена или сроки, которые Отец положил в Своей власти» (Деян 1:7). Церковь поэтому не называет срока ни для Пришествия, ни для иных событий конца.
            - "Христос предупреждает: «вот, Он в пустыне» — не выходите; «вот, Он в потаенных комнатах» — не верьте, ибо «как молния исходит от востока и видна бывает даже до запада, так будет пришествие Сына Человеческого» (Мф 24:26–27). Он придёт «таким же образом, как вы видели Его восходящим на небо» (Деян 1:11), и «узрит Его всякое око» (Откр 1:7)."
            - "Христос получил власть не в 1914 году: по воскресении Он говорит «дана Мне всякая власть на небе и на земле» (Мф 28:18), и Бог посадил Его «одесную Себя на небесах» (Еф 1:20), как исповедует Символ веры."
            - "«Семь времён» в книге Даниила — срок, назначенный Навуходоносору, и текст сообщает: «Тотчас и исполнилось это слово над Навуходоносором» (Дан 4:13, 30; в «Переводе нового мира» нумерация иная). Сами Свидетели признают, что многие учёные относят разрушение Иерусалима к 587 году до Р. Х., а не к 607-му."
            - По собственному изложению Свидетелей, Исследователи Библии связывали с 1874 годом возвращение Господа и Его невидимое присутствие, а небесной награды помазанников ждали в 1914 и 1925 годах; в 1975 году не оправдались ожидания начала Тысячелетнего правления. Церковь не опирается на сроки, которые Христос не открыл (Мф 24:36).
