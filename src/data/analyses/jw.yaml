        answer:
          points:
            - "Господь Сам постился сорок дней (Мф 4:2) и учит: «когда поститесь» (Мф 6:16–18), — не «если». О Своих учениках Он говорит: «придут дни, когда отнимется у них жених, и тогда будут поститься» (Мф 9:15)."
            - "В апостольской Церкви постились: Деян 13:2–3 и 14:23 («они помолились с постом»). Довод о том, что пост был частью Моисеева закона о Дне искупления, не объясняет этих мест Нового Завета."
            - "«Изнурение тела» (Кол 2:23) апостол называет видимостью мудрости в «самовольном служении», а не постом как таковым. Церковь не учит, что пост делает человека святым: Господь осуждает показной пост (Мф 6:16), а истинный пост — разрешить «оковы неправды» (Ис 58:6)."
            - "Безбрачие Церковь не вменяет всем: апостол осуждает «запрещающих вступать в брак» (1 Тим 4:3), брак для Церкви — Таинство, а монашество — добровольный путь."
