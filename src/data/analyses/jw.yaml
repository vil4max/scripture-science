        answer:
          points:
            - Тот же Бог, Который дал вторую заповедь (Исх 20:4), повелел сделать золотых херувимов на ковчеге, где Он «будет открываться» Моисею (Исх 25:18–22). Значит, запрещены идолы, которым поклоняются вместо Бога, а не священные изображения (катехизис свт. Филарета, §§512–514).
            - Слова Павла о том, что Божество не подобно золоту или камню (Деян 17:29), Церковь принимает и Божественное естество не изображает. Но Сын Божий стал человеком — «образом Бога невидимого» (Кол 1:15; Ин 14:9), и иконы изображают воплотившегося Христа и святых.
            - "Отцы VII собора прямо связывают иконы с воплощением: если бы изображение икон было идолопочитанием, «уничтожалось бы таинство нашего искупления, совершенное Сыном Божиим чрез явление Его во плоти»."
            - Собор различает «лобызание, почитание и поклонение» образу и «истинное служение», подобающее одному Богу. По jw.org, Свидетели не допускают и почитания изображений, видя в нём нарушение второй заповеди; Церковь же судит об образе по Первообразу.
