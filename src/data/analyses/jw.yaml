        title: «Перевод нового мира»
        short: "Церковь проверяет любой перевод Писания по греческому тексту и церковному пониманию, а Свидетели Иеговы отдают предпочтение собственному переводу, в котором ряд мест о Христе передан иначе, чем в Синодальном переводе."
