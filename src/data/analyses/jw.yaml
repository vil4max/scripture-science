        title: Божество Христа
        short: "Церковь учит, что Иисус Христос — Сын Божий и Творец, а не творение, и Писание называет Его Богом, а Свидетели Иеговы считают Его первым созданным Богом существом, но не Всемогущим Богом."
        topic: jesus
        church:
          text: "Иисус Христос — единородный Сын Божий, «рождённый, несотворённый, единосущный Отцу»: через Него всё сотворено, и Он не тварь, а Творец. В одном Лице Он соединил Божество и человечество, поэтому Писание прямо называет Его Богом (Ин 1:1; 20:28; Евр 1:8; Тит 2:13), а слова о Его подчинённости Отцу относятся к Его человеческой природе."
