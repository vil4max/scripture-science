        answer:
          points:
            - "Форма «Иегова» искусственна: она появилась на Западе в XVI веке, когда к согласным тетраграмматона добавили гласные слова «Адонаи»; учёные показали, что имя читалось «Яхве» (еп. Иларион (Алфеев), статья «Иегова» в энциклопедии «Азбука веры»). Свидетели сами признают, что точное произношение неизвестно."
            - В дошедших рукописях Нового Завета тетраграмматона нет, и приложение A5 к «Переводу нового мира» это признаёт. Включение имени в текст остаётся предположением переводчиков, а не свидетельством рукописей.
            - "Апостол Павел относит к Христу слова пророка о призывании «имени Господня»: «если устами твоими будешь исповедовать Иисуса Господом… спасёшься» и «всякий, кто призовет имя Господне, спасется» (Рим 10:9, 13; Иоиль 2:32). «Господь» — то имя, которым Новый Завет исповедует Христа (Флп 2:11)."
            - "Имя Божие полнее всего открыто во Христе: Отец даровал Ему «имя выше всякого имени» (Флп 2:9). Спасение связано с именем Христа — «нет другого имени под небом… которым надлежало бы нам спастись» (Деян 4:12), — а не с произношением тетраграмматона."
          proof:
