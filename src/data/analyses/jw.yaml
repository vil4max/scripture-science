        answer:
          points:
            - Деян 15:29 ставит кровь в один ряд с идоложертвенным, удавлениной и блудом, а в канонах Церкви это запрет употреблять кровь в пищу (Апостольское правило 63; Трулльское 67). Сами Свидетели начинают с того, что «христиане не должны есть кровь», а запрет на переливание выводят из этого запрета толкованием.
            - "Переливание — лечение, и ставится вопрос о спасении жизни: Господь исцеляет в субботу и спрашивает, «душу спасти, или погубить» (Мк 3:4); любовь к ближнему делает сохранение жизни первым долгом (катехизис, §§489–492). Пищевой запрет не переносится автоматически на медицинскую помощь."
            - "Граница проведена решением Руководящего совета, а не Писанием: до 2026 года запрет относили и к четырём основным компонентам крови, теперь оставляют их на совесть, а цельную кровь по-прежнему не принимают. Сам Совет пишет, что «в Библии ничего не говорится о том, как использовать компоненты и фракции крови»."
            - Церковь признаёт право человека не принимать методы, противоречащие его религиозным убеждениям (Основы социальной концепции, XI.3); донорство органов она называет проявлением любви (XII.7; о крови документ отдельно не говорит). Но выбор, от которого зависит жизнь, особенно ребёнка, не может быть простым делом совести.
