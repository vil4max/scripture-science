        tradition:
          text: Свидетели Иеговы учат, что Богу не угодно, когда ему поклоняются с помощью изображений, и не почитают ни иконы, ни крест. Они опираются на вторую заповедь («Не делай себе резное или какое-либо другое изображение… Не кланяйся и не служи им», Исх 20:4, 5) и на слова «Храните себя от идолов» (1 Ин 5:21). Любое почитание изображений они считают идолопоклонством.
