        tradition:
          text: Свидетели Иеговы крестят полным погружением в воду тех, кто осознанно решил посвятить жизнь Богу; в их понимании крещение — символ раскаяния и обещания исполнять волю Бога. Крещение младенцев они считают противоречащим Библии. Тех, кто крестился в другой церкви, не зная, по их мнению, библейской истины, они считают нужным крестить повторно.
          proof:
