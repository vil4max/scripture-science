      - id: resurrection-of-dead
        title: Воскресение мёртвых
        short: "Церковь учит, что воскреснут все умершие и тело снова соединится с душой, а Свидетели Иеговы считают воскресение воссозданием личности: для 144 000 — на небе, для большинства — на земле."
        topic: afterlife
        church:
          text: "Воскресение мёртвых — действие всемогущества Божия: тела умерших людей, соединившись опять с их душами, оживут и станут духовными и бессмертными. Воскреснут все умершие, и тело, истлевшее в земле, воскреснет, как из истлевшего зерна вырастает растение. До общего воскресения души праведников пребывают во свете и покое, а полное воздаяние человек получит по воскресении тела и на Суде Божием."
