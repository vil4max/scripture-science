              tier: official
              excerpt: "не смел произнести укоризненного суда, но сказал: «да запретит тебе Господь»"
              accessed: 2026-10-01T00:00:00.000Z
            - url: https://azbyka.ru/biblia/?1Thes.4:16&r
              title: 1 Фес. 4:16 — Синодальный перевод
              tier: official
              excerpt: при гласе Архангела и трубе Божией
              accessed: 2026-10-01T00:00:00.000Z
