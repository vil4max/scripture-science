        title: Молитва и поклонение Христу
        short: "Церковь молится Христу и поклоняется Ему как Богу вместе с Отцом, а Свидетели Иеговы молятся только Иегове, во имя Иисуса, а самому Иисусу не молятся и не поклоняются."
