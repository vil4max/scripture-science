        answer:
          points:
            - "Христос говорит об одном часе для всех: «наступает время, в которое все, находящиеся в гробах, услышат глас Сына Божия; и изыдут творившие добро в воскресение жизни, а делавшие зло — в воскресение осуждения» (Ин 5:28–29). Где Синодальный перевод читает «осуждения», «Перевод нового мира» (2021) говорит: «предстанут перед судом»."
            - "Воскреснет то же тело, но преображённое: «тленному сему надлежит облечься в нетление» (1 Кор 15:53); Христос по воскресении говорит: «дух плоти и костей не имеет, как видите у Меня» (Лк 24:39); Бог «оживит и ваши смертные тела» (Рим 8:11). Слова «плоть и кровь не могут наследовать Царствия Божия» (1 Кор 15:50), на которые ссылаются Свидетели, говорят о тленном, которое сменится нетлением."
            - "Это воскресение, а не воссоздание: Бог восстановит истлевшее тело и соединит его с той же душой — как из зерна, которое «не оживет, если не умрет», вырастает растение (1 Кор 15:36)."
            - «Будет воскресение мертвых, праведных и неправедных» (Деян 24:15), а Свидетели исключают из него закоснелых в грехе. Но в 2024 году «Сторожевая башня» отказалась от утверждения, что жители Содома и Гоморры не воскреснут («у нас нет оснований для таких утверждений»), а понимание Ин 5:29 индекс Свидетелей относит к уточнениям 2022 года.
