        answer:
          points:
            - "Апостольское Предание — то, что апостолы велели хранить: «стойте и держите предания, которым вы научены или словом или посланием нашим» (2 Фес 2:15; также 1 Кор 11:2; 2 Тим 2:2). Даже «Перевод нового мира» передаёт этот стих словами «следуйте указаниям, которые вы получили на словах или в наших письмах» и в сноске даёт буквальное: «традициям, которым вас научили»."
            - "Слова Христа фарисеям: «вы, оставив заповедь Божию, держитесь предания человеческого» (Мк 7:8) — против преданий, отменяющих слово Божие (Мк 7:9, 13), а не против апостольского. «Понимание Писания» само признаёт, что переданное апостолами (например, Вечеря Господня, 1 Кор 11:2, 23) угодно Богу; спор о том, где оно хранится — в жизни Церкви или только в Писании."
            - "Писание не толкуется как каждому угодно: «как могу разуметь, если кто не наставит меня?» (Деян 8:31); в посланиях Павла «есть нечто неудобовразумительное», что невежды «к собственной своей погибели превращают» (2 Пет 3:16); «никакого пророчества в Писании нельзя разрешить самому собою» (2 Пет 1:20). Для Свидетелей толкует Руководящий совет, для Церкви — Церковь, «столп и утверждение истины» (1 Тим 3:15)."
            - "Число книг — не главный спор: «Азбука веры» насчитывает 77 книг, из которых 11 неканонических в канон не входят (то есть 66 канонических, как и у Свидетелей), а свт. Филарет называет в Ветхом Завете 22 книги по еврейскому счёту. Различие в том, кто хранит и толкует эти книги."
          proof:
