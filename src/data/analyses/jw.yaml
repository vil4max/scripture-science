          text: "Церковь читает Писание в Церкви и по Преданию: перевод проверяется не названием или числом книг, а сопоставлением конкретных мест с греческим текстом и с церковным толкованием. Отдельный перевод не создаёт нового учения: понимать Писание следует «согласно толкованию Православной Церкви и святых отцов»."
