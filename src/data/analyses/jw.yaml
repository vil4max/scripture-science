            - "Притч 4:18 говорит о стезе праведных в противоположность пути беззаконных (Притч 4:19) — о нравственном пути, а не о пересмотре учения. Откровение завершено во Христе: Бог «в последние дни сии говорил нам в Сыне» (Евр 1:2), и апостол зовёт «подвизаться за веру, однажды преданную святым» (Иуд 3); иное благовестие, хотя бы его возвестил «Ангел с неба», — анафема (Гал 1:8)."
            - "Сроки связывались с поколением 1914 года: «Сторожевая башня» (1992) спрашивала, пройдёт ли «это преклонное поколение», прежде чем Бог спасёт землю, и отвечала: согласно пророчеству — нет. Индекс самих Свидетелей знает и число тех из поколения 1914 года, «кто еще жив», и два уточнения понимания слов «это поколение» (1995, 2008)."
            - "Втор 18:22 даёт проверку: если сказанное именем Господа не сбылось, «то не Господь говорил сие слово». Примеры Моисея, апостолов и ранних христиан, на которые ссылаются Свидетели, — исправляемые Богом заблуждения отдельных людей (2 Фес 2:1–3), а Христос запретил искать сроки (Мф 24:36; Деян 1:7)."
            - "Церковь следует правилу прп. Викентия Лиринского (V в.): учить тому, чему научился, «дабы, когда говоришь ново, не сказать тебе нового». Догматы Вселенских соборов не заменяют прежние, а объясняют ту же веру."
          proof:
