        tradition:
          text: По собственной истории Свидетелей Иеговы, их организация началась в 1870-х годах в Пенсильвании с группы исследователей Библии, среди которых был Ч. Т. Расселл (с 1879 года он издавал журнал, ставший «Сторожевой башней»), а имя «Свидетели Иеговы» принято на конгрессе 1931 года при Дж. Ф. Рутерфорде. С 1942 года организацию возглавлял Н. Норр, с 1971 года расширялся Руководящий совет, а с 1976 года все дела ведут его шесть комитетов. Организацию они считают не новой религией, а возрождением христианства первого века.
