      - id: governing-body
        title: Руководящий совет и «верный и благоразумный раб»
        short: "Церковь опирается на апостольское Предание и соборы епископов, а Свидетели Иеговы учат, что обучение и руководство организацией осуществляет Руководящий совет — небольшая группа, назначенная, по их вере, Христом."
        topic: authority
        church:
          text: Церковь называется Апостольской, потому что она непрерывно и неизменно сохраняет от апостолов учение и преемство даров Святого Духа через священное рукоположение. Она проверяет толкование Писания апостольским Преданием («вся апостольская проповедь, весь спасительный апостольский опыт вообще, переданные Церкви»), а не авторитетом организации. Решения, обязательные для всей Церкви, принимает Вселенский Собор — собрание епископов, преемников апостолов.
