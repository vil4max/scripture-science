        title: "История: от Рассела до Руководящего совета"
        short: "Церковь учит, что она непрерывна от апостолов и не исчезала, а Свидетели Иеговы ведут свою организацию от группы исследователей Библии 1870-х годов в Пенсильвании и считают её возрождением христианства первого века."
        topic: organisation
        church:
          text: "Церковь едина и непрерывна от Пятидесятницы: Христос обещал, что врата ада не одолеют её, и что Он с учениками «во все дни до скончания века» (Мф 16:18; 28:20). Вера и священство передаются от апостолов к епископам через рукоположение, а Глава Церкви — Христос. Поэтому Церковь не знает времени, когда она исчезла и её пришлось «восстанавливать»; возраст общины и истинность её учения — разные вопросы, но община, возникшая в XIX веке, не может быть тождественна апостольской Церкви."
