              title: «Архангел Михаил — кто он?» — Библейские вопросы, jw.org
              tier: official
              excerpt: Такое имя он носил до прихода на землю и носит после вознесения на небо
              accessed: 2026-10-01T00:00:00.000Z
            - url: https://www.jw.org/ru/библейские-учения/вопросы/архангел-михаил/
              title: «Архангел Михаил — кто он?» — Библейские вопросы, jw.org
              tier: official
              excerpt: данный титул носит только один ангел
              accessed: 2026-10-01T00:00:00.000Z
            - url: https://www.jw.org/ru/библейские-учения/вопросы/архангел-михаил/
              title: «Архангел Михаил — кто он?» — Библейские вопросы, jw.org
              tier: official
              excerpt: Было бы странно, если бы Бог назначил над святыми ангелами двух командующих
              accessed: 2026-10-01T00:00:00.000Z
        answer:
          points:
            - "Послание к Евреям противопоставляет Сына ангелам: «кому когда из Ангелов сказал Бог: Ты Сын Мой?» (Евр 1:5), и повелевает ангелам поклоняться Ему (Евр 1:6). Это трудно примирить с тем, что Михаил — имя Самого Сына."
            - "Апостол Иуда пишет, что Михаил Архангел, споря с диаволом, «не смел произнести укоризненного суда, но сказал: да запретит тебе Господь» (Иуд 9): он ссылается на Господа, а не говорит от Его лица."
            - "В 1 Фес 4:16 Господь сходит «при гласе Архангела и трубе Божией»: голос архангела и труба сопровождают Его пришествие, а не называют Его. Единственное число слова «архангел» в Писании не доказывает, что это имя Христа."
            - Михаил назван «одним из первых князей» (Дан 10:13) — то есть одним из нескольких. Блж. Феодорит Кирский (V в.), как его приводит свящ. Игорь Ефимов, понимает Михаила в Дан 12:1 как Архангела Господня, которому вверено попечение об иудеях.
            - "Ангел, явившийся Иоанну, отказывается от поклонения: «Богу поклонись» (Откр 22:9); Христу же поклоняются все ангелы (Евр 1:6)."
          proof:
            - url: https://azbyka.ru/biblia/?Hebr.1:5&r
              title: Евр. 1:5 — Синодальный перевод
              tier: official
              excerpt: "кому когда из Ангелов сказал Бог: Ты Сын Мой"
              accessed: 2026-10-01T00:00:00.000Z
