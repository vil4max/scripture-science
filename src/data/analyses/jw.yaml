        tradition:
          text: "Свидетели Иеговы учат, что «душа» в Библии — это сам человек, а не часть его, продолжающая жить после смерти: еврейское нефеш и греческое психе означают «дышащее» или «живое существо». По их учению, душа смертна: когда человек умирает, он перестаёт существовать, а Бог не мучит людей в огненном аду. Умерших, по их вере, ждёт воскресение: Бог вернёт к жизни миллиарды людей."
          proof:
