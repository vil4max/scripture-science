        tradition:
          text: "Свидетели Иеговы удаляют из собрания христианина, который совершил серьёзный грех и не раскаивается (1 Кор 5:11–13), о чём делается объявление в собрании. Верующие, по их учению, перестают общаться с удалённым и не проводят с ним время, но относятся к нему уважительно; он может приходить на встречи и вернуться, если раскается. В 2024 году они уточнили: приветствие удалённого — вопрос совести христианина, тогда как с теми, кто распространяет «отступнические» взгляды, не здороваются; прежнее слово «исключение» заменено на «удаление из собрания»."
