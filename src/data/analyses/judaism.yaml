# the tradition's teaching from its own documents. Validated for full evidence coverage.
# Detailed analysis: Orthodoxy and Judaism (Orthodox, Conservative and Reform streams marked where they differ).
# Card order inside a group follows the reading order of the analysis; `topic` links a card from the comparison.
# Source rules: docs/SOURCES.md. Quotation excerpts are exact copies from the cited pages (accent marks included).
tradition: judaism
lead: 'Все расхождения православного учения и учения иудаизма — по тезисам: учение Церкви, учение иудаизма (с различиями ортодоксального, консервативного и реформистского течений), православный ответ.'
authorityNote: 'Среди документов, на которые опирается этот разбор, нет акта Русской Православной Церкви, посвящённого иудаизму отдельно: Основные принципы отношения к инославию (2000) говорят об инославных христианах, а Основы социальной концепции (2000) касаются Израиля и Церкви лишь в связи с темой нации (II.1, II.4). Православная позиция здесь изложена по Писанию, Символу веры и катехизису свт. Филарета; пояснения энциклопедии «Азбука веры» и мнения отдельных авторов подписаны как таковые. Иудейское учение дано по иудейским источникам; заявления отдельных групп (например, «Дабру эмет») не обязательны для всего иудаизма.'
keyPoints:
  - text: "Священные книги иудаизма, Танах, Церковь принимает как часть своего Писания (Ветхий Завет); главное различие в том, что Новый Завет в священные книги иудаизма не входит."
    card: tanakh-old-testament
  - text: "Церковь верит, что обещанный Мессия, Христос, уже пришёл в Иисусе, а иудаизм ждёт Мессию, который ещё не пришёл, и Иисуса из Назарета Мессией не признаёт."
    card: messiah
  - text: "И Церковь, и иудаизм исповедуют одного Бога, но иудаизм строго един в вере и Троицу не принимает, а Церковь верит в единого Бога в трёх Лицах: Отце, Сыне и Святом Духе."
    card: one-god-trinity
  - text: "Церковь исповедует Иисуса Богом, ставшим человеком, а иудаизм считает Бога единым и бестелесным и божество Иисуса не признаёт; это главное расхождение."
    card: incarnation
  - text: "Церковь учит, что Христос исполнил закон Моисея: Десять заповедей остаются обязательными, а обрядовые предписания утратили силу; иудаизм считает Тору неизменной навсегда."
    card: law-and-commandments
  - text: "Церковь и иудаизм читают Писание по авторитетному преданию, но разному: у Церкви это апостольское Предание, у иудаизма — Устная Тора, записанная в Талмуде."
    card: oral-torah-tradition
  - text: "Церковь видит искупление грехов в жертве Христа на Кресте, а иудаизм после разрушения Храма полагается на раскаяние и Йом Кипур, День Искупления."
    card: sacrifice-atonement
  - text: "Церковь видит себя продолжением и исполнением избрания Израиля, не отвергая прежний народ Божий, а иудаизм не считает Церковь новым Израилем."
    card: israel-new-israel
  - text: "Иудаизм не един: ортодоксальное, консервативное и реформистское течения по-разному относятся к традиции, поэтому всегда нужно уточнять, о каком течении идёт речь."
    card: judaism-movements
