        church:
          text: Церковь празднует каждую седмицу не седьмой, а первый день — воскресный, со времени воскресения Христа. Суббота как день недели в христианской Церкви большим праздником не празднуется, но в память о сотворении мира отличается от других дней освобождением от поста.
