        tradition:
          text: 'Иудаизм исповедует Творца нематериальным: у Него нет никакого подобия (третий принцип Рамбама). Иисуса из Назарета иудейские авторитетные источники не признают ни Мессией, ни божеством. Справочное издание My Jewish Learning прямо говорит, что вера в божество Иисуса трудно совместима с настойчивым утверждением иудаизма о единстве Бога.'
