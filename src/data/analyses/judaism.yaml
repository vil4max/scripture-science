      - id: respect-no-hostility
        title: Уважение к людям и отказ от вражды
        short: "Церковь отвергает деление народов на лучших и худших и называет клеветой обвинения иудеев в ритуальных убийствах; иудейские источники о христианстве судят по-разному, расхождения же называются без вражды."
        topic: rules
        church:
          text: Православной этике противоречит деление народов на лучших и худших, принижение какой-либо этнической или гражданской нации. Обвинение иудеев в ритуальных убийствах энциклопедия «Азбука веры» называет абсурдным и грехом клеветы.
          proof:
            - url: https://azbyka.ru/otechnik/dokumenty/osnovy-sotsialnoj-kontseptsii-russkoj-pravoslavnoj-tserkvi/
              title: Основы социальной концепции Русской Православной Церкви (Архиерейский Собор 2000), II.4
              tier: official
              excerpt: Православной этике противоречит деление народов на лучшие и худшие, принижение какой-либо этнической или гражданской нации
              accessed: '2026-10-01'
            - url: https://azbyka.ru/iudaizm
              title: Азбука веры. Иудаизм
              tier: reference
              excerpt: Это обвинение абсурдно хотя бы потому
              accessed: '2026-10-01'
            - url: https://azbyka.ru/iudaizm
              title: Азбука веры. Иудаизм
              tier: reference
              excerpt: Такие обвинения являются грехом клеветы
              accessed: '2026-10-01'
        tradition:
          text: Иудейские источники о христианстве говорят по-разному. Рамбам спрашивает, может ли быть больший камень преткновения, чем христианство, и вместе с тем пишет, что деяния Иисуса из Назарета лишь подготавливают путь для Машиаха. «Дабру эмет» (2000, иудейские учёные разных течений) утверждает, что евреи и христиане поклоняются одному Богу; заявление ортодоксальных раввинов (2015) называет появление христианства желанным Творцом итогом. Это заявления групп, а не определения всего иудаизма.
          proof:
            - url: https://www.ccjr.us/dialogika-resources/documents-and-statements/jewish/dabru-emet
              title: 'Dabru Emet: A Jewish Statement on Christians and Christianity — Council of Centers on Jewish-Christian Relations'
              tier: reference
              excerpt: Jews and Christians worship the same God
              accessed: '2026-10-01'
            - url: https://www.ccjr.us/dialogika-resources/documents-and-statements/jewish/dabru-emet
              title: 'Dabru Emet: A Jewish Statement on Christians and Christianity — Council of Centers on Jewish-Christian Relations'
              tier: reference
              excerpt: Christian worship is not a viable religious choice for Jews
              accessed: '2026-10-01'
            - url: https://www.ccjr.us/dialogika-resources/documents-and-statements/jewish/to-do-the-will-of-our-father-in-heaven-toward-a-partnership-between-jews-and-christians
              title: To Do the Will of Our Father in Heaven — Council of Centers on Jewish-Christian Relations
              tier: reference
              excerpt: the emergence of Christianity in human history is neither an accident nor an error, but the willed divine outcome and gift to the nations
              accessed: '2026-10-01'
            - url: https://www.sefaria.org/api/texts/Mishneh_Torah,_Kings_and_Wars.11?context=0
              title: Mishneh Torah, Kings and Wars 11 (Touger translation) — Sefaria
              tier: official
              excerpt: Can there be a greater stumbling block than Christianity? All the prophets spoke of Mashiach as the redeemer of Israel
              accessed: '2026-09-26'
            - url: https://www.sefaria.org/api/texts/Mishneh_Torah,_Kings_and_Wars.11?context=0
