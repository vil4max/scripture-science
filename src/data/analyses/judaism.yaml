      - id: sacrifice-atonement
        title: Жертва и искупление
        short: "Церковь учит, что грехи искупила жертва Христа на Кресте, а иудаизм, где после разрушения Храма жертв не приносят, видит путь к прощению в раскаянии и в Йом Кипур (День Искупления) и не связывает искупление со смертью Мессии."
        topic: salvation
        church:
          text: Церковь исповедует, что Господь Иисус Христос принёс Себя в жертву за всех людей и Своей крестной смертью избавил нас от греха, проклятия и смерти. Эту единую жертву Церковь вспоминает в Евхаристии, возвещая смерть Господню, «доколе Он придет».
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
