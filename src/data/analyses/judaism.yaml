        tradition:
          text: Тора запрещает изготовление изваяний и изображений для поклонения (Исх 20:4); эта заповедь связана с верой в бестелесность Бога, которая — один из принципов веры иудаизма. Запрет идолопоклонства — один из самых строгих.
