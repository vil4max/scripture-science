        answer:
          points:
            - 'Общее: ни Церковь, ни иудаизм не читают Писание в одиночку — обе традиции хранят авторитетное толкование. Но источник авторитета разный: для Церкви это апостольское свидетельство о Христе («держите предания, которым вы научены», 2 Фес 2:15), для иудаизма — цепь от Синая к мудрецам (Авот 1:1).'
            - 'Христос осуждает конкретные случаи, когда предание отменяет заповедь: «зачем и вы преступаете заповедь Божию ради предания вашего?» (Мф 15:3). Он же говорит: «на Моисеевом седалище сели книжники и фарисеи» и «всё, что они велят вам соблюдать, соблюдайте и делайте» (Мф 23:2–3), — это не общий приговор раввинистическому преданию.'
            - 'Устная Тора не тождественна Священному Преданию Церкви: она относится к иному строю — к Торе Синая и её законоучению, а не к свидетельству апостолов.'
            - 'Внутри иудаизма нет единой позиции: ортодоксия, масорти и реформистское движение по-разному оценивают власть традиции. При сравнении всегда нужно указывать, о каком течении идёт речь.'
          proof:
