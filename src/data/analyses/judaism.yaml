          text: 'У иудаизма нет единого духовенства: раввин — учитель и галахический авторитет, получающий смиху (посвящение) в виде письменного документа, а не через возложение рук, как в древности. Ортодоксальные раввины получают смиху в ешивах; консервативное, реформистское и реконструктивистское движения рукополагают через свои семинарии, в том числе женщин.'
          proof:
            - url: https://jewishvirtuallibrary.org/rabbinic-ordination-semikha
              title: Rabbinic Ordination (Semikha) | Jewish Virtual Library
              tier: reference
              excerpt: the practice of rabbinic ordination does not include any "laying of the hands," but a written document
              accessed: '2026-09-25'
            - url: https://jewishvirtuallibrary.org/rabbinic-ordination-semikha
              title: Rabbinic Ordination (Semikha) | Jewish Virtual Library
              tier: reference
              excerpt: The Reconstructionist, Reform, and Conservative movements all ordain women for the Rabbinate
              accessed: '2026-09-25'
        answer:
          points:
            - 'Сходство честно признать: священническое служение и преемство есть и в Писании Израиля. «Никто сам собою не приемлет этой чести, но призываемый Богом, как и Аарон» (Евр 5:4).'
            - 'В Церкви служение передаётся рукоположением: дарование «дано тебе по пророчеству с возложением рук священства» (1 Тим 4:14); апостолы, «рукоположив же им пресвитеров к каждой церкви, они помолились с постом» (Деян 14:23).'
            - 'Роли различны: раввин — учитель Торы и судья по галахе, без Храма и жертвы; священник Церкви совершает Таинства, прежде всего Евхаристию. Это разные религиозные устройства.'
            - 'Внутри иудаизма единого порядка нет: ортодоксальная смиха и семинарские посвящения других движений различаются, в том числе в отношении к женщинам.'
          proof:
            - url: https://azbyka.ru/biblia/?Hebr.5:4&r
              title: Евр. 5:4 — Синодальный перевод
              tier: official
              excerpt: И никто сам собою не приемлет этой чести, но призываемый Богом, как и Аарон
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?1Tim.4:14&r
              title: 1 Тим. 4:14 — Синодальный перевод
