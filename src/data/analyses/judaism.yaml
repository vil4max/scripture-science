          text: 'Иудаизм регулирует и общественную жизнь по галахе. В делах, не относящихся к религиозной и семейной жизни, действует принцип «дина де-малхута дина»: закон страны проживания обязателен для евреев, а в некоторых случаях даже предпочитается еврейскому закону.'
