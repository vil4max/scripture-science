      - id: salvation-grace-works
        title: 'Путь спасения: заповеди и благодать'
        short: "Церковь учит спасению в соработничестве человека с Богом через Христа-Искупителя, а иудаизм указывает путь жизни по заповедям Торы и покаяния; ни Церковь, ни иудаизм не учат спасению одной лишь верой."
        topic: salvation
        church:
          text: Спасение в православном понимании — уподобление Богу и духовное единение с Ним; оно совершается как соработничество (синергия) Бога и человека и связано с воплощением, Крестом и воскресением Спасителя. Для спасения нужно не только веровать, но и исповедовать православную веру.
          proof:
            - url: https://azbyka.ru/spasenie
              title: 'Азбука веры. Спасение: определение и условия спасения'
              tier: reference
              excerpt: уподобление Богу и духовное единение с Ним
              accessed: '2026-09-27'
            - url: https://azbyka.ru/sinergiya
              title: Азбука веры. Синергия
              tier: reference
              excerpt: соработничество Бога и человека в деле достижения спасения
              accessed: '2026-09-27'
            - url: https://azbyka.ru/obozhenie
              title: Азбука веры. Обожение
              tier: reference
              excerpt: процесс уподобления верующего Богу и единения с Богом.
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: Для спасения нужно не только веровать, но и исповедовать православную веру
              accessed: '2026-09-25'
        tradition:
          text: 'Творец, по одиннадцатому принципу Рамбама, отвечает добром соблюдающим Его заповеди и карает нарушающих их. Путь — жизнь по Торе и заповедям: консервативный иудаизм настаивает на соблюдении традиции, реформистский исторически ставит этическое выше обрядового. О спасении одной лишь верой иудаизм не учит.'
          proof:
            - url: https://toldot.com/13PrintsipovVery.html
              title: 13 принципов веры | Толдот.ру
              tier: official
              excerpt: Творец, благословенно имя Его, отвечает добром соблюдающим Его заповеди и карает тех, кто их нарушает
              accessed: '2026-09-25'
            - url: https://www.rabbinicalassembly.org/about-us/conservative-masorti
              title: Conservative/Masorti | The Rabbinical Assembly
              tier: official
              excerpt: Conservative Judaism insists on observance of tradition
              accessed: '2026-10-01'
            - url: https://www.myjewishlearning.com/article/reform-judaism/
              title: Reform Judaism | My Jewish Learning
              tier: reference
              excerpt: Historically, it has emphasized the ethical aspects of Jewish tradition over its ritual requirements
              accessed: '2026-10-01'
        answer:
          points:
            - 'Православие тоже не учит спасению одной лишь верой: «и вера без дел мертва» (Иак 2:26). Поэтому в самом Православии есть слово о синергии — соработничестве человека с Богом, а не о пассивном ожидании.'
            - Расхождение — в основании спасения. «Благодатью вы спасены через веру, и сие не от вас, Божий дар» (Еф 2:8); «все согрешили… получая оправдание даром, по благодати Его, искуплением во Христе Иисусе» (Рим 3:23–24).
            - Для иудаизма путь — исполнение заповедей и покаяние; для Церкви нравственное усилие человека не устраняет необходимости Искупителя, но ведёт к соединению с Ним (обожению).
            - 'Это сопоставление нельзя вести по схеме противопоставления закона и благодати: и Православие, и иудаизм признают, что заповедь есть дар Божий; различие — в том, кем и как совершается освобождение от греха и смерти.'
