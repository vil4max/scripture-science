        answer:
          points:
            - 'Церковь согласна с Рамбамом в главном: Бог по существу бестелесен — «Бог есть Дух» (катехизис, вопрос 86). Поэтому воплощение — не превращение Бога в материю, а восприятие Сыном человеческого естества: «Слово стало плотию» (Ин 1:14), «в Нем обитает вся полнота Божества телесно» (Кол 2:9).'
            - 'Это не человек, ставший богом, и не второй бог: Символ веры исповедует Сына «Бога истинна от Бога истинна», единосущным Отцу. Единство Бога при этом не нарушается — таково исповедание Церкви, и в этом состоит главное расхождение с иудаизмом.'
