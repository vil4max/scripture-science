        title: 'Народ Божий: Израиль и Церковь'
        short: "Церковь видит себя продолжением и исполнением избрания Израиля, не отвергая прежний народ Божий, а иудаизм ведёт свою историю от завета Бога с Авраамом и Синая и не считает Церковь новым Израилем."
        topic: organisation
        church:
          text: Ветхозаветный народ израильский был прообразом народа Божия — новозаветной Церкви Христовой; искупительный подвиг Христа положил начало Церкви как новому человечеству — духовному потомству Авраама. Единство нового народа обеспечивается не национальной общностью, а верой во Христа и Крещением.
