        tradition:
          text: Иудаизм ведёт свою историю от завета Бога с Авраамом и от дарования Торы на Синае. Реформистский иудаизм сохраняет веру в Завет между Богом и Израилем. В заявлении «Дабру эмет» иудейские учёные пишут, что Бог заключил завет с народом Израиля, и называют христианство верой, возникшей внутри иудаизма, но не его продолжением.
