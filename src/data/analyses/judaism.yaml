        tradition:
          text: 'Иудаизм исповедует, что Тора дана Богом на Синае и не изменится: по девятому принципу Рамбама, Творец не даст никакой другой Торы. Из 613 заповедей около пятидесяти посвящены пище. Консервативный иудаизм настаивает на соблюдении традиции; реформистское течение исторически ставит этическое выше обрядового.'
