              title: Reform Judaism | My Jewish Learning
              tier: reference
              excerpt: Historically, it has emphasized the ethical aspects of Jewish tradition over its ritual requirements
              accessed: '2026-10-01'
        answer:
          points:
            - 'Общая основа прочна: две главные заповеди — любовь к Богу (Втор 6:5) и к ближнему (Лев 19:18) — Христос называет теми, на которых «утверждается весь закон и пророки» (Мф 22:37–40). Православный и иудей читают в этом месте одни и те же слова Торы.'
            - Различие — в судьбе обрядового закона. По слову апостолов, закон был «детоводителем ко Христу» (Гал 3:24), а праздники, субботы и различения в пище — «тень будущего, а тело – во Христе» (Кол 2:16–17); Апостольский собор не возложил на христиан из язычников бремени закона (Деян 15:28–29).
            - 'Для иудаизма это означало бы изменение Торы: по Рамбаму, Тора остаётся навсегда без изменения, дополнения и сокращения (Основы Торы 9:1). Расхождение — в основаниях, а не в уважении к заповеди.'
            - 'Церковь при этом не считает иудейскую праведность внешней: энциклопедия «Азбука веры» называет такое представление ошибочным и отмечает, что, по пониманию самих иудеев, исполнение заповедей — и долг, и выражение любви к Богу.'
          proof:
