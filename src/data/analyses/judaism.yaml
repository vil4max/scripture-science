      - id: asceticism-monasticism
        title: Аскеза и монашество
        short: "Церковь признаёт монашество добровольным путём полного посвящения себя Богу, а иудаизм не поощряет безбрачие и аскетизм, считая радость земной жизни частью служения Богу."
        topic: fasting
        church:
          text: Монашество — добровольный путь всецелого посвящения себя Богу через принятие обетов; главные обеты — послушание, нестяжание и целомудрие. Церковь видит в нём особый образ христианского жительства, а не обязанность для всех.
          proof:
            - url: https://azbyka.ru/monashestvo
              title: 'Азбука веры. Монашество: обеты и духовная жизнь'
              tier: reference
              excerpt: всецело посвятивший себя Богу через принятие обетов
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/dokumenty/polozhenie-o-monastyrjah-i-monashestvuyushhih/
              title: Положение о монастырях и монашествующих — документ Архиерейского Собора Русской Православной Церкви 2017 г. (текст на «Азбуке веры»)
              tier: official
              excerpt: особый образ христианского жительства, заключающийся во всецелом посвящении себя на служение Богу
              accessed: '2026-09-26'
            - url: https://azbyka.ru/otechnik/dokumenty/polozhenie-o-monastyrjah-i-monashestvuyushhih/
              title: Положение о монастырях и монашествующих — документ Архиерейского Собора Русской Православной Церкви 2017 г. (текст на «Азбуке веры»)
              tier: official
              excerpt: Главными из этих обетов являются послушание, нестяжание и целомудрие
              accessed: '2026-09-26'
        tradition:
          text: 'Иудаизм, по справочным изданиям, не поощряет монашеский идеал безбрачия и аскетизма: аскетизм никогда не занимал существенного места в еврейской религии, а крайнее воздержание Рамбам называет дурным путём. Радость земной жизни, данной Богом, считается частью служения.'
          proof:
            - url: https://ru.wikipedia.org/wiki/%D0%9C%D0%BE%D0%BD%D0%B0%D1%88%D0%B5%D1%81%D1%82%D0%B2%D0%BE
              title: Монашество — Википедия
              tier: reference
              excerpt: Иудаизм не поощряет монашеский идеал безбрачия и аскетизма
              accessed: '2026-09-26'
            - url: https://eleven.co.il/judaism/religious-ethics/10308/
              title: Аскетизм | Электронная еврейская энциклопедия
              tier: reference
              excerpt: Аскетизм никогда не занимал существенного места в еврейской религии
              accessed: '2026-09-26'
            - url: https://eleven.co.il/judaism/religious-ethics/10308/
              title: Аскетизм | Электронная еврейская энциклопедия
              tier: reference
              excerpt: они рассматривают аскетизм и отшельничество как противоречащие стремлению Бога дать людям возможность наслаждаться дарованной им земной жизнью
              accessed: '2026-09-26'
            - url: https://www.sefaria.org/api/texts/Mishneh_Torah,_Human_Dispositions.3.1?context=0
              title: Mishneh Torah, Human Dispositions (Hilchot De'ot) 3:1, trans. Eliyahu Touger — Sefaria
              tier: official
              excerpt: he will not eat meat, nor drink wine, nor live in a pleasant home, nor wear fine clothing
              accessed: '2026-09-26'
            - url: https://www.sefaria.org/api/texts/Mishneh_Torah,_Human_Dispositions.3.1?context=0
              title: Mishneh Torah, Human Dispositions (Hilchot De'ot) 3:1, trans. Eliyahu Touger — Sefaria
              tier: official
              excerpt: This, too, is a bad path and it is forbidden to walk upon it
              accessed: '2026-09-26'
        answer:
          points:
            - 'Здесь различие подлинное: иудаизм не поощряет монашеский идеал безбрачия. Православие не требует монашества от всех: о воздержании ради Царства Небесного Христос говорит «Кто может вместить, да вместит» (Мф 19:12).'
            - 'Но корни посвящения есть и в Писании Израиля: назорейство — обет воздержания от вина и крепких напитков, «чтобы посвятить себя в назореи Господу» (Чис 6:2–3); Иоанн Креститель, чья пища «были акриды и дикий мёд» (Мф 3:4).'
            - 'Монашество в Православии основано на слове Христа: «если хочешь быть совершенным, пойди, продай имение твоё и раздай нищим» (Мф 19:21). Это добровольный совет.'
            - 'Церковь не противопоставляет иудейскую жизнь монашеству как худшую или лучшую: речь о разных призваниях.'
          proof:
            - url: https://azbyka.ru/biblia/?Mt.19:12&r
              title: Мф. 19:12 — Синодальный перевод
              tier: official
              excerpt: Кто может вместить, да вместит
              accessed: '2026-10-01'
