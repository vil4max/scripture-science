            - 'Общий корень — покаяние: «обратитесь ко Мне всем сердцем своим в посте, плаче и рыдании» (Иоил 2:12). Йом Кипур установлен Торой: «смиряйте души ваши» (Лев 16:29, 31); катехизис Церкви напоминает, что и в Ветхом Завете подразумевались дни поста, как день очищения.'
            - 'Истинный пост пророки связывают со справедливостью: «разреши оковы неправды» и «раздели с голодным хлеб твой» (Ис 58:6–7). С этим согласно и Евангелие: постящийся должен явиться «не пред людьми, но пред Отцом твоим» (Мф 6:18).'
            - 'Христос предполагает пост как часть жизни учеников: «придут дни, когда отнимется у них жених, и тогда будут поститься» (Мф 9:15). Православный пост связан с церковным годом и с жизнью во Христе.'
            - 'Поэтому различие — не в часах без пищи, а в календаре и основании: нельзя оценивать православный пост только числом часов или строгостью запрета питья, как нельзя и иудейский Йом Кипур приравнивать к Великому посту.'
          proof:
