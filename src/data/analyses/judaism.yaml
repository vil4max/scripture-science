              title: Чис. 6:3 — Синодальный перевод
              tier: official
              excerpt: то он должен воздержаться от вина и крепкого напитка
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Mt.3:4&r
              title: Мф. 3:4 — Синодальный перевод
              tier: official
              excerpt: а пищею его были акриды и дикий мед
