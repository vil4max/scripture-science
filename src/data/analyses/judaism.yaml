        tradition:
          text: Письменную Тору дополняет Устная Тора, отражённая в Талмуде и передаваемая, по преданию, от Моисея через цепь поколений. Ортодоксальный иудаизм следует традиционному раввинистическому толкованию; в консервативном иудаизме раввины коллективно определяют направление через Раввинскую ассамблею; реформистское течение подчёркивает осознанный выбор человека.
