          points:
            - 'Общее — запрет идолов: вторая заповедь запрещает поклоняться идолам как мнимым божествам, и Православие это признаёт (катехизис, вопросы 512–513).'
            - Сам Моисей, через которого дана заповедь, получил повеление поставить в скинии золотых херувимов (Исх 25:18–20); поэтому, по катехизису, священные изображения не запрещены, если их не боготворят.
            - 'Основание иконы — воплощение: «Слово стало плотию… и мы видели славу Его» (Ин 1:14). Иудаизм не принимает воплощение, поэтому и основание запрета образов у него иное — бестелесность Бога.'
            - 'Различие не отрицает почтения к заповеди: и Церковь, и иудаизм исходят из того, что Бога нельзя ограничить изображением; Церковь изображает Его только в том, как Он Сам явился людям во Христе.'
