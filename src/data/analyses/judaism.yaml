            - 'Здесь согласие подлинное: классический иудаизм и Церковь исповедуют воскресение мёртвых. Оно известно уже Писанию Израиля: «многие из спящих в прахе земли пробудятся, одни для жизни вечной» (Дан 12:2); Марфа говорит: «знаю, что воскреснет в воскресение, в последний день» (Ин 11:24); фарисеи, по Деяниям, «признают» воскресение (Деян 23:8).'
            - 'Основание для Церкви — воскресение Христа: «Христос воскрес из мертвых, первенец из умерших» (1 Кор 15:20). Воскресение понимается как действительное, телесное.'
            - 'Различие внутри иудаизма: документ 1885 года нельзя считать описанием всех современных иудеев. При сравнении необходимо указывать автора и время иудейского документа и не смешивать разные направления.'
            - Церковь, кроме того, учит о состоянии душ до всеобщего воскресения и о пользе молитвы за умерших; в иудейских текстах «олам ха-ба» (грядущий мир) связан с воскресением, но мудрецы по-разному понимают его содержание, поэтому сравнивать надо осторожно.
          proof:
