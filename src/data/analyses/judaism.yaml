        tradition:
          text: Молитва, по пятому принципу Рамбама, обращена только к Творцу — Ему и никому другому. Из 613 заповедей Торы около пятидесяти посвящены пище; консервативный иудаизм настаивает на соблюдении традиции, а реформистское течение исторически ставит этическое выше обрядового.
