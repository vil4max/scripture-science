        topic: authority
        church:
          text: Священное Предание Церкви — апостольская проповедь и весь спасительный апостольский опыт, переданные Церкви; оно нужно для правильного понимания Писания, которое следует понимать согласно толкованию Православной Церкви и святых отцов.
