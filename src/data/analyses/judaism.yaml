              tier: reference
              excerpt: We do not see it as an extension of Judaism
              accessed: '2026-10-01'
        answer:
          points:
            - 'Основа общая: Бог избрал Израиль и заключил с ним завет. Апостол Павел говорит об Израильтянах: «которым принадлежат усыновление и слава, и заветы, и законоположение, и богослужение, и обетования» (Рим 9:4); Христос «по плоти» от них (Рим 9:5).'
            - 'Церковь видит себя продолжением и исполнением этого избрания: «вы – род избранный… некогда не народ, а ныне народ Божий» (1 Пет 2:9–10); «если же вы Христовы, то вы семя Авраамово» (Гал 3:29). В официальном документе Церкви это выражено словами о прообразе.'
            - 'Но это не отвержение народа: «неужели Бог отверг народ Свой? Никак» (Рим 11:1); «дары и призвание Божие непреложны» (Рим 11:29); «весь Израиль спасется» (Рим 11:26). Свт. Лука Крымский, цитируемый энциклопедией «Азбука веры», пишет: «О конечной судьбе Израиля мы ничего не знаем».'
            - 'Иудаизм не видит в Церкви нового Израиля: «Дабру эмет» уважает христианство как веру, возникшую внутри иудаизма, но не как его продолжение. Расхождение в том, кто наследует обетования, остаётся.'
