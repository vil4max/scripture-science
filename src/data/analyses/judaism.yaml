        church:
          text: Христос пришёл не нарушить закон, а исполнить его. Десять заповедей даны народу израильскому, но обязательны и для христиан, потому что это тот же закон, который написан в сердцах всех людей; ветхозаветный обрядовый закон с пришествием Христа, по учению Церкви, утратил силу закона.
