        answer:
          points:
            - 'Общая основа в Писании Израиля: «жертва Богу — дух сокрушенный» (Пс 50:19), «милости хочу, а не жертвы» (Ос 6:6) — Христос напоминает эти слова (Мф 9:13). Покаяние — общий путь к Богу, и Церковь не умаляет иудейское слово о тшуве.'
            - 'Различие — в том, что приносит прощение. Для Церкви ветхозаветные жертвы были прообразом: «Кровь Христа… очистит совесть нашу» (Евр 9:14); Христос «принеся одну жертву за грехи, навсегда воссел одесную Бога» (Евр 10:12); Иоанн Креститель говорит о Нём: «Агнец Божий, Который берет на Себя грех мира» (Ин 1:29).'
            - 'Иудаизм не связывает искупление со смертью Мессии: по Рамбаму, о котором пишет My Jewish Learning, убитый Мессия — не тот, о ком говорила Тора; сегодня, по Рамбаму, остаётся раскаяние, а Йом Кипур искупает кающихся.'
            - 'Честно признать: и для иудея, и для православного христианина без покаяния нет прощения; расходятся в ответе на вопрос, довольно ли покаяния без Искупителя.'
          proof:
