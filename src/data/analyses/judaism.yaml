        answer:
          points:
            - 'Основа общая: «помни день субботний, чтобы святить его» (Исх 20:8) — творение и покой седьмого дня; Церковь хранит это воспоминание и по сей день, не празднуя субботу как день недели, но и не умаляя её значения.'
            - 'Христос о субботе: «суббота для человека, а не человек для субботы», «Сын Человеческий есть Господин и субботы» (Мк 2:27–28). Он не отменял покой, а показал его цель.'
            - 'Апостольская практика: «в первый же день недели, когда ученики собрались для преломления хлеба» (Деян 20:7); «день воскресный» упомянут в Откровении (Откр 1:10).'
            - 'Апостол Павел говорит, что субботы и праздники — «тень будущего» (Кол 2:16–17): это христианское чтение; иудаизм же видит в Шаббате вечную заповедь народа.'
          proof:
