              excerpt: с возложением рук священства
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Act.14:23&r
              title: Деян. 14:23 — Синодальный перевод
              tier: official
              excerpt: Рукоположив же им пресвитеров к каждой церкви
              accessed: '2026-10-01'
