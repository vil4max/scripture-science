        tradition:
          text: 'Канон иудаизма — Танах: Тора (Пятикнижие Моисея), Невиим (Пророки) и Ктувим (Писания), 24 книги, составляющие Письменную Тору. Все течения признают один и тот же Танах; они расходятся в статусе Устной Торы.'
          proof:
            - url: https://toldot.com/Tanah.html
              title: Танах — Еврейская Библия | Толдот.ру
              tier: official
              excerpt: 'Само слово «Танах» — это аббревиатура трех слов: Тора (Пятикнижие Моисея, Хумаш), Невиим (Пророки), Ктувим (Писания)'
              accessed: '2026-09-25'
        answer:
          points:
            - 'Общее основание реально: Пятикнижие Церковь вместе с Христом называет законом Моисеевым (Лк 24:44), а апостол Павел говорит об иудеях, что «им вверено слово Божие» (Рим 3:2). Для православного христианина Танах — не чужая книга, а часть его Писания.'
            - 'Разный счёт книг не всегда означает разные тексты: святые Кирилл Иерусалимский, Афанасий Великий и Иоанн Дамаскин принимали 22 книги Ветхого Завета «в соответствии с тем, как их считают евреи» (Катехизис свт. Филарета). Русская православная классификация насчитывает в Ветхом Завете 50 книг, включая книги, которых нет в еврейском каноне.'
            - 'Главное различие — Новый Завет: в канон Танаха он не входит. Церковь читает Ветхий Завет в свете Христа: «Исследуйте Писания… они свидетельствуют о Мне» (Ин 5:39).'
            - 'Это чтение не отменяет почтения к Танаху: «Новый Завет в Ветхом скрывается, Ветхий Завет в Новом раскрывается» — слова блж. Августина, приводимые в энциклопедии «Азбука веры».'
          proof:
            - url: https://azbyka.ru/biblia/?Lk.24:44&r
              title: Лк. 24:44 — Синодальный перевод
              tier: official
              excerpt: написанному о Мне в законе Моисеевом и в пророках и псалмах
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Rom.3:2&r
