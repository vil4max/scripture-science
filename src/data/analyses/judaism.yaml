      - id: judaism-movements
        title: Течения иудаизма
        short: "Иудаизм не един: ортодоксальное, консервативное и реформистское течения по-разному относятся к традиции, но у всех один Танах, вера в единого Бога и в Завет — союз Бога с Израилем."
        topic: organisation
        church:
          text: Православная энциклопедия отмечает, что современный иудаизм неоднороден и представлен течениями, которые сильно отличаются в вероучении и практиках. Общие для большинства течений черты — монотеизм, вера в Завет, авторитет Танаха и Талмуда, исполнение заповедей, ожидание Мессии, вера в ангелов и в воскресение мёртвых.
          proof:
            - url: https://azbyka.ru/iudaizm
              title: Азбука веры. Иудаизм
              tier: reference
              excerpt: Современный иудаизм неоднороден и представлен различными течениями, которые сильно отличаются в вероучении и практиках
              accessed: '2026-10-01'
            - url: https://azbyka.ru/iudaizm
              title: Азбука веры. Иудаизм
              tier: reference
              excerpt: Для большинства течений характерны следующие, объединяющие их особенности
              accessed: '2026-10-01'
        tradition:
          text: Ортодоксальный иудаизм менее склонен считать, что предписания меняются вместе с обществом. В консервативном иудаизме (масорти) раввины коллективно определяют направление через Раввинскую ассамблею. Реформистский иудаизм говорит о постоянно развивающейся Торе и традиции и делает акцент на осознанном личном выборе.
          proof:
            - url: https://www.myjewishlearning.com/article/orthodox-judaism/
              title: Orthodox Judaism | My Jewish Learning
              tier: reference
              excerpt: Orthodox Judaism is more resistant than its liberal counterparts to the idea that biblical mandates can change in response to changing social circumstances
              accessed: '2026-09-25'
            - url: https://www.rabbinicalassembly.org/about-us/conservative-masorti
              title: Conservative/Masorti | The Rabbinical Assembly
              tier: official
              excerpt: Each rabbi serves as halakhic authority for his or her community, and our rabbis collectively give direction through the Rabbinical Assembly
              accessed: '2026-09-25'
            - url: https://urj.org/what-we-believe/what-is-reform-judaism
              title: What is Reform Judaism? | Union for Reform Judaism
              tier: official
              excerpt: strive to make thoughtful choices about how we put our values into action
              accessed: '2026-09-25'
            - url: https://urj.org/what-we-believe/what-is-reform-judaism
              title: What is Reform Judaism? | Union for Reform Judaism
              tier: official
              excerpt: in the teachings of an ever-evolving Torah and tradition
              accessed: '2026-09-25'
        answer:
          points:
            - Расхождения внутри иудаизма касаются статуса Устной Торы и галахи, кашрута, роли женщин-раввинов и эсхатологии (Питтсбургская платформа 1885 года отказалась от учения о телесном воскресении). Поэтому об иудаизме нельзя говорить как об одной позиции без уточнения, о каком течении речь.
            - 'Общее есть и у всех течений: один и тот же Танах, вера в единого Бога и в Завет между Богом и Израилем. Именно с этим общим основанием Церковь и сопоставляет своё учение.'
            - 'Православная оценка относится к учению, а не к людям: Основные принципы Русской Православной Церкви (2000) требуют относиться с христианской любовью к людям, исповедующим ошибочные, с точки зрения Церкви, взгляды. Этот документ написан об инославных христианах; сайт применяет тот же принцип тона к людям другой веры.'
          proof:
