        answer:
          points:
            - 'Общее наследие молитвы — Псалтирь: в Церкви она, по катехизису, «всегда используется в богослужении». Христос Сам, «по обыкновению Своему, в день субботний» входил в синагогу (Лк 4:16), а первые христиане «каждый день единодушно пребывали в храме и, преломляя по домам хлеб, принимали пищу» (Деян 2:46).'
            - 'Новое в Церкви — Евхаристия, установленная на Тайной вечере: «сие есть Тело Мое… сия чаша есть Новый Завет в Моей Крови» (Лк 22:19–20). Она не аналог синагогальной молитвы и не сводится к исполнению заповедей.'
            - 'Единство молитвы только Богу общее: и Церковь поклоняется одному Богу. Почитание ангелов и святых она не считает нарушением этого, «поскольку мы почитаем благодать Божию, в них обитающую и действующую» (катехизис, вопрос 511).'
            - Формы и язык богослужения различаются; Церковь не оценивает синагогальную молитву по меркам таинств, а показывает, что Христос исполняет ветхозаветные прообразы.
