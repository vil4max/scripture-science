      - id: one-god-trinity
        title: Единый Бог и Троица
        short: "Церковь и иудаизм верят в единого Бога, но Церковь исповедует Его единым в трёх Лицах — Отце, Сыне и Святом Духе (Троица), а иудаизм учение о Троице не принимает."
        topic: god
        church:
          text: 'Бог один по существу и троичен в Лицах: Отец, Сын и Святой Дух — Троица единосущная и нераздельная. Церковь исповедует то же единство Бога, что и Писание Израиля, но вместе с тем — Троицу, открытую во Христе.'
