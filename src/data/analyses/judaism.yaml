              excerpt: доколе Он придет
              accessed: '2026-10-01'
        tradition:
          text: 'После разрушения Храма жертвоприношения не совершаются. По Рамбаму, ныне, когда нет Храма и жертвенника искупления, остаётся лишь раскаяние (тшува), и раскаяние искупает все грехи; Йом Кипур искупает кающихся. Электронная еврейская энциклопедия: искупление достигается только искренним раскаянием, а проступки против ближнего требуют возмещения ущерба и прощения.'
