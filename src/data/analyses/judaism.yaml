              accessed: '2026-09-26'
        answer:
          points:
            - 'Основание уважения — в Писании: об Израильтянах Павел говорит, что «в отношении к избранию, возлюбленные Божии ради отцов» (Рим 11:28). Церковь исповедует, что Христос «по плоти» — от Израиля (Рим 9:5).'
            - 'На Кресте Христос молится: «Отче! прости им, ибо не знают, что делают» (Лк 23:34); апостол Пётр говорит: «вы, как и начальники ваши, сделали это по неведению» (Деян 3:17).'
            - 'Расхождения называются честно и без вражды: «Дабру эмет» говорит, что христианское богослужение не является приемлемым выбором для иудеев, а христиане знают Бога через Иисуса Христа. Церковь не скрывает своих расхождений, но не делает из них повода для вражды.'
            - Православная критика направлена на учения и положения, а не на людей и не на народ; обвинения в ритуальных убийствах, по словам энциклопедии, — клевета.
          proof:
