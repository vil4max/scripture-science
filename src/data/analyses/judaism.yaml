        tradition:
          text: 'Иудаизм исповедует строгий монотеизм: Творец — один, бестелесный, не имеющий подобия. Эта вера выражена во втором и третьем принципах Рамбама и ежедневно провозглашается в «Шма Исраэль». Учения о Троице иудаизм не принимает.'
          proof:
            - url: https://toldot.com/13PrintsipovVery.html
              title: 13 принципов веры | Толдот.ру
              tier: official
              excerpt: Творец, благословенно имя Его, — Один, и нет в мире цельности, подобной абсолютной цельности Его
              accessed: '2026-09-25'
            - url: https://toldot.com/13PrintsipovVery.html
              title: 13 принципов веры | Толдот.ру
              tier: official
              excerpt: благословенно имя Его, нематериален и ему несвойственны присущие материи состояния, и что у Него вообще нет никакого подобия
              accessed: '2026-09-25'
        answer:
          points:
            - 'Сходство подлинное: «Слушай, Израиль: Господь, Бог наш, Господь един есть» (Втор 6:4) Христос Сам называет первой из всех заповедей (Мк 12:29). Православная Церковь не учит о трёх богах.'
            - Различие — в том, как раскрыто это единство. Крещение «во имя Отца и Сына и Святого Духа» (Мф 28:19) — одно имя, а благословение апостола называет вместе Христа, Отца и Духа (2 Кор 13:13).
            - Катехизис свт. Филарета отмечает, что о Троице говорится и в Ветхом Завете, «но не так ясно» (вопрос 92), и приводит места Пс 32:6 и Ис 6:3. Это церковное толкование; иудейское чтение тех же мест иное.
            - Бог по существу бестелесен («Бог есть Дух»), с этим согласны и Рамбам, и катехизис; различие начинается там, где Церковь исповедует, что Сын Божий воплотился (см. карточку «Воплощение и божество Иисуса»).
          proof:
            - url: https://azbyka.ru/biblia/?Deut.6:4&r
