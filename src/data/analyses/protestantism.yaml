      - id: prayer-for-dead
        title: Молитва об усопших
        topic: afterlife
        church:
          text: Душам умерших с верой, но не успевших принести достойных плодов покаяния, для достижения блаженного воскресения могут помочь возносимые за них молитвы, особенно соединённые с бескровной жертвой Тела и Крови Христовых, и добрые дела, совершаемые в их память. Молитва за усопших — непременная часть Божественной Литургии, начиная от Литургии апостола Иакова; по Посланию 1723, облегчение они получают по бесконечной благости Божией через молитвы священников и благотворения.
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
