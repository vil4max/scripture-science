        answer:
          points:
            - "Здесь расхождения нет: рассмотренные исповедания держатся той же веры в Троицу, что и Символ веры, и называть это отрицанием Бога нельзя. Основные принципы РПЦ (2000) прямо называют общим для разделённых христиан Слово Божие и веру во Христа как Бога и Спасителя, пришедшего во плоти (§1.16)."
            - "Общая и крещальная формула: Христос заповедал крестить «во имя Отца и Сына и Святого Духа» (Мф 28:19) — так крестят и Православная Церковь, и баптисты, и пятидесятники."
            - "Название «протестантизм» само по себе не гарантирует одинакового учения у всех объединений: сопоставлять нужно конкретное исповедание с Символом веры."
            - "Совпадение слов о Троице не разрешает вопросов о Церкви, таинствах и Предании: именно там проходят дальнейшие расхождения (см. карточки ниже)."
          proof:
