      - id: predestination
        title: Предопределение и свобода воли
        topic: salvation
        church:
          text: "Послание восточных патриархов (1723) исповедует, что Бог предопределил к славе тех, кого избрал от вечности, — но потому, что предвидел, как одни будут хорошо, а другие худо пользоваться свободной волей: Он «хощет всем человекам спастися». Предваряющая благодать просвещает всех, а желающие свободно покоряться ей получают особую благодать."
          proof:
            - url: https://azbyka.ru/otechnik/bogoslovie/poslanie-patriarhov-vostochno-kafolicheskoj-tserkvi-o-pravoslavnoj-vere-1723-g/
              title: Послание Патриархов Восточно-Кафолической Церкви о православной вере (1723) — «Азбука веры», член 3
              tier: official
              excerpt: но поскольку Он предвидел, что одни будут хорошо пользоваться своею свободной волею, а другие худо
              accessed: "2026-10-01"
            - url: https://azbyka.ru/otechnik/bogoslovie/poslanie-patriarhov-vostochno-kafolicheskoj-tserkvi-o-pravoslavnoj-vere-1723-g/
              title: Послание Патриархов Восточно-Кафолической Церкви о православной вере (1723) — «Азбука веры», член 3
              tier: official
              excerpt: Который хощет всем человекам спастися и в познание истины прийти
              accessed: "2026-10-01"
            - url: https://azbyka.ru/otechnik/bogoslovie/poslanie-patriarhov-vostochno-kafolicheskoj-tserkvi-o-pravoslavnoj-vere-1723-g/
              title: Послание Патриархов Восточно-Кафолической Церкви о православной вере (1723) — «Азбука веры», член 3
              tier: official
              excerpt: благость Божия даровала Божественную и просвещающую благодать, называемую нами также предваряющею
              accessed: "2026-10-01"
        tradition:
          text: Вестминстерское исповедание (гл. 3) учит, что одни люди и ангелы предопределены к вечной жизни, а другие предназначены к вечной смерти. Аугсбургское исповедание (ст. XVIII) признаёт за человеком «в некоторой степени» свободную волю в делах, доступных разуму, но не в обращении к Богу без благодати Святого Духа.
          proof:
            - url: https://www.ireformed.org/westminster-confession-of-faith
              title: Вестминстерское исповедание веры, глава 3 «О вечных Божьих установлениях»
              tier: official
              excerpt: одни люди и ангелы предопределены к вечной жизни, а другие предназначены к вечной смерти
              accessed: "2026-09-25"
            - url: https://web.archive.org/web/20260308213117/https://www.elkras.ru/vo_chto_veryat_liuterane/verouchitelnye_knigi/kniga_soglasiya/augsburgskoe_veroispovedanie.jdx
              title: Аугсбургское вероисповедание, артикул XVIII
              tier: official
              excerpt: человек в некоторой степени обладает свободной волей
              accessed: "2026-10-01"
        answer:
          points:
            - "Протестанты здесь расходятся между собой: реформатское исповедание учит о предопределении одних к вечной жизни, а других к вечной смерти, Аугсбургское исповедание оставляет место свободной воле, а в рассмотренных текстах Аугсбургского исповедания и вероучения ЕХБ учения о предопределении в этих терминах нет."
            - Православный ответ, как он выражен в Послании 1723 года, — Бог хочет спасения всех («Который хощет всем человекам спастися», 1 Тим 2:4); предопределение дано с предведением, и осуждение не происходит «без причины».
            - "Писание связывает предопределение с предведением: «кого Он предузнал, тем и предопределил быть подобными образу Сына Своего» (Рим 8:29)."
          proof:
