        answer:
          points:
            - "Общее: воскресенье — день Воскресения, и христиане собираются в него; Лаодикийский Собор (правило 29) говорит, что христиане не должны иудействовать, оставляя дела в субботу, а воскресному дню отдают предпочтение."
            - "Протестанты расходятся между собой: по Вестминстерскому исповеданию, в Слове Божием «ясно выражена вечная нравственная заповедь» — святить один день из семи, а Аугсбургское отвергает мнение, что воскресенье заменило субботу как необходимое."
            - Церковный календарь сохраняют лютеране и англикане (Пасха, Пятидесятница, Великий пост), тогда как баптистское вероучение говорит о воскресном дне; общего запрета Пасхи или Рождества у протестантов нет.
            - Православные праздники раскрывают в богослужении события спасения; их значение не сводится к наличию прямой команды для каждого праздника в отдельном стихе.
          proof:
            - url: https://azbyka.ru/pravo/laodikijskij-sobor-29/
