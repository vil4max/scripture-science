        tradition:
          text: Аугсбургское исповедание (ст. XXI) учит вспоминать святых и подражать их добрым делам, но отвергает призывание святых как недоказанное Писанием, ссылаясь на единого Посредника. Вестминстерское исповедание велит поклоняться только Богу, «а не ангелам, святым или другим творениям», а Гейдельбергский катехизис включает молитву святым (prayer to saints) в запреты первой заповеди. Англиканский приход в Москве пишет, что sola Christus важно было, когда «молитва к святым и Деве Марии заменила молитву ко Христу», а на сайте англиканского святилища Уолсингема встречается обращение «Our Lady of Walsingham, pray for us». Рождение Христа от девы Марии исповедуют и Аугсбургское исповедание, и вероучение ЕХБ.
