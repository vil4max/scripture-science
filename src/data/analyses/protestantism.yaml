        church:
          text: "Церковь живёт событием Пятидесятницы: на апостолов сошёл Святой Дух, и каждый слышал их говорящих его наречием (Деян 2). В Таинстве Миропомазания верующий получает благодать, содействующую духовному росту и укрепляющую (катехизис), а дар языков, по энциклопедии «Азбука веры», обычное церковное толкование понимает как чудесную способность говорить на иностранных языках, не изучая их предварительно."
