        answer:
          points:
            - "Православие не учит покупке спасения делами: благодать первична, и Послание 1723 представляет Бога «единственным виновником нашего спасения», а катехизис учит, что без веры одними делами спастись нельзя (§479)."
            - Расхождение — в роли свободного ответа человека. Писание говорит и о том, что «человек оправдывается верою, независимо от дел закона» (Рим 3:28), и о том, что «человек оправдывается делами, а не верою только» (Иак 2:24); во Христе Иисусе имеет силу «вера, действующая любовью» (Гал 5:6); спасение — «не от дел» (Еф 2:8–9), но мы «созданы во Христе Иисусе на добрые дела» (Еф 2:10).
            - "Лютеране сами требуют добрых плодов веры (ст. VI), поэтому спор нельзя свести к противопоставлению веры и нравственной жизни: каждый спор о вере и делах требует выяснить, что именно отрицает конкретное исповедание."
            - "Православная синергия не означает самоспасения: это соработничество человека с благодатью Божией. Эти темы остаются предметом богословского диалога РПЦ с лютеранами (Основные принципы, §4)."
          proof:
