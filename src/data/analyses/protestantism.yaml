      - id: monasticism
        title: Монашество
        topic: fasting
        church:
          text: "Монашество, по Положению Архиерейского Собора РПЦ (2017), — особый образ христианского жительства, всецелое посвящение себя служению Богу; главные обеты — послушание, нестяжание и целомудрие. Оно основано на словах Господа: «Если хочешь быть совершенным, пойди, продай имение твоё» (Мф 19:21), и правила Вселенских Соборов отдают ему честь."
