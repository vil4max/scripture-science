      - id: ancestral-sin
        title: Первородный грех
        topic: salvation
        church:
          text: "Послание восточных патриархов (1723) учит, что от падения Адама «прародительский грех» распространился на всё потомство: нет рождённых по плоти, свободных от его бремени. Но бременем и следствием падения оно называет «не самый грех», а удобопреклонность ко греху и бедствия — труды, болезни и смерть."
          proof:
            - url: https://azbyka.ru/otechnik/bogoslovie/poslanie-patriarhov-vostochno-kafolicheskoj-tserkvi-o-pravoslavnoj-vere-1723-g/
