        church:
          text: Церковь признаёт войну злом, но не воспрещает своим чадам участвовать в боевых действиях, если речь идёт о защите ближних и восстановлении попранной справедливости (Основы социальной концепции РПЦ, VIII.2). По катехизису свт. Филарета, все люди — наши ближние, потому что все — создания единого Бога, а любовь к Государю и Отечеству должна простираться до готовности отдать за них свою жизнь.
