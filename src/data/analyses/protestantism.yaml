        church:
          text: "В Православной Церкви главные части Вселенской Церкви подчинены патриархам, области и города — митрополитам, архиепископам и епископам; от имени всей Церкви может действовать Вселенский Собор. Церковь едина, но существует как отдельные самостоятельные Церкви: Иерусалимская, Антиохийская, Александрийская, Константинопольская, Российская. Единственная Глава Церкви — Христос; Римскому престолу древний порядок усваивал первенство чести, но не юрисдикцию над всеми Поместными Церквами."
