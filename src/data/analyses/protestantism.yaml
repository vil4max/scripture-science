        answer:
          points:
            - Христос — единственный Искупитель; молитвы святых не вводят другого спасителя. Просьба об их ходатайстве выражает единство земной и небесной Церкви и не освобождает человека от собственной молитвы, покаяния и исполнения заповедей.
            - "Общее: лютеране, как и Православие, чтут память святых и берут пример с их жизни; спор идёт о призывании и о Богородице. Именование «Матерь Господа» взято из Писания (Лк 1:43), а Мария сама говорит: «отныне будут ублажать Меня все роды» (Лк 1:48)."
            - Основание православной молитвы — единство Церкви (Евр 12:1) и молитвы святых перед престолом Бога (Откр 8:3–4); Церковь не учит, что Богородица была свободна от первородного греха с самого начала, а различные объяснения Её очищения, по энциклопедии «Азбука веры», относятся к частным богословским мнениям.
            - "Протестанты не едины: лютеране и реформаты отвергают призывание святых, а в англиканской практике рядом существуют разные взгляды."
