        tradition:
          text: "Исповедание РЦХВЕ (раздел 7) учит о крещении Духом Святым как об отдельном событии: его физическим доказательством служит знамение говорения на иных языках, а цели — сверхъестественная сила и духовные дары для служения. В вероучении ЕХБ такого учения нет: Дух Святой там описан как ниспосланный в Пятидесятницу, возрождающий верующего и содействующий его росту."
