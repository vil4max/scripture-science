        tradition:
          text: Баптистское вероучение (ЕХБ) связывает воскресный день с воскресением Христа и называет его «днем святого труда для Господа». Аугсбургское исповедание (ст. XV, XXVIII) сохраняет воскресные дни, Пасху и Пятидесятницу, но отрицает, что воскресенье введено «взамен субботы как необходимое»; Вестминстерское исповедание (гл. 21) говорит о праздновании первого дня недели «как христианской Субботы». У англикан церковный год соблюдается в разных формах — от традиционной до менее формальной.
