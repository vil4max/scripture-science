              accessed: "2026-10-01"
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: "Свт. Филарет Московский. Пространный катехизис, §374: молитва за усопших в предании Церкви"
