              title: Свт. Филарет Московский. Пространный катехизис, §135
              tier: official
              excerpt: Имя Господь есть одно из имён Божиих.
              accessed: "2026-09-27"
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: "Свт. Филарет Московский. Пространный катехизис, §86: Каковы свойства Божии?"
              tier: official
              excerpt: Бог есть Дух вечный, всеблагой, всеведущий, всеправедный, всемогущий, вездесущий, неизменяемый, вседовольный, всеблаженный
              accessed: "2026-09-25"
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: "Свт. Филарет Московский. Пространный катехизис, §96: Почему Бог называется Вседержителем?"
              tier: official
              excerpt: Бог называется Вседержителем потому, что Он всё, что ни есть, содержит в Своей силе и в Своей воле
              accessed: "2026-09-25"
        tradition:
          text: Ни одно из рассмотренных вероучений — лютеранское, реформатское, баптистское, пятидесятническое — не содержит отдельного учения о произносимом имени Бога. Синодальный перевод, на котором, по РС ЕХБ, русские христиане читают Библию преимущественно, передаёт тетраграмматон словом «Господь» (Исх 3:15).
          proof:
            - url: https://azbyka.ru/biblia/?Ex.3:15
              title: Исход 3:15 — Синодальный перевод (Азбука веры)
              tier: reference
              excerpt: Господь, Бог отцов ваших, Бог Авраама, Бог Исаака и Бог Иакова послал меня к вам. Вот имя Моё на веки
              accessed: "2026-09-25"
            - url: https://bible150.ru/
              title: РС ЕХБ, сайт к 150-летию Синодального перевода
              tier: official
              excerpt: Христиане России до сих продолжают читать Библию преимущественно в этом переводе
              accessed: "2026-10-01"
        answer:
          points:
            - "Здесь расхождения с Православием нет: у протестантов нет обязательной практики употреблять исключительно имя «Иегова»."
            - Православие исповедует Бога, открывшего Себя во многих именах; слово «Господь» не является сокрытием Бога — предмет оценки смысл исповедания, а не одно написание.
            - Православная молитва не ставит познание Бога и спасение в зависимость от употребления только одной формы имени.
          proof:
            - url: https://azbyka.ru/biblia/?Ex.3:15
              title: Исход 3:15 — Синодальный перевод (Азбука веры)
              tier: reference
              excerpt: Господь, Бог отцов ваших, Бог Авраама, Бог Исаака и Бог Иакова послал меня к вам. Вот имя Моё на веки
              accessed: "2026-09-25"
        more:
          - title: Божие имя и божественные имена
            url: https://azbyka.ru/bozhestvennye-imena
            kind: encyclopedia
