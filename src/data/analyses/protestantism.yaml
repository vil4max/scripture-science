        answer:
          points:
            - "Общее: лютеране, реформаты и Православная Церковь допускают участие христианина в защите ближних и в справедливой войне."
            - "Единого протестантского решения нет: от допущения справедливой войны (Аугсбургское исповедание; Вестминстерское исповедание) до личного выбора, включая отказ по совести (Ассамблеи Бога, США), и призыва положить конец войне (Baptist Faith and Message 2000 — документ американской Южной баптистской конвенции, а не РС ЕХБ)."
            - Православный ответ оценивает нравственную ответственность и конкретный поступок; позицию отдельной общины следует называть по её документу, не превращая в общее правило всех протестантов.
            - "Основа — любовь к ближнему: «Нет больше той любви, как если кто положит душу свою за друзей своих» (Ин 15:13)."
