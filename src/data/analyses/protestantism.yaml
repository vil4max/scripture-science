              tier: official
              excerpt: нет ни одного из рожденных по плоти, кто бы свободен был от того бремени
              accessed: "2026-10-01"
            - url: https://azbyka.ru/otechnik/bogoslovie/poslanie-patriarhov-vostochno-kafolicheskoj-tserkvi-o-pravoslavnoj-vere-1723-g/
              title: Послание Патриархов Восточно-Кафолической Церкви о православной вере (1723) — «Азбука веры», член 6
              tier: official
              excerpt: А бременем и следствием падения мы называем не самый грех
              accessed: "2026-10-01"
            - url: https://azbyka.ru/otechnik/bogoslovie/poslanie-patriarhov-vostochno-kafolicheskoj-tserkvi-o-pravoslavnoj-vere-1723-g/
              title: Послание Патриархов Восточно-Кафолической Церкви о православной вере (1723) — «Азбука веры», член 6
              tier: official
              excerpt: но удобопреклонность ко греху и те бедствия, которыми Божественное правосудие наказало человека за его преслушание
              accessed: "2026-10-01"
        tradition:
          text: Аугсбургское исповедание (ст. II) учит, что все естественно рождаемые люди зачинаются во грехе, и это прирождённое зло — «истинно грех», обрекающий не получивших «второго рождения через Крещение и Святого Духа» вечному гневу Божию. Вестминстерское исповедание (гл. 6) выводит все прегрешения из «врожденной порочности».
          proof:
            - url: https://web.archive.org/web/20260308213117/https://www.elkras.ru/vo_chto_veryat_liuterane/verouchitelnye_knigi/kniga_soglasiya/augsburgskoe_veroispovedanie.jdx
              title: Аугсбургское вероисповедание, артикул II
              tier: official
              excerpt: этот первородный грех есть истинно грех и посему он обрекает всех, не получивших второго рождения через Крещение и Святого Духа, вечному гневу Божию
              accessed: "2026-10-01"
            - url: https://www.ireformed.org/westminster-confession-of-faith
              title: Вестминстерское исповедание веры, глава 6
              tier: official
              excerpt: врожденной порочности
              accessed: "2026-10-01"
        answer:
          points:
            - "Общее: обе стороны исповедуют, что падение затронуло всех людей; спор — в том, является ли само состояние виной и греховным деянием."
            - Православный ответ различает «прародительский грех» как повреждённость природы и личные грехи, происходящие «от злого человеческого сердца»; поэтому Послание 1723 называет бременем падения не самый грех, а склонность ко греху и смерть.
            - "Различие связано с Крещением: Аугсбургское исповедание говорит о вечном гневе для не получивших второго рождения, а Православие исповедует «одно Крещение во оставление грехов» (Символ веры)."
          proof:
