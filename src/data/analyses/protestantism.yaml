        answer:
          points:
            - Нормы Церкви выражают её жизнь и пастырскую заботу, а не средство «купить» благодать; различие в том, считать ли церковные установления обязательными для верующих или лишь советом.
            - "Ни одно из рассмотренных вероучений не содержит запрета на употребление крови: поэтому эта норма не является предметом спора с протестантами, но показывает, как по-разному понимается сила церковных правил."
            - "Православная вера в послушание Церкви основана на убеждении, что в ней действует благодать (катехизис, §§251, 269) и что заповедано: «держите предания» (2 Фес 2:15)."
            - "Свобода совести у реформатов тоже ограничена: те, кто под предлогом христианской свободы выступает против законной власти, гражданской или церковной, «оказывают неповиновение Божьему установлению» (Вестминстерское исповедание, гл. 20, §4)."
          proof:
            - url: https://azbyka.ru/biblia/?2Thes.2:15&r
