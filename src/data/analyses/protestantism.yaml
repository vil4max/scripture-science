          points:
            - Для Православия преемство — не только форма управления, но связь веры, епископского служения и Таинств; одного названия «епископ» или выборности общины для такого преемства недостаточно.
            - "Общее есть: лютеране и реформаты требуют законного призвания служителя, англикане сохраняют трёхчинное служение; но в рассмотренных текстах Аугсбургского и Вестминстерского исповеданий о преемстве от апостолов как условии Таинств не говорится."
            - "Протестанты не едины: у англикан три чина, у лютеран — призвание «в законном порядке», у баптистов — избрание церковью; ЕЛЦ России упрекает средневековую Церковь в том, что она «узурпировала дары Св. Духа в пользу касты клириков»."
            - "Апостольские послания знают поставление служителей: «поставил по всем городам пресвитеров» (Тит 1:5) и дар «с возложением рук священства» (1 Тим 4:14); так понимает Священство и катехизис (§354)."
