        tradition:
          text: У англикан — исторический трёхчинный строй; у реформатов — синодальное управление (Вестминстерское исповедание посвящает ему главу 31); у баптистов (РС ЕХБ) — конгрегационное устройство, где служителей избирает поместная церковь; у Ассамблей Бога (пятидесятники, США) есть генеральный суперинтендант, но за каждой общиной признано право самоуправления. Власть папы над всем христианским миром по божественному праву отвергают лютеране (Шмалькальденские артикулы), реформаты (Вестминстерское исповедание, гл. 25) и англикане.
