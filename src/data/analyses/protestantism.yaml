        tradition:
          text: "Аугсбургское исповедание (ст. XXVII) считает ненужными монашеские обеты, которыми надеялись обрести оправдание и благодать: «Поскольку все это ложно, бесполезно и выдумано от себя, монашеские обеты следует считать ненужными». Вестминстерское исповедание (гл. 22) называет обеты пожизненного безбрачия, добровольной бедности и постоянного послушания «предрассудками и греховными тенетами». В англиканской традиции монашеские общины есть: распущенные при Генрихе VIII, они были возобновлены в 1841–1855 гг."
          proof:
            - url: https://web.archive.org/web/20260308213117/https://www.elkras.ru/vo_chto_veryat_liuterane/verouchitelnye_knigi/kniga_soglasiya/augsburgskoe_veroispovedanie.jdx
              title: Аугсбургское вероисповедание, артикул XXVII «О монашеских обетах»
