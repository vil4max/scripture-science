        answer:
          points:
            - "Общее: Глава Церкви один — Христос; это говорит и катехизис (§257), и Вестминстерское исповедание (гл. 25, §6)."
            - "Различие: для Православия Церковь — видимое общество со священноначалием и Таинствами, в котором действует благодать (катехизис, §§250, 252); для лютеран определяющими остаются Слово и Таинства, для реформатов — невидимое собрание избранных, для баптистов — «невидимая» вселенская Церковь и вступление в поместную церковь по вере."
            - Православная Церковь верует, что по обетованиям Христа (Мф 16:18; 28:20) она не может отпасть от веры (катехизис, §269); Вестминстерское исповедание, напротив, считает, что даже самые чистые церкви подвержены заблуждениям (гл. 25, §5).
            - "Основные принципы РПЦ (2000): общины, отпавшие от единства с Православием, никогда не рассматривались как полностью лишённые благодати Божией (§1.15); Церковь не выносит суда о мере сохранности или повреждённости благодатной жизни в инославии (§1.17), а оскорбления в адрес инославных недопустимы (§7.1)."
