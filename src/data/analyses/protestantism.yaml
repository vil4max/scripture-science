      - id: baptism
        title: "Крещение: младенцы и способ"
        topic: worship
        church:
          text: Крещение есть Таинство, в котором верующий при троекратном погружении тела в воду с призыванием Отца, Сына и Святого Духа умирает для греховной жизни и возрождается Святым Духом. От желающего креститься требуются покаяние и вера; младенцев крестят по вере родителей и восприемников, потому что в Новом Завете Крещение совершается вместо обрезания.
