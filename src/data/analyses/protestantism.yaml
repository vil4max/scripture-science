        answer:
          points:
            - "Православие ожидает явного Пришествия Христа во славе, воскресения мёртвых и Суда без вычисления срока: «О дне же том и часе никто не знает» (Мф 24:36)."
            - "Протестанты здесь не едины: лютеранское исповедание осуждает учение о земном царстве до воскресения, тогда как баптистское и пятидесятническое вероучения учат о восхищении Церкви, а пятидесятническое — и о тысячелетнем Царстве на земле."
            - Отдельную схему событий нельзя приписывать всем протестантам или считать равнозначной Символу веры; Символ говорит о Царстве, которому «не будет конца».
            - По прот. О. Давыденкову, до II Вселенского Собора (381 г.) Церковь относилась к идеям хилиазма как к частным богословским мнениям, а после осуждения этого учения разделять такие идеи для православных стало недопустимым.
          proof:
