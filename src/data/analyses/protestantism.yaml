  - id: salvation-sacraments
    title: Спасение и Таинства
    cards:
      - id: justification
        title: "Оправдание: вера и дела"
        topic: salvation
        church:
          text: "По катехизису свт. Филарета, для спасения нужны правильная вера и жизнь по вере с соответствующими ей добрыми делами: вера без любви и добрых дел названа недействующей и мёртвой, но и любовью и делами без веры спастись нельзя. Спасение, по определению «Азбуки веры», есть уподобление Богу и духовное единение с Ним, в котором соработничество Бога и человека (синергия) и обожение. Послание восточных патриархов (1723) исповедует, что человек оправдывается «не просто одною верою, но верою, споспешествуемой любовью»."
