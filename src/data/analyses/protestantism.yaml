      - id: church
        title: Что такое Церковь
        topic: organisation
        church:
          text: Церковь, по катехизису свт. Филарета, — Богом установленное общество людей, соединённых православной верой, законом Божиим, священноначалием и Таинствами; её единственная Глава — Христос. Видимая Церковь есть предмет веры, потому что в ней невидимо присутствует благодать Божия. Основные принципы РПЦ (2000) исповедуют Православную Церковь истинной Церковью Христовой, в которой неповреждённо сохраняется Священное Предание.
