          text: Лютеранская Формула согласия, как её излагает ЕЛЦ России, называет Библию «единственный судья, правило и норма» для суждения «обо всех учениях», а по Вестминстерскому исповеданию «Дух Святой, говорящий в Писании, есть единственный высший Судия»; к Писанию, по этому тексту, ничего не может быть добавлено — ни новые откровения, ни «предания человеческие». У англикан Библия — высший авторитет, но для толкования, по Ричарду Хукеру, нужны предание и разум. Вероучение ЕХБ принято в качестве «вспомогательного материала» для духовного воспитания верующих, а РЦХВЕ называет Писание «самым авторитетным правилом веры и поведения».
