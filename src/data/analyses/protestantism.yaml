        answer:
          points:
            - "Запрет идолов не отменяет образа воплотившегося Христа: VII Вселенский Собор учит, что иконы подтверждают истинность воплощения Бога Слова, а честь, воздаваемая иконе, относится к её первообразу — «истинное служение» приличествует одному божественному естеству."
            - Идол — изображение твари, которому поклоняются «вместо Бога» (катехизис, §512); поэтому иконопочитание не есть идолопоклонство.
            - Свт. Григорий Великий (в катехизисе, §517) называет иконы «книгами» для неграмотных, и Гейдельбергский катехизис (вопр. 98) отвечает на этот довод отказом; но Православие не сводит икону к пособию — Собор говорит о почитании.
            - "Протестанты не едины: реформатская традиция отвергает изображения в богослужении, лютеране и англикане сохраняют распятия и церковное убранство, а у методистов и пятидесятников, по англоязычной Википедии, кресты и изображения встречаются охотнее."
          proof:
            - url: https://web.archive.org/web/20260520222344/https://pravenc.ru/text/155500.html
