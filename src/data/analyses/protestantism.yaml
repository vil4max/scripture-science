        tradition:
          text: "Аугсбургское исповедание (ст. IV) учит, что прощение грехов и оправдание даются «ради Христа по благодати через веру», а не заслугами и делами; вера должна приносить добрые плоды, но уповать на добрые дела как на способ снискать благодать нельзя (ст. VI). Англиканский приход в Москве говорит: «мы спасены (оправданы) не нашими добрыми делами, но только благодатью Божией»; по вероучению ЕХБ оправдание изменяет положение уверовавшего перед Богом."
