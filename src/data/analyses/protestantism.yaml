              tier: official
              excerpt: Молитва за усопших всегда является непременной частью Божественной Литургии, начиная от Литургии апостола Иакова
              accessed: "2026-10-01"
            - url: https://azbyka.ru/otechnik/bogoslovie/poslanie-patriarhov-vostochno-kafolicheskoj-tserkvi-o-pravoslavnoj-vere-1723-g/
              title: Послание Патриархов Восточно-Кафолической Церкви о православной вере (1723) — «Азбука веры», о состоянии умерших
              tier: official
              excerpt: Облегчение же получают они по бесконечной благости чрез молитвы Священников и благотворения, совершаемые за умерших
              accessed: "2026-10-01"
        tradition:
          text: Вестминстерское исповедание (гл. 21, §4) велит молиться «за всех живущих людей и за всех, кто будет жить, но не за умерших» и отрицает «никакого реального жертвоприношения во отпущение грехов живым или мертвым» в Вечере Господней (гл. 29). Лютеранские Шмалькальденские артикулы называют человеческой фантазией, «не подтверждаемая Словом Божьим», мессы за живых и мёртвых, которые приходские священники отправляли «по законному соглашению и путем продажи»; в тексте Аугсбургского исповедания молитва за умерших не упоминается.
          proof:
            - url: https://www.ireformed.org/westminster-confession-of-faith
              title: "Вестминстерское исповедание веры, глава 21, §4: молитва"
              tier: official
              excerpt: за всех живущих людей и за всех, кто будет жить, но не за умерших
              accessed: "2026-10-01"
            - url: https://www.ireformed.org/westminster-confession-of-faith
              title: "Вестминстерское исповедание веры, глава 29, §2: Вечеря и жертва"
              tier: official
              excerpt: не совершается никакого реального жертвоприношения во отпущение грехов живым или мертвым
              accessed: "2026-10-01"
            - url: https://reformed.org.ua/2/208/
              title: Шмалькальденские артикулы, часть II, артикул II
              tier: official
              excerpt: приходские священники предписывали и отправляли (по законному соглашению и путем продажи) мессы, добрые дела и т.п. как для живых, так и для мертвых. Это не только человеческая безделица [человеческая фантазия], не подтверждаемая Словом Божьим
              accessed: "2026-10-01"
        answer:
          points:
            - "Протестанты не едины: реформатское исповедание прямо исключает молитву за умерших, а лютеранская критика направлена на мессы, совершаемые по договору и за плату, но не говорит о молитве Православной Церкви."
            - Православие различает состояние души после смерти и всеобщее воскресение, и молитва об усопших связана именно с этим различением.
            - "Неприятие чистилища не означает отрицания всякой помощи усопшим: православное учение говорит не о выкупе заслуг, а о милости и благости Божией."
            - Катехизис опирается на предание Церкви и ссылается на 2 Мак 12:43 — книгу, которой нет в протестантском каноне; поэтому спор неотделим от вопросов о каноне и Предании.
          proof:
