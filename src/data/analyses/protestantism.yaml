        tradition:
          text: Вероучение ЕХБ учит, что второму пришествию должно предшествовать «невидимое для мира восхищение Церкви и встреча ее со Христом в облаках». Исповедание РЦХВЕ называет среди событий будущего восхищение Церкви, спасение остатка еврейской нации, поражение антихриста и установление тысячелетнего Царствия на земле. Аугсбургское исповедание (ст. XVII) говорит о явлении Христа в день Страшного суда и осуждает учения о земном царстве святых до воскресения мёртвых.
