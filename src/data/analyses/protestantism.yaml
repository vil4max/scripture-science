      - id: afterlife
        title: Загробная жизнь, воскресение и Суд
        topic: afterlife
        church:
          text: Символ веры исповедует воскресение мёртвых («Чаю воскресения мертвых») и жизнь будущего века. Души умерших праведников до всеобщего воскресения пребывают «во свете, покое и предначинании вечного блаженства», но полное воздаяние даётся по воскресении тела и на последнем Суде.
