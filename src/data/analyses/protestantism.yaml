              accessed: "2026-09-25"
        answer:
          points:
            - "Православие признаёт реальность даров Духа, но дар не служит мерой спасения: апостол спрашивает, все ли говорят языками (1 Кор 12:30), и ставит любовь выше языков (1 Кор 13:1)."
            - "Пользование даром подчинено порядку и назиданию Церкви: если нет истолкователя, апостол велит молчать (1 Кор 14:28; Азбука веры: главное назначение любого дара — назидание Церкви)."
            - Определённое переживание или дар не может само по себе служить мерой пребывания человека в Церкви и полноты её веры.
