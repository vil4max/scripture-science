        tradition:
          text: Аугсбургское исповедание (ст. VII–VIII) определяет Церковь как «собрание всех верующих и святых», где неискажённо проповедуется Евангелие и по Евангелию преподаются Таинства; Вестминстерское исповедание различает невидимую Церковь избранных и видимую Церковь. Вероучение ЕХБ называет вселенскую Церковь «невидимой», состоящей из искупленных людей на небесах и на земле, РЦХВЕ — телом Христовым из рождённых свыше, а англиканский приход в Москве видит себя частью единой католической Церкви.
