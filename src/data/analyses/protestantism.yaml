      - id: name-of-god
        title: "Имя Бога: «Господь»"
        topic: name-of-god
        church:
          text: "В православном учении имена Бога не говорят о Нём исчерпывающе: «Господь» — одно из имён Божиих, а Вседержителем Бог называется потому, что содержит всё в Своей силе и воле. Церковь исповедует Бога Духом вечным, всеблагим, всеведущим, всеправедным и всемогущим."
          proof:
            - url: https://azbyka.ru/bozhestvennye-imena
              title: "Азбука веры. Божие имя и божественные имена: понятие об именах, Исх. 3:14"
              tier: reference
              excerpt: имена Бога не говорят о Нем исчерпывающе
              accessed: "2026-09-27"
