      - id: apostolic-succession
        title: Священство и апостольское преемство
        topic: organisation
        church:
          text: Церковь называется Апостольской, потому что непрерывно сохраняет от апостолов и учение, и преемство даров Святого Духа через священное рукоположение. Иерархия — епископ, пресвитер, диакон — ведёт начало от Христа и апостолов, а Таинство Священства совершается через епископское рукоположение. Основные принципы РПЦ (2000) видят в апостольском преемстве иерархии основание общности и единства благодатной жизни.
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: "Свт. Филарет Московский. Пространный катехизис, §272: почему Церковь Апостольская"
              tier: official
              excerpt: Церковь называется Апостольской, потому что она непрерывно и неизменно сохраняет от апостолов и учение, и преемство даров Святого Духа через священное рукоположение
              accessed: "2026-10-01"
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
