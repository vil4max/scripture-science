        tradition:
          text: Аугсбургское исповедание (ст. XV, XXVI) отвергает предписания о постной пище и постных днях, если с их помощью надеются заслужить благодать и искупить грехи, но требует телесных трудов, таких как пост, которые должны совершаться «не по определенным дням, а постоянно». Вестминстерское исповедание допускает прибегать «к постам, соблюдаемым ради духовных целей»; Церковь Англии называет будни Великого поста и пятницы днями дисциплины и самоограничения (days of discipline and self denial); по вероучению ЕХБ, «Молитвы могут сопровождаться постами».
