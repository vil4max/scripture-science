        church:
          text: Важнейший пост — Великий пост, он продолжается сорок дней, как постился Сам Господь; в среду поститься положено в память предания Господа на страдание, а в пятницу — в память Его страданий и смерти. Есть также Рождественский, Успенский и Апостольский посты; вторая заповедь, запрещая чревоугодие, учит воздержанию и посту, а пост в форме воздержания от скоромной пищи традиционно предваряет причащение (Архиерейский Собор РПЦ, 2016).
