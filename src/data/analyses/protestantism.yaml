        answer:
          points:
            - Критика Аугсбургского исповедания направлена на обеты как способ заслужить благодать; Православие понимает монашество как добровольное следование евангельским советам, а не как покупку благодати и не как отрицание брака (Мф 19:21).
            - "Брак в Православии — Таинство, и вступать в него не обязательно всем: «девство лучше супружества для того, кто в силах его сохранить в чистоте» (катехизис, §§358–360)."
            - "Прямое расхождение — Положение 2017 г. говорит: «Монашество есть установление Божие», а Вестминстерское исповедание называет обеты предрассудками; но протестанты не едины: у англикан монашеские общины существуют."
            - Монашество основано, по Положению 2017 г., и на живом опыте Церкви — примерах Божией Матери, святого Иоанна Предтечи и многих подвижников.
