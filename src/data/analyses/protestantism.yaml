              excerpt: Это можно узнать из Священного Писания, из правил святых апостолов, святых Вселенских и Поместных Соборов, святых отцов и их Церковных уставов
              accessed: "2026-10-01"
            - url: https://azbyka.ru/pravo/shestoj-vselenskij-sobor-67/
              title: Правило 67 Трулльского Собора (691) — «Церковное право», «Азбука веры»
