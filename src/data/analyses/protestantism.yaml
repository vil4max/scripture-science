        answer:
          points:
            - "Писание не противопоставляется Преданию: оно вышло из Церкви и читается в ней. Апостол велит: «держите предания» (2 Фес 2:15), а Церковь называет «столпом и утверждением истины» (1 Тим 3:15)."
            - "Православие не делает частное толкование высшим судом над Писанием: Послание восточных патриархов (1723) замечает, что если бы каждый изъяснял Писание по-своему, Церковь разделилась бы на бесчисленные части."
            - "Протестанты в этом вопросе не едины: лютеране и реформаты исключают предание как источник учения, англикане признают его роль в толковании, а Книга Согласия у лютеран, по их собственному свидетельству, стоит «на ином уровне», чем Писание."
            - "Образец церковного решения — апостольский собор: «угодно Святому Духу и нам» (Деян 15:28)."
          proof:
            - url: https://azbyka.ru/biblia/?2Thes.2:15&r
