        church:
          text: Долг повиновения Церкви узнаётся из Священного Писания, правил святых апостолов, Вселенских и Поместных Соборов, святых отцов и церковных уставов. Среди таких правил — 63-е апостольское и 67-е Трулльского Собора, говорящие о воздержании от крови и удавленины.
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
