        answer:
          points:
            - Устройства различны — епископское, синодальное, общинное — и выражают разные представления о церковной власти; единого протестантского решения нет.
            - "Православная Церковь понимает власть соборно: решения принимает собор епископов (Деян 15:28). Англиканский приход в Москве называет свою общность в лучшем проявлении живой моделью того, что в России называется «соборностью», но решения англиканских соборов, по его словам, «имеют вес», хотя каждая провинция может принять или отклонить их."
            - "Отказ от власти папы — точка внешнего совпадения: Православие тоже не признаёт верховной юрисдикции папы, но основывается на соборном порядке престолов (правила 3 II и 28 IV Вселенских Соборов), а протестанты — на одном Писании."
            - Лютеранские Шмалькальденские артикулы замечают, что «церкви Греции и многих других языков» не подчинялись папе; для Православия спор касается не самого епископа Рима, а всемирного властного притязания.
          proof:
