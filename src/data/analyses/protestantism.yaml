# Curated analysis of protestantism (docs/tasks/site-m33-jw-analysis.md); Orthodox sources from Azbyka,
# the tradition's teaching from its own documents. Validated for full evidence coverage.
# Detailed analysis: Orthodoxy and Protestantism (Lutheran, Reformed, Anglican, Baptist, Pentecostal).
# Card order inside a group follows the reading order of the analysis; `topic` links a card from the comparison.
# Source rules: docs/SOURCES.md. Claims are attributed to a named confession; disagreements inside the family are marked in the answer points.
tradition: protestantism
lead: "Все расхождения православного учения и учения протестантских церквей — по тезисам: учение Церкви, учение протестантов (с указанием, какой конфессии принадлежит утверждение), православный ответ."
authorityNote: "Протестантизму как целому не посвящён ни один соборный или синодальный акт Русской Православной Церкви. О инославных общинах и о диалоге с англиканами и лютеранами говорят «Основные принципы отношения Русской Православной Церкви к инославию» (Архиерейский Собор, 2000, §§1.9, 1.13–1.18, 4, 7.1); о войне — «Основы социальной концепции» (2000, VIII.2). Православная позиция здесь изложена по Писанию, Символу веры, Пространному катехизису свт. Филарета, определениям Вселенских Соборов и Посланию восточных патриархов (1723; на «Азбуке веры» оно помещено среди символических книг). Статьи энциклопедии «Азбука веры» и труды отдельных авторов (в том числе прот. Олега Давыденкова) подписаны как их объяснения и мнения. Протестантизм — семья церквей: каждое утверждение приписано своей конфессии (лютеране — Аугсбургское исповедание; реформаты — Вестминстерское исповедание и Гейдельбергский катехизис; англикане — приход св. Андрея в Москве и Церковь Англии; баптисты — вероучение ЕХБ 1985 г.; пятидесятники — исповедание РЦХВЕ), а расхождения между ними отмечены."
