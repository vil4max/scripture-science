        answer:
          points:
            - "Общее: и Православие, и протестантские исповедания видят в посте духовную практику; Аугсбургское исповедание отвергает лишь мысль, что пост заслуживает благодать. Православие называет пост средством подготовки к покаянию (катехизис, §351) и к Причастию (Архиерейский Собор 2016)."
            - "Расхождение — в мере и порядке: Православие хранит единый церковный календарь с Великим постом, средами, пятницами и малыми постами; лютеране говорят о посте «постоянно», англикане — о буднях Великого поста и пятницах, баптисты — о посте при молитве."
            - Единых правил для всех протестантов нет; Аугсбургское исповедание называет бесполезными предписания о пище, только если они мыслятся как заслуга, и не отменяет сам пост.
            - "Применение правил — церковная практика: различаются, например, строгость поста относительно рыбы и морепродуктов."
