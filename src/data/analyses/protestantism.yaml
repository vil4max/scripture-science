        answer:
          points:
            - "Здесь Православие ближе к лютеранам и реформатам, чем к баптистам и пятидесятникам: все они крестят младенцев; Гейдельбергский катехизис (вопр. 74) и катехизис свт. Филарета (§§290–291) приводят один довод — Крещение заменило обрезание (Кол 2:11–12)."
            - "Протестанты не едины: баптисты и пятидесятники отвергают крещение младенцев и крестят по личной вере."
            - "Способ различается: Православная Церковь совершает троекратное погружение, баптисты — единократное, а Вестминстерское исповедание считает, что погружение «не обязательно», и допускает возливание и окропление."
            - "Смысл Крещения в Православии — рождение «от воды и Духа» (Ин 3:5): Аугсбургское исповедание тоже говорит, что через Крещение даруется благодать, тогда как Вестминстерское исповедание не связывает благодать и спасение с самим обрядом (гл. 28, §5); для баптистов это «свидетельство веры и послушания Господу»."
          proof:
