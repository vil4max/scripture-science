        answer:
          points:
            - "Общее: воскресение мёртвых и Суд исповедуют и Православие, и лютеране (ст. XVII), и баптисты; обе стороны различают состояние души после смерти и полноту, которая наступает после воскресения тела."
            - Православие учит о «предначинании» блаженства до Суда и о том, что полное воздаяние — после воскресения (катехизис, §370; Послание 1723); Вестминстерское исповедание описывает состояние душ как немедленное введение праведных в небесные обители в ожидании «полного искупления своих тел».
            - "Вечные муки: Аугсбургское исповедание (ст. XVII) отвергает учение, что осуждённые не будут терпеть вечных мук; Православие тоже учит о вечном огне и мучении для нераскаянных (катехизис, §380; Мф 25:46)."
            - Неприятие чистилища не означает отрицания всякой помощи усопшим — см. следующую карточку.
