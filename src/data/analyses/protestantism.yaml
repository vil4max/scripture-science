            - "Православное число — семь: Крещение, Миропомазание, Причащение, Покаяние, Священство, Брак и Елеосвящение; Церковь исповедует действие благодати в каждом из них, а не добавляет таинства."
            - "Протестанты не едины: лютеране считают два таинства средствами благодати, реформаты — знаками и печатями завета (Вестминстерское исповедание, гл. 27, §1), баптисты и пятидесятники — заповедями и символами; по справке Л. Н. Митрохина (Новая философская энциклопедия), баптизм «отвергает церковные таинства»."
            - "Различие касается и Покаяния: лютеране сохраняют индивидуальное разрешение грехов (Аугсбургское исповедание, ст. XI), а в Православной Церкви покаяние — Таинство, в котором кающийся при видимом получении прощения от священника невидимо освобождается от грехов Самим Христом (катехизис, §348)."
            - При приёме в Православную Церковь из инославия, по Основным принципам РПЦ (2000), используются различные чиноприёмы; Церковь не выносит суда о мере сохранности благодатной жизни в инославии (§§1.15, 1.17).
