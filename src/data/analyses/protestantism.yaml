        tradition:
          text: Лютеране (ЕЛЦ России) верят в воскресение, Страшный суд и жизнь после смерти; баптисты — в воскрешение всех умерших и суд «перед Великим белым престолом». Вестминстерское исповедание (гл. 32) учит, что души праведных после смерти принимаются в высшие небесные обители, души нечестивых ввергаются в ад, а Писание «не признает никаких других мест для души, разделенной с телом, кроме этих двух»; учения о чистилище нет ни в одном из рассмотренных вероучений.
