          points:
            - Православные и лютеране исповедуют подлинное присутствие Христа в Причастии (катехизис, §312; ст. X) — это совпадение следует сохранять.
            - "Способ присутствия объясняют по-разному: Послание 1723 исповедует присутствие Господа «не символически, не образно» и «не чрез проницание хлеба», как, по его словам, объясняют последователи Лютера; реформаты учат о духовном присутствии; баптисты и пятидесятники — о воспоминании."
            - Лютеранское, баптистское и англиканское понимания нельзя объединять как чисто символические обряды.
            - "Основание Церкви — слова Христа и апостола: «приимите, ядите: сие есть Тело Мое» (Мф 26:26); «ядущий Мою Плоть и пиющий Мою Кровь имеет жизнь вечную» (Ин 6:54); хлеб — «приобщение Тела Христова» (1 Кор 10:16)."
