        tradition:
          text: "Аугсбургское исповедание (ст. XV, XXVI) учит сохранять церковные порядки, которые можно соблюсти без греха, но не отягощать совесть утверждением, что они необходимы для спасения; пищевые предписания, служившие «получению благодати», оно отвергает. Вестминстерское исповедание (гл. 20) учит: «Один Бог есть Господин совести» и дал ей свободу от человеческих учений и установлений, которые противоречат Его Слову или дополняют его в вере и богослужении."
          proof:
            - url: https://web.archive.org/web/20260308213117/https://www.elkras.ru/vo_chto_veryat_liuterane/verouchitelnye_knigi/kniga_soglasiya/augsburgskoe_veroispovedanie.jdx
