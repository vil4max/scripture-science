      - id: communion-kinds
        title: 'Причащение мирян: под обоими видами'
        short: "Церковь причащает мирян и хлебом, и вином, как заповедал Христос, а католики Латинской Церкви обычно только хлебом, считая, что Христос присутствует целиком и в каждом виде."
        topic: worship
        church:
          text: 'Исповедание свт. Петра Могилы: причащаться должны и духовные, и мирские люди «под обоими видами хлеба и вина», как заповедал Христос и предали апостолы (Ин 6:53; 1 Кор 11:23–25).'
          proof:
            - url: https://azbyka.ru/otechnik/Petr_Mogila/pravoslavnoe-ispovedanie-kafolicheskoj-i-apostolskoj-tserkvi-vostochnoj/1_10
              title: Петр Могила. Православное исповедание Кафолической и Апостольской Церкви Восточной, ч. 1, вопр. 106 (символическая книга)
              tier: official
              excerpt: Причащаться же сему Таинству как духовные, так и мирские люди должны под обоими видами хлеба и вина
              accessed: '2026-10-01'
        tradition:
          text: 'Кодекс канонического права: святое причастие подаётся «под видом хлеба, или под обоими видами… или даже под видом одного вина» (кан. 925). По Катехизису, причащение только под видом хлеба позволяет «полностью получить плод благодати Евхаристии»; это обычная форма в латинском обряде, а в восточных обрядах — причащение в двух видах. Констанцский собор (1415) объясняет обычай тем, что Христос присутствует целиком под каждым видом.'
          proof:
            - url: https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib4-cann879-958_en.html
              title: Code of Canon Law, can. 925 — vatican.va
              tier: official
              excerpt: Holy communion is to be given under the form of bread alone, or under both species according to the norm of the liturgical laws
              accessed: '2026-10-01'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1390
              tier: official
              excerpt: Причащение только под одним видом — хлеба — позволяет полностью получить плод благодати Евхаристии
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/konfessii/hristianskoe-verouchenie-dogmaticheskie-teksty-uchitelstva-tserkvi-3-20-vv/11_305
              title: «Христианское вероучение. Догматические тексты учительства Церкви III–XX вв.» (рус. пер., «Азбука веры»), Констанцский собор, «Декрет о причащении под видом одного хлеба»
              tier: reference
              excerpt: в Церкви первых веков верные принимали Таинство под двумя видами
              accessed: '2026-10-01'
        answer:
          points:
            - 'Христос сказал: «пейте из неё все» (Мф 26:27); «если не будете есть Плоти Сына Человеческого и пить Крови Его, то не будете иметь в себе жизни» (Ин 6:53). Православная Церковь исходит из этих слов и из апостольской практики (1 Кор 11:28).'
            - Католичество не отрицает, что в первые века Таинство принимали под двумя видами (так говорит и решение Констанцского собора), но считает, что Христос присутствует целиком в каждом виде, поэтому причащение под одним видом даёт полный плод (§1390).
            - 'Сходство: Катехизис признаёт, что причащение в двух видах «наиболее ярко» выражает знамение Трапезы (§1390), а в восточных обрядах оно обычно; Кодекс допускает и причащение под обоими видами (кан. 925). Различие остаётся в общей латинской практике.'
          proof:
            - url: https://azbyka.ru/biblia/?Mt.26:27&r
              title: Мф. 26:27 — Синодальный перевод
              tier: official
              excerpt: 'подал им и сказал: пейте из нее все'
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Jn.6:53&r
              title: Ин. 6:53 — Синодальный перевод
              tier: official
              excerpt: если не будете есть Плоти Сына Человеческого и пить Крови Его
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?1Cor.11:28&r
              title: 1 Кор. 11:28 — Синодальный перевод
              tier: official
