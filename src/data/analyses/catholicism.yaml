      - id: unions
        title: 'Унии: Брестская уния и Восточные католические Церкви'
        short: "Унией называют союз с папой при сохранении восточного обряда; Церковь считает унию важнейшей темой диалога с католиками, а католики видят в Восточных католических Церквах законную часть своей Церкви."
        topic: organisation
        church:
          text: 'Документ Архиерейского Собора 2000 г.: «Важнейшей темой диалога сегодня остаётся тема унии и прозелитизма». Православные авторы описывают унию как способ, при котором православные сохраняли обряд, но вместо православной иерархии поминался папа Римский (по описанию митр. Илариона (Алфеева)). По оценке митр. Илариона, страдания православных на землях, где насаждались католицизм и уния, были следствием взаимного непризнания Церквей.'
          proof:
            - url: https://azbyka.ru/otechnik/dokumenty/osnovnye-printsipy-otnoshenija-russkoj-pravoslavnoj-tserkvi-k-inoslaviyu/
              title: Архиерейский Собор РПЦ, 2000. Основные принципы отношения к инославию, «Отношения с Римско-Католической Церковью»
              tier: official
              excerpt: Важнейшей темой диалога сегодня остается тема унии и прозелитизма
              accessed: '2026-10-01'
            - url: https://azbyka.ru/pravoslavno-katolicheskie-otnosheniya-na-sovremennom-etape
              title: Митр. Иларион (Алфеев). «Православно-католические отношения на современном этапе» (лекция 2010 г.)
              tier: reference
              excerpt: Его суть заключалась в том, чтобы позволить православным сохранить свои обряды, свою православную внешность
              accessed: '2026-10-01'
            - url: https://azbyka.ru/pravoslavno-katolicheskie-otnosheniya-na-sovremennom-etape
              title: Митр. Иларион (Алфеев). «Православно-католические отношения на современном этапе» (лекция 2010 г.)
              tier: reference
              excerpt: Все те страдания, которые пережили православные люди на территориях, где насаждались католицизм и уния
              accessed: '2026-10-01'
        tradition:
          text: Католическая Церковь включает Восточные католические Церкви, сохраняющие восточные обряды в общении с Римским престолом; Катехизис признаёт все законно признанные обряды «равноправными и равночестными». Иоанн Павел II в апостольском послании к 400-летию Брестской унии пишет, что уния была торжественно провозглашена в Бресте-Литовском 16 октября 1596 г.
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1203
              tier: official
              excerpt: почитает все законно признанные обряды равноправными и равночестными
              accessed: '2026-10-01'
            - url: https://www.vatican.va/content/john-paul-ii/en/apost_letters/1995/documents/hf_jp-ii_apl_19951112_iv-cent-union-brest.html
              title: Иоанн Павел II. Апостольское послание к 400-летию Брестской унии (1995), п. 1
              tier: official
              excerpt: was solemnly proclaimed at Brest-Litovsk on the River Bug on 16 October 1596
              accessed: '2026-10-01'
        answer:
          points:
            - 'Восточные католические Церкви существуют и сейчас: по словам митр. Илариона, Греко-Католическая Церковь продолжает существовать и остаётся частью Католической Церкви. Возникновение унии православная и католическая стороны описывают по-разному (см. ниже).'
            - 'В 1993 г. в Баламанде православные и католики совместно заявили: «Мы отрицаем этот метод поиска единства, потому что он противоречит общему преданию наших Церквей» — по словам митр. Илариона, католики признали, что уния была ошибкой прошлого. Баламандский документ вызвал неоднозначную реакцию в обеих Церквах.'
            - Сам Иоанн Павел II пишет, что епископы, принявшие унию, и их паства сохраняли живое сознание своих тесных связей с православными братьями и восточной идентичности (послание 1995 г.) — католическая сторона описывает унию иначе, чем православные авторы.
            - 'Православное отношение к единству определено словами Христа «да будут все едино» (Ин 17:21) и «одна вера, одно крещение» (Еф 4:5): единство в общей вере, а не в подчинении (см. карточку о папском примате).'
          proof:
            - url: https://azbyka.ru/biblia/?Jn.17:21&r
              title: Ин. 17:21 — Синодальный перевод
              tier: official
              excerpt: да будут все едино, как Ты, Отче, во Мне, и Я в Тебе
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Eph.4:5&r
              title: Еф. 4:5 — Синодальный перевод
              tier: official
              excerpt: один Господь, одна вера, одно крещение
              accessed: '2026-10-01'
