  - id: mary-images-days
    title: Богородица, иконы и праздники
    cards:
      - id: icons
        title: Иконы и почитание святых
        short: "И православные, и католики почитают иконы и просят святых ходатайствовать перед Богом, опираясь на VII Вселенский Собор; в этом вопросе согласие."
        topic: images
        church:
          text: Иметь священные изображения вовсе не запрещается; «честь, воздаваемая образу, переходит на Первообраз». Седьмой Вселенский Собор утвердил почитание икон и обращение к святым с просьбой о ходатайстве; поклонение принадлежит одному Богу.
          proof:
            - url: https://azbyka.ru/ikonopochitanie
              title: 'Азбука веры. Иконопочитание: основной тезис'
              tier: reference
              excerpt: Честь, воздаваемая образу, переходит на Первообраз
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: Иметь какие бы то ни было священные изображения вовсе не запрещается
              accessed: '2026-09-25'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: Глядя на иконы, следует умом видеть Бога и святых, на них изображённых
              accessed: '2026-09-25'
            - url: https://azbyka.ru/otechnik/pravila/dejanija-vselenskikh-soborov-tom7/1_12
              title: VII Вселенский Собор, деяние четвёртое — «Деяния Вселенских Соборов», том 7, «Азбука веры»
              tier: official
              excerpt: а равно и просить их ходатайства, так как они могут нас приближать к Богу
              accessed: '2026-10-01'
        tradition:
          text: 'Катехизис Католической Церкви: почитание изображений не противоречит Первой заповеди; «почитание, воздаваемое образу, обращено к прообразу». Почитание икон — «выражение глубокого почтения», а не поклонение. Седьмой Вселенский Собор в Никее (787 г.) осудил иконоборцев и утвердил почитание икон.'
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §2132
              tier: official
              excerpt: Почитание икон — это «выражение глубокого почтения», а не поклонение, которое подобает одному только Богу
              accessed: '2026-09-25'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §2131
              tier: official
              excerpt: Седьмой Вселенский Собор в Никее (в 787 г.) осудил иконоборцев и утвердил почитание икон
              accessed: '2026-10-01'
        answer:
          points:
            - 'По почитанию икон православное и католическое учение совпадают: оба опираются на VII Вселенский Собор и на тезис, что честь образа относится к Первообразу (§2132 Катехизиса).'
            - 'Совпадает и учение о заступничестве святых: католический Катехизис говорит, что святые «непрестанно ходатайствуют о нас перед Отцом» через «единого Посредника» (§956); Православная Церковь исповедует то же, как определил VII Собор.'
            - Запрет идолов (Исх 20:4) не отменяет священных изображений, которые Бог Сам повелел делать (Исх 25:18); с Воплощением Слова образ Христа стал возможен — на этом строится решение VII Собора (§2131).
            - 'Сходство не отменяет различий в других вопросах: в Православной Церкви отвергается, например, догмат 1854 г. о непорочном зачатии (см. следующую карточку).'
          proof:
            - url: https://azbyka.ru/biblia/?Ex.20:4&r
              title: Исх. 20:4 — Синодальный перевод
              tier: official
              excerpt: Не делай себе кумира и никакого изображения
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Ex.25:18&r
              title: Исх. 25:18 — Синодальный перевод
              tier: official
              excerpt: и сделай из золота двух херувимов
              accessed: '2026-10-01'
