      - id: celibacy
        title: Безбрачие духовенства
        short: "В Православии священники и диаконы могут быть женатыми (епископы безбрачны), а в католической Латинской Церкви священники по закону безбрачны; это вопрос порядка, а не догмата."
        topic: organisation
        church:
          text: Православная Церковь придерживается безбрачия для епископов (их обычно поставляют из монахов) и брака для священников и диаконов, вступивших в брак до рукоположения. Трулльский (Пято-Шестой) Собор 691 г. (правило 13), узнав о римском правиле об обязательном воздержании рукополагаемых от жён, не принял его и повелел не лишать клириков супружеского общения; апостольское правило 5 запрещает изгонять жену «под видом благоговения».
          proof:
            - url: https://azbyka.ru/celibat
              title: Целибат — энциклопедия «Азбука веры»
              tier: reference
              excerpt: Православная Церковь придерживается практики безбрачия для епископов
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/pravila/kanony-ili-kniga-pravil/10_13
              title: Правило 13 Трулльского (VI) Собора, «Книга Правил»
              tier: official
              excerpt: Понеже мы уведали, что в Римской Церкви, в виде правила, предано, чтобы те, которые имеют быть удостоены рукоположения во диакона, или пресвитера, обязывались не сообщаться более со своими женами
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/pravila/kanony-ili-kniga-pravil/5_5
              title: Правило 5 святых Апостолов, «Книга Правил»
              tier: official
              excerpt: Епископ, или пресвитер, или диакон, да не изгонит жены своей под видом благоговения
              accessed: '2026-10-01'
        tradition:
          text: 'Катехизис Католической Церкви: священнослужители, рукоположенные в Латинской Церкви (кроме постоянных диаконов), «обыкновенно избираются из верующих мужчин, которые живут в целибате». В Восточных Церквах женатые мужчины могут быть рукоположены во диаконы и во священники; такой порядок, по Катехизису, «с давних времен считается законным». Кодекс: клирики обязаны к «совершенному и вечному воздержанию».'
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1579
              tier: official
              excerpt: Все священнослужители, рукоположенные в Латинской Церкви, за исключением постоянных диаконов, обыкновенно избираются из верующих мужчин, которые живут в целибате
              accessed: '2026-10-01'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1580
              tier: official
              excerpt: женатые мужчины могут быть рукоположены во диаконы и во священники
              accessed: '2026-10-01'
            - url: https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib2-cann208-329_en.html
              title: Code of Canon Law, can. 277 §1 — vatican.va
              tier: official
              excerpt: Clerics are obliged to observe perfect and perpetual continence for the sake of the kingdom of heaven
              accessed: '2026-10-01'
        answer:
          points:
            - 'Здесь различие в дисциплине, и Католическая Церковь прямо признаёт законным восточный порядок (§1580): женатое духовенство — не «нарушение», а норма Восточных Церквей.'
            - 'Православная Церковь опирается на Писание и каноны: епископ должен быть «одной жены муж» (1 Тим 3:2; Тит 1:6), апостол Пётр был женат (Мф 8:14), и апостолы имели жён (1 Кор 9:5); Трулльский Собор не принял обязательного воздержания рукополагаемых от жён.'
            - 'Православная Церковь высоко ценит безбрачие (Мф 19:12: «Кто может вместить, да вместит»): «девство лучше супружества для того, кто в силах его сохранить» (катехизис), епископами становятся безбрачные.'
            - 'Вопрос не догматический, а канонический: в Латинской Церкви обязательный целибат клириков закреплён Кодексом (кан. 277), нормы которого относятся только к Латинской Церкви (кан. 1).'
