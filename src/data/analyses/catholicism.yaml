        tradition:
          text: 'Катехизис Католической Церкви: подлинно толковать Слово Божие, написанное или переданное, «вверено только живому Учительству Церкви» — Папе и епископам в общении с ним. Вместе с тем понимание предания, по Катехизису, «может расти в жизни Церкви» (§94). Русский перевод Катехизиса подготовлен комиссией при участии консультанта от Русской Православной Церкви.'
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §100
              tier: official
              excerpt: Обязанность подлинно толковать Слово Божие вверена одному только Учительству Церкви — Папе и епископам в общении с ним
              accessed: '2026-09-25'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), предисловие к 4-му изданию
              tier: official
              excerpt: Перевод Катехизиса на русский язык осуществлен Комиссией, учрежденной 19 мая 1993 г., при участии консультанта от Русской Православной Церкви
              accessed: '2026-09-25'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §94
              tier: official
              excerpt: понимание как сути, так и слов наследия веры может расти в жизни Церкви
              accessed: '2026-10-01'
        answer:
          points:
            - 'Сходство: обе традиции исповедуют Писание и Предание как путь Откровения; Православие не противопоставляет Писание Церкви, а читает его в Церкви — «столпе и утверждении истины» (1 Тим 3:15).'
            - 'Различие — кто решает: у католиков право подлинного толкования закреплено за Учительством, т.е. за папой и епископами в общении с ним (§100), у православных — за Церковью в целом, выраженной в соборном согласии (Деян 15:28).'
            - 'Тезис о «возрастании понимания» (§94) сам по себе православным богословием не отрицается; спор о том, что называть развитием: по оценке прот. М. Козлова и Д. Огицкого, в Римской Церкви «акцентируется развитие догматического учения» и возможность восполнения его новыми догматами — Православная Церковь так не учит.'
            - 'Участие консультанта РПЦ в русском переводе Катехизиса (предисловие) — свидетельство о переводе, а не о согласии Русской Церкви с его содержанием: оценка учения даётся документами Церкви и подписанными оценками отдельных авторов.'
