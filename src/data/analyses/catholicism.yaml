              tier: official
              excerpt: она является Церковью, в которой сохраняется апостольское преемство рукоположений
              accessed: '2026-10-01'
        tradition:
          text: 'Катехизис Католической Церкви: единственная Церковь Христова «пребывает в» (subsistit in) Католической Церкви; с Православными Церквами общение «так глубоко, что малого недостает, чтобы оно достигло полноты».'
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §816
              tier: official
              excerpt: пребывает в (subsistit in) Католической Церкви, управляемой Преемником Петра и епископами, находящимися в общении с ним
              accessed: '2026-10-01'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §838
              tier: official
              excerpt: малого недостает, чтобы оно достигло полноты, которая позволит совместное совершение Евхаристии Господней
              accessed: '2026-10-01'
        answer:
          points:
            - 'Позиция Церкви выражена в документе 2000 г.: Православная Церковь — «истинная Церковь Христова» (§1.1); в то же время Римско-Католическая Церковь признаётся Церковью с апостольским преемством, а развитие её учения «нередко шло вразрез с Преданием» (раздел «Отношения с Римско-Католической Церковью»).'
            - Приём в Православие идёт разными чинами — через Крещение, Миропомазание или покаяние (§1.17); при этом Церковь «не выносит суда о мере сохранности или поврежденности благодатной жизни в инославии». Общепринятой общеправославной оценки таинств Католической Церкви, по словам митр. Илариона, нет.
            - 'Термины: «Азбука веры» называет католицизм «еретическим направлением» — это оценка энциклопедической статьи; документ 2000 г. по отношению к РКЦ такого определения не употребляет. Критика учений не даёт права оскорблять людей: «недопустимы оскорбления в адрес инославных» (§7.1).'
            - 'Католичество и Православие согласно исповедуют Церковь единой, но по-разному отвечают на вопрос, где она «пребывает»: католический катехизис — в Католической Церкви (§816), Православная Церковь — в себе (§1.1, §1.18).'
          proof:
            - url: https://azbyka.ru/biblia/?Jn.17:21&r
              title: Ин. 17:21 — Синодальный перевод
              tier: official
              excerpt: да будут все едино, как Ты, Отче, во Мне, и Я в Тебе
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Eph.4:5&r
              title: Еф. 4:5 — Синодальный перевод
              tier: official
