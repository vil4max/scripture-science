        answer:
          points:
            - Христос — «глава Церкви» (Еф 1:22); по катехизису Он единственная Глава единственной Церкви. Апостолам заповедано пасти стадо, «не господствуя над наследием Божиим» (1 Пет 5:3), а подавая пример.
            - 'Православная Церковь не отрицает особого места Рима: «Азбука веры» отмечает, что Римская Поместная Церковь исторически обладала «первенством чести», а правила Вселенских Соборов (II, 3; IV, 28) называют Рим первым по чести престолом, при этом уравнивая престолы по преимуществам.'
            - Спор — о «полной, верховной и вселенской власти» одного епископа (§882; Pastor Aeternus, гл. 3; кан. 331). По Исповеданию свт. Петра Могилы, Церковь посредством Вселенских Соборов вправе «судить Патриархов, Пап, Епископов».
            - Поручение Христа Петру «паси овец Моих» (Ин 21:17) Православие не оспаривает; вопрос в том, передаётся ли оно как вселенская юрисдикция одного епископа. По словам митр. Илариона (Алфеева), именно роль римского епископа — «главная тема» современного диалога.
