        short: "Церковь учит, что её единственный Глава — Христос, а Римскому епископу принадлежит лишь первенство чести; католики признают за папой верховную власть над всей Церковью."
        topic: organisation
        church:
          text: Единственная Глава Церкви — Иисус Христос. Церковь едина, но состоит из отдельных самостоятельных Церквей; иерархия трёхстепенна (епископ, пресвитер, диакон). Римской кафедре древний порядок отдавал первенство чести, но не всемирную юрисдикцию одного епископа.
