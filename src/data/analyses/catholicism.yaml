      - id: baptism-confirmation
        title: Крещение и Миропомазание
        short: "Церковь крестит троекратным погружением, а в Латинской Церкви допускается и возлияние воды; на Востоке Миропомазание следует сразу за Крещением, у католиков Латинской Церкви — позже и обычно через епископа."
        topic: worship
        church:
          text: Крещение — это троекратное погружение тела в воду с призыванием Бога Отца, Сына и Святого Духа (§§285, 287 катехизиса); младенцев крестят по вере родителей и восприемников. Миропомазание — отдельное Таинство, в котором подаются дары Святого Духа; апостольское правило 50 требует троекратного погружения при Крещении.
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет. Пространный катехизис, §§289–291: Крещение младенцев'
              tier: official
              excerpt: Младенцев крестят по вере родителей и восприемников
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Свт. Филарет Московский. Пространный катехизис, §285
              tier: official
              excerpt: Крещение есть Таинство, в котором верующий при троекратном погружении тела в воду
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/pravila/kanony-ili-kniga-pravil/5_5
              title: Правило 50 святых Апостолов, «Книга Правил»
              tier: official
              excerpt: Если кто, епископ или пресвитер, совершит не три погружения единого тайнодействия, но одно погружение
