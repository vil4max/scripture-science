      - id: magisterium-tradition
        title: Предание, Писание и право толкования
        short: "Обе традиции опираются на Писание и Предание, но толковать их, по Православию, вправе Церковь в целом через соборное согласие, а по католичеству — папа и епископы в общении с ним."
        topic: authority
        church:
          text: Откровение сохраняется в Церкви Священным Преданием и Священным Писанием; Предание «нужно и в наши дни для руководства к правильному пониманию Священного Писания». Писание следует понимать «согласно толкованию Православной Церкви и святых отцов». Церковь не добавляет к Откровению нового, а хранит то, что передано (2 Фес 2:15).
