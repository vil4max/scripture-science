      - id: immaculate-conception
        title: Непорочное зачатие Девы Марии
        short: "Католики с 1854 г. учат, что Дева Мария с первого мгновения своей жизни была сохранена от первородного греха; Церковь такого догмата не принимает, хотя высоко чтит Богородицу."
        topic: images
        church:
          text: 'Православная Церковь почитает Пресвятую Богородицу Приснодевой, Матерью Бога Слова; по катехизису свт. Филарета, Мария «всегда пребывала и пребывает Девой». Она не учит, что Дева Мария была зачата без первородного греха: по «Азбуке веры», в святоотеческом богословии Её «предочищение» Духом Святым связывают с Благовещением; о времени очищения от первородного повреждения в православной литературе — разные частные мнения.'
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет. Пространный катехизис, §§184–189: Приснодева и Богородица'
              tier: official
              excerpt: Пресвятая Мария действительно всегда пребывала и пребывает Девой
              accessed: '2026-09-27'
            - url: https://azbyka.ru/bogorodica
              title: Богородица — раздел о католическом догмате непорочного зачатия и православных объяснениях очищения
              tier: reference
              excerpt: Согласно одним, предочищение Её Духом Святым
              accessed: '2026-09-27'
            - url: https://azbyka.ru/bogorodica
              title: Богородица — энциклопедия «Азбука веры», «Что такое „непорочное зачатие Богородицы“?»
              tier: reference
              excerpt: Православная Церковь, высоко оценивая достоинства Божьей Матери, тем не менее никогда не учила, что Она была изначально свободна от первородного греха
              accessed: '2026-10-01'
        tradition:
          text: 'Догмат 1854 г. (булла Пия IX «Ineffabilis Deus»): Блаженная Дева Мария «с самого первого момента Своего Зачатия… сохранена не запятнанной никаким пятном первородного греха». Катехизис излагает: Она «предохранена ото всякой скверны первородного греха» ради заслуг Иисуса Христа; это не то же самое, что девственное зачатие Иисуса Христа.'
          proof:
            - url: https://www.vatican.va/content/catechism/en/part_one/section_two/chapter_two/artcile_3/paragraph_2_conceived_by_the_power_of_the_holy_spirit_and_born_of_the_virgin_mary.html
              title: Катехизис Католической Церкви, §491 — непорочное зачатие Девы Марии
              tier: official
              excerpt: preserved immune from all stain of original sin
              accessed: '2026-09-27'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §491
              tier: official
              excerpt: Преблаженная Дева Мария была с первого мгновения Своего зачатия, по исключительной благодати и благоволению Всемогущего Бога, в предвидении заслуг Иисуса Христа
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/konfessii/hristianskoe-verouchenie-dogmaticheskie-teksty-uchitelstva-tserkvi-3-20-vv/8_185
              title: «Христианское вероучение. Догматические тексты учительства Церкви III–XX вв.» (рус. пер., «Азбука веры»), булла «Ineffabilis Deus» (1854)
              tier: reference
              excerpt: была с самого первого момента Своего Зачатия, особой благодатью и расположением Всемогущего Бога, ввиду заслуг Иисуса Христа, Спасителя рода человеческого, сохранена не запятнанной никаким пятном первородного греха
              accessed: '2026-10-01'
        answer:
          points:
            - 'Различие лежит в учении о первородном грехе и о Деве Марии: католический догмат определяет, что Она была предохранена от первородного греха с первого мгновения Своего зачатия; Православная Церковь такого догмата не принимает.'
            - 'Православное исповедание святости Богородицы не умалено: Она — «Благодатная» (Лк 1:28), Приснодева и Матерь Бога. Но Церковь «никогда не учила, что Она была изначально свободна от первородного греха» («Азбука веры»); в Писании о Ней сказано также «возрадовался дух Мой о Боге, Спасителе Моём» (Лк 1:47), а об общем наследии греха — Рим 5:12. Различные объяснения освящения Богородицы у отдельных православных авторов — частные богословские мнения («Азбука веры»).'
            - 'Оценка догмата в православной литературе не единообразна: по статье «Азбуки веры» о католицизме, это учение критиковалось многими православными святыми и богословами, но не получило соборного осуждения; свт. Филарет Московский, по цитате в этой статье, писал, что Церковь вопрос «не решила догматически, а оставила каждому свободно рассуждать о нем». Нужно различать этот спор и общее исповедание святости и Богоматеринства.'
            - 'Не следует смешивать два положения: догмат 1854 г. говорит о зачатии Девы Марии (§491), а о Христе Православная Церковь говорит «бессеменное зачатие от Святого Духа» («Азбука веры»).'
          proof:
            - url: https://azbyka.ru/biblia/?Lk.1:28&r
              title: Лк. 1:28 — Синодальный перевод
              tier: official
              excerpt: радуйся, Благодатная! Господь с Тобою
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Lk.1:47&r
              title: Лк. 1:47 — Синодальный перевод
              tier: official
              excerpt: и возрадовался дух Мой о Боге, Спасителе Моем
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Rom.5:12&r
              title: Рим. 5:12 — Синодальный перевод
              tier: official
              excerpt: и грехом смерть, так и смерть перешла во всех человеков
              accessed: '2026-10-01'
            - url: https://azbyka.ru/katolicizm
              title: 'Католицизм — энциклопедия «Азбука веры»: «Какие учения католицизма являются еретическими?»'
              tier: reference
              excerpt: однако не получило до сих пор соборного осуждения
              accessed: '2026-10-01'
