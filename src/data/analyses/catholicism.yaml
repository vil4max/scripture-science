        tradition:
          text: Папа, Епископ Римский и Преемник Петра, имеет над Церковью «полную, верховную и вселенскую власть». Первый Ватиканский собор учит, что Римская Церковь обладает «первенством обычной власти», а Кодекс канонического права закрепляет за ним «верховную, полную, непосредственную и вселенскую обычную власть». Епископ возглавляет епархию с помощью пресвитеров и диаконов, но в общении со всей Церковью под руководством папы.
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §882
              tier: official
              excerpt: Римский Первосвященник имеет над Церковью, в силу своей должности наместника Христа и пастыря всей Церкви, полную, верховную и вселенскую власть
