      - id: monasticism-eucharistic-fast
        title: Монашество и евхаристический пост
        short: "Монашеские обеты — послушание, нестяжание (бедность) и целомудрие — в обеих традициях по существу те же; различается пост перед Причащением: в Русской Церкви с полуночи, у католиков не менее часа."
