        title: Любовь к ближнему, защита отечества и война
        short: "Обе традиции называют войну злом, но допускают защиту ближних и отечества; существенного расхождения в документах нет, различается лишь подробность условий, при которых война допустима."
        topic: rules
        church:
          text: 'Все люди — наши ближние, потому что все — создания единого Бога; любовь к Отечеству должна простираться до готовности отдать за него жизнь. Основы социальной концепции РПЦ: признавая войну злом, Церковь не воспрещает чадам участвовать в боевых действиях ради защиты ближних и восстановления попранной справедливости.'
