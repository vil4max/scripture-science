        tradition:
          text: По Катехизису Католической Церкви, канон включает 46 книг Ветхого Завета и 27 книг Нового. Тридентский собор (1546) перечислил в числе священных и канонических книги Товита, Иудифи, Премудрости, Сираха, Варуха и две книги Маккавейские.
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §120
              tier: official
              excerpt: В него входят 46 книг Ветхого Завета (45, если считать Иер и Плач одной книгой) и 27 – Нового
              accessed: '2026-09-25'
            - url: https://azbyka.ru/otechnik/konfessii/hristianskoe-verouchenie-dogmaticheskie-teksty-uchitelstva-tserkvi-3-20-vv/3_49
              title: «Христианское вероучение. Догматические тексты учительства Церкви III–XX вв.» (рус. пер., «Азбука веры»), Тридентский собор, 4-я сессия, «Декрет о принятии священных книг и предания»
              tier: reference
              excerpt: Книги Товита, Иудифь, Есфирь, Иова
              accessed: '2026-10-01'
        answer:
          points:
            - 'Новый Завет и основа Ветхого Завета совпадают: расхождение касается около семи книг, которые католики считают каноническими («второканоническими»), а русская православная традиция — неканоническими, хотя они есть в православной Библии.'
            - 'Спор не сводится к числу: свт. Филарет советует принимать эти книги и приводит слова свт. Афанасия Великого о том, что они назначены «для чтения вступающих в Церковь». В 2 Макк 12:45 говорится о молитве за умерших; Православная Церковь молится за усопших, но учения о чистилище из этого не выводит (см. карточку о чистилище).'
            - 'Существенное различие — в том, кто определяет канон: Тридентский собор, не бывший вселенским для Православной Церкви, сделал это определение догматическим для католиков.'
