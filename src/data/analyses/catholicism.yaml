      - id: holy-days
        title: 'Праздники: воскресенье, Пасха, Успение и Взятие в небесную славу'
        short: "Воскресенье и Пасха общие для обеих традиций; Церковь празднует Успение Богородицы, а католики — Взятие Девы Марии в небесную славу, которое с 1950 г. стало у них догматом."
        topic: holy-days
        church:
          text: День воскресный празднуется со времени воскресения Христова; Пасха — «праздник праздников». Важнейшие праздники установлены в память событий воплощения Сына Божия, а затем — в честь Пресвятой Богородицы. Православная Церковь празднует Успение Богородицы; в песнопениях праздника есть мысль, что Богородица «не только душою, но и пречистою Своею плотию была вознесена на небо».
