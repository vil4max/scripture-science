              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §833
              tier: official
              excerpt: диоцезом (или епархией), разумеется община верующих христиан, пребывающая в общении веры и таинств со своим епископом
              accessed: '2026-09-26'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §886
              tier: official
