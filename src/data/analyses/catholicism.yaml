        tradition:
          text: 'Катехизис Католической Церкви: «Церковь называет чистилищем конечное очищение избранных, совершенно иное, нежели наказание проклятых»; учение сформулировано на Флорентийском и Тридентском соборах и опирается на молитву об усопших, засвидетельствованную в Писании (2 Макк 12:45). Тридентский собор предписывает епископам заботиться о правильном учении о чистилище.'
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1031
              tier: official
              excerpt: Церковь называет чистилищем это конечное очищение избранных, совершенно иное, нежели наказание проклятых
              accessed: '2026-09-25'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1032
              tier: official
              excerpt: Это учение опирается также и на обычай молитвы об усопших
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/konfessii/hristianskoe-verouchenie-dogmaticheskie-teksty-uchitelstva-tserkvi-3-20-vv/12_400
              title: «Христианское вероучение. Догматические тексты учительства Церкви III–XX вв.» (рус. пер., «Азбука веры»), Тридентский собор, 25-я сессия, «Декрет о чистилище»
              tier: reference
              excerpt: что существует чистилище и что души, которые пребывают там, получают помощь через ходатайство верных
              accessed: '2026-10-01'
        answer:
          points:
            - 'Общее: обе традиции молятся об усопших и верят в воскресение мёртвых (Символ веры, член 11); в Писании есть и свидетельство о молитве за умерших (2 Макк 12:45), которое католический Катехизис (§1032) приводит как основание. Православная молитва об усопших сама по себе не означает принятия учения о чистилище.'
            - 'Различие — в учении о «конечном очищении» (§1031): по Исповеданию свт. Петра Могилы, о таком временном очищающем наказании «нигде в Писании не упоминается», а за умерших Церковь приносит Бескровную Жертву, «сами же они не терпят никакого наказания, посредством которого бы очищались».'
            - Исповедание свт. Петра Могилы (вопр. 66) не находит в Писании учения о чистилище, хотя Катехизис ссылается на Мф 12:31–32 и 1 Кор 3:15; состояние душ до воскресения катехизис свт. Филарета описывает как свет, покой и начаток блаженства.
            - 'Православное учение не даёт подробной схемы загробного мира: совершенное блаженство и совершенное мучение каждый получит по общем воскресении (Послание патриархов 1723 г.); поэтому спор о чистилище — об учении о «временном очищении», а не о молитве за умерших.'
