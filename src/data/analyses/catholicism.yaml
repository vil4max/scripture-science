        answer:
          points:
            - 'Общее: Крещение во имя Троицы (Мф 28:19) — «одно крещение» (Еф 4:5); Катехизис признаёт тройное погружение «наиболее выразительным» знаком (§1239) и описывает восточный порядок как более ясно подчёркивающий единство христианского посвящения (§1292).'
            - 'Православная Церковь придерживается полного погружения (Рим 6:4: «погреблись с Ним крещением») — апостольское правило 50 прямо говорит о трёх погружениях; в Латинской Церкви допускается и возлияние (кан. 854).'
            - 'Миропомазание: на Востоке оно совершается сразу после Крещения, за ним следует участие в Евхаристии (§1318); в Латинской Церкви Конфирмация отделена по времени и обычно совершается епископом (§§1290, 1318).'
            - 'Принятие католиков в Православие: по свидетельству митр. Илариона (Алфеева), на практике католика, крещёного в Католической Церкви, заново не крестят и не миропомазывают; документ 2000 г. подтверждает, что Православная Церковь принимает приходящих из инославия разными чинами, не вынося суда о мере благодати (§§1.15, 1.17).'
