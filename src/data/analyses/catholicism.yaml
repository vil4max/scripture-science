  - id: worship-sacraments
    title: Таинства и богослужение
    cards:
      - id: sacraments
        title: Семь таинств и реальное присутствие Христа в Евхаристии
        short: "Православные и католики считают Таинств семь и верят, что в Причащении хлеб и вино становятся подлинным Телом и Кровью Христа; расхождений в этом нет, различия лежат в обряде и порядке."
        topic: worship
        church:
          text: 'Православная Церковь исповедует семь Таинств: Крещение, Миропомазание, Евхаристию, Покаяние, Священство, Брак, Елеосвящение. В Причащении верующий под видом хлеба и вина вкушает подлинные Тело и Кровь Христовы; хлеб и вино «прелагаются или пресуществляются», а образ этого непостижим.'
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет. Пространный катехизис, §312: Таинство Причащения'
              tier: official
              excerpt: под видом хлеба и вина вкушает подлинные Тело и Кровь Иисуса Христа для вечной жизни.
              accessed: '2026-09-27'
            - url: https://azbyka.ru/prichastie
              title: 'Азбука веры. Причастие: Таинство Евхаристии и преложение Даров'
              tier: reference
              excerpt: они становятся Телом и Кровью Христовыми
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/
