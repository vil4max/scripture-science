      - id: eucharist-bread
        title: 'Хлеб Евхаристии: квасной или пресный'
        short: "Православные совершают Причащение на квасном хлебе (с закваской), католики Латинской Церкви — на пресном (без закваски); православные авторы считают это различием обряда, а не веры."
        topic: worship
        church:
          text: Для Таинства Причащения, по катехизису свт. Филарета, используется «хлеб квасной, чистый, пшеничный» — в соответствии с понятием хлеба, примером Господа и апостолов; один хлеб означает единство причащающихся (1 Кор 10:17).
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Свт. Филарет Московский. Пространный катехизис, §§325–326
              tier: official
              excerpt: хлеб квасной, чистый, пшеничный
              accessed: '2026-10-01'
        tradition:
          text: По Кодексу канонического права, «согласно древней традиции Латинской Церкви», священник при Евхаристии использует пресный хлеб; Катехизис называет основными знаками «пшеничный хлеб и виноградное вино».
          proof:
            - url: https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib4-cann879-958_en.html
              title: Code of Canon Law, can. 926 — vatican.va
              tier: official
              excerpt: the priest is to use unleavened bread in the eucharistic celebration whenever he offers it
              accessed: '2026-10-01'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1412
              tier: official
              excerpt: Основными знаками евхаристического Таинства являются пшеничный хлеб и виноградное вино
              accessed: '2026-10-01'
        answer:
          points:
            - 'Католический канон 926 сам называет пресный хлеб «древней традицией Латинской Церкви»: речь идёт об обряде одной части Католической Церкви, а не о единой для всех норме (кан. 1 Кодекса: его нормы относятся только к Латинской Церкви).'
            - Православная практика — квасной хлеб (§325 катехизиса). По описанию прот. М. Козлова и Д. Огицкого, уже патриарх Пётр Антиохийский (XI в.) «не считал совершение литургии на опресноках… чем-то имеющим существенное значение», хотя отдавал предпочтение обычному хлебу.
            - Таким образом, по оценке самих православных авторов, это различие обряда, а не догмата.
          proof:
            - url: https://azbyka.ru/biblia/?1Cor.10:17&r
              title: 1 Кор. 10:17 — Синодальный перевод
              tier: official
              excerpt: Один хлеб, и мы многие одно тело; ибо все причащаемся от одного хлеба
              accessed: '2026-10-01'
            - url: https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib1-cann1-6_en.html
              title: Code of Canon Law, can. 1 — vatican.va
              tier: official
              excerpt: The canons of this Code regard only the Latin Church
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/bogoslovie/zapadnoe-hristianstvo-vzgljad-s-vostoka/2
              title: 'Прот. Максим Козлов, Д. П. Огицкий. «Западное христианство: взгляд с Востока», гл. II «Римский католицизм»'
              tier: reference
              excerpt: не считал совершение литургии на опресноках и другие обрядовые разности чем-то имеющим существенное значение
              accessed: '2026-10-01'
        more:
          - title: 'Западное христианство: взгляд с Востока, гл. II «Римский католицизм»'
            url: https://azbyka.ru/otechnik/bogoslovie/zapadnoe-hristianstvo-vzgljad-s-vostoka/2
            kind: author
            author: Прот. Максим Козлов, Д. П. Огицкий
        legacy: []
