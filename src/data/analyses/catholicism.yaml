        tradition:
          text: 'Кодекс канонического права (1983 г.) — свод, нормы которого относятся только к Латинской Церкви (кан. 1); в разделе о покаянных днях (кан. 1249–1253) норм о запрете крови нет: Кодекс говорит о воздержании от мяса «или иной пищи» по определению епископской конференции. Римский Понтифик обладает «верховной, полной, непосредственной и вселенской обычной властью» (кан. 331).'
          proof:
            - url: https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib1-cann1-6_en.html
              title: Code of Canon Law, can. 1 — vatican.va
              tier: official
              excerpt: The canons of this Code regard only the Latin Church
              accessed: '2026-10-01'
            - url: https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib4-cann1244-1253_en.html
              title: Code of Canon Law, can. 1249 — vatican.va
              tier: official
              excerpt: The divine law binds all the Christian faithful to do penance each in his or her own way
              accessed: '2026-10-01'
            - url: https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib2-cann330-367_en.html
              title: Code of Canon Law, can. 331 — vatican.va
              tier: official
              excerpt: possesses supreme, full, immediate, and universal ordinary power in the Church
              accessed: '2026-10-01'
        answer:
          points:
            - 'Основа различия — понимание, кто принимает церковные законы: в Православной Церкви — соборное правотворчество на основе канонов; в Латинской — Кодекс, а высшая власть в Церкви, по кан. 331, принадлежит Римскому Понтифику.'
            - Поэтому древние каноны (включая правила о воздержании от крови, ап. 63; Трулл. 67), которые действуют в Православной Церкви как часть канонического корпуса, в католическом Кодексе 1983 г. не воспроизведены (в изученных канонах о покаянных днях такого запрета нет); это различие в сфере права, а не веры.
            - 'Не следует переносить это различие на нравственное учение в целом: по большинству нравственных вопросов ответ даётся в других документах (см. карточки о браке и войне).'
