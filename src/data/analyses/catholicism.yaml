  - id: grace-salvation
    title: Благодать и спасение
    cards:
      - id: justification
        title: Оправдание, спасение и участие человека
        short: "Православные и католики одинаково учат, что спасение — дар Божий и что человек сотрудничает с благодатью; различие скорее в понятиях и языке, чем в споре о делах и благодати."
        topic: salvation
        church:
          text: Спасение даровано Иисусом Христом; человек отвечает на благодать верой, покаянием и жизнью в Таинствах. Православное учение называет это синергией — соработничеством Бога и человека, — а цель спасения — обожение, уподобление Богу и единение с Ним. По Посланию Восточных патриархов 1723 г., человек оправдывается «верою, споспешествуемой любовью».
          proof:
            - url: https://azbyka.ru/spasenie
              title: 'Азбука веры. Спасение: определение и условия спасения'
              tier: reference
              excerpt: уподобление Богу и духовное единение с Ним
              accessed: '2026-09-27'
            - url: https://azbyka.ru/sinergiya
              title: Азбука веры. Синергия
              tier: reference
              excerpt: соработничество Бога и человека в деле достижения спасения
              accessed: '2026-09-27'
            - url: https://azbyka.ru/obozhenie
              title: Азбука веры. Обожение
              tier: reference
              excerpt: процесс уподобления верующего Богу и единения с Богом.
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: Для спасения нужно не только веровать, но и исповедовать православную веру
              accessed: '2026-09-25'
            - url: https://azbyka.ru/otechnik/bogoslovie/poslanie-patriarhov-vostochno-kafolicheskoj-tserkvi-o-pravoslavnoj-vere-1723-g/
              title: Послание Патриархов Восточно-Кафолической Церкви о православной вере (1723), член 13
              tier: official
              excerpt: Веруем, что человек оправдывается не просто одною верою, но верою, споспешествуемой любовью, т.е. чрез веру и дела.
              accessed: '2026-10-01'
        tradition:
          text: 'Катехизис Католической Церкви: вера в Иисуса Христа необходима для спасения; оправдание — «самое совершенное деяние любви Божией», заслужено Страстями Христа, даруется Крещением и «устанавливает сотрудничество между Божией благодатью и свободой человека»; подготовка к благодати «уже есть действие благодати».'
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §161
              tier: official
              excerpt: Веровать в Иисуса Христа и в Пославшего Его ради нашего спасения необходимо, чтобы спастись
              accessed: '2026-09-25'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1994
              tier: official
              excerpt: Оправдание — самое совершенное деяние любви Божией, явленной в Иисусе Христе и дарованной Святым Духом
              accessed: '2026-09-25'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1993
              tier: official
              excerpt: Оправдание устанавливает сотрудничество между Божией благодатью и свободой человека
              accessed: '2026-10-01'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §2001
              tier: official
              excerpt: Подготовка человека к принятию благодати уже есть действие благодати
              accessed: '2026-10-01'
        answer:
          points:
            - 'Противопоставление «у католиков дела, у православных благодать» неверно: католический катехизис отвергает заслуживание первоначального оправдания (§§1992, 2001) и говорит о «сотрудничестве» благодати и свободы (§1993) — то есть близко к православной синергии.'
            - 'Православное исповедание то же: «благодатью вы спасены через веру, и сие не от вас, Божий дар» (Еф 2:8), и в то же время «вера, действующая любовью» (Гал 5:6). Послание патриархов 1723 г. называет Бога «единственным виновником нашего спасения» и в то же время учит об оправдании «верою, споспешествуемой любовью».'
            - 'Различие, по оценке прот. М. Козлова и Д. Огицкого (мнение авторов), — в языке и устроении понятия: в католической традиции спасение мыслится как «удовлетворение» (satisfactio) за грех, в православной — «прежде всего как избавление от самого греха» (Мф 1:21), исцеление и обожение. Катехизис 1992 г., по их же замечанию, употребляет и близкие православным понятия.'
            - 'Вопрос о спасении вне Церкви: Катехизис учит, что Церковь необходима для спасения, но это не относится к тем, кто не по своей вине не знает Христа и Церкви (§§846–847); документ РПЦ 2000 г. говорит, что «спасение может быть обретено лишь в Церкви Христовой», не судя о мере благодати вне её (§1.15).'
          proof:
            - url: https://azbyka.ru/biblia/?Eph.2:8&r
              title: Еф. 2:8 — Синодальный перевод
              tier: official
              excerpt: Ибо благодатью вы спасены через веру, и сие не от вас, Божий дар
              accessed: '2026-10-01'
