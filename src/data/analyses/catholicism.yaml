      - id: indulgences
        title: Индульгенции и «сокровищница заслуг»
        short: "Католики учат, что Церковь отпускает временную кару за уже прощённые грехи (индульгенция) из сокровищницы заслуг Христа и святых; Православие расходится в самой этой идее: Искупитель один — Христос."
        topic: salvation
        church:
          text: В православном понимании спасение — избавление от самого греха; Искупитель один — Христос, и «Кровь Иисуса Христа, Сына Его, очищает нас от всякого греха» (1 Ин 1:7). Церковь молится и приносит Бескровную Жертву за умерших (Исповедание свт. Петра Могилы). Богословские оценки индульгенций — мнения отдельных авторов, подписанные именами.
          proof:
            - url: https://azbyka.ru/otechnik/Petr_Mogila/pravoslavnoe-ispovedanie-kafolicheskoj-i-apostolskoj-tserkvi-vostochnoj/1_10
              title: Петр Могила. Православное исповедание Кафолической и Апостольской Церкви Восточной, ч. 1, вопр. 66 (символическая книга)
              tier: official
              excerpt: Церковь правильно поступает, что приносит за умерших Безкровную Жертву, и воссылает к Богу молитвы об отпущении грехов их
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/bogoslovie/zapadnoe-hristianstvo-vzgljad-s-vostoka/2
              title: 'Прот. Максим Козлов, Д. П. Огицкий. «Западное христианство: взгляд с Востока», гл. II «Римский католицизм»'
              tier: reference
              excerpt: образует так называемую сокровищницу заслуг или сокровищницу добрых дел
              accessed: '2026-10-01'
        tradition:
          text: 'Катехизис Католической Церкви: индульгенция — «отпущение перед Богом временной кары за грехи, вина за которые уже изглажена»; Церковь раздаёт «удовлетворения из сокровищницы заслуг Христа и святых». Тридентский собор постановил сохранить использование индульгенций, но преподавать их «осмотрительно».'
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1471
              tier: official
              excerpt: Индульгенция — это отпущение перед Богом временной кары за грехи, вина за которые уже изглажена
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/konfessii/hristianskoe-verouchenie-dogmaticheskie-teksty-uchitelstva-tserkvi-3-20-vv/11_340
              title: «Христианское вероучение. Догматические тексты учительства Церкви III–XX вв.» (рус. пер., «Азбука веры»), Тридентский собор, 25-я сессия, «Декрет об индульгенциях»
              tier: reference
              excerpt: Власть преподавать индульгенции была дарована Церкви Христом
              accessed: '2026-10-01'
            - url: https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib4-cann959-997_en.html
              title: Code of Canon Law, can. 992 — vatican.va
              tier: official
              excerpt: An indulgence is the remission before God of temporal punishment for sins whose guilt is already forgiven
              accessed: '2026-10-01'
        answer:
          points:
            - 'Сходство: католический катехизис не учит, что индульгенция — «покупка» прощения: она касается «временной кары» за уже прощённые грехи (§1471; can. 992), а кара, по §1472, вытекает из природы греха, а не есть «месть Бога».'
            - Расхождение — в самой идее «сокровищницы заслуг». По оценке прот. М. Козлова и Д. Огицкого, она основана на понятии «сверхдолжных заслуг» святых; в православном понимании спасение — это прежде всего избавление от самого греха («Он спасёт людей Своих от грехов их», Мф 1:21), а не удовлетворение за наказание.
            - Православная Церковь молится и приносит Бескровную Жертву за умерших; по Исповеданию свт. Петра Могилы, души умерших «не терпят никакого наказания, посредством которого бы очищались». Христос — единственный Искупитель (1 Ин 1:7).
            - Статья «Азбуки веры» о католицизме оценивает учение об индульгенциях как не имеющее основания в Писании и Предании — это оценка энциклопедической статьи, а не определение Собора.
          proof:
            - url: https://azbyka.ru/biblia/?1Jn.1:7&r
              title: 1 Ин. 1:7 — Синодальный перевод
              tier: official
              excerpt: и Кровь Иисуса Христа, Сына Его, очищает нас от всякого греха
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Mt.1:21&r
              title: Мф. 1:21 — Синодальный перевод
              tier: official
              excerpt: Он спасет людей Своих от грехов их
              accessed: '2026-10-01'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1472
              tier: official
              excerpt: Обе эти кары не должны пониматься как месть Бога, поражающая извне
              accessed: '2026-10-01'
            - url: https://azbyka.ru/katolicizm
              title: 'Католицизм — энциклопедия «Азбука веры»: «Индульгенции и чистилище»'
              tier: reference
              excerpt: Учение об индульгенциях не имеет оснований ни в Священном Писании, ни в Священном Предании
              accessed: '2026-10-01'
