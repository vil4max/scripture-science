      - id: consecration
        title: Слова установления и эпиклеза
        short: "Обе традиции верят, что хлеб и вино становятся Телом и Кровью Христа по слову Христа и действием Святого Духа; различие, если оно есть, лишь в акцентах и порядке молитв."
        topic: worship
        church:
          text: 'Важнейшее действие Литургии верных — произнесение слов Господа при установлении Таинства («Приимите, ядите…») и затем — призывание Святого Духа и благословение Даров: хлеб и вино прелагаются. По слову св. Иоанна Дамаскина, преложение совершается «схождением Святого Духа».'
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Свт. Филарет Московский. Пространный катехизис, §335
              tier: official
              excerpt: и затем – призывание Святого Духа и благословение Даров, т. е. принесённого хлеба и вина
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Свт. Филарет Московский. Пространный катехизис, §337 (цитата св. Иоанна Дамаскина)
              tier: official
              excerpt: хлеб и вино претворяются в Тело и Кровь Божию. Если хочешь понять, как это происходит, то достаточно знать, что схождением Святого Духа
              accessed: '2026-10-01'
        tradition:
          text: Катехизис Католической Церкви определяет эпиклесис как прошение, чтобы Отец ниспослал Освящающего Духа, дабы приношение стало Телом и Кровью Христа (§1105), и цитирует Иоанна Дамаскина (§1106). В то же время Тридентский собор связывает изменение хлеба и вина с «освящением» (§1376).
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1105
              tier: official
              excerpt: Эпиклесис [Ἐπίκλησις] («призывание на») есть прошение, в котором священник молит Отца ниспослать Освящающего Духа
              accessed: '2026-10-01'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1353
              tier: official
              excerpt: В эпиклесисе она молит Отца ниспослать Духа Святого
              accessed: '2026-10-01'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1376
              tier: official
              excerpt: освящением хлеба и вина совершается изменение всего существа хлеба в существо Тела Христа
              accessed: '2026-10-01'
        answer:
          points:
            - 'Честное сходство: Катехизис Католической Церкви сам говорит об эпиклесисе, цитирует Иоанна Дамаскина (§1106) и учит, что в Евхаристии «сила слов и действия Христа и сила Духа Святого» делают присутствующими Тело и Кровь (§1353). Таким образом, католичество не отрицает действия Святого Духа в Евхаристии.'
            - 'Различие, если оно есть, — в акценте и порядке: в латинской традиции в центре стоят слова установления и «освящение» (Тридентский собор, §1376), в византийской, по катехизису свт. Филарета, — слова Господа и затем призывание Духа; указание в §1353 («в некоторых литургических традициях эпиклесис следует за анамнесисом») показывает, что в самой католической Церкви порядок различен.'
            - 'Документально определённого догмата Православной Церкви о «моменте» преложения в изученных источниках нет: катехизис свт. Филарета говорит о всём действии — словах Господа, призывании Духа и благословении Даров. Нельзя поэтому описывать спор как «Христос или Дух»: обе традиции исповедуют действие обоих.'
            - 'Основа православного исповедания — слова Христа при Тайной Вечери (Мф 26:26) и действие Святого Духа: св. Иоанн Дамаскин сравнивает преложение даров с зачатием плоти Господа в Деве Марии «Святым Духом».'
          proof:
            - url: https://azbyka.ru/biblia/?Mt.26:26&r
              title: Мф. 26:26 — Синодальный перевод
              tier: official
              excerpt: 'приимите, ядите: сие есть Тело Мое'
              accessed: '2026-10-01'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1106
              tier: official
              excerpt: Святой Дух врывается и свершает то, что превосходит любое слово и любую мысль
              accessed: '2026-10-01'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1375
              tier: official
              excerpt: Отцы Церкви непоколебимо подтвердили веру Церкви в действенность слова Христова и действия Духа Святого
              accessed: '2026-10-01'
