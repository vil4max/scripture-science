      - id: grace
        title: 'Благодать: Божественная энергия или дар душе'
        short: "Православие учит, что благодать — несотворённая Божественная энергия, участие в жизни Самого Бога; католики говорят об участии в жизни Бога, но видят в благодати и постоянный дар, совершенствующий душу."
        topic: salvation
        church:
          text: 'Православное учение о благодати: дар обожения — это дар нетварной Божественной благодати, участие в жизни Самого Бога. «Причастниками Божеского естества» (2 Пет 1:4) верные становятся через благодать Святого Духа.'
          proof:
            - url: https://azbyka.ru/obozhenie
              title: Азбука веры. Обожение
              tier: reference
              excerpt: Дар обожения – дар нетварной божественной благодати
              accessed: '2026-10-01'
            - url: https://azbyka.ru/obozhenie
              title: Азбука веры. Обожение (цитата свт. Марка Эфесского)
              tier: reference
              excerpt: Не может быть тварным этот дар
              accessed: '2026-10-01'
        tradition:
          text: Катехизис Католической Церкви называет благодать участием в жизни Бога, делающим верных «причастниками Божественного естества», и различает освящающую, или обожествляющую, благодать — «постоянный (габитуальный) дар, устойчивое и сверхъестественное расположение, совершенствующее саму душу» — и благодать воздействующую (актуальную).
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1997
              tier: official
              excerpt: Благодать есть участие в жизни Бога, она вводит нас внутрь троической жизни
              accessed: '2026-10-01'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1999
              tier: official
              excerpt: это освящающая, или обожествляющая, благодать, получаемая при Крещении
              accessed: '2026-10-01'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §2000
              tier: official
              excerpt: Освящающая благодать — это постоянный (габитуальный) дар, устойчивое и сверхъестественное расположение, совершенствующее саму душу
              accessed: '2026-10-01'
        answer:
          points:
            - 'Сходство: Катехизис (§§1996–1999) говорит о благодати как участии в жизни Бога, об «обожествляющей» благодати и о причастии «Божественному естеству» (ср. 2 Пет 1:4). Самого выражения «тварная благодать» в тексте Катехизиса нет.'
            - Различие — в том, как понимается этот дар. По статье «Азбуки веры», католическое учение (на основании схоластики, св. Фомы Аквинского) видит в благодати «сверхъестественный» дар, существующий отдельно от Бога, а Православие учит о нетварных Божественных энергиях (свт. Григорий Палама). Это православная характеристика западного учения, а не формулировка католических документов.
            - 'Поэтому «тварная благодать» — оценка православных авторов, а не термин Катехизиса: учение о «габитуальной благодати» (§2000) следует сопоставлять с православным учением об обожении по первоисточникам обеих сторон.'
            - 'Основа православного учения — Писание и святоотеческое предание: Бог «желает спасения и алчет обожения людей» (св. Максим Исповедник; цитата в «Азбуке веры»), а дар обожения — дар нетварной благодати (свт. Марк Эфесский).'
          proof:
            - url: https://azbyka.ru/biblia/?2Pet.1:4&r
              title: 2 Пет. 1:4 — Синодальный перевод
              tier: official
              excerpt: соделались причастниками Божеского естества
              accessed: '2026-10-01'
