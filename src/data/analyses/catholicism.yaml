      - id: councils
        title: Вселенские Соборы и высший орган церковной власти
        short: "Церковь признаёт семь Вселенских Соборов (325–787 гг.), а католики считают вселенскими и более поздние соборы, решений которых Православие не принимает."
        topic: organisation
        church:
          text: Священноначалием, которое может действовать от имени всей Кафолической Церкви, является Вселенский Собор. По катехизису свт. Филарета, Вселенских Соборов было семь (325–787 гг.). Справочная статья «Азбуки веры» отмечает, что в византийской традиции встречается и счёт восьми соборов, считая собор 879 г.
