        church:
          text: Церковь настаивает на пожизненной верности супругов и нерасторжимости православного брака (Мф 19:6, 9); развод осуждается как грех, единственным допустимым основанием Господь назвал прелюбодеяние. Основы социальной концепции РПЦ (2000) допускают церковный развод по перечню оснований (в том числе определённых Поместным Собором 1918 г.); после покаяния такие люди могут быть вновь допущены к Таинствам.
