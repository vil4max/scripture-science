      - id: fasting
        title: Посты и покаянная дисциплина
        short: "Обе традиции видят в посте дело покаяния; у православных четыре многодневных поста и посты по средам и пятницам, а у католиков главное — Великий пост и пятницы, детали задают конференции епископов."
        topic: fasting
        church:
          text: Пост — время покаяния и борьбы со страстями. Важнейший пост — Великий пост (Четыредесятница, сорок дней, исключая Страстную седмицу); постятся в среду и пятницу; учреждены также Рождественский и Успенский посты и пост в память апостолов. Скоромной пищей считаются мясо и продукты теплокровных животных (молоко, яйца); рыба занимает срединное место.
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6
