              excerpt: Важнейшим постом является Великий пост, или святая Четыредесятница
              accessed: '2026-09-26'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6
