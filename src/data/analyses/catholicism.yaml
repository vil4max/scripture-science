      - id: church-status
        title: Как Православие оценивает Католическую Церковь
        short: "Церковь считает себя истинной Церковью Христовой, хотя признаёт у католиков преемство священства от апостолов; католики же учат, что Церковь Христова пребывает в Католической Церкви."
        topic: organisation
        church:
          text: Православная Церковь исповедует себя единой, святой, соборной и апостольской Церковью Христовой. По документу Архиерейского Собора 2000 г., общины, отпавшие от единства с Православием, «никогда не рассматривались как полностью лишённые благодати Божией», а церковное положение отделившихся «не поддаётся однозначному определению»; Римско-Католическая Церковь названа Церковью, «в которой сохраняется апостольское преемство рукоположений».
          proof:
            - url: https://azbyka.ru/otechnik/dokumenty/osnovnye-printsipy-otnoshenija-russkoj-pravoslavnoj-tserkvi-k-inoslaviyu/
              title: Архиерейский Собор РПЦ, 2000. Основные принципы отношения к инославию, §§1.1–1.3, 7.1
              tier: official
              excerpt: Православная Церковь есть истинная Церковь Христова
              accessed: '2026-09-27'
            - url: https://azbyka.ru/simvol_very
              title: Никео-Цареградский Символ веры, члены 1–12
              tier: official
              excerpt: Во Единую Святую, Соборную
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/dokumenty/osnovnye-printsipy-otnoshenija-russkoj-pravoslavnoj-tserkvi-k-inoslaviyu/
              title: Архиерейский Собор РПЦ, 2000. Основные принципы отношения к инославию, §1.15
              tier: official
              excerpt: общины, отпавшие от единства с Православием, никогда не рассматривались как полностью лишенные благодати Божией
