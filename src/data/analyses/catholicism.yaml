        tradition:
          text: 'Катехизис Католической Церкви: воскресенье «находится в самом сердце церковной жизни»; Пасха — «Праздник праздников»; обязательно празднуются также Рождество, Богоявление, Вознесение, Пресвятого Тела и Крови Христа, день Пресвятой Богородицы Марии, Непорочного Зачатия, Взятия в небесную славу, свв. Иосифа, Петра и Павла и Всех Святых. Догмат о Взятии в небесную славу провозглашён в 1950 г.'
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §2177
              tier: official
              excerpt: Воскресное празднование Дня Господня и Евхаристии Господа находится в самом сердце церковной жизни
              accessed: '2026-09-25'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1169
              tier: official
              excerpt: 'Поэтому Пасха не просто один из праздников: она «Праздник праздников», «Торжество торжеств»'
              accessed: '2026-09-26'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §2177
              tier: official
              excerpt: Таким же образом должны праздноваться дни Рождества Иисуса Христа, Богоявления, Вознесения, Пресвятого Тела и Крови Христа; день Пресвятой Богородицы Марии
              accessed: '2026-09-26'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §2177
              tier: official
              excerpt: Ее Непорочного Зачатия, Ее Взятия в небесную славу [Успения]; дни св. Иосифа, свв. апостолов Петра и Павла, Всех Святых
              accessed: '2026-09-26'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §966
              tier: official
              excerpt: была взята телом и душой в небесную славу
              accessed: '2026-10-01'
        answer:
          points:
            - 'Воскресенье и Пасха общи: обе традиции видят в них центр церковного года и исповедуют воскресение Христа; разница дат Пасхи и календарей — вопрос церковного расчёта и обычая, а не вероучения.'
            - 'Состав праздничного круга различается: в католическом перечне обязательных торжеств — Рождество, Богоявление, Вознесение, Пресвятое Тело и Кровь Христа, Непорочное Зачатие и Взятие Богородицы в небесную славу (§2177); Православная Церковь празднует Успение Богородицы.'
            - 'Узкий вопрос — не вера в прославление Богородицы, а догматизация: по оценке прот. М. Козлова и Д. Огицкого, песнопения Успения выражают ту же мысль, но догмат принят «без какого-либо Собора» (1950 г.) папой Пием XII и на основе иных посылок.'
            - Поэтому единство в празднике Успения/Взятия не доказывает единства в учении о первородном грехе Богородицы; эти вопросы в Православии разделяют (см. предыдущую карточку).
          proof:
            - url: https://azbyka.ru/otechnik/bogoslovie/zapadnoe-hristianstvo-vzgljad-s-vostoka/2
              title: 'Прот. Максим Козлов, Д. П. Огицкий. «Западное христианство: взгляд с Востока», гл. II «Римский католицизм»'
              tier: reference
              excerpt: принятого также без какого-либо Собора в 1950 г. папой Пием XII
              accessed: '2026-10-01'
