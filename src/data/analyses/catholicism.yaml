      - id: filioque
        title: Исхождение Святого Духа (Filioque)
        short: "Церковь учит, что Святой Дух исходит от Отца, как сказано в Символе веры, а католики — что от Отца и Сына (это учение называют Filioque, по-латыни и от Сына)."
        topic: spirit
        church:
          text: 'Святой Дух — истинный Бог, Он исходит от Отца: так исповедует Символ веры («Иже от Отца исходящаго»). По катехизису, учение об исхождении Духа от Отца «не может быть подвержено какому-либо изменению или дополнению», а послание Духа Сыном в мир отличается от вечного исхождения.'
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет. Пространный катехизис, §§237–240: Божество и исхождение Святого Духа'
              tier: official
              excerpt: Учение об исхождении Святого Духа от Отца не может быть подвержено какому-либо изменению или дополнению.
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: Святой Дух исповедуем исходящим от Отца и именуем Его Духом Отца; от Сына же не исповедуем исхождение Святого Духа
              accessed: '2026-09-25'
            - url: https://azbyka.ru/simvol_very
              title: 'Никео-Цареградский Символ веры, член 8: о Святом Духе'
              tier: official
              excerpt: Иже от Отца исходящаго
              accessed: '2026-10-01'
        tradition:
          text: 'Латинская традиция Символа веры исповедует, что Дух исходит «от Отца и Сына» (Filioque). Флорентийский собор разъясняет: Дух вечно исходит от Отца и Сына «как от единого начала и единым дыханием»; различие восточного и западного выражений катехизис называет «законной взаимодополняемостью».'
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §246
              tier: official
              excerpt: Латинская традиция Символа веры исповедует, что Дух исходит «от Отца и Сына (Filioque)»
              accessed: '2026-09-25'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §248
              tier: official
              excerpt: Эта законная взаимодополняемость, если она не становится предметом обострения, не затрагивает существа веры в реальность той же исповедуемой тайны
              accessed: '2026-10-01'
        answer:
          points:
            - 'Слова Христа о Духе, «Который от Отца исходит» (Ин 15:26), Православная Церковь повторяет без прибавления: по катехизису, это «точные слова Самого Иисуса Христа», и они достаточны для выражения истины.'
            - 'Исповедание свт. Петра Могилы различает вечное исхождение и послание: Дух исходит от одного Отца как от причины, «а чрез Сына в мир посылается». Слова о том, что Сын посылает Духа (Ин 15:26; Ин 14:26), говорят о послании в мир, а не о вечном происхождении Ипостаси.'
            - 'Сходство честно признаётся: католический катехизис не вводит двух начал, а говорит об «едином начале» (§246) и называет различие выражений взаимодополняемостью (§248). Православное учение тем не менее допускает исхождение только от Отца — как у прп. Иоанна Дамаскина, на которого ссылается катехизис: Дух именуется «Духом Сыновним», но «от Сына… не исповедуем исхождение».'
            - Слова Гал 4:6 («Бог послал в сердца ваши Духа Сына Своего») говорят о посылании Духа в сердца верующих — это то же послание в мир, которое Православная Церковь отличает от вечного исхождения Ипостаси.
          proof:
