        tradition:
          text: 'Кодекс канонического права: покаянные дни — каждая пятница и время Великого поста; воздержание от мяса (или иной пищи по определению епископской конференции) — по пятницам, воздержание и пост — в Пепельную среду и Великую пятницу; воздержание обязывает с 14 лет, пост — от совершеннолетия до 60 лет; конференции епископов могут заменить пост делами милосердия.'
          proof:
            - url: https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib4-cann1244-1253_en.html
              title: Code of Canon Law, Book IV, can. 1251 — vatican.va
              tier: official
              excerpt: Abstinence from meat, or from some other food as determined by the Episcopal Conference, is to be observed on all Fridays
              accessed: '2026-09-26'
            - url: https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib4-cann1244-1253_en.html
              title: Code of Canon Law, Book IV, can. 1251 — vatican.va
              tier: official
              excerpt: Abstinence and fasting are to be observed on Ash Wednesday and Good Friday
              accessed: '2026-09-26'
            - url: https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib4-cann1244-1253_en.html
              title: Code of Canon Law, Book IV, can. 1252 — vatican.va
              tier: official
              excerpt: The law of abstinence binds those who have completed their fourteenth year
              accessed: '2026-09-26'
            - url: https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib4-cann1244-1253_en.html
              title: Code of Canon Law, Book IV, can. 1253 — vatican.va
              tier: official
              excerpt: The conference of bishops can determine more precisely the observance of fast and abstinence as well as substitute other forms of penance
              accessed: '2026-09-26'
            - url: https://www.vatican.va/content/paul-vi/en/apost_constitutions/documents/hf_p-vi_apc_19660217_paenitemini.html
              title: Paul VI, Apostolic Constitution Paenitemini (1966), ch. III, 2 — vatican.va
              tier: official
              excerpt: The law of fasting allows only one full meal a day, but does not prohibit taking some food in the morning and evening
              accessed: '2026-09-26'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1438
              tier: official
              excerpt: Периоды и дни покаяния на протяжении литургического года (время Великого Поста, каждая пятница в память смерти Господа)
              accessed: '2026-09-26'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §2043
              tier: official
              excerpt: Четвертая заповедь («Соблюдай предписанные Церковью периоды воздержания от мясной пищи и посты») определяет периоды аскетической жизни и покаяния
              accessed: '2026-09-26'
            - url: https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib4-cann1244-1253_en.html
              title: Code of Canon Law, Book IV, can. 1251 — vatican.va
              tier: official
              excerpt: is to be observed on all Fridays, unless a solemnity should fall on a Friday
              accessed: '2026-09-26'
            - url: https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib4-cann1244-1253_en.html
              title: Code of Canon Law, Book IV, can. 1252 — vatican.va
              tier: official
              excerpt: The law of fasting binds those who have attained their majority, until the beginning of their sixtieth year
              accessed: '2026-09-26'
            - url: https://www.vatican.va/archive/cod-iuris-canonici/eng/documents/cic_lib4-cann1244-1253_en.html
              title: Code of Canon Law, Book IV, can. 1253 — vatican.va
              tier: official
              excerpt: especially works of charity and exercises of piety
              accessed: '2026-09-26'
        answer:
          points:
            - 'Общее: посты нужны для покаяния, не для «заслуги»: «когда постишься, помажь голову твою и умой лице твоё» (Мф 6:17). Катехизис Католической Церкви (§1438) и православный катехизис (§524) связывают пост с покаянием, и расхождения здесь не догматические.'
            - 'Различие — в мере и уставе: в Православной Церкви четыре многодневных поста и посты в среду и пятницу (§§539–543); в католической дисциплине главное — Великий пост, пятницы, Пепельная среда и Великая пятница; один полный приём пищи в день (Paenitemini); способ воздержания и замена пощения делами определяются епископскими конференциями (кан. 1253).'
            - Православный пост связан с календарём праздников (Рождественский, Успенский посты как подготовка к праздникам, §543), католический — в основном с Великим постом и пятницами; возрастные нормы (14 и 60 лет) заданы каноном.
            - Сравнение возраста, дней и разрешённой пищи — вопрос церковной дисциплины, а не доказательство большей святости одной диеты.
          proof:
            - url: https://azbyka.ru/biblia/?Mt.6:17&r
              title: Мф. 6:17 — Синодальный перевод
              tier: official
              excerpt: А ты, когда постишься, помажь голову твою и умой лице твое
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Mt.6:16&r
              title: Мф. 6:16 — Синодальный перевод
              tier: official
              excerpt: Также, когда поститесь, не будьте унылы, как лицемеры
              accessed: '2026-10-01'
