        tradition:
          text: 'Катехизис Католической Церкви: Крещение совершается «наиболее выразительным образом через тройное погружение», но с древности — и троекратным возлиянием воды; в латинской Церкви Конфирмация даётся по достижении сознательного возраста, обычно епископом, а на Востоке Миропомазание совершается сразу после Крещения. Кодекс допускает Крещение через погружение или возлияние.'
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1239
              tier: official
