      - id: name-of-god
        title: Имя Божие
        short: "Обе традиции признают библейские имена Бога и Его непостижимость; отдельного расхождения об имени Божием в изученных документах нет."
        topic: name-of-god
        church:
          text: Имена Божии открывают человеку Бога, но не исчерпывают Его существа; «Господь» — одно из имён Божиих. Православное учение не делает произношение одного имени условием истинной веры.
          proof:
            - url: https://azbyka.ru/bozhestvennye-imena
              title: 'Азбука веры. Божие имя и божественные имена: понятие об именах, Исх. 3:14'
              tier: reference
              excerpt: имена Бога не говорят о Нем исчерпывающе
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Свт. Филарет Московский. Пространный катехизис, §135
              tier: official
              excerpt: Имя Господь есть одно из имён Божиих.
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: Бог есть Дух вечный, всеблагой, всеведущий, всеправедный, всемогущий, вездесущий, неизменяемый, вседовольный, всеблаженный
              accessed: '2026-09-25'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: Бог называется Вседержителем потому, что Он всё, что ни есть, содержит в Своей силе и в Своей воле
              accessed: '2026-09-25'
        tradition:
          text: 'Катехизис Католической Церкви говорит об открытии Богом Своего «сокровенного имени» — Ягве, «Я есмь Тот, Кто есть»: это откровение и одновременно указание на непостижимую тайну Бога.'
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §206
              tier: official
              excerpt: Открывая Свое сокровенное имя — Ягве, «Я есмь Тот, Кто есть»
              accessed: '2026-09-25'
        answer:
          points:
            - 'По этой теме отдельного расхождения между Православием и католичеством в изученных документах нет: обе традиции признают библейские имена Бога и Его непостижимость.'
            - Откровение имени у куста («Я есмь Сущий», Исх 3:14) Православная Церковь читает как откровение Бога, Который приближается к человеку, оставаясь непостижимым.
            - Различия в том, как именуют Бога в богослужении, — вопрос практики; общее исповедание имени Бога им не затрагивается.
          proof:
            - url: https://azbyka.ru/biblia/?Ex.3:14&r
              title: Исх. 3:14 — Синодальный перевод
              tier: official
              excerpt: Я есмь Сущий
              accessed: '2026-10-01'
        more: []
        legacy: []
