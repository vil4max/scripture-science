              tier: official
              excerpt: Душам умерших с верой, но не успевших принести достойных плодов покаяния, для достижения блаженного воскресения могут помочь возносимые за них молитвы
              accessed: '2026-09-25'
            - url: https://azbyka.ru/otechnik/Petr_Mogila/pravoslavnoe-ispovedanie-kafolicheskoj-i-apostolskoj-tserkvi-vostochnoj/1_10
              title: Петр Могила. Православное исповедание Кафолической и Апостольской Церкви Восточной, ч. 1, вопр. 66 (символическая книга)
              tier: official
              excerpt: Нигде в Писании не упоминается о нем, т.е. чтобы было временное какое наказание, очищающее души по смерти
