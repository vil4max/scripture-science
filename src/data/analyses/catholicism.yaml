      - id: christ
        title: Иисус Христос — Бог и человек
        short: "Православные и католики одинаково исповедуют Иисуса Христа истинным Богом и истинным человеком; в этом согласие, а расхождения касаются Святого Духа, Церкви и спасения."
        topic: jesus
        church:
          text: Господь Иисус Христос — одно Лицо, истинный Бог и истинный человек, Сын Божий, воплотившийся от Духа Святого и Марии Девы. Человеческой природе Христа безмерно сообщены все дары Святого Духа.
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет. Пространный катехизис, §§180–181: природы и Ипостась Христа'
              tier: official
              excerpt: В Господе Иисусе Христе не два, а одно лицо, Бог и человек вместе
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Свт. Филарет Московский. Пространный катехизис, §134
              tier: official
              excerpt: Его человеческой природе безмерно сообщены все дары Святого Духа.
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: Имя Христос означает Помазанник и оно произошло от помазания священным миром
              accessed: '2026-09-25'
        tradition:
          text: Катехизис Католической Церкви исповедует Иисуса Назарянина, родившегося в Вифлееме во времена царя Ирода Великого, истинным Богом и истинным человеком — предвечным Сыном Божиим, ставшим человеком.
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §423
              tier: official
              excerpt: Мы веруем и исповедуем, что Иисус Назарянин, родившийся евреем от дочери Израилевой в Вифлееме во времена царя Ирода Великого
              accessed: '2026-09-25'
        answer:
          points:
            - 'Исповедание Божества и человечества Христа, Его воплощения от Девы и телесного воскресения совпадает: это общая основа обеих традиций.'
            - 'Католичество, по справочному описанию «Азбуки веры», принимает (с оговорками) семь Вселенских Соборов первого тысячелетия; Православная Церковь исповедует то же: по катехизису свт. Филарета, во Христе «не два, а одно лицо, Бог и человек вместе».'
            - 'Общность христологии следует отличать от вопроса о церковном единстве: она не отменяет расхождений в учении о Святом Духе, Церкви и спасении, описанных ниже.'
