        tradition:
          text: 'Католическая Церковь считает вселенскими и последующие соборы. В сборнике догматических текстов, размещённом на «Азбуке веры» (русский перевод), они значатся так: Флорентийский — XVII Вселенский, I Ватиканский — XX, II Ватиканский — XXI. Катехизис опирается на Флорентийский и Тридентский соборы (например, в учении о чистилище).'
          proof:
            - url: https://azbyka.ru/otechnik/konfessii/hristianskoe-verouchenie-dogmaticheskie-teksty-uchitelstva-tserkvi-3-20-vv/
