# Curated analysis of catholicism (docs/tasks/site-m33-jw-analysis.md); Orthodox sources from Azbyka,
# the tradition's teaching from its own documents. Validated for full evidence coverage.
# Detailed analysis: Orthodoxy and Catholicism.
# Card order follows the reading order of the analysis; `topic` links a card from the comparison.
# Source rules: docs/SOURCES.md. Catholic positions come from the Catechism of the Catholic Church
# (archived ccconline.ru copy; vatican.va), conciliar texts and the Code of Canon Law.
tradition: catholicism
lead: 'Все документированные расхождения православного учения и католичества — по тезисам: учение Церкви, учение Католической Церкви (по Катехизису, соборам и Кодексу канонического права), православный ответ; общее отмечено там, где оно есть.'
authorityNote: 'Отдельного соборного акта о католичестве у Русской Православной Церкви нет. Документ Архиерейского Собора 2000 г. «Основные принципы отношения Русской Православной Церкви к инославию» содержит общие принципы (§§1.1–1.18, 7.1) и раздел об отношениях с Римско-Католической Церковью: он признаёт в ней апостольское преемство рукоположений, оценивает развитие её учения как нередко «шедшее вразрез с Преданием» и называет важнейшей темой диалога унию и прозелитизм; о браке и войне говорят «Основы социальной концепции» (2000). Остальные положения основаны на Писании, Символе веры, катехизисе свт. Филарета, правилах Соборов и символических книгах (Православное исповедание свт. Петра Могилы, Послание патриархов 1723 г.); оценки митр. Илариона (Алфеева), прот. М. Козлова и Д. Огицкого и статей «Азбуки веры» подписаны как мнения авторов. Энциклопедическая статья «Азбуки веры» называет католицизм «еретическим направлением»; документ 2000 г. такого определения не употребляет, а оскорбления в адрес инославных объявляет недопустимыми (§7.1).'
keyPoints:
  - text: "Православные и католики одинаково исповедуют одного Бога в трёх Лицах; спор начинается не с учения о Троице, а с вопроса о Святом Духе и о Символе веры."
    card: trinity
  - text: "Католики учат, что Святой Дух исходит от Отца и Сына (по-латыни Filioque), а Церковь исповедует исхождение Духа от Отца, как сказано в Символе веры, и не принимает этой добавки."
    card: filioque
  - text: "Католики признают за папой Римским верховную власть над всей Церковью, а Церковь чтит особое место Рима, но считает единственным Главой Церкви Христа и отвергает власть одного епископа над всеми."
    card: papal-primacy
  - text: "Католики с 1870 г. верят, что определения папы о вере безошибочны сами по себе, а Православие видит безошибочность в Церкви как целом, выраженной в согласии соборов."
    card: papal-infallibility
  - text: "Православная Церковь считает себя истинной Церковью Христовой, но признаёт у католиков преемство рукоположений от апостолов, не судит о мере благодати у них и считает недопустимым оскорблять людей."
    card: church-status
  - text: "Католики учат о чистилище как об очищении души после смерти; Православная Церковь тоже молится об умерших, но учения о чистилище как о месте очищающих наказаний не принимает."
    card: purgatory
  - text: "Католический догмат 1854 г. говорит, что Дева Мария с первого мгновения жизни сохранена от первородного греха; Православная Церковь такого догмата не принимает, но высоко почитает Богородицу."
    card: immaculate-conception
  - text: "Православные и католики одинаково учат, что спасение — дар Божий и человек сотрудничает с благодатью, поэтому спор нельзя сводить к тому, что у католиков дела, а у православных благодать."
    card: justification
  - text: "Православные и католики признают семь Таинств и подлинное присутствие Христа в Причащении; различия касаются обряда и порядка, а не самой веры в Причащение."
    card: sacraments
groups:
  - id: trinity-spirit
    title: 'Бог: Троица и Святой Дух'
    cards:
      - id: trinity
        title: Единый Бог в трёх Лицах
        short: "Православные и католики одинаково веруют в Троицу — одного Бога в трёх Лицах: Отце, Сыне и Святом Духе; спор начинается только с вопроса об исхождении Святого Духа."
        topic: god
        church:
          text: 'Бог один по существу и троичен в Лицах: Отец, Сын и Святой Дух — Троица единосущная и нераздельная. Единство Божества и троичность Лиц не противоречат друг другу, а Лица равны по достоинству.'
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет. Пространный катехизис, §§90–94: единосущная Троица'
              tier: official
              excerpt: 'Бог один по существу, но троичен в лицах: Отец, Сын и Святой Дух'
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: 'Бог один по существу, но троичен в лицах: Отец, Сын и Святой Дух, Троица единосущная и нераздельная'
              accessed: '2026-09-25'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Свт. Филарет Московский. Пространный катехизис, §§86–90
              tier: official
              excerpt: Бог один по существу, но троичен в лицах
              accessed: '2026-09-27'
        tradition:
          text: 'Катехизис Католической Церкви исповедует единого Бога в трёх Лицах, «Троицу единосущную»: Божественные Лица не разделяют единую Божественность и различаются только взаимными отношениями происхождения.'
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §253
              tier: official
              excerpt: 'Мы не исповедуем трех богов, но единого Бога в трех лицах: «Троицу единосущную»'
              accessed: '2026-09-25'
        answer:
          points:
            - 'В учении о единстве Бога и троичности Лиц православное и католическое исповедание совпадают: крещение совершается «во имя Отца и Сына и Святого Духа» (Мф 28:19) — одно имя, три Лица.'
            - Сын «единосущен Отцу» по Символу веры, принятому обеими традициями; католический катехизис употребляет ту же формулу («Троицу единосущную»).
            - Расхождение возникает не в учении о единстве и троичности, а в вопросе об исхождении Святого Духа и о прибавке к Символу веры (см. карточки «Исхождение Святого Духа» и «Прибавка Filioque к Символу веры»).
          proof:
            - url: https://azbyka.ru/biblia/?Mt.28:19&r
              title: Мф. 28:19 — Синодальный перевод
              tier: official
              excerpt: крестя их во имя Отца и Сына и Святого Духа
              accessed: '2026-10-01'
            - url: https://azbyka.ru/simvol_very
              title: 'Никео-Цареградский Символ веры, член 2: о Сыне'
              tier: official
              excerpt: Бога истинна от Бога истинна, рожде́нна, несотворе́нна, единосущна Отцу
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
