        tradition:
          text: 'Катехизис Католической Церкви: в Церкви семь таинств — Крещение, Миропомазание (Конфирмация), Евхаристия, Покаяние, Елеопомазание больных, Священство, Брак. Тридентский собор называет изменение всего существа хлеба и вина в Тело и Кровь Христовы пресуществлением.'
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1113
              tier: official
              excerpt: 'В Церкви существует семь таинств: Крещение, Миропомазание (Конфирмация), Евхаристия, Покаяние, Елеопомазание больных'
              accessed: '2026-09-25'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §1376
              tier: official
              excerpt: освящением хлеба и вина совершается изменение всего существа хлеба в существо Тела Христа
              accessed: '2026-10-01'
        answer:
          points:
            - 'Число Таинств и вера в реальное присутствие Христа в Евхаристии совпадают: расхождений в этом пункте нет. Само слово «пресуществление» употребляет и Православная Церковь: Послание патриархов 1723 г. говорит о хлебе, «претворяемом и пресуществляемом».'
            - 'Православный катехизис подчёркивает, что слово «пресуществление» не объясняет образа претворения: показывается только, что хлеб «истинно, действительно и существом» становится Телом Господа. Катехизис Католической Церкви говорит о «действенности слова Христова и действия Духа Святого» (§1375).'
            - 'Различия лежат в обряде и дисциплине (см. следующие карточки). Совместного совершения Евхаристии между Церквами нет: Катехизис говорит, что общение с Православными Церквами «так глубоко, что малого недостает» до полноты, которая его позволит (§838).'
