      - id: papal-infallibility
        title: Непогрешимость папы и непогрешимость Церкви
        short: "Церковь учит, что безошибочна вся Церковь как целое, а определения веры принимает собор; католики с 1870 г. верят, что папа, говоря ex cathedra (с кафедры), безошибочно определяет веру и без согласия Церкви."
        topic: authority
        church:
          text: Непогрешимость в Православии принадлежит Кафолической Церкви как целому — её способности неизменно хранить и точно выражать Божественную истину; отдельные епархии и даже Поместные Церкви сами по себе ею не обладают. Определения веры принимает собор, а не единоличная власть.
          proof:
            - url: https://azbyka.ru/nepogreshimost
              title: Непогрешимость — энциклопедия «Азбука веры» (автор статьи Панайотис И. Бумис)
