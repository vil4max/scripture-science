        tradition:
          text: Первый Ватиканский собор (1870) определил как догмат, что папа Римский, когда говорит ex cathedra, пользуется безошибочностью, и «эти определения папы Римского непреложны сами по себе [ex sese], а не из-за согласия Церкви». Катехизис добавляет, что безошибочность присуща и Коллегии Епископов вместе с Преемником Петра, особенно на Вселенском Соборе.
          proof:
            - url: https://azbyka.ru/otechnik/konfessii/hristianskoe-verouchenie-dogmaticheskie-teksty-uchitelstva-tserkvi-3-20-vv/9_220
              title: «Христианское вероучение. Догматические тексты учительства Церкви III–XX вв.» (рус. пер., «Азбука веры»), «Pastor Aeternus» (1870), гл. 4
              tier: reference
              excerpt: Следовательно, эти определения папы Римского непреложны сами по себе [ex sese], а не из-за согласия Церкви
              accessed: '2026-10-01'
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §891
              tier: official
              excerpt: Этой безошибочностью обладает в силу своей миссии Римский Первосвященник, глава Коллегии Епископов
              accessed: '2026-10-01'
        answer:
          points:
            - 'Апостольский Собор решил дело «апостолами и пресвитерами» (Деян 15:6), и его решение изложено словами «угодно Святому Духу и нам» (Деян 15:28): авторитет принадлежит соборному свидетельству, а не одному лицу.'
            - Церковь — «столп и утверждение истины» (1 Тим 3:15); по Исповеданию свт. Петра Могилы, Церковь вправе судить даже Пап. Определение, истинное «не из-за согласия Церкви», с этим не совмещается.
            - 'Сходство признаётся: католичество тоже учит о безошибочности Коллегии Епископов и Вселенского Собора (§891), и догмат не означает безгрешности папы или его непогрешимости как богослова — как отмечает и «Азбука веры».'
            - 'Православное возражение направлено именно на тезис об определениях, истинных «сами по себе», без согласия Церкви: по православному учению, непогрешимость не передаётся одному епископу.'
