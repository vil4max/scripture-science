      - id: filioque-creed
        title: Прибавка Filioque к Символу веры
        short: "Церковь хранит Символ веры без добавлений, потому что он общий для всей Церкви, а католики добавили в него слова Filioque (и от Сына) и считают это законным, хотя в древнем Символе их не было."
        topic: spirit
        church:
          text: Третий Вселенский Собор своим седьмым правилом запретил составлять новый Символ веры; Православная Церковь исповедует Никео-Цареградский Символ в его соборной редакции, без добавлений. Вопрос о Filioque поэтому касается не только содержания, но и права изменять общий Символ.
          proof:
            - url: https://azbyka.ru/otechnik/pravila/kanony-ili-kniga-pravil/8_7
              title: Правило 7 III Вселенского Собора (Эфесского), «Книга Правил»
              tier: official
              excerpt: да не будет позволено никому произносить, или писать, или слагать иную веру, кроме определенной от святых отец, в Никее граде
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Свт. Филарет Московский. Пространный катехизис, §240
              tier: official
              excerpt: третий Вселенский Собор своим седьмым правилом запретил составлять новый Символ веры
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/bogoslovie/tomos-konstantinopolskogo-sobora-1484-g-s-torzhestvennym-osuzhdeniem-uniatskogo-ferraro-florentijskogo-sobora/
              title: Томос Константинопольского собора 1484 г. (пер. П. Пашкова, «Азбука веры»)
              tier: official
              excerpt: и сделать прибавку к Символу веры, содержащую это учение
              accessed: '2026-10-01'
        tradition:
          text: Катехизис Католической Церкви признаёт, что Filioque отсутствовало в Символе, исповеданном в 381 г. в Константинополе; введение формулы в Символ через латинскую литургию остаётся предметом спора с православными Церквами. Флорентийская булла 1439 г. определяет, что Filioque «было законно и разумно добавлено к Символу».
          proof:
            - url: http://web.archive.org/web/20260422005102/https://ccconline.ru/
              title: Катехизис Католической Церкви (ccconline.ru, архивная копия), §247
              tier: official
              excerpt: Провозглашение Filioque отсутствовало в Символе веры, исповеданном в 381 г. в Константинополе
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/konfessii/hristianskoe-verouchenie-dogmaticheskie-teksty-uchitelstva-tserkvi-3-20-vv/4_74
              title: «Христианское вероучение. Догматические тексты учительства Церкви III–XX вв.» (рус. пер., «Азбука веры»), булла «Laetentur Coeli» (1439), «Декрет для греков»
              tier: reference
              excerpt: Filioque, которое разъясняет эти слова, было законно и разумно добавлено к Символу
              accessed: '2026-10-01'
        answer:
          points:
            - Правило 7 Эфесского Собора запрещает «слагать иную веру» помимо определённой в Никее; Православная Церковь опирается на это правило (по катехизису, оно запретило новый Символ).
            - 'Католический катехизис признаёт то, что важно для спора: формулы не было в Символе 381 г., а её введение через латинскую литургию «и сегодня составляет предмет спора» (§247). Расхождение, таким образом, документировано самой католической стороной.'
            - 'Православный ответ состоит из двух частей: по содержанию — исхождение Духа от Отца (Ин 15:26); по форме — общий Символ принадлежит всей Церкви и не меняется волей одной Поместной Церкви. Флорентийское определение 1439 г. Православной Церковью не принято.'
            - Константинопольский Собор 1484 г. (с участием Восточных патриархов, по справочному описанию «Азбуки веры») осудил Ферраро-Флорентийский собор и прибавку к Символу; в Православной Церкви Символ веры читается без Filioque.
          proof:
            - url: https://azbyka.ru/biblia/?Jn.15:26&r
              title: Ин. 15:26 — Синодальный перевод
              tier: official
              excerpt: Дух истины, Который от Отца исходит
              accessed: '2026-10-01'
            - url: https://azbyka.ru/katolicizm
              title: 'Католицизм — энциклопедия «Азбука веры»: «Какие учения католицизма являются еретическими?»'
              tier: reference
              excerpt: Важнейшими из этих соборов и вероизложений следует признать Константинопольский Собор 1484 г. (с участием всех Восточных патриархов)
