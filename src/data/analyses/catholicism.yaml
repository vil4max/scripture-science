  - id: last-things
    title: Посмертие и конец времён
    cards:
      - id: purgatory
        title: Чистилище и молитва об усопших
        short: "Католики учат о чистилище — особом очищении души после смерти; Церковь, как и они, молится об умерших и ждёт воскресения, но чистилища как места очищающих наказаний не признаёт."
        topic: afterlife
        church:
          text: До всеобщего воскресения души праведных пребывают «во свете, покое и предначинании вечного блаженства»; тем, кто умер с верой, но не принёс достойных плодов покаяния, помогают молитвы Церкви. Православная Церковь молится за усопших и ожидает воскресения мёртвых, но не принимает учения о «чистилище» как о месте очищающих наказаний (Исповедание свт. Петра Могилы, вопр. 66).
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Свт. Филарет Московский. Пространный катехизис, О членах 11 и 12 Символа веры
              tier: official
              excerpt: во свете, покое и предначинании вечного блаженства
              accessed: '2026-09-27'
            - url: https://azbyka.ru/simvol_very
              title: 'Никео-Цареградский Символ веры, член 11: воскресение мёртвых'
              tier: official
              excerpt: Чаю воскресения мертвых
