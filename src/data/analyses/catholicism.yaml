      - id: church-law
        title: Источники церковного права
        short: "Православная Церковь живёт по древним правилам Апостолов и Соборов (Книге Правил), а Латинская Католическая Церковь — по Кодексу канонического права 1983 г.; это различие в сфере права, а не веры."
        topic: rules
        church:
          text: В Православной Церкви действуют древние правила Апостолов, Вселенских и Поместных Соборов («Книга Правил»); например, апостольское правило 63 и 67-е правило Трулльского Собора запрещают употребление в пищу крови и удавленины. Каноны Церкви, принятые на всеправославном уровне, не противоречат Божественному Откровению, но их применение может меняться с обстоятельствами.
          proof:
            - url: https://azbyka.ru/pravo/63-apostolskoe-pravilo/
              title: Правило 63 святых Апостолов — «Церковное право», «Азбука веры»
              tier: official
