        tradition:
          text: 'Пункт 26 «Основ вероучения»: «Бог, единственный имеющий бессмертие, дарует вечную жизнь Своим искупленным. До дня Второго пришествия смерть для всех людей — это состояние небытия». Пункт 7 описывает человека как «неразрывное единство тела, души и духа». Московское объединение церкви описывает своё учение как понимание смертности души, или условного бессмертия: до воскресения и суда мёртвые бессознательны.'
          proof:
