        answer:
          points:
            - Общее — надежда на вечное Царство и жизнь с Богом после Суда (Лк 1:33; Откр 21:3).
            - 'Различие — в промежуточном «тысячелетнем» периоде на небе после пришествия. Катехизис не описывает такого отдельного периода: перед Судом — царство благодати, а после — царство славы (§§234–235).'
            - Свящ. Д. Сысоев пишет, что Православная Церковь понимает тысячелетие как всё время от Искупления до Второго пришествия Христа, а «первое воскресение» — как оживление души верой и Крещением (он цитирует свт. Игнатия Брянчанинова). Это толкование авторов, а не догмат.
            - Адвентистский текст относит Откр 20:4–6 к периоду после пришествия; обе стороны читают этот текст по-разному, и спор нужно решать не отдельной цитатой, а в свете Символа веры (Его «царствию не будет конца»).
