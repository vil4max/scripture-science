        topic: holy-days
        church:
          text: Церковь празднует не седьмой, а первый день недели — воскресный, со времени воскресения Христа (катехизис свт. Филарета, §§534–536). Суббота как день недели не празднуется как большой праздник, но в память о сотворении мира отличается от других дней освобождением от поста (§533). Лаодикийский Собор (360), правила которого утвердил Трулльский Собор (691), постановил, что христиане «не должны иудействовать и в субботу оставлять дела», а в воскресенье, «отдавая, как христиане, предпочтение этому дню», оставлять все дела, если они могут.
