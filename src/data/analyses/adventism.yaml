      - id: remnant-church
        title: Церковь Остатка и единая Церковь
        topic: organisation
        church:
          text: 'Церковь едина: у неё один Глава — Христос, и по катехизису свт. Филарета это «общество людей, соединённых православной верой, законом Божиим, священноначалием и Таинствами». Архиерейский Собор 2000 года свидетельствует: «Православная Церковь есть истинная Церковь Христова» (§1.1) и призывает православных относиться к исповедующим иные взгляды «с христианской любовью» (§7.1).'
          proof:
            - url: https://azbyka.ru/otechnik/dokumenty/osnovnye-printsipy-otnoshenija-russkoj-pravoslavnoj-tserkvi-k-inoslaviyu/
