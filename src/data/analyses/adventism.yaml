        tradition:
          text: 'В «Основах вероучения» Христос — «Бог Вечный Сын»: «будучи вовеки истинным Богом», Он стал истинным человеком, зачатый Святым Духом и рождённый девой Марией. Он добровольно умер на кресте за грехи, воскрес, вознёсся и вернётся во славе.'
          proof:
            - url: https://www.mosadvent.ru/index.php/adout/faith/item/509-polnoe-izlozhenie-doktrin
              title: Полное изложение доктрин, п. 4 «Бог Сын»
              tier: official
              excerpt: Он был действительно Богом — обещанным Мессией. Он добровольно пострадал и умер на кресте за наши грехи
              accessed: '2026-09-25'
            - url: https://www.mosadvent.ru/index.php/adout/faith/item/509-polnoe-izlozhenie-doktrin
