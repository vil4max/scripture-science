    cards:
      - id: moral-and-ceremonial-law
        title: Закон Божий и Десять заповедей
        topic: rules
        church:
          text: 'Десять заповедей даны народу Израиля, но, по катехизису свт. Филарета, и нам следует поступать по ним: в сущности это тот же закон, который написан в сердцах всех людей. Господь Иисус Христос учил хранить заповеди и исполнять их более совершенно, чем их понимали до Него (Мф 19:17; гл. 5).'
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6
              title: 'Свт. Филарет. Пространный катехизис, §486: следует ли поступать по заповедям, если даны они другому народу'
              tier: official
              excerpt: Заповеди эти даны народу израильскому, но и нам следует поступать по ним
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6
              title: 'Свт. Филарет. Пространный катехизис, §487: учил ли Иисус Христос поступать по десяти заповедям'
              tier: official
              excerpt: учил понимать и исполнять их более совершенно, чем до Него их понимали
              accessed: '2026-10-01'
        tradition:
          text: 'Пункт 19 «Основ вероучения»: Десять заповедей «обязательны для людей всех времён» и лежат в основе Божьего завета с Его народом. Спасение — дар благодати и «невозможно заслужить делами», но «спасённый человек послушен заповедям».'
          proof:
