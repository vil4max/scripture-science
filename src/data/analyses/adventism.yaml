        tradition:
          text: 'В «Основах вероучения» церкви адвентистов седьмого дня сказано: «Бог един. Отец, Сын и Святой Дух — единство трёх совечных Личностей». На сайте Московского объединения церкви добавлено, что эти доктрины она относит к тем, что объединяют её с ортодоксальным христианством: они сформулированы в постановлениях первых четырёх соборов.'
          proof:
            - url: https://www.mosadvent.ru/index.php/adout/faith/item/509-polnoe-izlozhenie-doktrin
              title: Полное изложение доктрин, п. 2 «Троица»
              tier: official
              excerpt: Бог един. Отец, Сын и Святой Дух — единство трёх совечных Лич ностей
              accessed: '2026-09-26'
            - url: https://www.mosadvent.ru/index.php/adout/faith/item/510-chto-otlichaet-adventistskoe-verouchenie
              title: «Что отличает адвентистское вероучение?» — Московское объединение Церкви ХАСД
              tier: official
              excerpt: Доктрины сформулированные в постановлениях первых четырех соборов и утверждающие веру в тайну Божественной Троицы и тайну Богочеловечества Господа Иисуса Христа
              accessed: '2026-10-01'
        answer:
          points:
            - 'В исповедании Троицы расхождения нет: и Церковь, и адвентисты исповедуют единого Бога в трёх Лицах. Приписывать адвентистам отрицание Троицы неверно.'
            - Свящ. Роман Конь свидетельствует, что в XIX веке большинство адвентистов Троицу не исповедовало, и считает, что не все адвентисты до сих пор отошли от начальных взглядов. Это мнение автора, а не акт Церкви; официальное исповедание сегодня троично (п. 2).
            - Архиерейский Собор 2000 года различает «инославные исповедания», признающие веру в Святую Троицу и Богочеловечество Иисуса Христа, и секты, отвергающие основополагающие догматы (§6.3). Адвентисты в документе не названы; к какому разряду их относить, он прямо не говорит.
            - Различия начинаются дальше — в учении о пророческом авторитете, о состоянии умерших, о суде и о Церкви; они разобраны в следующих карточках.
          proof:
            - url: https://azbyka.ru/otechnik/Roman-Kon/osobennosti-hristologii-adventizma-sedmogo-dnja/
              title: Свящ. Р. М. Конь. Особенности христологии адвентизма седьмого дня, введение
              tier: reference
              excerpt: когда большинство адвентистов не верили в Святую Троицу
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/Roman-Kon/osobennosti-hristologii-adventizma-sedmogo-dnja/
              title: Свящ. Р. М. Конь. Особенности христологии адвентизма седьмого дня, аннотация
              tier: reference
              excerpt: не все адвентисты отошли от начальных взглядов
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/dokumenty/osnovnye-printsipy-otnoshenija-russkoj-pravoslavnoj-tserkvi-k-inoslaviyu/
              title: Архиерейский Собор РПЦ, 2000. Основные принципы отношения к инославию, §6.3
              tier: official
              excerpt: Православная Церковь проводит четкое различие между инославными исповеданиями, признающими веру в Святую Троицу, Богочеловечество Иисуса Христа, и сектами, которые отвергают основополагающие христианские догматы
              accessed: '2026-10-01'
