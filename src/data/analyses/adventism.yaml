        answer:
          points:
            - 'Здесь расхождения нет: благоговейное отношение к имени Божию, о котором говорит третья заповедь (Исх 20:7), общее для Церкви и адвентистов.'
            - 'Православная традиция называет Бога многими именами и не ограничивает Его одним произносимым именем: «Я есмь Сущий» (Исх 3:14); имя Иисуса — «выше всякого имени» (Флп 2:9).'
            - 'Форма «Иегова» в книге Е. Уайт сама по себе спора не создаёт. Различие в другом: на какой авторитет опирается толкование — на Писание и Предание или на труды позднейшего автора (см. карточку «Дар пророчества»).'
