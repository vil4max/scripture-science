        tradition:
          text: 'Пункт 13 «Основ вероучения»: «Вселенская Церковь состоит из тех, кто истинно верит в Христа», а в последние дни Бог призвал «Церковь Остатка» к соблюдению заповедей Божьих и сохранению веры в Иисуса; её миссия — вестью трёх ангелов (Откр 14) провозглашать наступление часа суда. Дар пророчества назван «отличительным признаком» этой Церкви (п. 18).'
          proof:
            - url: https://www.mosadvent.ru/index.php/adout/faith/item/509-polnoe-izlozhenie-doktrin
              title: Полное изложение доктрин, п. 13 «Церковь Остатка и ее миссия» — Московское объединение Церкви ХАСД
              tier: official
              excerpt: Бог при звал Церковь Остатка к соблюдению заповедей Божьих и сохранению веры в Иисуса
              accessed: '2026-09-26'
            - url: https://www.mosadvent.ru/index.php/adout/faith/item/509-polnoe-izlozhenie-doktrin
              title: Полное изложение доктрин, п. 13 «Церковь Остатка и ее миссия»
              tier: official
              excerpt: Вселенская Церковь состоит из тех, кто истинно верит в Христа
              accessed: '2026-10-01'
            - url: https://www.mosadvent.ru/index.php/adout/faith/item/509-polnoe-izlozhenie-doktrin
              title: Полное изложение доктрин, п. 13 «Церковь Остатка и ее миссия»
              tier: official
              excerpt: Церковь Остатка провозглашает наступление часа суда
              accessed: '2026-10-01'
        answer:
          points:
            - 'Адвентистский текст не исключает других христиан из Церкви: вселенская Церковь, по тексту, «состоит из тех, кто истинно верит в Христа»; «Церковь Остатка» описана как особое призвание последнего времени.'
            - 'Православное понимание иное: единство Церкви — в одной апостольской вере, в Таинствах и священноначалии (Еф 4:4–6), которое непрерывно ведёт начало от апостолов (§§272–275). Призвание «остатка» оценивается по соответствию этой вере.'
            - Христос обещал быть с Церковью «во все дни до скончания века» (Мф 28:20); врата ада не одолеют её (Мф 16:18).
            - Отвергая ошибочные, с православной точки зрения, взгляды, православные призваны с любовью относиться к людям, которые их исповедуют (§7.1 документа 2000 года).
