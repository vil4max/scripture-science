      - id: christ-incarnation
        title: 'Лицо Христа: общее исповедание'
        topic: jesus
        church:
          text: Иисус Христос — Сын Божий, второе Лицо Троицы, воплотившийся от Духа Святого и Марии Девы. По катехизису свт. Филарета, «в Господе Иисусе Христе не два, а одно лицо, Бог и человек вместе»; Его человеческой природе безмерно сообщены все дары Святого Духа.
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
