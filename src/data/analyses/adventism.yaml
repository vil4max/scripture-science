              accessed: '2026-10-01'
        answer:
          points:
            - 'Есть общее: оба вероучения связывают Крещение с погружением в воду, покаянием и верой (Деян 2:38). В адвентистском тексте оно связано и с прощением грехов, и с принятием Духа Святого.'
            - Первое различие — возраст. К адвентистскому Крещению допускаются лишь исповедавшие веру и раскаяние; Церковь крестит и младенцев по вере родителей и восприемников (§289), потому что Крещение заменило обрезание (Кол 2:11–12; §291); в Писании упомянуты крещения целых домов (Деян 16:33).
            - Второе — смысл. Адвентистский текст говорит об «установлении» и «символе»; Церковь — о Таинстве, через которое действует благодать и без рождения «от воды и Духа» нельзя войти в Царствие Божие (Ин 3:5).
            - Свящ. Евгений Веселов предлагает для обсуждения принимать адвентистов, которые не были крещены в Православной Церкви и не принимали крещения у католиков или традиционных протестантов, через полноценное Крещение. Это проект чина, предложенный автором, а не принятое священноначалием правило.
