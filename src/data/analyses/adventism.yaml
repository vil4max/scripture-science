              excerpt: Священноначалием, которое может действовать от имени всей Кафолической Церкви, является Вселенский Собор
              accessed: '2026-09-25'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет. Пространный катехизис, §275: откуда ведёт своё начало иерархия Православной Церкви'
              tier: official
              excerpt: Иерархия Православной Церкви ведёт своё начало от Самого Иисуса Христа и от сшедшего на апостолов Святого Духа
              accessed: '2026-10-01'
        tradition:
          text: 'Адвентистская церковь устроена по представительному принципу: общины входят в конференции, конференции — в унионы; всемирную работу координирует Генеральная конференция, а её съезд — высший орган, который может вносить изменения в «Основы вероучения». Церковь возводит себя к адвентистскому движению 1840-х годов и «Великому разочарованию» 22 октября 1844 года; Генеральная конференция организована в мае 1863 года.'
          proof:
            - url: https://www.mosadvent.ru/index.php/adout/faith/item/509-polnoe-izlozhenie-doktrin
              title: Полное изложение доктрин, преамбула
              tier: official
              excerpt: соответствующие изменения и дополнения в данные положения могут быть внесены на съезде Генеральной Конференции
              accessed: '2026-09-25'
            - url: https://adventist.org/identity/structure
              title: Structure — Seventh-day Adventist Church
              tier: official
              excerpt: All of the churches within a specific area, often a state, province or territory, are organized into conferences.
              accessed: '2026-09-26'
            - url: https://adventist.org/identity/structure
