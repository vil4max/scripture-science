      - id: origin-and-structure
        title: Происхождение и устройство церкви
        topic: organisation
        church:
          text: Церковь управляется священноначалием, преемство которого, по катехизису, ведёт начало «от Самого Иисуса Христа и от сшедшего на апостолов Святого Духа». Хотя Церковь одна, есть самостоятельные поместные Церкви; священноначалием, действующим от имени всей Церкви, является Вселенский Собор.
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: 'Церковь одна, однако имеются отдельные и самостоятельные Церкви, например: Иерусалимская, Антиохийская, Александрийская, Константинопольская, Российская'
              accessed: '2026-09-25'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
