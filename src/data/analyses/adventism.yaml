        answer:
          points:
            - 'Здесь есть настоящее согласие: Десять заповедей обязательны и для христиан — так учит и катехизис (§486), и адвентистский текст (п. 19).'
            - 'Различие в том, что ещё из Закона Моисея остаётся в силе. Церковь читает обрядовые установления Закона как исполненные во Христе: «конец закона — Христос» (Рим 10:4), закон был «детоводителем ко Христу» (Гал 3:24), а то, что ветшает и стареет, «близко к уничтожению» (Евр 8:13).'
            - 'Апостольский Собор не наложил на обращённых из язычников бремени Закона: «не возлагать на вас никакого бремени более, кроме сего необходимого» (Деян 15:28). Субботу и пищевые предписания адвентисты соблюдают как продолжающие действовать; см. карточки «Суббота» и «Пища, здоровье и воздержание».'
