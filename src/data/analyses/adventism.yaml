        title: Пища, здоровье и воздержание
        topic: rules
        church:
          text: 'Церковь не делит пищу на чистую и нечистую по ветхозаветному закону: «нет ничего в себе самом нечистого» (Рим 14:14), «всякое творение Божие хорошо» (1 Тим 4:4). Но Апостольское правило 63 и 67-е правило Трулльского Собора сохраняют запрет вкушать кровь и удавленину, о котором говорит Писание.'
          proof:
            - url: https://azbyka.ru/pravo/shestoj-vselenskij-sobor-67/
              title: Правило 67 Трулльского Собора (691) — «Церковное право», «Азбука веры»
              tier: official
              excerpt: Божественное Писание заповедало нам воздерживаться от крови, удавленины и блуда
              accessed: '2026-09-26'
            - url: https://azbyka.ru/pravo/63-apostolskoe-pravilo/
              title: Правило 63 святых Апостолов — «Церковное право», «Азбука веры»
              tier: official
              excerpt: съест мясо с кровью души его, или звероядину, или мертвечину, да будет извержен, ибо это запретил закон
              accessed: '2026-09-26'
        tradition:
          text: 'Пункт 22 «Основ вероучения»: «Мы должны воздерживаться от нечистой еды, указанной в Писании» (Лев 11:1–47), а также от алкоголя, табака, наркотиков и злоупотребления лекарствами, потому что наши тела, как сказано, «являются храмом Святого Духа», и о них нельзя пренебрегать заботой.'
          proof:
            - url: https://www.mosadvent.ru/index.php/adout/faith/item/509-polnoe-izlozhenie-doktrin
              title: Полное изложение доктрин, п. 22 «Христианское поведение»
              tier: official
              excerpt: Мы должны воздерживаться от нечистой еды, указанной в Писании
              accessed: '2026-09-25'
            - url: https://www.mosadvent.ru/index.php/adout/faith/item/509-polnoe-izlozhenie-doktrin
