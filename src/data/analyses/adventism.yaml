      - id: military-service
        title: Военная служба и мир
        topic: rules
        church:
          text: '«Основы социальной концепции» Русской Православной Церкви (VIII.2): «Признавая войну злом, Церковь все же не воспрещает своим чадам участвовать в боевых действиях», когда речь идёт о защите ближних и восстановлении попранной справедливости. Катехизис свт. Филарета учит: все люди — наши ближние, а любовь к Отечеству должна простираться «до готовности отдать за них свою жизнь».'
          proof:
            - url: https://azbyka.ru/otechnik/dokumenty/osnovy-sotsialnoj-kontseptsii-russkoj-pravoslavnoj-tserkvi/
              title: 'Основы социальной концепции РПЦ (2000), VIII.2: участие христиан в боевых действиях'
              tier: official
              excerpt: Признавая войну злом, Церковь все же не воспрещает своим чадам участвовать в боевых действиях
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6
              title: 'Свт. Филарет. Пространный катехизис, §§489–492: любовь к Богу и ближнему'
              tier: official
              excerpt: Все люди являются нашими ближними. Потому что все – создания единого Бога
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: Наша любовь к Государю и Отечеству должна простираться до готовности отдать за них свою жизнь
              accessed: '2026-09-25'
        tradition:
          text: 'Институт библейских исследований Евро-Азиатского дивизиона отмечает: официальные документы церкви АСД не запрещают службу в армии. Заявление Генеральной конференции 1985 года убеждает народы «перековать мечи свои на орала».'
          proof:
            - url: https://bri.esd.adventist.org/uploaded_assets/113416
              title: «Библия и церковь о проблеме войны и мира» — Институт библейских исследований, Евро-Азиатский дивизион
              tier: official
              excerpt: официальные документы Церкви АСД не запрещают службу в армии
              accessed: '2026-09-25'
            - url: https://bri.esd.adventist.org/uploaded_assets/113416
              title: «Библия и церковь о проблеме войны и мира», текст заявления Генеральной конференции 1985 года
              tier: official
              excerpt: Церковь адвентистов седьмого дня убеждает все народы «перековать мечи свои на орала, и копья свои — на серпы»
              accessed: '2026-09-25'
        answer:
          points:
            - По документам обеих сторон военная служба не запрещена общим правилом. Расхождения в этом вопросе документально не выявлено.
            - 'Общее и отношение к войне: в «Основах социальной концепции» война названа злом («Признавая войну злом…»), а адвентистская церковь призывает народы к миру (заявление 1985 г.).'
            - Основания православного подхода — слова Христа «нет больше той любви, как если кто положит душу свою за друзей своих» (Ин 15:13) и то, что Иоанн Креститель не потребовал от воинов оставить службу (Лк 3:14).
          proof:
            - url: https://azbyka.ru/biblia/?Jn.15:13&r
              title: Ин. 15:13 — Синодальный перевод
              tier: official
              excerpt: Нет больше той любви, как если кто положит душу свою за друзей своих
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Lk.3:14&r
              title: Лк. 3:14 — Синодальный перевод
              tier: official
              excerpt: и довольствуйтесь своим жалованьем
              accessed: '2026-10-01'
