# Curated analysis of adventism (docs/tasks/site-m33-jw-analysis.md); Orthodox sources from Azbyka,
# the tradition's teaching from its own documents. Validated for full evidence coverage.
# Detailed analysis: Orthodoxy and the Church of Seventh-day Adventists.
# Source rules: docs/SOURCES.md. Reused proofs keep their original wording and access dates.
tradition: adventism
lead: 'Все документированные расхождения православного учения и учения Церкви адвентистов седьмого дня — по тезисам: учение Церкви, учение адвентистов, православный ответ. Общее исповедание отмечено так же прямо, как и различия.'
authorityNote: Среди использованных церковных документов — «Основные принципы отношения Русской Православной Церкви к инославию» (Архиерейский Собор, 2000) и «Основы социальной концепции» — адвентисты не названы, а соборного или синодального акта, посвящённого им отдельно, мы не нашли. Православная позиция здесь изложена по Писанию, Символу веры и катехизису свт. Филарета; оценки отдельных авторов — свящ. Д. Сысоева, свящ. Е. Веселова, свящ. Р. Коня, А. Л. Дворкина и других — подписаны как их мнения. Проект чина присоединения свящ. Е. Веселова — предложение автора для обсуждения, а не принятый священноначалием акт.
