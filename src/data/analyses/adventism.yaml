              accessed: '2026-10-01'
        answer:
          points:
            - 'Есть общее: центр надежды — воскресение мёртвых (Ин 5:28–29; Символ веры, член 11). Писание называет смерть сном (Ин 11:11), и православные авторы этого не отрицают: по свящ. Даниилу Сысоеву, образ сна «предполагает пробуждение», но не небытие.'
            - 'Расхождение — в состоянии между смертью и воскресением. Христос говорит разбойнику: «ныне же будешь со Мною в раю» (Лк 23:43); Павел желает «разрешиться и быть со Христом» (Флп 1:23; 2 Кор 5:8); «Бог не есть Бог мертвых, но живых» (Мф 22:32); души убиенных «под жертвенником» взывают к Богу (Откр 6:9–10).'
            - Лк 23:43 адвентистские авторы, как пишет Сысоев, читают с запятой после «ныне». Притча о богаче и Лазаре (Лк 16:22–26) лежит в основе слов катехизиса (§371); при этом православные авторы расходятся, притча ли это или рассказ о реальных событиях (Сысоев).
            - 'Церковь молится об усопших: «душам умерших с верой, но не успевших принести достойных плодов покаяния, для достижения блаженного воскресения могут помочь возносимые за них молитвы» (§373). Молитва об усопших связана с этим различением состояния до воскресения и окончательной участи после Суда.'
