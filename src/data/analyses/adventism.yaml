        answer:
          points:
            - 'Различие — в смысле слов Христа: адвентисты принимают «символы» тела и крови, Церковь исповедует, что в Причащении принимаются подлинные Тело и Кровь Христовы (Мф 26:26–28; Ин 6:53–56; 1 Кор 10:16).'
            - 'Адвентистский текст не сводит Вечерю к одному воспоминанию: по нему, при её совершении присутствует Сам Христос. Но об особом соединении со Христом в самом Причастии (§339) в нём не сказано.'
            - Омовение ног адвентисты совершают перед Вечерей на основании Ин 13:1–17; в перечне семи Таинств катехизиса оно не названо (§282).
            - Адвентистская Вечеря, по тексту, открыта для участия «всех верующих христиан»; в Церкви к Таинству приступают после покаяния, поста и молитвы, а единство Церкви видимо выражается «одинаковым исповеданием веры и общением в молитвах и Таинствах» (§259).
