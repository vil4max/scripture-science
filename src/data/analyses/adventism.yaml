      - id: name-of-god
        title: Имя Божие
        topic: name-of-god
        church:
          text: Православная Церковь чтит имя Божие и называет Бога многими именами, ни одно из которых не исчерпывает Его существа. «Господь» — одно из имён Божиих, а Вседержителем Бог называется потому, что содержит всё сущее в Своей силе и воле.
          proof:
            - url: https://azbyka.ru/bozhestvennye-imena
              title: 'Азбука веры. Божие имя и божественные имена: понятие об именах, Исх. 3:14'
              tier: reference
              excerpt: имена Бога не говорят о Нем исчерпывающе
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Свт. Филарет Московский. Пространный катехизис, §135
              tier: official
              excerpt: Имя Господь есть одно из имён Божиих.
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: Бог есть Дух вечный, всеблагой, всеведущий, всеправедный, всемогущий, вездесущий, неизменяемый, вседовольный, всеблаженный
              accessed: '2026-09-25'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: Бог называется Вседержителем потому, что Он всё, что ни есть, содержит в Своей силе и в Своей воле
              accessed: '2026-09-25'
        tradition:
          text: В «Основах вероучения» особого учения об имени Божием нет. Е. Уайт, труды которой церковь признаёт авторитетным источником истины, толкует третью заповедь как запрет «небрежно или легкомысленно произносить имя Господа» и требует произносить его «с благоговением и торжественностью»; в той же книге Бог назван и Иеговой.
          proof:
            - url: https://m.egwwritings.org/ru/book/1802.1294
              title: Е. Уайт, «Патриархи и пророки», гл. 27 «Закон, данный Израилю», ПП 306.5 — EGW Writings (Ellen G. White Estate)
              tier: official
              excerpt: «Не произноси имени Господа, Бога твоего, напрасно; ибо Господь не оставит без наказания того, кто произносит имя Его напрасно»
              accessed: '2026-09-26'
            - url: https://m.egwwritings.org/ru/book/1802.1294
              title: Е. Уайт, «Патриархи и пророки», гл. 27 «Закон, данный Израилю», ПП 306.6 — EGW Writings (Ellen G. White Estate)
              tier: official
              excerpt: но она также запрещает нам небрежно или легкомысленно произносить имя Господа, не думая о его внушающем трепет значении
              accessed: '2026-09-26'
            - url: https://m.egwwritings.org/ru/book/1802.1294
              title: Е. Уайт, «Патриархи и пророки», гл. 27 «Закон, данный Израилю», ПП 306.6 — EGW Writings (Ellen G. White Estate)
              tier: official
              excerpt: Его святое имя следует произносить с благоговением и торжественностью
              accessed: '2026-09-26'
            - url: https://m.egwwritings.org/ru/book/1802.1294
              title: Е. Уайт, «Патриархи и пророки», гл. 27 «Закон, данный Израилю», ПП 305.4 — EGW Writings (Ellen G. White Estate)
              tier: official
              excerpt: Иегова, Вечный, Сущий от начала, не сотворенный, но Сам являющийся Источником жизни и Создателем всего, Один достоин самого высокого почитания и поклонения
