      - id: millennium
        title: Тысячелетнее Царство и Новая Земля
        topic: end-times
        church:
          text: Катехизис свт. Филарета различает царство природы (весь мир), благодати (верующие на земле) и славы (блаженные на небесах); слова Символа веры о том, что царству Христа не будет конца, относятся к царству славы (§§234–235). Тысячелетнего царства между пришествием и Судом катехизис не описывает.
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет. Пространный катехизис, §234: что такое царство Христа'
              tier: official
              excerpt: 'Царство Христа это: весь мир; все верующие на земле; все блаженные на небесах'
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет. Пространный катехизис, §235: какому из царств не будет конца'
              tier: official
              excerpt: Слова Символа о том, что царству Христа не будет конца, относятся к царству славы
              accessed: '2026-10-01'
        tradition:
          text: 'Пункт 27 «Основ вероучения»: тысячелетнее Царство — «промежуточный период между первым и вторым воскресениями», когда Христос и искупленные находятся на небе, а на земле остаётся только сатана с ангелами. После тысячелетия Христос и святые сойдут на землю, нечестивые воскреснут, и огонь уничтожит их. Затем, по п. 28, будет Новая Земля, где «Сам Господь будет там жить вместе со Своим народом».'
          proof:
            - url: https://www.mosadvent.ru/index.php/adout/faith/item/509-polnoe-izlozhenie-doktrin
