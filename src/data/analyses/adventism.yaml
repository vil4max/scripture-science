          points:
            - 'Общее — память о творении и посвящение времени Богу. Церковь не отменяет памяти о субботе: в этот день не поститься (§533).'
            - 'Но день христианского собрания в Новом Завете — первый день недели: «в первый же день недели, когда ученики собрались для преломления хлеба» (Деян 20:7); сборы в этот день (1 Кор 16:2); «день воскресный» (Откр 1:10). Св. Иустин (около 150 г.), по цитате А. Л. Дворкина: «Мы, христиане, собираемся для трапезы Господней в первый день недели».'
            - 'Апостол учит не судить «за какой-нибудь праздник, или новомесячие, или субботу», которые «есть тень будущего, а тело — во Христе» (Кол 2:16–17); он говорит и о различении дней (Рим 14:5), и упрекает: «Наблюдаете дни, месяцы, времена и годы» (Гал 4:10).'
            - Свящ. Евгений Веселов называет соблюдение субботы «одним из самых заметных отличий» адвентистов от остальных христиан; ответ Церкви основан на Новом Завете и правиле Лаодикийского Собора, а не на отрицании Закона.
