              accessed: '2026-10-01'
        answer:
          points:
            - 'В основном исповедании о Лице Христа расхождения не видно: предвечный Сын, воплощение, Крест, телесное воскресение — общее (Ин 1:14).'
            - 'Различие возникает в учении об искуплении и Суде: адвентисты говорят о служении Христа в небесном святилище, во второй части которого с 1844 года идёт «следственный суд». См. карточки «Небесное святилище» и «Следственный суд».'
            - Свящ. Р. Конь, отмечая, что адвентисты «формально исповедуют веру во Святую Троицу и Богочеловечество Иисуса Христа», рассматривает их христологию в связи с учением о человеке, спасении и конце времён. Это оценка автора, а не определение Церкви.
