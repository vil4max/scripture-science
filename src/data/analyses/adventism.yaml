        answer:
          points:
            - 'Общее — запрет боготворить изображение: употребление икон противоречило бы второй заповеди, «если бы их боготворили» (§517). Церковь с этим согласна.'
            - 'Но запрет идолов не есть запрет всех священных изображений: тот же Моисей по повелению Бога поставил в скинии золотых херувимов (Исх 25:18–20), и катехизис делает вывод, что иметь священные изображения вовсе не запрещается (§514).'
            - 'Воплощение сделало невидимого Бога видимым: «Слово стало плотию» (Ин 1:14), Христос — «образ Бога невидимого» (Кол 1:15). Икона Христа свидетельствует о Его истинном воплощении, а не пытается изобразить непостижимую сущность Божию.'
            - 'Икона не идол: на ней следует «умом видеть Бога и святых, на них изображённых» (§518), а почитание переходит на Первообраз.'
