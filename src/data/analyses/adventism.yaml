          points:
            - 'Адвентистское учение нельзя описывать как «спасение делами»: спасение — дар благодати, принимаемый верой, дела — его плод (Еф 2:8–10). Это близко к православному различению веры и жизни по вере (Иак 2:24).'
            - 'Совпадают и слова: «причастниками Божественной природы» (2 Пет 1:4) — язык, которым Православие говорит об обожении. Но общность слов не доказывает общности всего учения: из одного совпадающего положения нельзя выводить согласие во всей доктрине.'
