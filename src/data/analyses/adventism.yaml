          points:
            - 'Общее: Христос — наш небесный Первосвященник и ходатай (Евр 4:14; 7:25; Рим 8:34), а жертва на Кресте принесена «однажды» — об этом говорит и адвентистский текст.'
            - Особое адвентистское положение — деление служения на две части с переходом ко второй в 1844 году. Писание же говорит, что Христос «однажды вошел во святилище и приобрел вечное искупление» (Евр 9:12) и «однажды, к концу веков, явился для уничтожения греха жертвою Своею» (Евр 9:26). Православное учение о ходатайстве Христа не содержит второго этапа, начавшегося в определённый год.
            - Свящ. Евгений Веселов, разбирая это учение, считает, что оно «является результатом крайне рационального отношения к тайне нашего Искупления и продуктом юридического мышления XIX в.», и что оно, вопреки заявлениям адвентистов, «не имеет точного соответствия» в ветхозаветном дне очищения (Лев 16). Это оценка автора, не определение Церкви.
