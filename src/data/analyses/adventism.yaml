        tradition:
          text: По п. 27 «Основ вероучения», в конце тысячелетия нечестивые будут воскрешены, и «снизойдёт от Бога огонь, который уничтожит это воинство и очистит землю»; грех и грешники «навсегда исчезнут из вселенной». Московское объединение церкви описывает своё учение как понимание ада «как полного и окончательного уничтожения нечестивых».
          proof:
            - url: https://www.mosadvent.ru/index.php/adout/faith/item/509-polnoe-izlozhenie-doktrin
              title: Полное изложение доктрин, п. 27 «Тысячелетнее Царство и уничтожение греха»
              tier: official
              excerpt: снизойдёт от Бога огонь, который уничтожит это воинство и очистит землю
              accessed: '2026-09-25'
            - url: https://www.mosadvent.ru/index.php/adout/faith/item/509-polnoe-izlozhenie-doktrin
              title: 28 основ вероучения Церкви адвентистов седьмого дня — «Полное изложение доктрин» (mosadvent.ru)
              tier: official
              excerpt: По окончании этого тысячелетнего периода Христос со Своими святыми и Святой Город сойдут на землю. Тогда будут воскрешены и все
              accessed: '2026-09-26'
            - url: https://www.mosadvent.ru/index.php/adout/faith/item/510-chto-otlichaet-adventistskoe-verouchenie
              title: «Что отличает адвентистское вероучение?» — Московское объединение Церкви ХАСД
              tier: official
              excerpt: Понимание ада как полного и окончательного уничтожения нечестивых
              accessed: '2026-10-01'
        answer:
          points:
            - 'Общее: окончательный Суд, воскресение всех (Ин 5:28–29 приведено и в адвентистском тексте) и конец греха. Расходятся в участи нераскаявшихся: вечное мучение — или уничтожение.'
            - В Мф 25:46 слово «вечный» относится и к муке, и к жизни; свящ. Д. Сысоев указывает на это и считает неверным понимать его в двух разных смыслах (его аргумент, не определение Церкви).
            - Откровение говорит, что дым мучения «будет восходить во веки веков» (Откр 14:11), а диавол с зверем и лжепророком «будут мучиться день и ночь во веки веков» (Откр 20:10); Христос говорит о геенне, «где червь их не умирает и огонь не угасает» (Мк 9:48).
