              tier: official
              excerpt: поскольку наши тела являются храмом Святого Духа, мы не должны пренебрегать заботой о них
              accessed: '2026-09-26'
        answer:
          points:
            - 'Здесь есть общее: тело — храм Святого Духа (1 Кор 6:19), а пьянство осуждено — «не упивайтесь вином, от которого бывает распутство» (Еф 5:18). Писание осуждает пьянство, а не вино как таковое (Пс 103:15; Ин 2:1–11).'
            - 'Различие — в разделении пищи на чистую и нечистую. Христос учит, что человека оскверняет не входящее в уста (Мф 15:11), и евангелист поясняет: «чем очищается всякая пища» (Мк 7:19); Петру сказано: «что Бог очистил, того ты не почитай нечистым» (Деян 10:15); см. также Рим 14:14; 1 Тим 4:3–5; Кол 2:16.'
            - Церковь при этом сохраняет часть апостольского запрета — на кровь и удавленину (Деян 15:29; Апостольское правило 63; Трулльское 67). Так что полного расхождения в пищевых предписаниях нет.
            - Церковные посты — подвиг воздержания (катехизис, §§539–543), а не деление пищи на чистую и нечистую; см. карточку «Пост».
