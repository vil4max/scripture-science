      - id: divine-names
        title: Имена Бога
        short: "Церковь называет Бога Отцом по вере во Христа, а ислам называет Его самыми прекрасными именами-свойствами и отрицает, что у Аллаха (Бога) может быть сын."
        topic: name-of-god
        church:
          text: 'Церковь называет Бога по Его свойствам — Господь, Вседержитель, Творец, всеблагой, всеведущий, всемогущий, — но учит, что имена Бога не говорят о Нём исчерпывающе. Христос открыл имя отношений: верующие называют Бога Отцом «по вере во Иисуса Христа и по благодати возрождения».'
          proof:
            - url: https://azbyka.ru/bozhestvennye-imena
              title: 'Азбука веры. Божие имя и божественные имена: понятие об именах, Исх. 3:14'
              tier: reference
              excerpt: имена Бога не говорят о Нем исчерпывающе
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: Свт. Филарет Московский. Пространный катехизис, §135
              tier: official
