        title: Иса и Иисус Христос
        short: "Церковь исповедует Иисуса Христа Сыном Божиим и Богом, воплотившимся от Девы Марии, а ислам чтит Ису (Иисуса) как Мессию и великого пророка, рождённого от Девы, но не как Бога и не как Сына Божия."
        topic: jesus
        church:
          text: Господь Иисус Христос — Сын Божий единородный, единосущный Отцу, ради нашего спасения воплотившийся от Духа Святого и Марии Девы. В Нём «не два, а одно лицо, Бог и человек вместе»; имя «Христос» означает «Помазанник», потому что Его человеческой природе безмерно сообщены все дары Святого Духа.
