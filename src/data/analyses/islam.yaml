      - id: salvation-faith-works
        title: 'Спасение: вера, дела и милость'
        short: "Церковь учит, что человека спасает Христос, освободивший от греха и смерти, при участии самого человека, а в исламе в Рай входят по вере и праведным делам с милостью Бога, без искупительной жертвы."
        topic: salvation
        church:
          text: 'Христос пришёл спасти людей от греха, проклятия и смерти; спасение — это «уподобление Богу и духовное единение с Ним» (обожение). Оно совершается как соработничество Бога и человека (синергия): одной веры без любви и добрых дел недостаточно, но и любовью и добрыми делами без веры спастись нельзя, ибо «благодатью вы спасены через веру» (Еф 2:8).'
          proof:
            - url: https://azbyka.ru/spasenie
              title: 'Азбука веры. Спасение: определение и условия спасения'
              tier: reference
              excerpt: уподобление Богу и духовное единение с Ним
              accessed: '2026-09-27'
            - url: https://azbyka.ru/sinergiya
              title: Азбука веры. Синергия
              tier: reference
              excerpt: соработничество Бога и человека в деле достижения спасения
              accessed: '2026-09-27'
