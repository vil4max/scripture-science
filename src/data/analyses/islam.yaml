      - id: predestination-freedom
        title: Предопределение и свобода
        short: "Церковь учит, что Бог ведёт мир, не отнимая у человека свободы, и хочет спасения всех; в исламе предопределение (кадар) — часть вероучения, а свободу человека мусульмане понимают по-разному."
