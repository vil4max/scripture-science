      - id: holy-days
        title: 'Праздники: Пасха и Ид'
        short: "Главный праздник Церкви — Пасха, память о Воскресении Христа, а главные праздники ислама — окончание поста Рамадан и день жертвы пророка Ибрахима (Авраама); у шиитов есть и особые дни."
        topic: holy-days
        church:
          text: Церковь празднует события спасительного домостроительства. Воскресный день празднуется со времени Воскресения Христова, а Пасха — «праздник праздников, предначинание вечного праздника». Важнейшие праздники установлены в память событий, связанных с Воплощением Сына Божия, а затем — в честь Богородицы, послужившей тайне воплощения.
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6
              title: 'Свт. Филарет. Пространный катехизис, §§535–536: воскресный день'
              tier: official
              excerpt: День воскресный празднуется со времени воскресения Христа.
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: В христианской Церкви празднуется через каждые шесть дней седьмой, только не последний из семи дней
              accessed: '2026-09-25'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: Праздник Воскресения Христова, Пасха, праздник праздников, предначинание вечного праздника, вечного блаженства
              accessed: '2026-09-26'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: Важнейшие праздники – это праздники, установленные в память о главных событиях, относящихся к спасительному для нас воплощению Сына Божия
              accessed: '2026-09-26'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: а затем установленные в честь Пресвятой Богородицы как послужившей тайне воплощения
              accessed: '2026-09-26'
        tradition:
          text: Два главных исламских праздника — Ид аль-Фитр (Ураза-байрам), завершающий пост Рамадана, и Ид аль-Адха (Курбан-байрам), связанный с событием с пророком Ибрахимом (Авраамом), которому Божественным Откровением было велено принести в жертву сына Исмаила. Шииты-имамиты, помимо общих праздников, особо чтут День Гадира, дни рождения имамов и справляют траур по имаму Хусейну в месяц Мухаррам.
          proof:
            - url: https://web.archive.org/web/20230530185010/https://mosmechet.ru/ramadan
              title: Рамадан и Ураза-байрам | Историческая мечеть г. Москвы
              tier: official
              excerpt: из двух главных исламских праздников - Ураза-байрам ( Ид аль-фитр), праздник разговения
              accessed: '2026-09-26'
            - url: https://mosmechet.ru/fetvakurban2026
              title: Фетва по Курбану 2026 | Историческая мечеть г. Москвы
              tier: official
              excerpt: связан с событием, произошедшим с пророком Ибрахимом (Авраамом). Божественным Откровением ему было велено принести в жертву своего сына Исмаила
              accessed: '2026-09-25'
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=37:102
              title: Коран 37:102, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: Я вижу во сне, что зарезаю тебя
              accessed: '2026-10-01'
            - url: https://ru.wikishia.net/view/%D0%98%D0%BC%D0%B0%D0%BC%D0%B8%D1%8F
              title: Имамия — Wikishia
              tier: official
              excerpt: Траур по невинно убиенным мученникам, особенно по Имаму Хусейну (а) и его сподвижникам в месяц Мухаррам, является одним из их других важных ритуалов имамитов
              accessed: '2026-10-01'
            - url: https://ru.wikishia.net/view/%D0%98%D0%BC%D0%B0%D0%BC%D0%B8%D1%8F
              title: Имамия — Wikishia
              tier: official
              excerpt: шииты — имамиты с особым почитанием празднуют также день рождения имама Али
              accessed: '2026-10-01'
        answer:
          points:
            - 'Праздники двух религий отмечают события их собственной истории: Церковь — Воплощение, Крест и Воскресение Христа, ислам — завершение Рамадана и жертву Ибрахима; одни не подменяют другие.'
            - 'Предание о жертве Ибрахима различается в источниках: Библия называет сына Исаака (Быт 22:2), Коран в аяте о жертве сына не называет (37:102), а в фетве московской мечети речь идёт об Исмаиле. Церковь опирается на библейский текст, а исламский рассказ следует приписывать исламскому источнику.'
            - 'Внутри ислама круг праздников различается: по изложению Wikishia, общие праздники всех мусульман — Ид аль-Фитр, Ид Курбан, Ид Мабаас и день рождения Пророка, а имамиты добавляют особые шиитские дни.'
            - 'Для Церкви главный праздник — Пасха, потому что Воскресение Христа — основание веры: «если Христос не воскрес, то вера ваша тщетна» (1 Кор 15:17).'
          proof:
            - url: https://azbyka.ru/biblia/?Gen.22:2&r
              title: Быт. 22:2 — Синодальный перевод
              tier: official
              excerpt: возьми сына твоего, единственного твоего, которого ты любишь, Исаака
              accessed: '2026-10-01'
            - url: https://ru.wikishia.net/view/%D0%98%D0%BC%D0%B0%D0%BC%D0%B8%D1%8F
              title: Имамия — Wikishia
              tier: official
              excerpt: Идаль Фитр, Ид Курбан, Ид Мабаас, и дню рождения Пророка (с), которые являются религиозными праздниками всех мусульман
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?1Cor.15:17&r
              title: 1 Кор. 15:17 — Синодальный перевод
              tier: official
              excerpt: А если Христос не воскрес, то вера ваша тщетна
              accessed: '2026-10-01'
