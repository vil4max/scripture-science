      - id: icons
        title: Иконы и изображения
        short: "Церковь почитает иконы — священные изображения Господа, Богородицы и святых, а в исламе единого мнения об изображениях живых существ нет: описан очень жёсткий запрет, но есть и иные взгляды."
        topic: images
        church:
          text: 'Церковь почитает священные изображения — иконы Господа, Богородицы и святых. Вторая заповедь запрещает идолов, а не священные изображения: Бог Сам повелел Моисею поставить в скинии золотых херувимов. «Честь, воздаваемая образу, переходит на Первообраз»: почитание относится не к дереву и краскам, а к тому, кто изображён.'
