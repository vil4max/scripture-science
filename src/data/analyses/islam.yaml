        answer:
          points:
            - 'Сходство велико и важно: Коран называет Христа Мессией, Словом и рождённым Девой Марьям (3:45–47), и Церковь также исповедует Рождество от Девы (Лк 1:34–35).'
            - 'Но «Слово» понимается по-разному: «В начале было Слово, и Слово было Бог» и «Слово стало плотию» (Ин 1:1, 14). Для Церкви Слово — Сам Бог, для Корана — слово, которое Аллах «послал Марьям» (4:171).'
            - 'Божество Христа Церковь исповедует по Писанию: воскресшему Фома говорит «Господь мой и Бог мой!» (Ин 20:28), а Христос говорит: «Я и Отец – одно» (Ин 10:30).'
            - 'Признания Христа великим пророком и учителем для христианского исповедания недостаточно: Сын Божий совершил наше спасение «Своим учением, Своей жизнью, Своей смертью и Своим воскресением» (§193).'
          proof:
