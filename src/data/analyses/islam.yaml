              accessed: '2026-10-01'
        tradition:
          text: 'В исламе Бог называется «самыми прекрасными именами» (Коран 7:180): это имена-свойства, и призывать Его можно и как Аллаха, и как Милостивого (17:110). В числе того, что Коран отрицает о Боге, — наличие у Него сына: Аллаху «не подобает иметь сына» (19:35).'
          proof:
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=7:180
              title: Коран 7:180, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: У Аллаха - самые прекрасные имена. Посему взывайте к Нему посредством их
              accessed: '2026-09-25'
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=17:110
              title: Коран 17:110, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: Призывайте Аллаха или призывайте Милостивого
              accessed: '2026-10-01'
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=19:35
              title: Коран 19:35, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: Не подобает Аллаху иметь сына
              accessed: '2026-10-01'
        answer:
          points:
            - 'Словарь двух традиций в чём-то пересекается: катехизис описывает Бога как всеблагого, всеведущего, всеправедного и всемогущего, а ислам называет Его «самыми прекрасными именами».'
            - 'Различие — в том, какое имя дано Откровением: Христос научил молиться «Отче наш, сущий на небесах» (Мф 6:9), а верующим «дал власть быть чадами Божиими» (Ин 1:12).'
            - Слово «Аллах» по-арабски означает «Бог»; энциклопедия «Азбука веры» при этом отмечает, что учение ислама принципиально отличается от христианского Откровения о Боге.
            - 'Поэтому вопрос не в слове, а в содержании веры: Божественное имя объясняется через исповедание Откровения, а не как отдельный словесный знак.'
          proof:
            - url: https://azbyka.ru/biblia/?Mt.6:9&r
              title: Мф. 6:9 — Синодальный перевод
              tier: official
              excerpt: Отче наш, сущий на небесах
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Jn.1:12&r
              title: Ин. 1:12 — Синодальный перевод
              tier: official
              excerpt: дал власть быть чадами Божиими
              accessed: '2026-10-01'
            - url: https://azbyka.ru/islam
              title: Ислам — православная энциклопедия «Азбука веры», раздел «Кратко об исламе»
              tier: official
              excerpt: Несмотря на то, что слово «Аллах» переводится с арабского как Бог, учение ислама принципиально отличается от Богооткровенного христианского учения
              accessed: '2026-10-01'
