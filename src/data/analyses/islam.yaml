      - id: organisation-clergy
        title: Устройство общины
        short: "В Церкви есть иерархия, ведущая начало от апостолов и передаваемая рукоположением, а в суннитском исламе нет рукоположенного духовенства — авторитет у учёных (улемов), у шиитов-имамитов община следует имаму."
