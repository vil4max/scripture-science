        tradition:
          text: 'В исламе вход в Рай понимается как следствие искренней веры (иман) вместе с праведными делами, по милости Бога: «те, которые уверовали и совершали праведные деяния, окажутся обитателями Рая» (Коран 2:82). Искупительной жертвы ислам не знает: по изложению сайта «Медина», миссия Исы состояла в том, чтобы указать людям верный путь, а не принести себя в жертву за грехи человечества, и «ни одна душа не понесет чужого бремени» (53:38). Коран говорит и о награде праведным иудеям и христианам (2:62), и о том, что иная религия помимо ислама «никогда не будет принята» (3:85).'
          proof:
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=2:82
              title: Коран 2:82, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: те, которые уверовали и совершали праведные деяния, окажутся обитателями Рая. Они пребудут там вечно
              accessed: '2026-09-25'
            - url: https://web.archive.org/web/20251214232323/https://medinaschool.org/library/creed/proroki/iisus-v-islame
              title: Иисус в исламе — medinaschool.org (архивная копия)
              tier: official
              excerpt: а не в том, чтобы принести себя в жертву, чтобы искупить грехи человечества
              accessed: '2026-10-01'
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=53:38
              title: Коран 53:38, перевод Э. Кулиева | Quran.com Content API
              tier: official
