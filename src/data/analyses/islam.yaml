        answer:
          points:
            - 'Внешние формы частично пересекаются — молитва и пост есть и в христианской жизни (см. карточки о молитве и посте), — но вероучительное основание различно: столпы ислама — обязанности верующего, а не Таинства, установленные Христом.'
            - 'Энциклопедия «Азбука веры» замечает, что шахаду иногда сравнивают с Таинством Крещения, но такое сравнение очень условно: в Церкви Крещение — рождение «от воды и Духа» (Ин 3:5), а не произнесение формулы.'
            - 'Главное действие христианского богослужения — общение с Христом в Евхаристии: «если не будете есть Плоти Сына Человеческого и пить Крови Его, то не будете иметь в себе жизни» (Ин 6:53).'
            - Различия между суннитским и шиитским перечнями (хумс, имамат, справедливость) — внутренние различия ислама; общим для обеих сторон остаётся то, что это обязанности, а не Таинства.
