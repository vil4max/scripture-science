      - id: fall-and-atonement
        title: Грехопадение и искупление
        short: "Церковь учит, что грех Адама принёс смерть всему роду людей и потому нужен Спаситель Христос, а ислам говорит о личной ответственности каждого и искупительной жертвы не знает."
        topic: salvation
        church:
          text: 'Грех вошёл в людей от диавола, когда Адам и Ева нарушили заповедь; от греха Адама произошли проклятие и смерть, и все умирают, «потому что происходят от заражённого грехом Адама, и сами грешат». Поэтому людям нужен Спаситель: Христос, в Котором Божество соединилось с человечеством, благодатно стал новым главой людей.'
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет Московский. Пространный катехизис, §§155–156: откуда и когда вошёл грех'
              tier: official
              excerpt: Грех перешёл от диавола к людям, когда диавол прельстил Еву и Адама
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет Московский. Пространный катехизис, §162: что произошло от греха Адама'
              tier: official
              excerpt: От греха Адама произошли проклятие и смерть
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет Московский. Пространный катехизис, §166: почему люди умирают'
              tier: official
              excerpt: потому что происходят от заражённого грехом Адама, и сами грешат
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Rom.5:12&r
              title: Рим. 5:12 — Синодальный перевод
              tier: official
              excerpt: как одним человеком грех вошел в мир, и грехом смерть
              accessed: '2026-10-01'
        tradition:
          text: 'Коран рассказывает, что Адам ослушался Господа (20:121), но Господь принял его покаяние (2:37; 20:122) и наставил на прямой путь. Ответственность в исламе личная: «ни одна душа не понесет чужого бремени» (17:15). По изложению сайта «Медина», совершает грехи «каждый сын Адама», но человеку дана возможность каяться.'
          proof:
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=20:121
              title: Коран 20:121, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: Адам ослушался своего Господа и впал в заблуждение
              accessed: '2026-10-01'
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=2:37
              title: Коран 2:37, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: Адам принял слова от своего Господа, и Он принял его покаяние
              accessed: '2026-10-01'
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=20:122
              title: Коран 20:122, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: принял его покаяние и наставил на прямой путь
              accessed: '2026-10-01'
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=17:15
              title: Коран 17:15, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: Ни одна душа не понесет чужого бремени
              accessed: '2026-10-01'
            - url: https://web.archive.org/web/20251020074922/https://medinaschool.org/library/creed/vera/kak-popast-v-raj
              title: Как попасть в рай — medinaschool.org (архивная копия)
              tier: official
              excerpt: человеку дана возможность совершать добрые дела, каяться
              accessed: '2026-10-01'
        answer:
          points:
            - 'Сходство: в обоих рассказах первый человек нарушает заповедь, кается и получает милость; по Церкви, Бог дал первым людям надежду на спасение, обещав, что семя жены «будет поражать» диавола «в голову» (Быт 3:15; §169).'
            - 'Различие в последствиях: Церковь учит, что смерть и повреждение стали общими для рода человеческого — «как одним человеком грех вошел в мир, и грехом смерть, так и смерть перешла во всех человеков» (Рим 5:12; §166).'
            - 'Поэтому для Церкви Христос — новый глава людей: «как непослушанием одного человека сделались многие грешными, так и послушанием одного сделаются праведными многие» (Рим 5:19; §206).'
            - Ислам, напротив, исходит из личной ответственности каждого (17:15) и потому не знает искупительной жертвы; различие в понимании греха определяет различие в понимании Креста.
          proof:
            - url: https://azbyka.ru/biblia/?Gen.3:15&r
              title: Быт. 3:15 — Синодальный перевод
              tier: official
              excerpt: оно будет поражать тебя в голову
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет Московский. Пространный катехизис, §169: надежда на спасение'
              tier: official
              excerpt: Когда первые люди исповедали перед Богом свой грех, то Бог по милосердию Своему дал им надежду на спасение
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Rom.5:19&r
              title: Рим. 5:19 — Синодальный перевод
              tier: official
              excerpt: так и послушанием одного сделаются праведными многие
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет Московский. Пространный катехизис, §206: как Крест избавляет от греха и смерти'
              tier: official
              excerpt: благодатно сделался новым всемогущим главой людей
              accessed: '2026-10-01'
