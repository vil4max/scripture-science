        answer:
          points:
            - 'Единство Бога — общая основа: апостол Павел тоже исповедует, что «нет иного Бога, кроме Единого» (1 Кор 8:4), и Церковь не учит о трёх богах — три Лица имеют равное Божественное достоинство.'
            - 'Троичность открыта в Писании: Господь заповедал крестить «во имя Отца и Сына и Святого Духа» (Мф 28:19) — во имя, а не во имена, — а апостол соединяет благодать Христа, любовь Бога Отца и общение Святого Духа (2 Кор 13:13).'
            - 'Рождение Сына от Отца Церковь понимает вне времени: Он «рождён прежде всех век», «рождён, не сотворён». Различие остаётся полным: ислам отвергает любое Божественное сыновство, Церковь исповедует Сына единосущного Отцу.'
            - 'Коран упоминает и иное представление — будто людей побуждали принять Ису и его мать «двумя богами наряду с Аллахом» (5:116). Православие так не учит: Пресвятая Дева — сотворённое существо, которое Церковь чтит выше Херувимов и Серафимов, но не как Бога.'
          proof:
            - url: https://azbyka.ru/biblia/?1Cor.8:4&r
              title: 1 Кор. 8:4 — Синодальный перевод
              tier: official
              excerpt: нет иного Бога, кроме Единого
              accessed: '2026-10-01'
