            - 'Различие: для христианина пищевые предписания — не закон спасения: «всякое творение Божие хорошо» (1 Тим 4:4); пост — добровольное воздержание ради молитвы и покаяния, а не постоянный запрет на свинину или вино.'
            - 'Пьянство Церковь осуждает: «не упивайтесь вином, от которого бывает распутство» (Еф 5:18) — но исламские пищевые и правовые предписания относятся к собственной религиозной системе и не переносятся в христианскую нравственность по сходству отдельных запретов.'
