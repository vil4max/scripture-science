        answer:
          points:
            - 'Сходство: Церковь тоже исповедует Вознесение Христа и Его будущее возвращение — «Сей Иисус, вознесшийся от вас на небо, придет таким же образом» (Деян 1:11); Коран говорит, что Аллах вознёс Ису к Себе (4:158).'
            - 'Крест для Церкви — историческое и спасительное событие: Евангелие свидетельствует, что Иисус «предал дух» (Ин 19:30), а апостол передаёт, что «Христос умер за грехи наши, по Писанию» (1 Кор 15:3).'
            - Символ веры называет имя правителя, чтобы обозначить историческую дату распятия (§198), а упоминание погребения укрепляет веру, что Христос действительно умер и воскрес (§202).
            - 'Без Креста и Воскресения нет христианской веры: «если Христос не воскрес, то вера ваша тщетна» (1 Кор 15:17). Это одно из главных расхождений с исламом; сгладить его нельзя, а сравнивать честнее с учётом того, что мусульманские толкователи сами расходятся в объяснении аята.'
          proof:
            - url: https://azbyka.ru/biblia/?Act.1:11&r
              title: Деян. 1:11 — Синодальный перевод
              tier: official
              excerpt: Сей Иисус, вознесшийся от вас на небо, придет таким же образом
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Jn.19:30&r
              title: Ин. 19:30 — Синодальный перевод
              tier: official
              excerpt: И, преклонив главу, предал дух
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?1Cor.15:3&r
              title: 1 Кор. 15:3 — Синодальный перевод
              tier: official
              excerpt: Христос умер за грехи наши, по Писанию
              accessed: '2026-10-01'
