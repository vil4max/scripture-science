        answer:
          points:
            - 'Сходство: и Церковь, и ислам ждут возвращения Иисуса до Суда — «Сей Иисус… придет таким же образом, как вы видели Его восходящим на небо» (Деян 1:11).'
            - 'Различие в роли: Христос возвращается Судией и Царём «во славе Своей» (Мф 25:31), и «Царству Его не будет конца» (Лк 1:33); воскресший Христос «уже не умирает» (Рим 6:9), тогда как в исламских изложениях Иса после своей миссии умрёт.'
            - 'О часе обе традиции говорят сходно: по Евангелию, его знает только Отец (Мф 24:36), по Корану, «знание об этом принадлежит только моему Господу» (7:187).'
            - Шиитское (имамитское) учение отождествляет Махди с двенадцатым имамом, скрытым и живым; в изложении «Медины» Махди — потомок Мухаммада, который появится перед концом света. Церковь ожидает не имама, а Пришествия Христа.
          proof:
