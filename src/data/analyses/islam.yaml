              title: Аниконизм — Википедия (русская), раздел «Аниконизм в исламе»
              tier: reference
              excerpt: Создание изображений считается делом идолопоклонников и противоречит основе исламского учения о чистом единобожии
              accessed: '2026-10-01'
        answer:
          points:
            - 'Общая забота — защитить единобожие от идолопоклонства: вторая заповедь запрещает «кумира» и поклонение ему (Исх 20:4; §§512–513), и Церковь не учит поклоняться изображению как богу.'
            - 'Церковь различает почитание и боготворение: иконы нельзя боготворить, но можно почитать как священные изображения и использовать для благоговейного воспоминания дел Божиих и святых (§517).'
            - 'Основание иконопочитания — Боговоплощение: Бог стал человеком, и «Слово стало плотию… и мы видели славу Его» (Ин 1:14); энциклопедия «Азбука веры» поясняет, что именно Боговоплощение открыло возможность иконопочитания.'
            - Среди мусульманских авторитетов нет одного мнения (описан жёсткий запрет, но и вопрос о смысле запрета), поэтому нельзя говорить о едином отношении «всех мусульман» к изображениям.
          proof:
            - url: https://azbyka.ru/biblia/?Ex.20:4&r
              title: Исх. 20:4 — Синодальный перевод
              tier: official
              excerpt: Не делай себе кумира и никакого изображения
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6
              title: 'Свт. Филарет Московский. Пространный катехизис, §517: противоречит ли икона второй заповеди'
              tier: official
              excerpt: Употребление святых икон противоречило бы второй заповеди в том случае, если бы их боготворили
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Jn.1:14&r
              title: Ин. 1:14 — Синодальный перевод
              tier: official
              excerpt: И Слово стало плотию
              accessed: '2026-10-01'
            - url: https://azbyka.ru/ikonopochitanie
              title: 'Азбука веры. Иконопочитание: основной тезис'
              tier: official
              excerpt: когда Боговоплощение открыло возможность иконопочитания
              accessed: '2026-10-01'
