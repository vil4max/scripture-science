# Curated analysis of islam (docs/tasks/site-m33-jw-analysis.md); Orthodox sources from Azbyka,
# the tradition's teaching from its own documents. Validated for full evidence coverage.
# Detailed analysis: Orthodoxy and Islam (Sunni and Twelver Shia views marked where sources differ).
# Quran quotations: Kuliev translation via quran.com (a "translation of meanings"); cite sura:ayah.
# Source rules: docs/SOURCES.md; card order follows the reading order of the analysis; `topic` links a card from the comparison.
tradition: islam
lead: 'Все расхождения православного учения и ислама — по тезисам: учение Церкви, учение ислама (с пометками, где суннитские и шиитские источники расходятся), православный ответ.'
authorityNote: Отдельного соборного или синодального документа Русской Православной Церкви об исламе в разделе «Документы» Азбуки веры не найдено. «Основные принципы отношения Русской Православной Церкви к инославию» (2000) посвящены инославным христианам и об исламе не говорят; «Основы социальной концепции» (2000) упоминают последователей Магомета лишь в рассказе о св. Кирилле (VIII.2) и нехристиан — в связи с браком (X.2). Поэтому православная позиция изложена по Писанию, Символу веры и катехизису св. Филарета; статьи энциклопедии «Азбука веры» и оценки отдельных авторов подписаны как их мнения. Учение ислама приводится по Корану (перевод смыслов Э. Кулиева, quran.com) и по мусульманским источникам; суннитские и шиитские (имамитские) различия отмечены там, где источники их называют.
keyPoints:
  - text: "Церковь и ислам верят в одного Бога, но ислам отвергает Троицу и божественное сыновство, а Церковь исповедует единого Бога в трёх Лицах — Отце, Сыне и Святом Духе."
    card: tawhid-trinity
  - text: "Ислам чтит Ису (Иисуса) как Мессию и великого пророка, рождённого от Девы, но не как Бога и Сына Божия, а Церковь исповедует Иисуса Христа Богом и Сыном Божиим."
    card: isa-prophet
  - text: "Церковь исповедует, что Христос действительно умер на Кресте и воскрес, а в исламе его смерть на кресте отрицается; это одно из главных расхождений."
    card: crucifixion
  - text: "Церковь верит, что Откровение достигло полноты во Христе, а ислам считает последним откровением Коран и при этом признаёт ниспосланными Богом Тору, Псалтирь и Евангелие."
    card: final-revelation
  - text: "Церковь не ждёт после Христа нового пророка, а ислам считает Мухаммада последним пророком и всякого, кто объявит себя пророком после него, ложным."
    card: muhammad-seal
  - text: "Церковь учит, что спасение совершил Христос, освободив от греха и смерти, а в исламе в Рай входят по вере и праведным делам с милостью Бога, без искупительной жертвы."
    card: salvation-faith-works
  - text: "Церковь и ислам сходятся в вере в воскресение тел, Суд и воздаяние, но в Церкви Судья — Христос, а главное блаженство — соединение с Богом."
    card: afterlife
  - text: "Основа исламской жизни — пять столпов, обязанности верующего, среди них молитва, пост и паломничество в Мекку; в Церкви же средоточие — Таинства, прежде всего Евхаристия."
    card: five-pillars
  - text: "Сунниты, кроме Корана, опираются на сунну Мухаммада и решения учёных, а шииты-имамиты — на имама, назначаемого Богом; Церковь опирается на Священное Предание, восходящее к апостолам."
    card: sunna-imamate
