        answer:
          points:
            - 'Сходство: обе религии учат, что Бог говорил через пророков и дал людям Писание; Коран называет Тору и Евангелие «верным руководством и светом» (5:44; 5:46).'
            - 'Церковь верит, что Откровение достигло полноты во Христе: Бог, говоривший издревле «в пророках», «в последние дни сии говорил нам в Сыне» (Евр 1:1–2). Откровения после Христа, которое дополняло бы Евангелие, Церковь не принимает.'
            - 'Энциклопедия «Азбука веры» формулирует итог так: Коран не признаётся христианами Словом Божьим и не обладает для них авторитетом.'
            - 'Слово, называющее себя откровением, Церковь проверяет признаками, названными в катехизисе: высотой и чистотой учения, исполнившимися пророчествами и чудесами (§§57–60).'
