      - id: muhammad-seal
        title: Мухаммад — «печать пророков»
        short: "Церковь видит во Христе полноту Откровения и не ждёт после Него нового пророка, а ислам считает Мухаммада последним пророком (печатью пророков) и всякого пророка после него ложным."
        topic: authority
        church:
          text: 'Церковь исповедует Иисуса Христа Сыном Божиим и полнотой Откровения: «Закон и пророки до Иоанна; с сего времени Царствие Божие благовествуется» (Лк 16:16), а в последние дни Бог «говорил нам в Сыне» (Евр 1:1–2). Поэтому за Христом Церковь не ждёт нового пророка, который изменял бы или дополнял Евангелие.'
