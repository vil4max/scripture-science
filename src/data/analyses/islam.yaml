      - id: ramadan-and-lent
        title: Рамадан и православные посты
        short: "Церковь постится сорок дней Великого поста и в другие дни, воздерживаясь от мяса, молока и яиц, а мусульмане весь месяц Рамадан от рассвета до заката не едят, не пьют и воздерживаются от близости."
        topic: fasting
        church:
          text: 'Важнейший пост Церкви — Великий пост, или святая Четыредесятница: он продолжается сорок дней, потому что сорок дней постился Сам Господь. Поститься положено также в среду и пятницу — в память предания Господа на страдание и Его страданий и смерти, — и в Рождественский, Успенский и апостольский посты. Скоромная пища (мясо, молоко, яйца) исключается, рыба допускается в менее строгих формах; пост соединяется с молитвой и покаянием и традиционно предваряет Причастие.'
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов), §539
              tier: official
              excerpt: Важнейшим постом является Великий пост, или святая Четыредесятница
