      - id: food-rules
        title: Пищевые предписания и закон
        short: "Запрет крови и мертвечины есть и в Церкви, и в исламе, но христианину пищевые правила не нужны для спасения, а ислам прямо запрещает и свинину, и опьяняющие напитки."
        topic: rules
        church:
          text: 'В церковном праве сохраняется заповедь о воздержании от крови и удавленины: апостолы постановили «воздерживаться от идоложертвенного и крови, и удавленины, и блуда» (Деян 15:29), а 63-е Апостольское правило и 67-е правило Трулльского Собора запрещают употребление крови, удавленины и мертвечины. Но мерило христианской нравственности — заповеди Христовы: «не то, что входит в уста, оскверняет человека» (Мф 15:11).'
          proof:
            - url: https://azbyka.ru/pravo/shestoj-vselenskij-sobor-67/
              title: Правило 67 Трулльского Собора (691) — «Церковное право», «Азбука веры»
              tier: official
              excerpt: Божественное Писание заповедало нам воздерживаться от крови, удавленины и блуда
              accessed: '2026-09-26'
            - url: https://azbyka.ru/pravo/63-apostolskoe-pravilo/
              title: Правило 63 святых Апостолов — «Церковное право», «Азбука веры»
              tier: official
              excerpt: съест мясо с кровью души его, или звероядину, или мертвечину, да будет извержен, ибо это запретил закон
              accessed: '2026-09-26'
            - url: https://azbyka.ru/biblia/?Act.15:29&r
              title: Деян. 15:29 — Синодальный перевод
              tier: official
              excerpt: воздерживаться от идоложертвенного и крови, и удавленины, и блуда
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Mt.15:11&r
              title: Мф. 15:11 — Синодальный перевод
              tier: official
              excerpt: не то́, что́ входит в уста, оскверняет человека
              accessed: '2026-10-01'
        tradition:
          text: Коран запрещает мертвечину, кровь, мясо свиньи и то, над чем не было произнесено имя Аллаха (5:3); опьяняющие напитки и азартные игры названы «скверной из деяний дьявола» (5:90). Еда людей Писания, по Корану, дозволена мусульманам (5:5).
          proof:
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=5:3
              title: Коран 5:3, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: Вам запрещены мертвечина, кровь, мясо свиньи и то, над чем не было произнесено имя Аллаха
