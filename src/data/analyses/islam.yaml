      - id: tahrif
        title: Прежние Писания и вопрос об «искажении»
        short: "Церковь учит, что Писание хранится и читается в Церкви по её Преданию, а Коран упрекает читавших прежние Писания в искажении слов; мусульманские богословы спорят, искажён текст или только толкование."
        topic: scripture
        church:
          text: 'Церковь учит, что Священное Писание написано Святым Духом через пророков и апостолов и хранится в Церкви — «столпе и утверждении истины» (1 Тим 3:15). Писание читается в Церкви по её Преданию: «никакого пророчества в Писании нельзя разрешить самому собою» (2 Пет 1:20).'
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/1_3
              title: 'Свт. Филарет Московский. Пространный катехизис, §19: Священное Писание'
              tier: official
              excerpt: Священным Писанием называются книги, написанные Святым Духом через освящённых от Бога людей, называемых пророками и апостолами
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?1Tim.3:15&r
              title: 1 Тим. 3:15 — Синодальный перевод
              tier: official
              excerpt: Церковь Бога живаго, столп и утверждение истины
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?2Pet.1:20&r
              title: 2 Пет. 1:20 — Синодальный перевод
              tier: official
              excerpt: никакого пророчества в Писании нельзя разрешить самому собою
              accessed: '2026-10-01'
        tradition:
          text: 'Коран упрекает людей Писания: они «искажают слова, меняя их местами» (5:13), «пишут Писание собственными руками» (2:79). Что отсюда следует, — предмет мусульманского богословия: проф. Т. Ибрагим в статье, размещённой на сайте ДУМ РФ, доказывает, что речь идёт об искажении толкования, а не текста, и приводит слова Ибн Аббаса, переданные аль-Бухари: изменить текст Писаний Божьих никто не в силах. Это мнение автора, а не единый мусульманский вердикт.'
          proof:
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=5:13
              title: Коран 5:13, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: Они искажают слова, меняя их местами
              accessed: '2026-10-01'
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=2:79
              title: Коран 2:79, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: Горе тем, которые пишут Писание собственными руками
              accessed: '2026-10-01'
            - url: https://web.archive.org/web/20250728015830/https://dumrf.ru/islam/dialog/1753
              title: Т. Ибрагим. О каком искажении Библии говорил Пророк? — dumrf.ru (архивная копия; мнение автора)
              tier: official
              excerpt: не об искажении текста, а об извращении его толкования
              accessed: '2026-10-01'
            - url: https://web.archive.org/web/20250728015830/https://dumrf.ru/islam/dialog/1753
              title: Т. Ибрагим. О каком искажении Библии говорил Пророк? — dumrf.ru (архивная копия; мнение автора)
              tier: official
              excerpt: Ни один смертный не в силах изменить текст чего-либо из Писаний Божьих
              accessed: '2026-10-01'
        answer:
          points:
            - 'Мусульманские авторы расходятся: по описанию энциклопедии «Азбука веры», ранние исламские писатели видели искажение в ложном понимании, а более поздние выдвинули идею искажения самого текста, и обе позиции сохранились.'
            - 'Коран сам отсылает к Писанию, которое читали ещё до Мухаммада, как к свидетельству: «спроси тех, кто начал читать Писание раньше тебя» (10:94).'
            - 'Церковь не скрывает рукописной истории Писания: энциклопедия «Азбука веры» замечает, что христиане признают — оригинал библейского текста не дошёл до нас. Критерий церковной веры — Писание, читаемое в Церкви по апостольскому Преданию (1 Тим 3:15; 2 Пет 1:20).'
            - 'Различие учений о Христе — Божество, Крест, Воскресение — Церковь не объясняет порчей текста: оно коренится в самом Откровении, которое хранит Церковь.'
          proof:
            - url: https://azbyka.ru/islam
              title: Ислам — православная энциклопедия «Азбука веры», раздел «Кратко об исламе»
              tier: official
              excerpt: Но более поздние авторы выдвинули идею искажения самого текста. Причем обе эти позиции сохранились
              accessed: '2026-10-01'
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=10:94
              title: Коран 10:94, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: спроси тех, кто начал читать Писание раньше тебя
              accessed: '2026-10-01'
            - url: https://azbyka.ru/islam
              title: Ислам — православная энциклопедия «Азбука веры», раздел «О проблемах, связанных с Кораном»
              tier: official
              excerpt: христиане признают, что оригинал библейского текста не дошел до нас
