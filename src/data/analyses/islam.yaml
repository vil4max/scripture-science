        tradition:
          text: 'В суннитском исламе нет рукоположенного духовенства и единой иерархии: религиозный авторитет коллективно принадлежит улемам в рамках четырёх правовых школ (мазхабов); исследователи оценивают ханафитский мазхаб как наиболее гибкий и либеральный. В шиитском (имамитском) исламе руководство общиной возлагается на имама, назначаемого Богом, а в его отсутствие верующие следуют признанным богословам.'
          proof:
            - url: https://cyberleninka.ru/article/n/mazhaby-v-islame
              title: Мазхабы в исламе | КиберЛенинка
              tier: reference
              excerpt: Ханафитский (ханифитский) мазхаб оценивается исследователями как наиболее гибкий и либеральный
              accessed: '2026-09-25'
            - url: https://cyberleninka.ru/article/n/mazhaby-v-islame
              title: Мазхабы в исламе | КиберЛенинка
              tier: reference
              excerpt: маликитский, ханифитский, шафиитский и ханба-литский.
              accessed: '2026-09-26'
            - url: https://ru.wikishia.net/view/%D0%98%D0%BC%D0%B0%D0%BC%D0%B8%D1%8F
              title: Имамия | Wikishia
              tier: official
              excerpt: руководство мусульманской общиной возлагается на имама, а имам назначается Богом
              accessed: '2026-09-25'
        answer:
          points:
            - Улемы и имамы не являются носителями апостольского священства, и суннитская и шиитская модели различаются между собой; у Церкви источник служения — преемство от апостолов через рукоположение (Еф 4:11–12).
            - Православная иерархия служит единству веры и Таинств в Церкви Христовой, поэтому нельзя сравнивать только управленческие должности, опуская источник служения.
            - 'Нельзя приписывать мусульманским общинам церковное устройство: у суннитов нет единой иерархии, у шиитов-имамитов центральное место занимает имам.'
            - 'Документ Архиерейского Собора 2000 г. посвящён отношению к инославным христианам и к исламу напрямую не обращается; но его принцип (п. 7.1) годится для разговора с любыми людьми: отвергая ошибочные с православной точки зрения взгляды, православные призваны относиться к людям «с христианской любовью».'
          proof:
