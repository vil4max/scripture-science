        tradition:
          text: 'Для мусульман Коран — заключительное откровение, ниспосланное Мухаммаду; вместе с тем ислам признаёт прежние Писания как ниспосланные Богом: Таурат (Тору), данный Мусе, Забур (Псалтирь), данный Дауду, и Инджиль (Евангелие), данный Исе (5:44; 17:55; 5:46). Мусульманские источники называют любой перевод Корана лишь «переводом смыслов»: как откровение Коран существует на арабском языке. Цитаты Корана на этой странице даны в переводе смыслов Э. Кулиева.'
          proof:
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=5:44
