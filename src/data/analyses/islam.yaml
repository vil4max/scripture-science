              accessed: '2026-10-01'
        tradition:
          text: 'Ислам поощряет умеренность: «Не запрещайте блага, которые Аллах сделал дозволенными для вас» (5:87); аскеза (зухд) понимается как простая и благочестивая жизнь, а крайний аскетизм не поощряется. Суфизм иногда сравнивают с монашеством, но большинство суфийских орденов не призывает к безбрачию. О монашестве последователей Исы Коран говорит: «они выдумали сами. Мы не предписывали им этого» (57:27); переводчик приводит и второе прочтение этого места.'
          proof:
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=5:87
              title: Коран 5:87, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: Не запрещайте блага, которые Аллах сделал дозволенными для вас, и не преступайте границы дозволенного
              accessed: '2026-09-26'
            - url: http://web.archive.org/web/20260815120834/https://www.britannica.com/topic/zuhd
              title: Zuhd | Encyclopaedia Britannica (архивная копия)
              tier: reference
              excerpt: 'zuhd, (Arabic: “detachment”), in Islam, asceticism'
              accessed: '2026-09-26'
            - url: http://web.archive.org/web/20260815120834/https://www.britannica.com/topic/zuhd
              title: Zuhd | Encyclopaedia Britannica (архивная копия)
              tier: reference
              excerpt: Islam nevertheless encourages and praises those who shun luxury in favour of a simple and pious life
              accessed: '2026-09-26'
            - url: https://ru.wikipedia.org/wiki/%D0%97%D1%83%D1%85%D0%B4
              title: Зухд — Википедия
              tier: reference
              excerpt: Ислам запрещает крайний аскетизм и призывает к умеренности в нём
              accessed: '2026-09-26'
            - url: https://ru.wikipedia.org/wiki/%D0%9C%D0%BE%D0%BD%D0%B0%D1%88%D0%B5%D1%81%D1%82%D0%B2%D0%BE
              title: Монашество — Википедия
              tier: reference
              excerpt: В исламе с монашеством часто сравнивают последователей суфизма
              accessed: '2026-09-26'
            - url: https://ru.wikipedia.org/wiki/%D0%9C%D0%BE%D0%BD%D0%B0%D1%88%D0%B5%D1%81%D1%82%D0%B2%D0%BE
              title: Монашество — Википедия
              tier: reference
              excerpt: большинство суфийских орденов не призывают к безбрачию, а их последователи имеют семьи и детей
              accessed: '2026-09-26'
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=57:27
              title: Коран 57:27, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: а монашество они выдумали сами. Мы не предписывали им этого
              accessed: '2026-10-01'
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=57:27
              title: Коран 57:27, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: (или Мы предписали им только стремиться к довольству Аллаха)
              accessed: '2026-10-01'
        answer:
          points:
            - 'Сходство: обе традиции знают добровольное воздержание и простую жизнь как путь благочестия; ислам, по Британской энциклопедии, одобряет тех, кто сторонится роскоши ради простой и благочестивой жизни.'
            - 'Различие: в Церкви монашество — признанное и благословляемое призвание к «совершенству» (Мф 19:21), а Коран говорит о нём как о том, что последователи Исы «выдумали сами» (57:27), хотя переводчик отмечает и иное прочтение: Бог предписал им стремиться к Его довольству.'
            - Ислам не отвергает аскезу целиком — есть зухд и суфийская традиция; но суфийские практики не представляют весь ислам, а крайний аскетизм, по Википедии, исламом не поощряется.
            - 'Церковь не считает монашество обязательным: путь большинства — брак, который она называет Таинством (§358); монашеские обеты принимаются добровольно.'
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет Московский. Пространный катехизис, §358: что такое брак'
              tier: official
              excerpt: Брак есть Таинство
              accessed: '2026-10-01'
