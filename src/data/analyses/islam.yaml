          text: 'Молитва — «возношение ума и сердца к Богу»; она бывает внутренней и внешней, и одной внешней молитвы недостаточно, а внутренняя не отменяет внешней: Господь Иисус Христос выражал молитву и словами, и движениями тела. Образец всех молитв — молитва Господня «Отче наш»: Бога называют Отцом «по вере во Иисуса Христа и по благодати возрождения».'
