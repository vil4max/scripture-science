        tradition:
          text: 'Исламское вероучение держится таухида — абсолютного единобожия: Аллах «не родил и не был рожден, и нет никого равного Ему» (Коран 112:3–4). Коран прямо обращается к людям Писания: «не говорите: „Троица!“» (4:171), называет неверием слова «Аллах является третьим в троице» (5:73) и говорит, что Аллаху «не подобает иметь сына» (19:35).'
