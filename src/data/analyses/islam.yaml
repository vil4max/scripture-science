        tradition:
          text: В исламе Мухаммад — «Посланник Аллаха и печать пророков (или последний из пророков)» (Коран 33:40). Мусульманские богословы читают этот аят как указание, что он последний в пророческой цепи; по исламскому мировоззрению, всякий, кто после него претендует на роль пророка, считается ложным (ДУМ РФ).
          proof:
