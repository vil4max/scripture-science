        tradition:
          text: 'В исламе Иса (Иисус) — один из великих пророков и Мессия (аль-Масих), рождённый Девой Марьям по слову Бога. Коран называет его «посланником Аллаха, Его Словом… и духом от Него» (4:171), но не Богом и не Сыном Божиим: не уверовали «те, которые говорят: „Аллах — это Мессия, сын Марьям“» (5:72). Сам Иса, по Корану, говорит: «Поклоняйтесь Аллаху, моему Господу и вашему Господу» (5:117); его рождение без отца подобно сотворению Адама (3:59).'
