        title: Единство Бога и Троица
        short: "Церковь и ислам верят в одного Бога, но Церковь исповедует Его единым в трёх Лицах — Отце, Сыне и Святом Духе (Троица), а ислам отвергает Троицу и любое божественное сыновство."
        topic: god
        church:
          text: 'Православная Церковь исповедует одного Бога: Он един по существу и троичен в Лицах — Отец, Сын и Святой Дух, Троица единосущная и нераздельная. Это не три бога: Лица имеют одно Божество и равное достоинство и различаются лишь тем, что Отец не рождается и не исходит, Сын предвечно рождается от Отца, а Святой Дух предвечно исходит от Отца.'
