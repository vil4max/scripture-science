              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: Священное Предание нужно и в наши дни для руководства к правильному пониманию Священного Писания
              accessed: '2026-09-25'
