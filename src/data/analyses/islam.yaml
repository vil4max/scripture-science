        tradition:
          text: 'Сунниты, помимо Корана, опираются на сунну Пророка, а правовые вопросы решают учёные (улемы) в рамках одной из четырёх школ — ханафитской, маликитской, шафиитской или ханбалитской. Шииты-имамиты учат, что руководство общиной после Пророка принадлежит имаму, назначаемому Богом; источниками права они называют Коран, предание Пророка в передаче двенадцати имамов, разум и консенсус учёных. Коран говорит: «Повинуйтесь Аллаху, повинуйтесь Посланнику и обладающим влиянием среди вас» (4:59).'
          proof:
            - url: https://cyberleninka.ru/article/n/mazhaby-v-islame
              title: Мазхабы в исламе | КиберЛенинка
              tier: reference
              excerpt: последователей Джафара Ас-Садика (иногда Джафар ас-Садик - «Джафар правдивый»)
              accessed: '2026-09-25'
            - url: https://ru.wikishia.net/view/%D0%98%D0%BC%D0%B0%D0%BC%D0%B8%D1%8F
              title: Имамия | Wikishia
              tier: official
              excerpt: руководство мусульманской общиной возлагается на имама, а имам назначается Богом
              accessed: '2026-09-25'
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=4:59
              title: Коран 4:59, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: Повинуйтесь Аллаху, повинуйтесь Посланнику и обладающим влиянием среди вас
              accessed: '2026-09-25'
            - url: https://ru.wikishia.net/view/%D0%98%D0%BC%D0%B0%D0%BC%D0%B8%D1%8F
              title: Имамия — Wikishia
              tier: official
              excerpt: они обращаются к четырем источникам — Корану, устной традиции Пророка Ислама (с) в передаче двенадцати имамов (а), разуму — акль и консенсусу ученых — иджма
              accessed: '2026-10-01'
        answer:
          points:
            - 'Сходство методов: обе стороны передают веру не только текстом, но и преданием; апостол и Церковь тоже призывают: «держите предания, которым вы научены» (2 Фес 2:15).'
            - 'Различие источников: Предание Церкви восходит к апостольскому свидетельству о Христе; сунна и хадисы восходят к Мухаммаду, а шиитские предания — ещё и к имамам; Церковь не считает их вариантами Священного Предания.'
            - 'Различие внутри ислама — кто руководит общиной: сунниты — коллективный авторитет улемов в рамках мазхабов, шииты-имамиты — назначенный Богом имам, а в его отсутствие — богословы. Церковь не участвует в этом споре, а сравнивает способы передачи веры.'
            - 'В Церкви учительную власть несёт не улема и не имам, а Церковь в целом: Вселенские Соборы и преемство апостольского служения (§§274–276).'
          proof:
