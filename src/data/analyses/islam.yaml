      - id: crucifixion
        title: Крест Христов и аят 4:157
        short: "Церковь исповедует, что Христос действительно умер на Кресте и воскрес, а в исламе Иса (Иисус) вознесён Аллахом (Богом) к Себе и его смерть на кресте отрицается, хотя толкователи объясняют это по-разному."
        topic: jesus
        church:
          text: 'Символ веры исповедует Христа «распятаго же за ны при Понтийстем Пилате, и страдавша и погребенна»: Он действительно умер на Кресте, а распятие было не «одной видимостью страдания и смерти». Христос пострадал и умер человеческой природой, добровольно («Я Сам отдаю ее», Ин 10:18), и в третий день воскрес.'
          proof:
            - url: https://azbyka.ru/simvol_very
              title: 'Никео-Цареградский Символ веры, член 4: страдание и погребение'
