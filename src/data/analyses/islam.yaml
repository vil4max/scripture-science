              excerpt: опьяняющие напитки, азартные игры, каменные жертвенники (или идолы) и гадальные стрелы являются скверной из деяний дьявола
              accessed: '2026-09-25'
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=5:5
              title: Коран 5:5, перевод Э. Кулиева | Quran.com Content API
