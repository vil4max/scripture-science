      - id: marriage
        title: Брак и семья
        short: "Брак в Церкви — Таинство союза двоих; она не венчает браки с нехристианами, но признаёт их законными, а Коран разрешает мужчине жениться на двух, трёх, четырёх при условии справедливости."
        topic: rules
        church:
          text: Брак в Церкви — Таинство, в котором благословляется союз жениха и невесты «во образ духовного союза Христа и Церкви»; Христос подтверждает, что «будут два одною плотью» (Мф 19:5). Церковь не освящает венчанием браки православных с нехристианами, но признаёт такие браки законными и не считает живущих в них находящимися в блудном сожительстве.
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет Московский. Пространный катехизис, §358: что такое брак'
              tier: official
              excerpt: Брак есть Таинство
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Mt.19:5&r
              title: Мф. 19:5 — Синодальный перевод
              tier: official
              excerpt: и будут два одною плотью
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/dokumenty/osnovy-sotsialnoj-kontseptsii-russkoj-pravoslavnoj-tserkvi/
              title: Основы социальной концепции Русской Православной Церкви (2000), X.2 (о браке с нехристианами)
              tier: official
              excerpt: Церковь и сегодня не освящает венчанием браки, заключенные между православными и нехристианами, одновременно признавая таковые в качестве законных
              accessed: '2026-10-01'
        tradition:
          text: Коран разрешает мужчине жениться «на двух, трех, четырех», если он справедлив к ним, а при опасении несправедливости велит довольствоваться одной (4:3). Мусульманину дозволены также целомудренные женщины из числа людей Писания (5:5).
          proof:
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=4:3
              title: Коран 4:3, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: 'женитесь на других женщинах, которые нравятся вам: на двух, трех, четырех'
              accessed: '2026-10-01'
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=5:5
              title: Коран 5:5, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: целомудренные женщины из числа тех, кому Писание было даровано до вас
              accessed: '2026-10-01'
        answer:
          points:
            - 'Различие в самом понимании брака: Церковь исходит из союза двоих — «будут два одною плотью» (Мф 19:5) и образа Христа и Церкви (§358); в Коране допускается многобрачие при условии справедливости (4:3).'
            - 'Смешанный брак с нехристианином Церковь не освящает, но уважает: апостол Павел советует не расторгать такой брак, надеясь на освящение неверующей стороны (1 Кор 7:14).'
            - 'Условие церковного брака — общность веры: «только единая в вере семья может стать „домашней Церковью“» (Основы социальной концепции, X.2).'
          proof:
            - url: https://azbyka.ru/biblia/?1Cor.7:14&r
              title: 1 Кор. 7:14 — Синодальный перевод
              tier: official
              excerpt: неверующий муж освящается женою верующею
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/dokumenty/osnovy-sotsialnoj-kontseptsii-russkoj-pravoslavnoj-tserkvi/
              title: Основы социальной концепции Русской Православной Церкви (2000), X.2
              tier: official
              excerpt: Только единая в вере семья может стать «домашней Церковью»
              accessed: '2026-10-01'
