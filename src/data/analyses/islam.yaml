              accessed: '2026-10-01'
        answer:
          points:
            - 'Сходство: обе традиции связывают спасение с верой, делами и милостью Бога; Церковь учит, что «вера, если не имеет дел, мертва сама по себе» (Иак 2:17), и что спасение — дар Божий (Еф 2:8).'
            - 'Но для Церкви спасение — не только награда за правильное поведение, а освобождение от греха и смерти и единение с Богом: верующие становятся «причастниками Божеского естества» (2 Пет 1:4).'
            - 'Это спасение совершено Христом: «нет другого имени под небом, данного человекам, которым надлежало бы нам спастись» (Деян 4:12); Он избавил нас от греха, проклятия и смерти Своей крестной смертью (§204).'
            - Катехизис связывает спасение с принадлежностью к Телу Христову — Церкви (§270) и вместе с тем напоминает, что Бог «хочет, чтобы все люди спаслись» (1 Тим 2:4).
          proof:
            - url: https://azbyka.ru/biblia/?Jac.2:17&r
              title: Иак. 2:17 — Синодальный перевод
              tier: official
              excerpt: вера, если не имеет дел, мертва сама по себе
