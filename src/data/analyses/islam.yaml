      - id: war-and-state
        title: Власть, война и любовь к ближним
        short: "Церковь и ислам требуют повиноваться власти; Церковь называет войну злом, но допускает защиту ближних, а суннитские школы права расходятся: большинство признаёт лишь оборонительную войну, ханафитская — и более широкую."
        topic: rules
        church:
          text: 'Христиане призваны любить всех людей как ближних: «все люди являются нашими ближними, потому что все — создания единого Бога». Церковь признаёт войну злом, но не воспрещает участвовать в боевых действиях ради защиты ближних и восстановления попранной справедливости; любовь к Отечеству может простираться до готовности отдать за него жизнь. Власти христиане подчиняются: «всякая душа да будет покорна высшим властям» (Рим 13:1).'
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6
              title: 'Свт. Филарет. Пространный катехизис, §§489–492: любовь к Богу и ближнему'
              tier: official
              excerpt: Все люди являются нашими ближними. Потому что все – создания единого Бога
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов)
              tier: official
              excerpt: Наша любовь к Государю и Отечеству должна простираться до готовности отдать за них свою жизнь
              accessed: '2026-09-25'
            - url: https://azbyka.ru/otechnik/dokumenty/osnovy-sotsialnoj-kontseptsii-russkoj-pravoslavnoj-tserkvi/
              title: Основы социальной концепции Русской Православной Церкви (2000), VIII.2
              tier: official
              excerpt: Признавая войну злом, Церковь все же не воспрещает своим чадам участвовать в боевых действиях, если речь идет о защите ближних и восстановлении попранной справедливости
              accessed: '2026-10-01'
            - url: https://azbyka.ru/biblia/?Rom.13:1&r
              title: Рим. 13:1 — Синодальный перевод
              tier: official
              excerpt: Всякая душа да будет покорна высшим властям
              accessed: '2026-10-01'
        tradition:
          text: 'Коран предписывает: «Повинуйтесь Аллаху, повинуйтесь Посланнику и обладающим влиянием среди вас» (4:59) и говорит: «Нет принуждения в религии» (2:256). О войне правовые школы расходятся: по академическому источнику, ханафитская школа допускает войну с «неверными» шире, остальные суннитские школы считают правомерной только оборонительную войну. Шиитские взгляды в использованных здесь источниках не излагаются.'
          proof:
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=4:59
              title: Коран 4:59, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: Повинуйтесь Аллаху, повинуйтесь Посланнику и обладающим влиянием среди вас
              accessed: '2026-09-25'
            - url: https://cyberleninka.ru/article/n/uchenie-islama-o-voyne-i-mire-1
              title: Учение ислама о войне и мире | КиберЛенинка
              tier: reference
              excerpt: войну с «неверными» (ханафитская школа) или только войну оборонительную, когда сами «неверные» нападают на мусульман
              accessed: '2026-09-25'
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=2:256
              title: Коран 2:256, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: Нет принуждения в религии
              accessed: '2026-10-01'
        answer:
          points:
            - 'Сходство: и Коран, и Писание требуют повиновения власти (4:59; Рим 13:1).'
            - 'Допустимая война: Церковь называет войну злом и допускает участие в ней ради защиты ближних (Основы социальной концепции, VIII.2); позиция большинства суннитских школ, как её описывает источник, — оборонительная война, ханафитская школа допускает войну шире.'
            - 'Вопросы власти и войны требуют отдельной нравственной оценки, а не общего ярлыка для всех мусульман; Церковь напоминает заповедь любви к врагам: «любите врагов ваших, благословляйте проклинающих вас» (Мф 5:44).'
            - В «Основах социальной концепции» приведён рассказ о споре св. Кирилла с учёными последователями Магомета о Христовых заповедях — пример разговора по существу.
