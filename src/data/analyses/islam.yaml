        tradition:
          text: 'Коран приводит слова тех, кто сказал: «мы убили Мессию Ису», и отвечает: «они не убили его и не распяли, а это только показалось им» (4:157); «это Аллах вознес его к Себе» (4:158). Толкования различаются: на сайте онлайн-академии «Медина» говорится, что Коран отрицает смерть Исы на кресте, приводятся толкования, по которым вместо Исы был распят другой человек, и отмечено, что версий несколько. По Корану, Иса останется на небесах до приближения Судного дня.'
