      - id: asceticism-monasticism
        title: Аскеза и монашество
        short: "Церковь признаёт монашество добровольным призванием, а ислам поощряет умеренность и простую жизнь, и Коран говорит, что монашество последователей Исы (Иисуса) они выдумали сами (переводчик допускает и иное прочтение)."
        topic: fasting
        church:
          text: 'Монашество — особый образ христианского жительства, всецелое посвящение себя на служение Богу через обеты, главные из которых — послушание, нестяжание и целомудрие. Оно добровольно и не обязательно для всех: «если хочешь быть совершенным» (Мф 19:21); основа аскезы — воздержание: «вторая заповедь, запрещая чревоугодие, учит воздержанию и посту».'
          proof:
            - url: https://azbyka.ru/monashestvo
              title: 'Азбука веры. Монашество: обеты и духовная жизнь'
              tier: reference
              excerpt: всецело посвятивший себя Богу через принятие обетов
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/4_6
              title: Пространный христианский катехизис Православной Кафолической Восточной Церкви, свт. Филарет (Дроздов), §524
              tier: official
              excerpt: Вторая заповедь, запрещая чревоугодие, учит воздержанию и посту
              accessed: '2026-09-26'
