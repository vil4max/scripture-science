      - id: sunna-imamate
        title: Сунна, школы права и имамат
        short: "Церковь опирается на Священное Предание, восходящее к апостолам, сунниты — на Коран и сунну (предание о Мухаммаде) с решениями учёных, а шииты-имамиты — ещё и на имама, назначаемого Богом."
        topic: authority
        church:
          text: Священное Предание — это «вся апостольская проповедь, весь спасительный апостольский опыт», переданные Церкви; оно нужно и сегодня для правильного понимания Священного Писания, которое следует понимать согласно толкованию Православной Церкви и святых отцов. Церковь отличает Предание от «преданий человеческих» (Мк 7:8).
          proof:
            - url: https://azbyka.ru/predanie-svyashhennoe
              title: Азбука веры. Священное Предание, определение 2
              tier: reference
              excerpt: вся апостольская проповедь, весь спасительный апостольский опыт вообще, переданные Церкви
              accessed: '2026-09-27'
