        tradition:
          text: В исламском праве вопрос об изображении живых существ остаётся предметом дискуссии. Русская Википедия (статья «Аниконизм») описывает очень жёсткий запрет, основанный на хадисах о наказании создающих изображения в День Суда и связанный с борьбой против идолопоклонства; вместе с тем муфтий Египта Мухаммад Абдо (1849–1905) полагал, что хадис о наказании художников, «по всей вероятности, появился в эпоху язычества».
          proof:
            - url: https://cyberleninka.ru/article/n/muhammad-abdo-o-zaprete-izobrazheniy-cheloveka-v-islame-po-materialam-araboyazychnogo-zhurnala-bayan-al-hakaik
