  - id: revelation
    title: Откровение и пророки
    cards:
      - id: final-revelation
        title: 'Откровение: Библия и Коран'
        short: "Церковь верит, что Откровение достигло полноты во Христе, а ислам считает заключительным откровением Коран, ниспосланный Мухаммаду, и признаёт ниспосланными Богом и прежние Писания, включая Тору и Евангелие."
        topic: scripture
        church:
          text: 'Откровение Божие хранится в Церкви в Священном Писании и Священном Предании. Пророки Ветхого Завета возвестили его начала, «в полноте же и совершенстве» принёс его воплотившийся Сын Божий (Евр 1:1–2). Библия состоит из книг Ветхого и Нового Заветов: в русской православной традиции их 77 (50 и 27), а катехизис св. Филарета по древнему счёту называет двадцать две ветхозаветные книги и двадцать семь новозаветных.'
          proof:
            - url: https://azbyka.ru/bibliya
              title: 'Азбука веры. Библия: состав и язык библейских книг'
              tier: reference
              excerpt: 'Библия включает в себя 77 книг: Ветхий Завет – 50 книг, Новый завет – 27 книг.'
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/1
              title: 'Свт. Филарет Московский. Пространный катехизис, О Священном Писании: число ветхозаветных книг'
              tier: official
              excerpt: двадцать две
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/1_3
