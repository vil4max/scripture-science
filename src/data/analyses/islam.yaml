      - id: mary-and-saints
        title: Мария и святые
        short: "Церковь чтит Марию как Богородицу, Матерь воплотившегося Бога, и призывает в молитве святых, а Коран чтит Марьям (Марию) как избранную деву и мать пророка Исы (Иисуса), но мольба по Корану обращена только к Богу."
        topic: images
        church:
          text: Церковь чтит Пресвятую Деву Марию как Приснодеву и Богородицу, Матерь воплотившегося Господа, и ставит Её выше Херувимов и Серафимов, но Она — сотворённое существо, а не Бог. Святых небесной Церкви Церковь призывает в молитве, опираясь на Священное Предание; о времени очищения Богородицы от первородного повреждения в православной литературе есть разные мнения.
          proof:
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет. Пространный катехизис, §§184–189: Приснодева и Богородица'
              tier: official
              excerpt: Пресвятая Мария действительно всегда пребывала и пребывает Девой
              accessed: '2026-09-27'
            - url: https://azbyka.ru/bogorodica
              title: Богородица — раздел о католическом догмате непорочного зачатия и православных объяснениях очищения
              tier: reference
              excerpt: Согласно одним, предочищение Её Духом Святым
              accessed: '2026-09-27'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет Московский. Пространный катехизис, §188: достоинство Девы Марии'
              tier: official
              excerpt: Православная Церковь чтит Её превыше Херувимов и Серафимов
              accessed: '2026-10-01'
            - url: https://azbyka.ru/otechnik/Filaret_Moskovskij/prostrannyj-pravoslavnyj-katekhizis/2_12
              title: 'Свт. Филарет Московский. Пространный катехизис, §262: призывание святых'
              tier: official
              excerpt: призывать в молитве святых Церкви небесной
              accessed: '2026-10-01'
        tradition:
          text: 'В Коране Марьям (Мария) — избранная: ангелы говорят ей: «Аллах избрал тебя, очистил и возвысил над женщинами миров» (3:42); она «сберегла целомудрие» (66:12), сын родился у неё, хотя её «не касался мужчина» (19:20–21). Обращение с мольбой принадлежит Одному Богу: «Не взывайте же ни к кому наряду с Аллахом» (72:18).'
          proof:
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=3:42
              title: Коран 3:42, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: Аллах избрал тебя, очистил и возвысил над женщинами миров
              accessed: '2026-10-01'
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=66:12
              title: Коран 66:12, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: которая сберегла целомудрие
              accessed: '2026-10-01'
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=19:20
              title: Коран 19:20, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: Как у меня может быть мальчик, если меня не касался мужчина
              accessed: '2026-10-01'
            - url: https://api.quran.com/api/v4/quran/translations/45?verse_key=72:18
              title: Коран 72:18, перевод Э. Кулиева | Quran.com Content API
              tier: official
              excerpt: Не взывайте же ни к кому наряду с Аллахом
              accessed: '2026-10-01'
        answer:
          points:
            - 'Сходство: обе традиции чтут Марию как деву, избранную Богом: «радуйся, Благодатная! Господь с Тобою» (Лк 1:28); «отныне будут ублажать Меня все роды» (Лк 1:48).'
            - 'Различие по сути: для Церкви Она — Богородица, «Матерь Господа» (Лк 1:43), родившая по человечеству истинного Бога (§§185–187); для Корана Марьям — мать пророка Исы (3:45).'
            - 'Сходство слов не делает учения тождественными: Коран говорит, что Аллах «очистил» Марьям (3:42), а православные авторы по-разному объясняют очищение Богородицы Духом Святым.'
            - Церковь призывает святых, потому что Церковь на земле и на небе едина (§262); по Корану, мольба обращена только к Богу (72:18) — это различие в молитвенной практике, а не слово о Марии как о личности.
          proof:
            - url: https://azbyka.ru/biblia/?Lk.1:28&r
              title: Лк. 1:28 — Синодальный перевод
              tier: official
              excerpt: радуйся, Благодатная! Господь с Тобою
