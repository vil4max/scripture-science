              title: Положение о монастырях и монашествующих — документ Архиерейского Собора Русской Православной Церкви 2017 г. (текст на «Азбуке веры»)
              tier: official
              excerpt: особый образ христианского жительства, заключающийся во всецелом посвящении себя на служение Богу
