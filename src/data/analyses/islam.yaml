        answer:
          points:
            - 'Сходство: Коран признаёт пророков до Мухаммада, включая Ису, и учит не делать различий между ними (2:136); Церковь чтит ветхозаветных пророков — Адама, Ноя, Авраама, Моисея и других.'
            - 'Различие — в месте Христа: в Церкви Он не один из ряда посланников, а Сын Божий, Который один «явил» Отца и открывает Его, «кому Сын хочет открыть» (Ин 1:18; Мф 11:27).'
            - 'Церковь проверяет любое учение исповеданием Христа: «всякий дух, который исповедует Иисуса Христа, пришедшего во плоти, есть от Бога» (1 Ин 4:2).'
            - 'Энциклопедия «Азбука веры» поясняет, что с позиции христианства Мухаммад не является пророком: он родился через шесть веков после Боговоплощения, когда Христос уже открыл полноту. Это оценка православных авторов, а не самоописание ислама.'
